  // בקרת שלמות דטרמיניסטית (קוד, לא AI)
  function validateD1Result(inputFindings,parsed){
    const inputSids=new Set(inputFindings.map(f=>f.sid));
    const phenomena=Array.isArray(parsed.phenomena)?parsed.phenomena:[];
    const needsReview=Array.isArray(parsed.needsReview)?parsed.needsReview:[];
    const assignedUnion=new Set();
    const foreignIds=new Set();
    const evidenceMismatch=[]; // {phenIdx, sid}

    phenomena.forEach((p,pi)=>{
      const assigned=new Set(Array.isArray(p.assignedSourceIds)?p.assignedSourceIds:[]);
      assigned.forEach(s=>{
        if(!inputSids.has(s)) foreignIds.add(s);
        assignedUnion.add(s);
      });
      (Array.isArray(p.textualEvidence)?p.textualEvidence:[]).forEach(te=>{
        if(te.sourceId){
          if(!inputSids.has(te.sourceId)) foreignIds.add(te.sourceId);
          if(!assigned.has(te.sourceId)) evidenceMismatch.push({phenIdx:pi,sid:te.sourceId,phenTitle:p.title||`תופעה ${pi+1}`});
          assignedUnion.add(te.sourceId);
        }
      });
    });
    needsReview.forEach(r=>{
      if(r.sourceId){
        if(!inputSids.has(r.sourceId)) foreignIds.add(r.sourceId);
        assignedUnion.add(r.sourceId);
      }
    });

    const missing=[...inputSids].filter(s=>!assignedUnion.has(s));
    const valid=missing.length===0&&foreignIds.size===0&&evidenceMismatch.length===0;
    return {valid,missing,foreign:[...foreignIds],evidenceMismatch,phenomenaCount:phenomena.length,needsReviewCount:needsReview.length};
  }

      const uniqueConcepts=[...new Set(findings.map(f=>f.concept))];
      result.push({unit:u,findings,uniqueConcepts});

    result.sort((a,b)=>{const [a1,a2]=parseCh(a.unit),[b1,b2]=parseCh(b.unit); return a1-b1||a2-b2;});

    setD1Error(null); setD1Loading(true);
    const todo=mode==="all"
      ? unitsToProcess.filter(u=>{ const s=unitStatus(String(u.unit.id)); return s.status!=="approved"&&s.status!=="ai-valid"; })
      : unitsToProcess.filter(u=>mode===`unit:${u.unit.id}`);
    setD1Progress({current:0,total:todo.length,unitName:"",status:""});
    const localState={...d1State};
    for(let i=0;i<todo.length;i++){
      const {unit,findings,uniqueConcepts}=todo[i];
      const uid=String(unit.id);
      setD1Progress({current:i+1,total:todo.length,unitName:unit.name||unit.label||uid,status:`עובד על ${findings.length} אינדיקטורים...`});
      try{
        const {parsed,prompt}=await runD1ForUnit(unit,findings,uniqueConcepts);
        const validation=validateD1Result(findings,parsed);
        const proposal={
          phenomena:parsed.phenomena||[],
          needsReview:parsed.needsReview||[],
          methodNote:parsed.methodNote||"",
          inputSids:findings.map(f=>f.sid),
          promptVersion:PROMPT_VERSION_D1,
          runAt:new Date().toISOString(),
          model:"claude-sonnet-4-5-20250929",
          validatedByCode:validation.valid,
          validationReport:validation
        };
        // גיבוי אוטומטי של ai_proposal הקיים לפני דריסה — שומר את גרסאות ה-AI הקודמות
        const existingAi=localState[uid]&&localState[uid].ai_proposal;
        if(existingAi&&existingAi.promptVersion&&existingAi.promptVersion!==PROMPT_VERSION_D1){
          await fbSaveStage4Unit(characterDimKey,uid,"previous_ai_proposal",existingAi);
          localState[uid]={...(localState[uid]||{}),previous_ai_proposal:existingAi};
        }
        await fbSaveStage4Unit(characterDimKey,uid,"ai_proposal",proposal);
        localState[uid]={...(localState[uid]||{}),ai_proposal:proposal};
        setD1State({...localState});
      }catch(e){
        console.error(`ד'1 כשל ביחידה ${uid}:`,e);
        const errProposal={
          error:String(e.message||e),
          inputSids:findings.map(f=>f.sid),
          promptVersion:PROMPT_VERSION_D1,
          runAt:new Date().toISOString(),
          validatedByCode:false,
          validationReport:{valid:false,missing:[],foreign:[],evidenceMismatch:[]}
        };
        await fbSaveStage4Unit(characterDimKey,uid,"ai_proposal",errProposal);
        localState[uid]={...(localState[uid]||{}),ai_proposal:errProposal};
        setD1State({...localState});
      }
    }
    setD1Loading(false);
    setD1Progress({current:0,total:0,unitName:"",status:""});
  }

  const d1Stats=useMemo(()=>{
    let approved=0, valid=0, invalid=0, pending=0;
    unitsToProcess.forEach(u=>{
      const s=unitStatus(String(u.unit.id));
      if(s.status==="approved") approved++;
      else if(s.status==="ai-valid") valid++;
      else if(s.status==="ai-invalid") invalid++;
      else pending++;
    });
    return {approved,valid,invalid,pending,total:unitsToProcess.length};
  },[unitsToProcess,d1State]);

  // ─ ניווט לפאנל סקירה פר-יחידה ─
  const [reviewingUid,setReviewingUid]=useState(null);
  const reviewingData=useMemo(()=>{
    if(!reviewingUid) return null;
    const entry=unitsToProcess.find(x=>String(x.unit.id)===reviewingUid);
    if(!entry) return null;
    const st=d1State[reviewingUid]||{};
    return {...entry,aiProposal:st.ai_proposal||null,userApproved:st.user_approved||null,previousApproved:st.previous_approved||null};
  },[reviewingUid,unitsToProcess,d1State]);

  async function saveUserApproved(uid,approvedData){
    const prev=(d1State[uid]&&d1State[uid].user_approved)||null;
    const newState={...(d1State[uid]||{}),user_approved:approvedData};
    if(prev) newState.previous_approved=prev;
    await fbSaveStage4Unit(characterDimKey,uid,"user_approved",approvedData);
    if(prev) await fbSaveStage4Unit(characterDimKey,uid,"previous_approved",prev);
    setD1State({...d1State,[uid]:newState});
  }
  async function reopenApproved(uid){
    const cur=(d1State[uid]&&d1State[uid].user_approved)||null;
    if(!cur) return;
    // מעבירים את הגרסה הנוכחית ל-previous_approved ומוחקים את user_approved
    await fbSaveStage4Unit(characterDimKey,uid,"previous_approved",cur);
    await db.ref(_stage4UnitPath(characterDimKey,uid,"user_approved")).remove();
    const newEntry={...(d1State[uid]||{}),previous_approved:cur,user_approved:null};
    setD1State({...d1State,[uid]:newEntry});
  }

  // אם במצב סקירה — החזר את הפאנל במקום הרשימה
  if(reviewingData){
    return (<UnitReviewPanel
      unit={reviewingData.unit}
      findings={reviewingData.findings}
      aiProposal={reviewingData.aiProposal}
      userApproved={reviewingData.userApproved}
      previousApproved={reviewingData.previousApproved}
      characterDimKey={characterDimKey}
      dimColor={dimColor} dimLabel={dimLabel} character={character}
      onBack={()=>setReviewingUid(null)}
      onSaveApproved={async(data)=>{ await saveUserApproved(reviewingUid,data); }}
      onReopen={async()=>{ await reopenApproved(reviewingUid); }}
    />);
  }

  return(
    <div style={{maxWidth:"1100px",margin:"0 auto",padding:"20px 16px"}}>
      {/* כותרת */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"20px",flexWrap:"wrap",gap:"12px"}}>
        <div>
          <div style={{fontSize:"20px",fontWeight:"bold",color:"#f1f5f9",marginBottom:"3px"}}>
            📊 שלב ד': איחוד ממצאים — <span style={{color:dimColor}}>{dimLabel}</span> · ב{charName}
          </div>
          <div style={{fontSize:"12px",color:"#64748b"}}>קליטת כל האינדיקטורים מ-{concepts.length} המושגים של הממד, לקראת זיהוי תופעות טקסטואליות</div>
        </div>
        <button onClick={onBack} style={{padding:"7px 14px",borderRadius:"7px",border:"1px solid #475569",cursor:"pointer",background:"transparent",color:"#94a3b8",fontSize:"12px",fontWeight:"600"}}>↩ חזרה</button>
      </div>

      {/* דוח קליטה */}
      <div style={{padding:"16px 20px",background:"#1e293b",borderRadius:"10px",border:`1px solid ${canProceed?"#34d39944":"#f59e0b44"}`,marginBottom:"18px"}}>
        <div style={{fontSize:"14px",fontWeight:"700",color:"#f1f5f9",marginBottom:"12px"}}>📥 דוח קליטה (דטרמיניסטי — בלי AI)</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(180px, 1fr))",gap:"12px",marginBottom:"12px"}}>
          <StatBox label="מושגים בממד" value={concepts.length} color={dimColor}/>
          <StatBox label="מושגים מוכנים" value={`${concepts.length-ingest.missingConcepts.length}/${concepts.length}`} color={ingest.missingConcepts.length===0?"#34d399":"#f59e0b"}/>
          <StatBox label="סה״כ אינדיקטורים" value={ingest.totalFindings} color="#60a5fa"/>
          <StatBox label="יחידות במאגר (raw)" value={ingest.totalRawUnits} color="#a78bfa"/>
          <StatBox label="יחידות שאותרו" value={`${ingest.unitsWithFindings}/${ingest.totalRawUnits}`} color={ingest.unitsWithFindings===ingest.totalRawUnits?"#34d399":ingest.unitsWithFindings>0?"#fbbf24":"#64748b"}/>
          <StatBox label="אינדיקטורים מותאמים" value={`${ingest.matchedCount}/${ingest.totalFindings}`} color={ingest.unmatchedCount===0?"#34d399":"#ef4444"}/>
          <StatBox label="אינדיקטורים לא מותאמים" value={ingest.unmatchedCount} color={ingest.unmatchedCount===0?"#34d399":"#ef4444"}/>
          <StatBox label="יחידות יתומות (ללא ממצא)" value={ingest.orphanUnits.length} color={ingest.orphanUnits.length===0?"#34d399":"#94a3b8"}/>
          <StatBox label="מועמדי כפילות" value={ingest.duplicateCandidates.length} color={ingest.duplicateCandidates.length>0?"#fbbf24":"#64748b"}/>
          <StatBox label="מזהים חסרים" value={ingest.totalMissingSids} color={ingest.totalMissingSids===0?"#34d399":"#ef4444"}/>
        </div>
        {ingest.missingConcepts.length>0&&(
          <div style={{marginTop:"10px",padding:"10px 12px",background:"#78350f22",border:"1px solid #f59e0b",borderRadius:"6px",fontSize:"11px",color:"#fcd34d"}}>
            ⚠ מושגים שחסר להם שלב 3 מוכן: {ingest.missingConcepts.join(", ")}. יש להשלים ולאשר קודם.
          </div>
        )}
        {ingest.totalMissingSids>0&&(
          <div style={{marginTop:"10px",padding:"10px 12px",background:"#7f1d1d22",border:"1px solid #ef4444",borderRadius:"6px",fontSize:"11px",color:"#fca5a5",display:"flex",alignItems:"center",justifyContent:"space-between",gap:"10px",flexWrap:"wrap"}}>
            <span>⚠ {ingest.totalMissingSids} אינדיקטורים ללא מזהה קבוע. אפשר לפתוח כל מושג ידנית, או ללחוץ כאן →</span>
            <button onClick={migrateAllMissingIds} style={{padding:"6px 12px",borderRadius:"6px",border:"none",cursor:"pointer",background:"#f59e0b",color:"white",fontSize:"11px",fontWeight:"700"}}>🔧 יצור מזהים חסרים</button>
          </div>
        )}
      </div>

      {/* פירוט פר-מושג */}
      <div style={{padding:"16px 20px",background:"#1e293b",borderRadius:"10px",border:"1px solid #334155",marginBottom:"18px"}}>
        <div style={{fontSize:"13px",fontWeight:"700",color:"#f1f5f9",marginBottom:"10px"}}>פירוט לפי מושג</div>
        <table style={{fontSize:"12px",width:"100%"}}>
          <thead><tr style={{background:"#0f172a"}}>
            <th style={{textAlign:"right",color:"#94a3b8",padding:"6px 10px"}}>מושג</th>
            <th style={{textAlign:"right",color:"#94a3b8",padding:"6px 10px"}}>אינדיקטורים</th>
            <th style={{textAlign:"right",color:"#94a3b8",padding:"6px 10px"}}>עם מזהה</th>
            <th style={{textAlign:"right",color:"#94a3b8",padding:"6px 10px"}}>סטטוס</th>
          </tr></thead>
          <tbody>
            {concepts.map(c=>{
              const pc=ingest.perConcept[c]||{};
              const okIds=pc.hasSourceIds===pc.total&&pc.total>0;
              return(<tr key={c} style={{borderBottom:"1px solid #334155"}}>
                <td style={{color:"#cbd5e1",padding:"6px 10px",fontWeight:"600"}}>{c}</td>
                <td style={{color:"#cbd5e1",padding:"6px 10px"}}>{pc.total||0}</td>
                <td style={{color:okIds?"#34d399":(pc.missingSourceIds>0?"#f59e0b":"#64748b"),padding:"6px 10px"}}>{pc.hasSourceIds||0}/{pc.total||0}</td>
                <td style={{color:pc.approved?"#34d399":"#f59e0b",padding:"6px 10px",fontSize:"11px"}}>{pc.approved?"✓ מאושר":pc.total>0?"⚠ לא מאושר":"✗ אין נתונים"}</td>
              </tr>);
            })}
          </tbody>
        </table>
      </div>

      {/* אינדיקטורים שלא זוהו ל-u.id — בעיה דטרמיניסטית */}
      {ingest.unmatchedCount>0&&(
        <div style={{padding:"14px 18px",background:"#7f1d1d22",borderRadius:"10px",border:"1px solid #ef4444",marginBottom:"18px"}}>
          <div style={{fontSize:"13px",fontWeight:"700",color:"#fca5a5",marginBottom:"8px"}}>
            ⚠ {ingest.unmatchedCount} אינדיקטורים לא זוהו ל-u.id במאגר
          </div>
          <div style={{fontSize:"11px",color:"#fecaca",marginBottom:"10px",lineHeight:"1.6"}}>
            אלה אינדיקטורים ששם היחידה שה-AI החזיר אינו מכיל את מזהה היחידה (u.id) או את שם היחידה כפי שמופיע ב-raw.units. יש לפתור לפני המעבר לד'1 — אחרת לא נדע ליחידה הספרותית האמיתית אנחנו מתייחסים.
          </div>
          <div style={{maxHeight:"200px",overflowY:"auto",fontSize:"10px",fontFamily:"monospace",color:"#fef3c7"}}>
            {ingest.unmatchedFindings.slice(0,20).map((f,i)=>(
              <div key={i} style={{padding:"4px 0",borderBottom:"1px solid #7f1d1d66"}}>
                <span style={{color:"#fca5a5"}}>[{f.label}]</span> <span style={{color:"#fecaca"}}>יחידה (AI):</span> "{f.unit}" <span style={{color:"#64748b"}}>· מושג: {f.concept}</span>
              </div>
            ))}
            {ingest.unmatchedFindings.length>20&&<div style={{color:"#fca5a5",marginTop:"6px"}}>...ועוד {ingest.unmatchedFindings.length-20}</div>}
          </div>
        </div>
      )}

      {/* יחידות יתומות — ב-raw אך ללא אינדיקטור בממד */}
      {ingest.orphanUnits.length>0&&(
        <div style={{padding:"14px 18px",background:"#1e293b",borderRadius:"10px",border:"1px solid #475569",marginBottom:"18px"}}>
          <div style={{fontSize:"13px",fontWeight:"700",color:"#cbd5e1",marginBottom:"8px"}}>
            ℹ {ingest.orphanUnits.length} יחידות ב-raw שלא מופיע להן אינדיקטור בממד זה
          </div>
          <div style={{fontSize:"11px",color:"#94a3b8",marginBottom:"10px",lineHeight:"1.6"}}>
            אלה יחידות שאת הוספת לכלי האנליטי, אבל אין להן אף אינדיקטור חיובי לממד "{dimLabel}" באף מושג. זה **לא בהכרח בעיה** — פשוט אומר שהממד הזה לא נמצא בהן. (ייתכן שהן יהיו רלוונטיות לממדים אחרים.)
          </div>
          <div style={{maxHeight:"150px",overflowY:"auto",fontSize:"10px"}}>
            {ingest.orphanUnits.slice(0,20).map((u,i)=>(
              <span key={i} style={{display:"inline-block",padding:"3px 7px",margin:"2px",background:"#0f172a",color:"#94a3b8",borderRadius:"4px"}}>
                {u.name||u.label||u.id} ({u.id})
              </span>
            ))}
            {ingest.orphanUnits.length>20&&<span style={{color:"#64748b",marginRight:"6px"}}>...ועוד {ingest.orphanUnits.length-20}</span>}
          </div>
        </div>
      )}

      {/* יחידות שחוזרות בכמה מושגים (הכפילות המחקרית האמיתית) */}
      {ingest.unitRepeats.length>0&&(
        <div style={{padding:"16px 20px",background:"#1e293b",borderRadius:"10px",border:`1px solid ${dimColor}44`,marginBottom:"18px"}}>
          <div style={{fontSize:"13px",fontWeight:"700",color:"#f1f5f9",marginBottom:"4px"}}>
            🔗 יחידות חוזרות בכמה מושגים ({ingest.unitRepeats.length} יחידות מתוך {ingest.uniqueUnits})
          </div>
          <div style={{fontSize:"11px",color:"#94a3b8",marginBottom:"12px",lineHeight:"1.6"}}>
            זהו הגרעין המחקרי של ד'1 — כל יחידה כזו תעובד כקבוצת-מנה אחת, שבה ה-AI מקבל את כל האינדיקטורים שלה מכל המושגים כדי לזהות תופעות משותפות. {ingest.unitsInOneConcept} יחידות נוספות מופיעות רק במושג אחד.
          </div>
          <div style={{maxHeight:"400px",overflowY:"auto"}}>
            <table style={{fontSize:"11px",width:"100%"}}>
              <thead><tr style={{background:"#0f172a",position:"sticky",top:0}}>
                <th style={{textAlign:"right",color:dimColor,padding:"6px 10px"}}>יחידה</th>
                <th style={{textAlign:"right",color:dimColor,padding:"6px 10px",width:"80px"}}>במושגים</th>
                <th style={{textAlign:"right",color:dimColor,padding:"6px 10px",width:"80px"}}>אינדיקטורים</th>
                <th style={{textAlign:"right",color:dimColor,padding:"6px 10px"}}>מושגים</th>
              </tr></thead>
              <tbody>
                {ingest.unitRepeats.map((ur,i)=>(
                  <tr key={i} style={{borderBottom:"1px solid #334155"}}>
                    <td style={{color:"#cbd5e1",padding:"5px 10px",fontWeight:"600"}} title={`u.id: ${ur.unitId}`}>{ur.unitName} <span style={{fontSize:"9px",color:"#64748b"}}>({ur.unitId})</span></td>
                    <td style={{color:ur.concepts.length>=5?"#34d399":"#cbd5e1",padding:"5px 10px",fontWeight:"700"}}>{ur.concepts.length}</td>
                    <td style={{color:"#94a3b8",padding:"5px 10px"}}>{ur.totalIndicators}</td>
                    <td style={{color:"#94a3b8",padding:"5px 10px",fontSize:"10px"}}>{ur.concepts.join(", ")}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{marginTop:"10px",fontSize:"10px",color:"#64748b"}}>
            💡 יחידה המופיעה ב-5+ מושגים — מודגשת בירוק. אלו הן היחידות ה"עשירות" ביותר, הסביר שה-AI יזהה בהן תופעה משותפת חזקה.
          </div>
        </div>
      )}

      {/* מועמדי כפילות טקסט (אם יש) */}
      {ingest.duplicateCandidates.length>0&&(
        <div style={{padding:"14px 18px",background:"#78350f22",borderRadius:"10px",border:"1px solid #fbbf2466",marginBottom:"18px"}}>
          <div style={{fontSize:"13px",fontWeight:"700",color:"#fcd34d",marginBottom:"8px"}}>⚠ מועמדי כפילות טכנית ({ingest.duplicateCandidates.length}) — אותו טקסט מופיע ביותר ממזהה אחד</div>
          <div style={{fontSize:"11px",color:"#fde68a",lineHeight:"1.6",marginBottom:"8px"}}>
            אלה **מועמדים** בלבד. ה-AI (בשלב הבא) יבדוק אם זו באמת אותה תופעה או ממצאים שונים באותו טקסט.
          </div>
          <div style={{maxHeight:"200px",overflowY:"auto",fontSize:"10px",fontFamily:"monospace",color:"#fef3c7"}}>
            {ingest.duplicateCandidates.slice(0,10).map((dc,i)=>(
              <div key={i} style={{padding:"4px 0",borderBottom:"1px solid #78350f66"}}>
                <div style={{color:"#fcd34d",fontWeight:"700"}}>({dc.count} מופעים): {dc.basis}...</div>
                <div style={{color:"#fde68a"}}>sids: {dc.sids.join(", ")}</div>
              </div>
            ))}
            {ingest.duplicateCandidates.length>10&&<div style={{color:"#fcd34d",marginTop:"4px"}}>...ועוד {ingest.duplicateCandidates.length-10}</div>}
          </div>
        </div>
      )}

      {/* כפתור המשך */}
      <div style={{marginTop:"24px",textAlign:"center"}}>
        {!canProceed&&(
          <div style={{fontSize:"12px",color:"#f59e0b"}}>
            ⚠ לא ניתן להמשיך — יש לפתור:
            {ingest.missingConcepts.length>0&&<div style={{marginTop:"4px"}}>• {ingest.missingConcepts.length} מושגים חסרים/לא מאושרים</div>}
            {ingest.totalMissingSids>0&&<div style={{marginTop:"4px"}}>• {ingest.totalMissingSids} אינדיקטורים ללא מזהה קבוע</div>}
            {ingest.unmatchedCount>0&&<div style={{marginTop:"4px"}}>• {ingest.unmatchedCount} אינדיקטורים לא זוהו ליחידה מהמאגר</div>}
          </div>
        )}
        {canProceed&&d1Loaded&&(
          <div style={{marginTop:"24px",padding:"18px 20px",background:"#1e293b",borderRadius:"10px",border:`2px solid ${dimColor}66`}}>
            <div style={{fontSize:"15px",fontWeight:"700",color:"#f1f5f9",marginBottom:"4px"}}>🤖 ד'1 — זיהוי תופעות באמצעות AI</div>
            <div style={{fontSize:"11px",color:"#94a3b8",marginBottom:"14px",lineHeight:"1.6"}}>עיבוד {unitsToProcess.length} יחידות בטור. לכל יחידה: AI מקבל את כל האינדיקטורים ממנה ומזהה תופעות. בקרת שלמות דטרמיניסטית אוטומטית.</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(140px, 1fr))",gap:"10px",marginBottom:"14px"}}>
              <StatBox label="יחידות סה״כ" value={d1Stats.total} color={dimColor}/>
              <StatBox label="מאושרות" value={d1Stats.approved} color="#34d399"/>
              <StatBox label="הצעת AI תקינה" value={d1Stats.valid} color="#60a5fa"/>
              <StatBox label="נכשלו/לא תקינות" value={d1Stats.invalid} color={d1Stats.invalid>0?"#ef4444":"#64748b"}/>
              <StatBox label="ממתינות" value={d1Stats.pending} color={d1Stats.pending>0?"#fbbf24":"#64748b"}/>
            </div>
            {d1Loading?(
              <div style={{padding:"14px",background:"#0f172a",borderRadius:"8px",border:`1px solid ${dimColor}`}}>
                <div style={{fontSize:"13px",color:dimColor,fontWeight:"700"}}>⏳ עובד על יחידה {d1Progress.current}/{d1Progress.total}: {d1Progress.unitName}</div>
                <div style={{fontSize:"11px",color:"#94a3b8",marginTop:"4px"}}>{d1Progress.status}</div>
              </div>
            ):(
              <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
                <button onClick={()=>runD1("all")} disabled={d1Stats.pending===0&&d1Stats.invalid===0}

### עקרונות מתודולוגיים (קריטיים — יש לציית לכולם)

**א. יישום ההגדרה ללא החמרה נוספת:**
הרכיבים בהגדרה אינם חייבים להיאמר במפורש בטקסט, להופיע באותו פסוק, או להיות מתוארים כמחשבת המלך. ניתן לבסס זיקה מושגית מתוך פעולות, בחירות ספרותיות, ניסוחים והקשר שסופקו — ובלבד שההסקה מנומקת. **אין להשלים שיקול דעת שאינו מבוסס בחומר** (זה הצד השני של אותו עיקרון).

**ב. הבחנה בין ממצא טקסטואלי להסקה מושגית:**
כל טענה במסקנה כוללת לפעמים שני רכיבים נפרדים — טענה על הכתוב/שינוי, והסקה מושגית ממנה. יש לבדוק אותם בנפרד. למשל: "חלוקת האחריות בין המלך לזקנים מראה חכמה" — הטענה על חלוקת אחריות עשויה להיות **נתמכת**, בעוד שההסקה שהיא מוכיחה חכמה עשויה להיות **מסויגת** או **חורגת**. אין לדחות את כל הטענה בגלל אחד הרכיבים.

**ג. אין ברירת מחדל סיווג:**
כל סיווג חייב לעמוד בקריטריון שלו. אסור "להעדיף מסויגת כדי לא להיות חמורה" — ההיפך: "מסויגת" מחייבת בסיס חיובי מזוהה. "חורגת" מציינת הרחבה מעבר לראיות. חוסר מידע = "insufficient" (נפרד).

**ד. אין להחיל דרישות ממושג אחר:**
בחן את המסקנה **אך ורק** לפי ההגדרה וההבהרה של "${concept}". אין להחיל דרישות השייכות למושג אחר. הופעת מילה מן השדה הסמנטי אינה מוכיחה לבדה את המושג, והיעדרה אינו מוכיח את היעדרו.

**ה. סיווג המסקנה — לא הדמות:**
את מסווג **את המסקנה המחקרית** שהחוקרת כתבה, לא את דמות המלך ולא את היחידה הטקסטואלית. גם אם המסקנה סווגה "חורגת" — אין פירוש הדבר שהדמות אינה מעוצבת לפי המושג. ייתכן שהניסוח המקורי של המסקנה דורש צמצום, בעוד שהדמות עצמה כן נענית לקריטריון. **ציין זאת במפורש בסיכום** כאשר רלוונטי.

**ו. יחידות ללא מסקנה אינן "חורגות":**
יחידה שאין בה מסקנה מחקרית כתובה (״אין מסקנה״) אינה חורגת ולא נתמכת — פשוט אין בה מה לבדוק. סווג כ-"no_conclusion" בלבד. אין להסיק מהעדר מסקנה שהמסקנה הייתה חורגת לו נכתבה.

**ז. הסקת יכולת דורשת בסיס טקסטואלי מסוים:**
אם ההגדרה מתארת "יכולת", אין לדרוש "תהליך מחשבתי מפורש שמוצג בטקסט". יכולת ניתנת להסקה מפעולה — ובלבד שההסקה נשענת על לפחות אחד מהבאים: נימוק מפורש של דמות, בחירה מודעת בין אפשרויות, התאמה מורכבת לנסיבות, תיקון טעות קודמת, או קשר מבוסס בין הנחיה (אלוהית/נבואית/מוסרית) לבין הכרעה. **הצלחה כשלעצמה, או התאמה כללית לאופי התיאולוגי של הספר, אינן מספיקות** להסקת היכולת.

**ח. מעמד הפרשנות המתועדת:**
פרשנות מתועדת שסופקה בחומר יכולה לתמוך בזיהוי, אך אינה מעניקה לו אישור אוטומטי. אם הפרשנות היא הראיה היחידה — ציין זאת כסייג בהנמקה.

### סיווגים — קריטריונים מדויקים (לא היררכיה; כל אחד עצמאי)

- **"supported"**: הטענה (ממצא או הסקה) נתמכת בראיות מזוהות שסופקו ובהגדרה המחייבת.
- **"qualified"**: יש **בסיס חיובי מזוהה**, אך נדרש צמצום, הבחנה או הכרה במחלוקת. ציין את הסייג המדויק.
- **"exceeded"**: הטענה כוללת קביעה שהראיות שסופקו אינן מבססות (הרחבה מעבר לחומר).
- **"insufficient"**: חסר מידע הנחוץ לבדיקה (אין מספיק נתונים — לא נקבע נגד הטענה).
- **"irrelevant"** (רק ל-conceptualStatus): הטענה היא ממצא טקסטואלי בלבד ואינה כוללת הסקה מושגית.

### חוקים מחייבים
1. פרק כל מסקנה לטענות עצמאיות ב-perClaim. אם טענה מערבת ממצא והסקה — אל תשנה את המסקנה המקורית אבל סווג כל רכיב בנפרד.
2. **כל נימוק** חייב להצביע על ראיה ספציפית: פסוק מזוהה, אינדיקטור משלב 2, או פרשנות מתועדת. אמירה כללית כמו "אין תהליך של הבנה" — אסורה. יש להסביר אילו ראיות נבדקו ומה הן מראות.
3. ההגדרה היא העוגן, אין להוסיף תנאים.
4. אין להמציא פסוקים, ציטוטים או ראיות. אין לטעון שמקור פרשני נבדק אם לא נבדק — יש לציין "הפניה מתועדת".
5. בחן את **כלל היחידה והקשרה** לפני קביעה שרכיב נעדר. אם מתועד מרכיב רלוונטי (למשל "ויהוה צבאות עמו") — יש להתייחס אליו, גם אם אינו מוכיח לבדו את ההסקה המלאה.

### סיכום (summary) — חוקים
הסיכום יעריך את **המסקנה המרכזית** של היחידה ויסביר **כיצד היא נשענת על טענות המשנה**. אין להצביע לפי מספר/ספירת סיווגים ("3 מתוך 4 נתמכים לכן..."). אם יש פער בין הממצאים (נתמכים) להסקה (חורגת) — יש להסביר את הפער במפורש. למשל: "מסקנת החיזוק של החכמה חורגת; הממצאים על סמכות ואחריות נתמכים."
האמן את הסיווג המסכם של היחידה (conclusionStatus) מהסיכום — לא ההיפך.

### חוקי פורמט JSON קריטיים
- **אל תשתמשי בגרשיים כפולים (") בתוך ערכי מחרוזת.** השתמשי בגרשיים טיפוגרפיים: ״ ״ (\\u05F4), גרש בודד ʼ, או סוגריים.
- אל תשברי שורה בתוך ערך מחרוזת.
- אין פסיק אחרי האלמנט האחרון.
- פלט רק JSON, ללא טקסט או markdown.

  const dimLabel=(DIMS.find(d=>d.id===dimId)||{}).label||dimId;
  const dimColor=(DIMS.find(d=>d.id===dimId)||{}).color||"#818cf8";
  const charName=character==="david"?"דוד":"שלמה";

  // ─────── איסוף יחידות רלוונטיות ───────
  function collectRelevant(){
    const list=(raw.units||[]).filter(u=>{
      if((u.character||"david")!==character) return false;
      const s=getUnitSummary(u.id,raw);
      if(s&&s.notInThesis) return false;
      return true;
    });
    list.sort((a,b)=>{const [a1,a2]=parseCh(a),[b1,b2]=parseCh(b); return a1-b1||a2-b2;});
    return list;
  }

  // ─────── שלב 1 חישובי ───────
  function runStage1(){
    const units=collectRelevant();
    const sem=getSemantic(concept,raw);
    const posWords=((sem&&sem.pos)||"").split(/[,،;]/).map(s=>s.trim()).filter(Boolean);
    const rows=[]; let cNN=0,cN=0,cS=0,cNone=0,cNR=0;
    units.forEach(u=>{
      const uid=String(u.id);
      const s=getUnitSummary(uid,raw);
      const nrList=(s&&Array.isArray(s.notRelevantConcepts))?s.notRelevantConcepts:[];
      if(nrList.includes(concept)){ cNR++; rows.push([`${u.name||"?"} (${u.chapter||"?"})`,"—","—","לא רלוונטי"]); return; }
      const text=u.chroniclesText||"";
      const hasSem=posWords.some(w=>w&&text.indexOf(w)>=0);
      const ec=getEntry(uid,concept,"chronicles",raw)||{};
      const hasN=(ec.params||[]).some(p=>p&&p.found===true);
      let sym="—";
      if(hasSem&&hasN){sym="ס+נ";cNN++;} else if(hasSem){sym="ס";cS++;} else if(hasN){sym="נ";cN++;} else cNone++;
      rows.push([`${u.name||"?"} (${u.chapter||"?"})`,hasSem?"✓":"—",hasN?"✓":"—",sym]);
    });
    return{
      status:"חישוב מיידי — מוכן לאישור",
      hasTable:true,
      tableHeaders:["יחידה","ס (סמנטי גלוי)","נ (נרמז)","סימון"],
      tableRows:rows,
      summary:`מתוך ${units.length} יחידות: ${cNN} ס+נ, ${cN} נ בלבד, ${cS} ס בלבד, ${cNone} ללא ממצא, ${cNR} לא רלוונטיות. סה"כ ${cNN+cN+cS} יחידות עם ממצא כלשהו למושג "${concept}".`,
      selfCheck:"חישוב דטרמיניסטי. ס מבוסס על השדה הסמנטי של המושג; נ מבוסס על פרמטר אחד לפחות עם found=true בשלב ב'."
    };
  }

  // ─────── שלב 2 חישובי ───────
  function runStage2(){
    const units=collectRelevant();
    const params=validParams(getParams(concept,raw));
    const labelOrder=[]; const l2i={};
    params.forEach((p,i)=>{const l=p.paramLabel||"כללי"; if(!l2i[l]){l2i[l]=[];labelOrder.push(l);} l2i[l].push(i);});
    const headers=["יחידה",...labelOrder,'סה"כ'];
    const rows=[]; let total=0;
    const indicatorDetails=[]; // פירוט אינדיקטורים חיוביים לפי יחידה
    units.forEach(u=>{
      const uid=String(u.id);
      const s=getUnitSummary(uid,raw);
      const nrList=(s&&Array.isArray(s.notRelevantConcepts))?s.notRelevantConcepts:[];
      if(nrList.includes(concept)) return;
      const ec=getEntry(uid,concept,"chronicles",raw)||{};
      const ecParams=Array.isArray(ec.params)?ec.params:[];
      const pos=ecParams.map((p,i)=>p&&p.found===true?i:-1).filter(i=>i>=0);
      if(!pos.length) return;
      const row=[`${u.name||"?"} (${u.chapter||"?"})`];
      labelOrder.forEach(l=>row.push(String(pos.filter(i=>l2i[l].includes(i)).length)));
      row.push(String(pos.length)); total+=pos.length;
      rows.push(row);
      // בניית פירוט לכל אינדיקטור חיובי ביחידה
      const foundInUnit=pos.map(i=>{
        const def=params[i]||{};
        const data=ecParams[i]||{};
        return {
          indicatorIdx:i,
          q:def.q||`אינדיקטור ${i+1}`,
          paramLabel:def.paramLabel||"כללי",
          verse:data.verse||"",
          note:data.explicit_note||data.note||data.evidence||""
        };
      });
      indicatorDetails.push({
        unitId:uid,
        unitName:u.name||"?",
        chapter:u.chapter||"?",
        totalFound:pos.length,
        indicators:foundInUnit
      });
    });
    const labelsForSummary=labelOrder.length?labelOrder.join(", "):"— (אין קטגוריות פרמטרים מוגדרות למושג זה)";
    return{
      status:"חישוב מיידי — מוכן לאישור",
      hasTable:true,
      tableHeaders:headers,
      tableRows:rows,
      indicatorDetails,
      summary:`${rows.length} יחידות עם אינדיקטורים חיוביים, סה"כ ${total} אינדיקטורים ב-${labelOrder.length} קטגוריות: ${labelsForSummary}.`,
      selfCheck:"חישוב דטרמיניסטי. הטבלה מציגה ספירת אינדיקטורים חיוביים לפי paramLabel. הפירוט מתחתיה מציג את טקסט כל אינדיקטור כן + הפסוק + ההסבר (אם קיים) מהכלי האנליטי."
    };
  }

  // ─────── קריאה ישירה ל-Anthropic (בלי worker) ───────
  async function aiCallDirect(prompt,maxTokens){
    const r=await aiCallDirectWithUsage(prompt,maxTokens);
    return r.text;
  }
  // גרסה שמחזירה גם usage לצורך מעקב עלות (שלב 4 חדש)
  async function aiCallDirectWithUsage(prompt,maxTokens){
    if(!apiKey) throw new Error("חסר מפתח API. הזן אותו דרך סמל ה-🔑 בסרגל העליון.");
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-api-key":apiKey,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body:JSON.stringify({
        model:"claude-sonnet-4-5-20250929",
        max_tokens:maxTokens,
        messages:[{role:"user",content:prompt}]
      })
    });
    if(!res.ok){
      let errMsg=`שגיאת API (${res.status})`;
      try{const d=await res.json(); if(d.error&&d.error.message) errMsg+=`: ${d.error.message}`;}catch{}
      throw new Error(errMsg);
    }
    const data=await res.json();
    if(!data.content||!data.content.length) throw new Error("תשובה ריקה מ-API");
    if(data.stop_reason==="max_tokens"){
      console.warn("aiCallDirect: תשובה נקטעה במגבלת max_tokens");
      throw new Error(`התשובה נקטעה במגבלת ${maxTokens} טוקנים (stop_reason=max_tokens). נסי שוב — המערכת תמשיך מהקבוצה הזאת, או דווחי לי להעלות את המגבלה.`);
    }
    const text=data.content.map(b=>b.text||"").join("");
    const usage=data.usage||{};
    return {text,usage,costUsd:_estimateCostUsd(usage)};
  }

  function parseJSON(text){
    const clean=text.replace(/```json|```/g,"").trim();
    try{ return JSON.parse(clean); }
    catch(e){
      // ניסיון לחלץ אובייקט שלם
      const first=clean.indexOf("{"); const last=clean.lastIndexOf("}");
      if(first>=0&&last>first){
        try{ return JSON.parse(clean.substring(first,last+1)); }catch{}
      }
      throw new Error("התשובה אינה בפורמט JSON תקין: "+clean.substring(0,120));
    }
  }

  // ─────── בניית בלוק נתונים ליחידה ───────
  function buildUnitBlock(u){
    const uid=String(u.id);
    const ec=getEntry(uid,concept,"chronicles",raw)||{};
    const params=validParams(getParams(concept,raw));
    const foundParams=(ec.params||[]).map((p,i)=>({...p,def:params[i]})).filter(x=>x&&x.found===true);
    const paramList=foundParams.map((p,i)=>`  פרמטר ${i+1} (${(p.def&&p.def.paramLabel)||""}): ${(p.def&&p.def.q)||""}${p.verse?` [פסוק ${p.verse}]`:""}`).join("\n");
    const explicitNote=ec.explicit_note?`\nהערת שדה גלוי: ${ec.explicit_note}`:"";
    const compareNote=getCompareNote(uid,concept,raw);
    const sourceInfo=u.sourceRef?`מקבילה: ${u.sourceRef}`:"יחידת סונדרגוט";
    return `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
### ${u.name||"?"} (${u.chapter||"?"}) — ${sourceInfo}

טקסט דה"י: ${(u.chroniclesText||"—").substring(0,750)}
${u.sourceText?`טקסט המקבילה: ${u.sourceText.substring(0,750)}`:""}

אינדיקטורים חיוביים (${foundParams.length}):
${paramList||"—"}${explicitNote}

מסקנה מחקרית של הכותבת:
${compareNote||"(טרם נכתבה)"}`;
  }

  // ─────── שלב 3: בסיס טקסטואלי + נושא ממצא, בפיצול לקבוצות ───────
  // ─────── שלב 3 חדש: ריכוז מסקנות מחקריות משלב ב׳ של הכלי האנליטי ───────
  // קורא ישירות מ-compareNotes, ללא AI, ללא שינוי בנתוני המקור.
  function runStage3(){
    const units=collectRelevant(); // כל היחידות של הדמות
    const headers=["יחידה","פרק","מקבילה","מסקנה מחקרית משלב ב׳"];
    const rows=[]; const sourceIds=[]; const detailed=[];
    let withConclusion=0, withoutConclusion=0, noParallel=0;
    const missingList=[];
    units.forEach(u=>{
      const uid=String(u.id);
      const noteRaw=getCompareNote(uid,concept,raw);
      const note=(noteRaw||"").trim();
      const unitLabel=u.name||u.label||"?";
      const chapterLabel=u.chapter||"?";
      const parallelLabel=u.sourceRef?u.sourceRef:"סונדרגוט (אין מקבילה)";
      if(!u.sourceRef) noParallel++;
      let statusCell;
      if(note){
        withConclusion++;
        statusCell=note;
      }else{
        withoutConclusion++;
        statusCell="— (לא נכתבה מסקנה בשלב ב׳)";
        missingList.push(`${unitLabel} (${chapterLabel})`);
      }
      rows.push([`${unitLabel} (${chapterLabel})`,chapterLabel,parallelLabel,statusCell]);
      // sourceId יציב ליחידה (לתאימות אפשרית עם שלב 4)
      const sid=`s3cn_${uid}_${concept.replace(/\s+/g,"_")}`;
      sourceIds.push({sid,label:`${concept}.${unitLabel}.${chapterLabel}`});
      detailed.push({
        uid,unitName:unitLabel,chapter:chapterLabel,
        sourceRef:u.sourceRef||"",hasParallel:!!u.sourceRef,
        conclusion:note,hasConclusion:!!note
      });
    });
    const coverage={
      unitsChecked:units.length,
      conclusionsCollected:withConclusion,
      withoutConclusion,
      noParallel,
      missingList
    };
    const summary=`נבדקו ${units.length} יחידות של ${character==="solomon"?"שלמה":"דוד"} עבור המושג "${concept}". נאספו ${withConclusion} מסקנות מחקריות (נכתבו ידנית ב-שלב ב׳ של הכלי האנליטי). ${withoutConclusion} יחידות ללא מסקנה. מתוכן, ${noParallel} ללא מקבילה בשמואל/מלכים.`;
    const selfCheck=`קריאה דטרמיניסטית מתוך compareNotes בנתוני הכלי האנליטי (Firebase). אין שינוי בנתוני המקור, אין AI, אין קיצור. ${withoutConclusion>0?`יחידות ללא מסקנה: ${missingList.slice(0,8).join("; ")}${missingList.length>8?` ועוד ${missingList.length-8}`:""}.`:"כל היחידות הוכסו."}`;
    return{
      status:"חישוב מיידי — מוכן לאישור",
      hasTable:true,
      tableHeaders:headers,
      tableRows:rows,
      sourceIds,
      detailedConclusions:detailed,
      coverage,
      summary,
      selfCheck,
      source:"compareNotes",
      computedAt:new Date().toISOString()
    };
  }

  // ─────── שלב 3 ישן: ניתוח AI (נשמר כארכיון, לא נקרא כברירת מחדל) ───────
  async function runStage3LegacyAI(extra=""){
    const isEternal=(concept==="נצח"||concept==="עולם");
    const who=character==="solomon"?"שלמה":"דוד";
    const units=collectRelevant();
    const withIndic=[]; const notRelCount=[];
    units.forEach(u=>{
      const uid=String(u.id);
      const s=getUnitSummary(uid,raw);
      const nrList=(s&&Array.isArray(s.notRelevantConcepts))?s.notRelevantConcepts:[];
      if(nrList.includes(concept)){ notRelCount.push(u.name||u.label); return; }
      const ec=getEntry(uid,concept,"chronicles",raw)||{};
      const hasP=(ec.params||[]).some(p=>p&&p.found===true);
      const hasE=!!(ec.explicit_note&&ec.explicit_note.trim());
      if(hasP||hasE) withIndic.push(u);
    });
    if(!withIndic.length){
      return{status:"אין נתונים",hasTable:false,
        summary:`לא נמצאו יחידות עם אינדיקטורים חיוביים למושג "${concept}" ב${who}.`,
        selfCheck:"אין נתונים לניתוח."};
    }
    const BATCH=4; // קטן יותר מ-8 כדי להימנע ממגבלת טוקנים ולאפשר שמירות ביניים תכופות
    const batches=[];
    for(let i=0;i<withIndic.length;i+=BATCH) batches.push(withIndic.slice(i,i+BATCH));

    // ─ המשכיות: אם יש תוצאות חלקיות מהרצה קודמת, המשיכי מאותה נקודה ─

### עקרונות מחייבים

**1. שלמות הממצאים**
- עליך לעבור על כל ${rows.length} האינדיקטורים ללא יוצא מן הכלל.
- כל אינדיקטור חייב לקבל שיוך מפורש לתופעה אחת לפחות, או להישמר כתופעה עצמאית אם אינו מתאים לקבוצה.
- אין להשמיט אינדיקטור משום שהוא מופיע ביחידה אחת בלבד או אינו משתלב בקלות.
- **אין ליצור קבוצת "אינדיקטורים פזורים" כתחליף לניתוח פרטני**. אינדיקטור ייחודי = תופעה עצמאית בשם מדויק משלה.

**2. הגדרה מחקרית של תופעה טקסטואלית**
תופעה טקסטואלית = פעולה, אמירה, בחירה נרטיבית, דפוס התנהגות או אמצעי עיצוב ספרותי. אחד אינדיקטורים רק כאשר יש מכנה משותף **מהותי וברור**. דמיון כללי בנושא, השתייכות לאותו מושג, או הופעה באותה יחידה — **אינם מספיקים**.

**3. הבחנה בין אמצעי העיצוב** (זה קריטי!)
יש לשמר הבחנה בין:
- מעשיו והחלטותיו של המלך
- דבריו הישירים של המלך (במיוחד הסברי מניעיו)
- דברי המספר על המלך
- דברי דמויות אחרות על המלך
- מבנה הסיפור ובחירת האירועים

**אין לאחד אמצעי עיצוב שונים רק משום שהם מובילים למסקנה רעיונית דומה**. איחוד מותר רק כאשר הם מבטאים תופעה משותפת, תוך שמירת ההבחנה ביניהם.

**4. דיוק בין ממצא לפרשנות**
- הבחן בין מה שהטקסט מתאר בפועל לבין המשמעות הפרשנית.
- אל תייחס לדמות תכונה/כוונה/מניע שאינם מבוססים על הממצאים.
- **אל תסיק שכל פעולה מוצלחת מבטאת הכוונה אלוהית**, שכל פעולה מנהלית מבטאת השראה רוחנית, או שכל התייחסות למקדש מעידה על תכונה של המלך.
- הימנע מהסקת מסקנות על כוונת הכרוניסט בשלב זה.

**5. שמירה על הבחנות בין תופעות**
יש להבחין (לדוגמה) בין:
- הכרה במקור האלוהי של המלוכה ≠ ייחוס ניצחון צבאי לאלוהים
- התייעצות לפני פעולה ≠ הכרה בטעות לאחר פעולה
- ארגון מוסדי ≠ הצגת הארגון כמימוש הוראה אלוהית
- פעולה של המלך ≠ הצהרתו על מניעיה
- אישור אלוהי ≠ תמיכה ציבורית

אל תניח שהתופעות זהות. אחד רק כשהראיות מצדיקות.

**6. שמירת ממצאים ייחודיים ומסייגים**
- תופעה חשובה אינה חייבת לחזור במספר יחידות.
- אם אינדיקטור מבטא אמצעי עיצוב ייחודי — שמר אותו כתופעה עצמאית.
- ממצאים על **היעדר ביטוי מפורש**, סתירה או מגבלה פרשנית — יוצגו בנפרד מהתופעות החיוביות.
- **אל תמחק ממצא מסייג כדי ליצור תמונה אחידה או חיובית**.

**7. ניסוח שמות התופעות**
- קצר, מדויק, תיאורי.
- **אסור** לכלול את המושג "${concept}" או נגזרת (${concept==="רוח/ריח"?"כולל רוח, ריח, רוחני, השראה":""}${concept==="אחד/יחד"?"כולל אחד, יחד, אחדות":""}${concept==="נצח"?"כולל נצח, לנצח, תמיד":""}${concept==="עולם"?"כולל עולם, לעולם":""}).
- **אסור** לנסח כותרת שהיא מסקנה תיאולוגית/הערכה כשהראיות מתארות רק פעולה/אמירה.
- **אסור** להשתמש בכותרות רחבות מדי.

**8. צמצום מבוקר**
- **אין מספר מחייב של תופעות**. אל תאחד תופעות שונות רק כדי לעמוד בטווח מספרי.
- עדיף מספר גדול יותר של תופעות מדויקות על פני מעטות ורחבות.
- **צמצום לדפוסים מרכזיים ייעשה בשלב 5** — לא על ידי השמטה בשלב 4.

**9. תיעוד מחקרי**
- לכל תופעה שמור את כל האינדיקטורים (indicatorIndices), היחידות, הפסוקים והפרשנים כפי שהופיעו במקור.
- אל תמציא פסוקים, אסמכתאות, פרשנים או מספרי עמודים.

### תהליך העבודה המחייב
א. עבור על כל ${rows.length} האינדיקטורים.
ב. זהה לכל אינדיקטור את הפעולה/אמירה/אמצעי עיצוב שלו.
ג. צור קבוצות עם מכנה משותף טקסטואלי מוכח.
ד. בדוק כל קבוצה — האם כל האינדיקטורים שבה מבטאים את התופעה שנבחרה?
ה. בדוק תופעות רחבות מדי (לפצל) או חופפות (אולי לאחד).
ו. לכל אינדיקטור שלא שובץ — תן שיוך או צור תופעה עצמאית בשם מדויק, עם נימוק.
ז. בקרת שלמות: כל אינדיקטור מופיע ≥1 פעמים.
ח. בקרת דיוק: אין טענות החורגות מהראיות.

### תיקון מחייב: איזון בין שלמות הממצאים לבין איחוד מחקרי

**עליך לשמר את כל האינדיקטורים המאומתים, אך אין ליצור תופעה נפרדת לכל אינדיקטור כברירת מחדל.**

בצע **שני סבבי עבודה**:

**סבב ראשון: מיפוי מלא**
זהה את התוכן הטקסטואלי ואת אמצעי העיצוב של כל אינדיקטור. ודא שאף אינדיקטור אינו נעלם.

**סבב שני: איחוד מחקרי מבוקר**
בדוק אילו אינדיקטורים מבטאים אותה תופעה טקסטואלית, גם כאשר הם מופיעים ביחידות שונות או מוצגים באמצעים ספרותיים שונים.

יש להבחין בין שני מצבים:
1. **אינדיקטורים המתארים אותה תופעה באמצעות ראיות שונות** → יש לאחד אותם ולשמר את ההבדלים בתוך תיאור התופעה.
2. **אינדיקטורים המתארים תופעות שונות בעלות נושא משותף** → אין לאחד אותם רק בשל הדמיון הנושאי.

**הבחנה בין דברי המלך, מעשיו, דברי המספר ודברי דמויות אחרות אינה מחייבת יצירת תופעות נפרדות בכל מקרה.** היא מחייבת שמירה מפורשת על זהות הגורם המציג את הממצא (ציוני ב-subject ובתיאור התופעה).

לכל תופעה מאוחדת יש להציג:
- שם תיאורי קצר
- מכנה משותף טקסטואלי
- מזהי כל האינדיקטורים ששויכו אליה (indicatorIndices)
- יחידות ופסוקים
- אמצעי העיצוב הרלוונטיים
- נימוק קצר לאיחוד (justification)

**אין לקבוע מספר תופעות רצוי מראש.** עם זאת, **אם מספר התופעות קרוב למספר האינדיקטורים (${rows.length})**, יש לבצע בדיקת חפיפות נוספת ולנמק מדוע לא ניתן לבצע איחוד משמעותי יותר.

**אין לכלול בתיאור התופעה מסקנות על התאמה לחזון הנבואי או על משמעות שינויים ביחס לשמואל–מלכים.** מסקנות אלה ייבחנו בשלבים 6–7.

**בדיקת עקביות אוטומטית בסיום**: בדוק שסך האינדיקטורים המשויכים (איחוד indicatorIndices מכל התופעות) זהה למספר ששדווח ב-controlReport.indicatorsAssigned, ושמספר התופעות ב-controlReport.phenomenaCount זהה למספר שורות הפלט. אם קיימת סתירה — אין להציג את השלב כשלם.

**כלל יסוד**: כל אינדיקטור חייב להישמר, אך **אין חובה שכל אינדיקטור יהפוך לתופעה עצמאית**.

נתוני שלב 3 (${rows.length} אינדיקטורים ממוספרים):

### פלט נדרש

החזרי JSON בלבד (ללא markdown). קציני description ו-unitsText (האינדיקטורים זמינים ל-drill-down דרך indicatorIndices):

{"phenomena":[{"name":"שם תיאורי מדויק (ללא המושג, לא קטגוריה פורמלית, לא מסקנה תיאולוגית)","description":"משפט או שניים — תיאור טקסטואלי מדויק של התופעה","unitsText":"שמות יחידות ייצוגיות מופרדות בפסיקים","indicatorIndices":[1,3,5,7],"subject":"דוד עצמו | המספר | דמות אחרת | סביבה | מעורב","commentators":"עד 4 פרשנים מרכזיים או —","isLimiting":false,"justification":"נימוק קצר למי שהתופעה היא עצמאית/חריגה — לא חובה לרוב"}],"methodNote":"הערת שיטה קצרה","controlReport":{"indicatorsExamined":${rows.length},"indicatorsAssigned":0,"indicatorsUnassigned":0,"phenomenaCount":0,"splitOrMerged":"תופעות שפוצלו/אוחדו, עם נימוק קצר, או 'ללא'","independentFindings":"תופעות עצמאיות או מסייגות שזוהו, או 'ללא'","requiresReview":"טענות הדורשות בדיקה מחקרית נוספת, או 'ללא'"}}

**חשוב**: בשדה isLimiting=true ציוני אם התופעה היא מסייגת (מצביעה על היעדר ביטוי, סתירה או מגבלה) ולא דפוס חיובי. **אל תחסרי אינדיקטורים**: אם ב-controlReport.indicatorsUnassigned>0 — הציון יוחזר כבלתי מאושר.`;
    const resp=await aiCallDirect(prompt,16000);
    const parsed=parseJSON(resp);
    const phenomena=parsed.phenomena||[];
    // סימון תופעות מסייגות בשם לקריאה נוחה
    const tableRows=phenomena.map(p=>[
      (p.isLimiting?"⊗ ":"")+(p.name||""),
      (p.description||"")+(p.justification?` — נימוק: ${p.justification}`:""),
      p.unitsText||p.units||"",
      p.subject||"",
      p.commentators||"—"
    ]);
    const phenomenaMeta=phenomena.map(p=>({
      indicatorIndices:Array.isArray(p.indicatorIndices)
        ?p.indicatorIndices.filter(i=>Number.isInteger(i)&&i>=1&&i<=rows.length)
        :[],
      isLimiting:!!p.isLimiting
    }));
    // בדיקות בדיעבד
    const conceptWords=(concept.split("/")||[concept]).map(w=>w.trim()).filter(Boolean);
    const nameUsesConcept=phenomena.filter(p=>conceptWords.some(w=>(p.name||"").includes(w))).length;
    const mappedSet=new Set();
    phenomenaMeta.forEach(m=>m.indicatorIndices.forEach(i=>mappedSet.add(i)));
    const missingIndices=[];
    for(let i=1;i<=rows.length;i++){ if(!mappedSet.has(i)) missingIndices.push(i); }
    const unmappedCount=missingIndices.length;
    const missingList=missingIndices.length?` [חסרים: ${missingIndices.join(", ")}]`:"";
    const limitingCount=phenomena.filter(p=>p.isLimiting).length;
    const cr=parsed.controlReport||{};
    // סטטוס לפי כלל ד"ר עמר: אם יש אינדיקטור ללא שיוך — לא מאושר
    const stageStatus=unmappedCount===0?"מוכן לאישור":"לא מאושר — חסרים אינדיקטורים";
    return{
      status:stageStatus,hasTable:true,
      tableHeaders:["שם התופעה","תיאור","יחידות","נושא דומיננטי","פרשנים"],
      tableRows,
      phenomenaMeta, // מאפשר drill-down לאינדיקטורים משלב 3
      summary:`זוהו ${phenomena.length} תופעות (${limitingCount} מסייגות ⊗) מתוך ${rows.length} אינדיקטורים — ${mappedSet.size} משויכים, ${unmappedCount} לא משויכים${missingList}.${parsed.methodNote?` | הערת שיטה: ${parsed.methodNote}`:""}${cr.splitOrMerged&&cr.splitOrMerged!=="ללא"?` | פיצולים/איחודים: ${cr.splitOrMerged}`:""}${cr.independentFindings&&cr.independentFindings!=="ללא"?` | ממצאים עצמאיים: ${cr.independentFindings}`:""}${cr.requiresReview&&cr.requiresReview!=="ללא"?` | דורש בדיקה: ${cr.requiresReview}`:""}`,
      selfCheck:`בדיקה עצמית לפי מתודולוגיית ד"ר עמר:\n1) שלמות אינדיקטורים: ${unmappedCount===0?`✓ כל ${rows.length} שויכו.`:`⚠ ${unmappedCount} לא שויכו: ${missingIndices.join(", ")}. הכלי לא מאושר. פתחי את טבלת האינדיקטורים החסרים למטה, ערכי ידנית או דחי והריצי שוב.`}\n2) שמות התופעות ללא המושג "${concept}"? ${nameUsesConcept===0?"✓":`⚠ ${nameUsesConcept} מכילות את המושג — דחי והרץ שוב.`}\n3) איכות על צמצום: ${phenomena.length} תופעות (ללא מגבלה מספרית). לפי ד"ר עמר, מספר גדול יותר של תופעות מדויקות עדיף על מעט רחבות. הצמצום לדפוסים ייעשה בשלב 5.\n4) שמירת ההבחנה בין אמצעי העיצוב (פעולה / דיבור ישיר / המספר / דמות אחרת): בדקי שכל תופעה לא מערבבת אמצעי עיצוב שונים.\n5) דיוק: בדקי שהתיאורים לא כוללים מסקנות תיאולוגיות החורגות מהראיות (למשל, שכל ייחוס מצליח = הכוונה אלוהית).\n6) ממצאים מסייגים: ${limitingCount>0?`✓ ${limitingCount} תופעות סומנו כמסייגות (⊗) — הצגה נפרדת מהתופעות החיוביות.`:"אין תופעות מסייגות — ייתכן שכל הממצאים אכן חיוביים, או שלא זוהו היעדרויות."}\n7) דוח בקרה מה-AI: בדקו ${cr.indicatorsExamined||"?"} אינדיקטורים, שויכו ${cr.indicatorsAssigned||"?"}, נותרו ${cr.indicatorsUnassigned||"?"} ללא שיוך, יצרו ${cr.phenomenaCount||"?"} תופעות.`
    };
  }

  async function runStage(n,extra=""){
    setLoading(true);
    setProgressNote(n>=4?`⏳ שלב ${n} רץ... (קריאה ל-AI, יכול לקחת 30-120 שניות)`:`⏳ שלב ${n} רץ...`);
    try{
      // גיבוי שלב 3 הישן (ניתוח AI) כאשר מריצים את החדש
      if(n===3){
        const existing=stageData.stage3;
        if(existing&&existing.promptVersion&&!existing.source){
          // זו תוצאת AI ישנה — העבר ל-stage3_legacy_ai כדי לא לדרוס
          const curData={...stageData};
          curData.stage3_legacy_ai={...existing,archivedAt:new Date().toISOString(),archivedReason:"החלפת שלב 3 בריכוז מסקנות מחקריות משלב ב׳"};
          setStageData(curData);
        }
      }
      // שלב 4: הכפתור "הפעל" אינו רלוונטי יותר — הפעולות מתבצעות בפאנל פאזה 1 עצמו
      if(n===4){
        setLoading(false);
        setProgressNote("");
        alert("שלב 4 הוחלף לשיטה חדשה: הגדרה→בדיקת התאמה→סינתזה. השתמשי בכפתורי הפאנל של שלב 4 (בפאזות א/ב/ג) ולא ב'הפעל'. התופעות הישנות (ד'1) נשמרו בארכיון בסוף הפאנל.");
        return;
      }
      let result;
      if(n===1) result=runStage1();
      else if(n===2) result=runStage2();
      else if(n===3) result=runStage3(); // סינכרוני — ללא AI
      else {
        // שלבים 5-7 — יבואו בסבבים הבאים
        await new Promise(r=>setTimeout(r,500));
        result={
          status:"בפיתוח",hasTable:true,
          tableHeaders:["עמודה 1","עמודה 2","עמודה 3"],
          tableRows:[["שלב "+n,"יתווסף בסבב הבא","—"]],
          summary:`שלב ${n} (${STAGE_LABELS[n]}) — טרם נבנה. סבב בנייה הבא יוסיף אותו.`,
          selfCheck:"בפיתוח."
        };
      }
      const newData={...stageData,[`stage${n}`]:result};
      saveNow(newData);
    } catch(e){
      // שגיאות לא נשמרות
      setStageData({...stageData,[`stage${n}`]:{status:"שגיאה",hasTable:false,summary:`⚠️ ${e.message||e}`,selfCheck:"נסי שוב — השגיאה לא נשמרה."}});
    }
    setLoading(false); setProgressNote("");
  }

    saveNow({...stageData,approvedStages:approved});
    if(n<7) setCurrentStage(n+1);

        <strong>סטטוס:</strong> במסך זה — שלבים 1-4 פר-מושג (שלב 4 חזר לרמת מושג בשיטה החדשה: הגדרה → בדיקת התאמה → סינתזה). ד'1 הישן (איחוד ממצאים ברמת ממד) נגיש עדיין דרך מסך בחירת מושג, בכפתור "📊 שלב ד'".

                                      </div>
                                    </div>
                                  </>

                              </>

                                <div style={{fontSize:"11px",color:"#94a3b8",marginBottom:"10px",lineHeight:"1.5"}}>לחצי כדי שה-AI יבהיר כיצד ליישם את ההגדרה בעת בחינת הממצאים. ההבהרה היא הנחיית עבודה בלבד — אין בה הגדרה חדשה.</div>

                            {/* שלב 3 */}

                            <div style={{marginTop:"10px",padding:"8px 10px",background:"#78350f22",borderRadius:"5px",fontSize:"11px",color:"#fcd34d"}}>⚠ לפני המעבר לפאזה 2: יש להשלים ואשר את שלבים 2 ו-3 בפורמט החדש.</div>
                          )}
                          {stage4Availability.stage2HasData&&stage4Availability.stage3HasData&&stage4Availability.stage3IsNewFormat&&conceptDef&&conceptDef.text&&conceptDef.clarification&&(
                            <div style={{marginTop:"10px",padding:"8px 10px",background:"#064e3b33",borderRadius:"5px",fontSize:"11px",color:"#86efac"}}>✅ פאזה 1 הושלמה. נתוני המחקר זמינים, הגדרה והבהרה שמורות.</div>
                          )}

                        {/* ═══ פאזה 2 — בדיקת התאמה ═══ */}
                        {conceptDef&&conceptDef.text&&conceptDef.clarification&&stage4Availability.stage3IsNewFormat&&(

                                      </div>
                                      <div style={{padding:"8px 10px",background:"#0f172a",borderRadius:"6px"}}>
                                        <div style={{fontSize:"10px",color:"#64748b",fontWeight:"700",marginBottom:"4px"}}>החלטות החוקרת</div>
                                        <div style={{fontSize:"10px",color:"#cbd5e1",lineHeight:"1.5"}}>
                                          <span style={{color:"#86efac"}}>✓ אושר: {dec.approved}</span> · <span style={{color:"#fcd34d"}}>✏ ערוך: {dec.edited}</span> · <span style={{color:"#f59e0b"}}>⚠ לבדיקה: {dec.review}</span> · <span style={{color:"#64748b"}}>○ ממתין: {dec.pending}</span>

                                      <span style={{fontSize:"10px",color:"#fcd34d"}}>⚠ {p2Proposal.totalUnits-p2Proposal.processedUnits} יחידות עדיין לא עובדו</span>
                                    </>

                                  <button onClick={()=>{setAcceptTestOpen(!acceptTestOpen);setAcceptTestSelected([]);}} disabled={p2Loading} style={{padding:"6px 14px",borderRadius:"5px",border:"1px solid #818cf8",cursor:p2Loading?"wait":"pointer",background:acceptTestOpen?"#1e1b4b":"transparent",color:"#a5b4fc",fontSize:"11px",fontWeight:"700"}}>🧪 בדיקת קבלה סלקטיבית</button>

                                  {p2Error&&<div style={{padding:"4px 10px",background:"#7f1d1d33",borderRadius:"5px",fontSize:"10px",color:"#fca5a5"}}>❌ {p2Error}</div>}

                                )}

                    {n===3&&hasResult.promptVersion&&!hasResult.source&&(
                      <div style={{marginBottom:"12px",padding:"10px 14px",background:"#78350f22",borderRadius:"7px",border:"1px dashed #f59e0b66",fontSize:"11px",color:"#fcd34d"}}>
                        💡 תוכן זה נוצר ב-AI (שלב 3 הישן). שלב 3 עודכן: הוא כעת מרכז את המסקנות המחקריות שכתבת בשלב ב׳ של הכלי האנליטי, ללא AI. <strong>כדי להחליף:</strong> בטלי אישור ולחצי "הפעל שוב". התוכן הקיים יישמר באופן אוטומטי כארכיון ולא יידרס.
                      </div>
                    )}

                    {/* הודעה למקרה שהפירוט חסר (נתונים ישנים לפני עדכון הכלי) */}
                    {n===2&&hasResult.tableRows&&hasResult.tableRows.length>0&&(!hasResult.indicatorDetails||hasResult.indicatorDetails.length===0)&&(
                      <div style={{marginBottom:"12px",padding:"10px 14px",background:"#78350f22",borderRadius:"7px",border:"1px dashed #f59e0b66",fontSize:"11px",color:"#fcd34d"}}>
                        💡 הפירוט המלא לפי אינדיקטורים (עם פסוק והסבר) זמין בגרסה חדשה של הכלי. <strong>כדי לראות אותו:</strong> בטלי אישור לשלב זה (אם מאושר) ולחצי "הפעל שוב". הנתונים הקיימים לא יוחלפו — יתווסף רק הפירוט.
                      </div>
                    )}

                    {/* פירוט אינדיקטורים חיוביים לפי יחידה (שלב 2) */}
                    {n===2&&hasResult.indicatorDetails&&hasResult.indicatorDetails.length>0&&(
                      <div style={{marginBottom:"12px",padding:"12px 14px",background:"#0f172a",borderRadius:"7px",border:`1px solid ${dimColor}44`}}>
                        <div style={{fontSize:"11px",color:dimColor,fontWeight:"700",marginBottom:"8px"}}>📋 פירוט אינדיקטורים חיוביים לפי יחידה (מהכלי האנליטי)</div>
                        <div style={{maxHeight:"500px",overflowY:"auto",display:"flex",flexDirection:"column",gap:"10px"}}>
                          {hasResult.indicatorDetails.map((ud,ui)=>(
                            <div key={ui} style={{padding:"10px",background:"#1e293b",borderRadius:"6px",borderRight:`2px solid ${dimColor}66`}}>
                              <div style={{fontSize:"12px",fontWeight:"700",color:"#f1f5f9",marginBottom:"6px"}}>{ud.unitName} <span style={{color:"#64748b",fontWeight:"400"}}>({ud.chapter}) · {ud.totalFound} אינדיקטורים חיוביים</span></div>
                              <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
                                {ud.indicators.map((ind,ii)=>(
                                  <div key={ii} style={{padding:"7px 10px",background:"#0f172a",borderRadius:"5px",fontSize:"11px"}}>
                                    <div style={{display:"flex",gap:"8px",alignItems:"flex-start",flexWrap:"wrap",marginBottom:"3px"}}>
                                      <span style={{background:`${dimColor}22`,color:dimColor,padding:"1px 6px",borderRadius:"3px",fontSize:"10px",fontWeight:"700"}}>{ind.paramLabel}</span>
                                      {ind.verse&&<span style={{background:"#1e3a5f",color:"#93c5fd",padding:"1px 6px",borderRadius:"3px",fontSize:"10px",fontWeight:"700"}}>פסוק {ind.verse}</span>}
                                    </div>
                                    <div style={{color:"#cbd5e1",lineHeight:"1.5",marginBottom:ind.note?"4px":"0"}}>{ind.q}</div>
                                    {ind.note&&<div style={{color:"#94a3b8",fontSize:"10px",fontStyle:"italic",padding:"4px 6px",background:"#334155",borderRadius:"3px",lineHeight:"1.4"}}>💬 {ind.note}</div>}
                                  </div>
                                ))}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {n!==4&&hasResult.summary&&(
                      <div style={{marginBottom:"10px",padding:"10px 12px",background:"#0f172a",borderRadius:"6px",borderRight:`3px solid ${dimColor}`}}>
                        <div style={{fontSize:"10px",color:dimColor,fontWeight:"700",marginBottom:"4px"}}>סיכום השלב</div>
                        {editMode[n]?(
                          <textarea value={(editDraft[n]&&editDraft[n].summary)||""} onChange={e=>updateField(n,"summary",e.target.value)}
                            style={{width:"100%",minHeight:"80px",padding:"6px",background:"#1e293b",border:"1px solid #475569",borderRadius:"4px",color:"#f1f5f9",fontSize:"12px",fontFamily:"inherit",resize:"vertical",direction:"rtl"}}/>
                        ):(
                          <div style={{fontSize:"12px",color:"#cbd5e1",lineHeight:"1.6"}}>{hasResult.summary}</div>
                        )}
                      </div>
                    )}
                    {n!==4&&hasResult.selfCheck&&(
                      <div style={{marginBottom:"12px",padding:"9px 12px",background:"#0f172a",borderRadius:"6px",border:"1px dashed #475569"}}>
                        <div style={{fontSize:"10px",color:"#94a3b8",fontWeight:"700",marginBottom:"4px"}}>🔍 בדיקה עצמית</div>
                        {editMode[n]?(
                          <textarea value={(editDraft[n]&&editDraft[n].selfCheck)||""} onChange={e=>updateField(n,"selfCheck",e.target.value)}
                            style={{width:"100%",minHeight:"60px",padding:"6px",background:"#1e293b",border:"1px solid #475569",borderRadius:"4px",color:"#f1f5f9",fontSize:"11px",fontFamily:"inherit",resize:"vertical",direction:"rtl"}}/>
                        ):(
                          <div style={{fontSize:"11px",color:"#94a3b8",lineHeight:"1.6"}}>{hasResult.selfCheck}</div>
                        )}
                      </div>
                    )}
                    {n!==4&&(
                      <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>
                        {approved?(
                          <div style={{fontSize:"11px",color:"#64748b",padding:"6px 0"}}>👁 מצב עיון בלבד. להרצה מחדש או שינוי — לחצי "בטל אישור" למעלה.</div>
                        ):hasResult.status==="שגיאה"?(
                          <button onClick={()=>runStage(n)} disabled={loading} style={{padding:"8px 18px",borderRadius:"7px",border:"none",cursor:loading?"wait":"pointer",background:loading?"#475569":"#f59e0b",color:"white",fontSize:"12px",fontWeight:"700",opacity:loading?0.7:1}}>{loading?(progressNote||"⏳ רץ..."):"🔄 הפעל שוב"}</button>
                        ):(
                          <>
                            <button onClick={()=>approveStage(n)} disabled={loading} style={{padding:"8px 16px",borderRadius:"7px",border:"none",cursor:loading?"not-allowed":"pointer",background:"#34d399",color:"white",fontSize:"12px",fontWeight:"700",opacity:loading?0.5:1}}>✓ אשר {n<7?"ועבור לשלב הבא":"סיים ניתוח"}</button>
                            <button onClick={()=>runStage(n)} disabled={loading} style={{padding:"8px 16px",borderRadius:"7px",border:`1px solid ${loading?"#475569":"#ef4444"}`,cursor:loading?"wait":"pointer",background:loading?"#1e293b":"transparent",color:loading?"#94a3b8":"#ef4444",fontSize:"12px",fontWeight:"700",opacity:loading?0.7:1}}>{loading?(progressNote||"⏳ רץ..."):"🔄 הפעל שוב"}</button>
                          </>
                        )}
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════
// ── אפליקציה ראשית ─────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
function App(){
  const [screen,setScreen]=useState("home");
  // ה-raw נטען אוטומטית מ-Firebase מהכלי האנליטי (אין צורך להעלות גיבוי).
  // גיבוי JSON מהמחשב נשאר כאופציה חלופית.
  const [raw,setRaw]=useState(null);
  const [rawSource,setRawSource]=useState(""); // "firebase" | "file" | ""
  const [fbStatus,setFbStatus]=useState("loading"); // "loading" | "loaded" | "empty" | "error"
  // stageResults — מקור האמת לתוצאות השלבים (נטען מ-Firebase, נמשך ללוקאל ולפיירבייס בכל שמירה)
  const [stageResults,setStageResults]=useState(()=>LS_get("stageResults",{}));
  // bootDone — דגל שחוסם את הכניסה לניתוח עד שהטעינה מ-Firebase הסתיימה
  const [bootDone,setBootDone]=useState(false);
  const [apiKey,setApiKey]=useState(()=>LS_get("apiKey",""));
  const [showApiModal,setShowApiModal]=useState(false);
  const [selection,setSelection]=useState(null);

  // טעינה חד-פעמית מ-Firebase: גם ה-raw (research2) וגם תוצאות הסינתזה (synthesis_v1).
  useEffect(()=>{
    let rawDone=false, srDone=false;
    const check=()=>{ if(rawDone&&srDone) setBootDone(true); };
    fbLoadResearch(data=>{
      if(data){
        setRaw(data);
        setRawSource("firebase");
        setFbStatus("loaded");
      }else{
        setFbStatus("empty");
      }
      rawDone=true; check();
    });
    fbLoadStageResults(sr=>{
      // Firebase הוא המקור הסמכותי; מעדכן את ה-React state ואת ה-LS כמטמון מקומי.
      if(sr && Object.keys(sr).length){
        LS_set("stageResults",sr);
        setStageResults(sr);
      }
      srDone=true; check();
    });
  },[]);

  function handleBackup(data,name){
    // העלאת גיבוי מקומי (fallback) — דורס את מה שהגיע מ-Firebase.
    setRaw(data);
    setRawSource("file");
  }

  // גיבוי ושחזור של עבודת הסינתזה — נשארים כאופציה למשתמשת (למקרה שצריך קובץ חיצוני).
  function downloadSynthBackup(){
    const stageResults=LS_get("stageResults",{});
    const payload={
      version:"synthesis-v1",
      exportedAt:new Date().toISOString(),
      stageResults:stageResults,
    };
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`synthesis_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }
  function uploadSynthBackup(e){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.stageResults){ alert("קובץ לא תקין — לא נמצא stageResults"); return; }
        const current=LS_get("stageResults",{});
        const merged={...current,...data.stageResults};
        LS_set("stageResults",merged);
        fbSaveStageResults(merged); // סנכרון מיידי ל-Firebase
        alert(`✓ שוחזרו ${Object.keys(data.stageResults).length} מושגים (סה"כ כעת: ${Object.keys(merged).length}). סונכרן ל-Firebase.`);
        e.target.value=""; // reset
      }catch(err){ alert("שגיאה בטעינה: "+err.message); }
    };
    r.readAsText(f);
  }

  function handleApiKey(key){
    setApiKey(key); LS_set("apiKey",key);
  }

  const backupStats=useMemo(()=>{
    if(!raw) return null;
    const units=raw.units||[];
    const notesCount=Object.values(raw.compareNotes||{}).reduce((s,o)=>s+Object.values(o).filter(v=>v&&v.trim()).length,0);
    const conceptCount=allConceptsFrom(raw).length;
    return{
      units:units.length,
      davidCount:units.filter(u=>u.character==="david").length,
      solomonCount:units.filter(u=>u.character==="solomon").length,
      notes:notesCount,
      concepts:conceptCount
    };
  },[raw]);

  const canStart=raw&&apiKey;

  return(
    <div>
      {/* סרגל עליון */}
      <div style={{background:"#1e293b",borderBottom:"1px solid #334155",padding:"10px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:"14px"}}>
          <div style={{fontSize:"15px",fontWeight:"bold",color:"#f1f5f9",cursor:"pointer"}} onClick={()=>setScreen("home")}>🧬 כלי סינתזה — דברי הימים</div>
          {raw&&(
            <button onClick={()=>setScreen(screen==="home"?"selector":"home")} style={{padding:"5px 12px",borderRadius:"6px",border:"1px solid #475569",cursor:"pointer",background:"transparent",color:"#94a3b8",fontSize:"11px",fontWeight:"600"}}>
              {screen==="home"?"📊 התחלת ניתוח":"🏠 ראשי"}
            </button>
          )}
        </div>
        <div style={{display:"flex",gap:"8px",alignItems:"center",fontSize:"10px"}}>
          <span style={{color:fbStatus==="loading"?"#fbbf24":(fbStatus==="loaded"?"#34d399":(fbStatus==="empty"?"#94a3b8":"#f87171"))}}>
            🔥 {fbStatus==="loading"?"מתחבר...":(fbStatus==="loaded"?"Firebase":(fbStatus==="empty"?"ריק":"שגיאה"))}
          </span>
          <span style={{color:"#475569"}}>·</span>
          <span style={{color:raw?"#34d399":"#64748b"}}>📥 {raw?(rawSource==="firebase"?"נתונים":"מקומי"):"ללא"}</span>
          <span style={{color:"#475569"}}>·</span>
          <span style={{color:apiKey?"#34d399":"#64748b",cursor:"pointer"}} onClick={()=>setShowApiModal(true)}>🔑 {apiKey?"API":"ללא מפתח"}</span>
        </div>
      </div>

      {/* תוכן */}
      {screen==="home"&&<WelcomeScreen onBackupLoaded={handleBackup} hasBackup={!!raw} hasApiKey={!!apiKey} onOpenApiKey={()=>setShowApiModal(true)} backupStats={backupStats} fbStatus={fbStatus} rawSource={rawSource} onDownloadSynth={downloadSynthBackup} onUploadSynth={uploadSynthBackup}/>}
      {screen==="home"&&canStart&&bootDone&&(
        <div style={{textAlign:"center",marginTop:"-20px",paddingBottom:"30px"}}>
          <button onClick={()=>setScreen("selector")} style={{padding:"14px 36px",borderRadius:"10px",border:"none",cursor:"pointer",background:"#34d399",color:"white",fontSize:"15px",fontWeight:"700"}}>
            🚀 התחלת ניתוח
          </button>
          <div style={{marginTop:"10px",fontSize:"11px",color:"#64748b"}}>
            {Object.keys(stageResults).length>0 ? `✓ נטענו ${Object.keys(stageResults).length} מושגים עם תוצאות שלבים מ-Firebase` : "ללא תוצאות שלבים שמורות — נתחיל מאפס"}
          </div>
        </div>
      )}
      {screen==="home"&&canStart&&!bootDone&&(
        <div style={{textAlign:"center",marginTop:"-20px",paddingBottom:"30px"}}>
          <div className="pulse" style={{display:"inline-block",padding:"12px 30px",borderRadius:"10px",background:"#334155",color:"#cbd5e1",fontSize:"14px"}}>
            ⏳ טוען תוצאות שלבים מ-Firebase... (יתעדכן לכפתור ברגע שנסיים)
          </div>
        </div>
      )}
      {screen==="selector"&&raw&&<ConceptSelector raw={raw}
        onPick={sel=>{setSelection(sel);setScreen("analyze");}}
        onPickDimension={sel=>{setSelection(sel);setScreen("dim4");}}
        onBackHome={()=>setScreen("home")} stageResults={stageResults}/>}
      {screen==="analyze"&&selection&&selection.concept&&<AnalysisScreen raw={raw} character={selection.character} dimId={selection.dimId} concept={selection.concept} apiKey={apiKey} onBackToSelector={()=>setScreen("selector")} stageResults={stageResults} setStageResults={setStageResults}/>}
      {screen==="dim4"&&selection&&<DimensionStage4Screen raw={raw} character={selection.character} dimId={selection.dimId} apiKey={apiKey} onBack={()=>setScreen("selector")} stageResults={stageResults} setStageResults={setStageResults}/>}

      {showApiModal&&<ApiKeyModal currentKey={apiKey} onSave={handleApiKey} onClose={()=>setShowApiModal(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
