// ── מסך שלב ד' — ברמת ממד (מלך × ממד) ─────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
function DimensionStage4Screen({raw,character,dimId,apiKey,onBack,stageResults,setStageResults}){
  const dim=DIMS.find(d=>d.id===dimId)||{};
  const dimLabel=dim.label||dimId;
  const dimColor=dim.color||"#818cf8";
  const charName=character==="solomon"?"שלמה":"דוד";
  const concepts=dim.concepts||[];

  // ─ יחידות גולמיות של הדמות מהכלי האנליטי (מקור האמת ליחידות המחקר) ─
  const rawUnits=useMemo(()=>{
    if(!raw||!Array.isArray(raw.units)) return [];
    return raw.units.filter(u=>(u.character||"david")===character);
  },[raw,character]);

  // ─ קליטה דטרמיניסטית + התאמה לממצאים מהמאגר ─
  const ingest=useMemo(()=>{
    const findings=[];
    const perConcept={};
    const missingConcepts=[];
    concepts.forEach(c=>{
      const key=`${character}__${dimId}__${c}`;
      const sd=(stageResults||{})[key];
      if(!sd||!sd.stage3||!Array.isArray(sd.stage3.tableRows)){
        missingConcepts.push(c);
        perConcept[c]={total:0,hasSourceIds:0,missingSourceIds:0,approved:false};
        return;
      }
      const rows=sd.stage3.tableRows;
      const sids=sd.stage3.sourceIds||[];
      let hasIds=0, missIds=0;
      rows.forEach((row,i)=>{
        const unit=row[0]||"?";
        const basis=row[1]||"";
        const subject=row[2]||"";
        const commentators=row[3]||"";
        const sidObj=sids[i];
        if(sidObj&&sidObj.sid) hasIds++; else missIds++;
        findings.push({
          sid:sidObj?sidObj.sid:`tmp_${c}_${i}`,
          label:sidObj?sidObj.label:`${c}.${unit}.${i+1}`,
          concept:c,unit,basis,subject,commentators,rowIdx:i
        });
      });
      perConcept[c]={total:rows.length,hasSourceIds:hasIds,missingSourceIds:missIds,approved:(sd.approvedStages||[]).includes(3)};
    });

    // ─ התאמת כל finding ל-u.id מתוך raw.units (בדיקה דטרמיניסטית מורחבת) ─
    const unitIndex={}; rawUnits.forEach(u=>{ unitIndex[String(u.id)]=u; });
    const normalize=s=>String(s||"").replace(/[:\-.\s]+/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"");
    const normName=s=>String(s||"").replace(/[–—―—–−]/g,"-").replace(/[״"']/g,"").replace(/\s+/g," ").trim();
    const chapterIndex={};
    rawUnits.forEach(u=>{
      const key=normalize(u.chapter);
      if(key){ if(!chapterIndex[key]) chapterIndex[key]=[]; chapterIndex[key].push(u); }
    });
    const sortedChapters=Object.keys(chapterIndex).sort((a,b)=>b.length-a.length);
    // תמורות של chapter: אם ה-AI הפך סדר (למשל 1_18_11 במקום 18_1_11)
    function chapterPermutations(key){
      const parts=key.split("_").filter(x=>x);
      if(parts.length!==3) return [key];
      const [a,b,c]=parts;
      return [`${a}_${b}_${c}`,`${a}_${c}_${b}`,`${b}_${a}_${c}`,`${b}_${c}_${a}`,`${c}_${a}_${b}`,`${c}_${b}_${a}`];
    }
    const extractParen=t=>{ const m=String(t||"").match(/\(([^)]+)\)/); return m?m[1].trim():""; };
    // חילוץ רצף של 3 מספרים מופרדים ב-:_-. מהטקסט (גם מחוץ לסוגריים)
    const extractNumRef=t=>{ const m=String(t||"").match(/(\d+)[:\-_.](\d+)[:\-_.](\d+)/); return m?`${m[1]}_${m[2]}_${m[3]}`:""; };
    // Longest common prefix לשתי מחרוזות (לאחר נירמול)
    function commonPrefixLen(a,b){ let i=0; while(i<a.length&&i<b.length&&a[i]===b[i]) i++; return i; }

    const matchedFindings=[]; const unmatchedFindings=[];
    const unitHits={}; const unitByConcept={};
    findings.forEach(f=>{
      const text=f.unit||"";
      let matchedUid=null, matchStrategy="";
      const paren=extractParen(text);
      const parenNorm=normalize(paren);
      // אסטרטגיה 1: chapter מתוך סוגריים (ישיר)
      if(parenNorm&&chapterIndex[parenNorm]){
        const candidates=chapterIndex[parenNorm];
        if(candidates.length===1){ matchedUid=String(candidates[0].id); matchStrategy="paren-chapter"; }
        else{
          for(const u of candidates){
            const nm=u.name||u.label||"";
            if(nm&&text.includes(nm)){ matchedUid=String(u.id); matchStrategy="paren+name"; break; }
          }
          if(!matchedUid){ matchedUid=String(candidates[0].id); matchStrategy="paren-first"; }
        }
      }
      // אסטרטגיה 1ב: תמורות של chapter מהסוגריים (אם ה-AI הפך סדר)
      if(!matchedUid&&parenNorm){
        const perms=chapterPermutations(parenNorm);
        for(const p of perms){
          if(chapterIndex[p]){ matchedUid=String(chapterIndex[p][0].id); matchStrategy="paren-perm"; break; }
        }
      }
      // אסטרטגיה 2: רצף 3 מספרים כלשהו בטקסט + תמורות
      if(!matchedUid){
        const anyRef=extractNumRef(text);
        if(anyRef){
          if(chapterIndex[anyRef]){ matchedUid=String(chapterIndex[anyRef][0].id); matchStrategy="text-ref"; }
          else{
            for(const p of chapterPermutations(anyRef)){
              if(chapterIndex[p]){ matchedUid=String(chapterIndex[p][0].id); matchStrategy="text-ref-perm"; break; }
            }
          }
        }
      }
      // אסטרטגיה 3: chapter כלשהו בטקסט המנורמל כולו
      if(!matchedUid){
        const textNorm=normalize(text);
        for(const chap of sortedChapters){
          if(textNorm.includes(chap)){ matchedUid=String(chapterIndex[chap][0].id); matchStrategy="text-chapter"; break; }
        }
      }
      // אסטרטגיה 4: שם יחידה בטקסט (substring מלא)
      if(!matchedUid){
        const sortedByName=[...rawUnits].filter(u=>u.name||u.label).sort((a,b)=>{
          const la=(a.name||a.label||"").length, lb=(b.name||b.label||"").length; return lb-la;
        });
        for(const u of sortedByName){
          const nm=normName(u.name||u.label||"");
          if(nm&&nm.length>3&&normName(text).includes(nm)){ matchedUid=String(u.id); matchStrategy="name"; break; }
        }
      }
      // אסטרטגיה 5: Longest common prefix של השם (לפחות 6 תווים)
      if(!matchedUid){
        const textN=normName(text);
        let bestUid=null, bestLen=5;
        for(const u of rawUnits){
          const nm=normName(u.name||u.label||"");
          if(nm.length<6) continue;
          const len=commonPrefixLen(textN,nm);
          if(len>bestLen){ bestLen=len; bestUid=String(u.id); }
        }
        if(bestUid){ matchedUid=bestUid; matchStrategy="name-prefix"; }
      }
      if(matchedUid){
        f.matchedUnitId=matchedUid;
        f.matchStrategy=matchStrategy;
        matchedFindings.push({finding:f,unitId:matchedUid});
        if(!unitHits[matchedUid]) unitHits[matchedUid]=[];
        unitHits[matchedUid].push(f.sid);
        if(!unitByConcept[matchedUid]) unitByConcept[matchedUid]={};
        unitByConcept[matchedUid][f.concept]=(unitByConcept[matchedUid][f.concept]||0)+1;
      }else{
        unmatchedFindings.push(f);
      }
    });

    // יחידות יתומות (ב-raw אבל ללא אינדיקטור בממד)
    const orphanUnits=rawUnits.filter(u=>!unitHits[String(u.id)]);

    // כפילות טקסט
    const verseGroups={};
    findings.forEach(f=>{
      const basisKey=(f.basis||"").trim().slice(0,80);
      if(basisKey.length>20){ if(!verseGroups[basisKey]) verseGroups[basisKey]=[]; verseGroups[basisKey].push(f.sid); }
    });
    const duplicateCandidates=[];
    Object.entries(verseGroups).forEach(([basis,sids])=>{ if(sids.length>1) duplicateCandidates.push({basis,sids,count:sids.length}); });

    // יחידות חוזרות בכמה מושגים (לפי u.id מהמאגר)
    const unitRepeats=Object.entries(unitByConcept)
      .map(([uid,byC])=>{
        const u=unitIndex[uid];
        return {unitId:uid,unitName:u?(u.name||u.label||uid):uid,concepts:Object.keys(byC),totalIndicators:Object.values(byC).reduce((a,b)=>a+b,0)};
      })
      .filter(x=>x.concepts.length>1)
      .sort((a,b)=>b.concepts.length-a.concepts.length||b.totalIndicators-a.totalIndicators);
    const unitsInOneConcept=Object.keys(unitByConcept).filter(uid=>Object.keys(unitByConcept[uid]).length===1).length;

    return {
      findings,perConcept,missingConcepts,duplicateCandidates,
      matchedFindings,unmatchedFindings,unitHits,orphanUnits,
      totalRawUnits:rawUnits.length,
      unitsWithFindings:Object.keys(unitHits).length,
      matchedCount:matchedFindings.length,
      unmatchedCount:unmatchedFindings.length,
      unitRepeats,unitsInOneConcept,
      totalFindings:findings.length,
      totalMissingSids:findings.filter(f=>f.sid.startsWith("tmp_")).length
    };
  },[character,dimId,stageResults,rawUnits]);

  const canProceed=ingest.missingConcepts.length===0&&ingest.totalMissingSids===0&&ingest.unmatchedCount===0;

  // ─ מיגרציית מזהים חסרים בבת אחת לכל הממד ─
  function migrateAllMissingIds(){
    const current=stageResults||LS_get("stageResults",{});
    const updated={...current};
    let changedConcepts=0, totalRows=0;
    concepts.forEach(c=>{
      const key=`${character}__${dimId}__${c}`;
      const sd=current[key];
      if(!sd||!sd.stage3||!Array.isArray(sd.stage3.tableRows)) return;
      const migrated=ensureSourceIds(sd.stage3,c);
      if(migrated!==sd.stage3){
        updated[key]={...sd,stage3:migrated,lastUpdated:Date.now()};
        changedConcepts++;
        totalRows+=sd.stage3.tableRows.length;
      }
    });
    if(changedConcepts>0){
      if(setStageResults) setStageResults(updated);
      LS_set("stageResults",updated);
      fbSaveStageResults(updated);
      alert(`✓ נוצרו מזהים ל-${totalRows} אינדיקטורים ב-${changedConcepts} מושגים. נשמרו ב-Firebase.`);
    }else{
      alert("אין צורך — כל המושגים כבר כוללים מזהים.");
    }
  }

  // ═══════════════════════════════════════════════════════════════════════
  // ─ ד'1 — זיהוי תופעות פר-יחידה (עיבוד בטור, שמירות ביניים, המשכיות) ─
  // ═══════════════════════════════════════════════════════════════════════
  const characterDimKey=`${character}__${dimId}`;
  const PROMPT_VERSION_D1="v4-2026-10-18-with-example";

  // state של ד'1
  const [d1State,setD1State]=useState({}); // {unitId: {ai_proposal, user_approved}}
  const [d1Loading,setD1Loading]=useState(false);
  const [d1Progress,setD1Progress]=useState({current:0,total:0,unitName:"",status:""});
  const [d1Error,setD1Error]=useState(null);
  const [d1Loaded,setD1Loaded]=useState(false);

  // טעינה חד-פעמית של תוצאות ד'1 הקיימות מ-Firebase
  useEffect(()=>{
    fbLoadStage4Dim(characterDimKey,data=>{
      setD1State(data||{});
      setD1Loaded(true);
    });
  },[characterDimKey]);

  // AI call לד'1 פר יחידה — עם הפרומפט המלא שאישרת
  async function runD1ForUnit(unit,unitFindings,uniqueConceptsInUnit){
    const chapter=unit.chapter||"?";
    const unitName=unit.name||unit.label||`יחידה ${unit.id}`;
    const isSondergut=!unit.sourceRef;
    const indicatorsBlock=unitFindings.map((f,i)=>
      `[${i+1}] sid: ${f.sid}\n    label: ${f.label}\n    מושג: ${f.concept}\n    בסיס טקסטואלי: ${f.basis||"—"}\n    נושא: ${f.subject||"—"}\n    פרשנים: ${f.commentators||"—"}`
    ).join("\n\n");

    const prompt=`אתה עוזר מחקר לתזה בתנ"ך. לפניך ${unitFindings.length} אינדיקטורים מן היחידה הספרותית "${unitName}" (${chapter}) הנוגעת ל${character==="solomon"?"שלמה":"דוד"} בספר דברי הימים. אלה כל הממצאים שנאספו ביחידה זו מתוך ${uniqueConceptsInUnit.length} מושגים בממד "${dimLabel}".

**שלב ד'1: זיהוי ואפיון תופעות טקסטואליות ביחידה ספרותית אחת.**

מטרתך לזהות תופעות טקסטואליות מובחנות על בסיס הממצאים שסופקו, תוך שמירה על עקיבות מלאה למקורות. אין לקבוע בשלב זה את מידת הביסוס של הטענות, את מרכזיות התופעות או את התאמתן לחזון הנבואי.

### כללים מתודולוגיים

1. זהי את כל התופעות הטקסטואליות המובחנות העולות מן הממצאים. אחדי ממצאים המתארים אותה פעולה, אמירה, התרחשות או בחירה ספרותית. אל תאחדי תופעות שונות רק כדי לצמצם את מספרן ואל תפצלי תופעה אחת ללא הצדקה טקסטואלית. **אין מספר מחייב של תופעות**.
2. ממצא ייחודי שאינו משתלב בקבוצה יישמר כתופעה עצמאית בעלת שם תיאורי, אם אפשר לאפיינו מתוך הראיות. אם הנתונים אינם מספיקים, העבירי אותו לרשימת needsReview ונמקי.
3. לכל תופעה נסחי כותרת תיאורית קצרה ותיאור עובדתי מדויק. הכותרת לא תכלול את שם המושג הנבואי ולא תציג מסקנה תיאולוגית.
4. הבחיני בין מי שפועל או מדבר (actor) לבין האופן שבו המספר מציג אותו (presentation). אין לייחס למלך מעשה/אמירה/ידיעה/תכונה השייכים לדמות אחרת.
5. לכל תופעה ציינו את אמצעי העיצוב הטקסטואלי (designMeans) ואת הראיות המדויקות שסופקו (textualEvidence). **אין להמציא פסוקים, ציטוטים, אסמכתאות או פרטים שאינם בקלט.**
6. נסחי טענה אנליטית מצומצמת (analyticalClaim) המתארת מה ניתן ללמוד מן התופעה על אופן הצגת המלך או מלכותו. הפרידי בבירור בין התיאור העובדתי לטענה. אם אין בסיס לטענה — השאירי analyticalClaim ריק ואל תמציאי קשר. **הטענה חייבת להישען רק על הראיות עצמן ולא לחרוג מהן.** אסור לייחס למלך תכונה שלא באה לידי ביטוי ישיר בטקסט. **אסור להציג רכיבים משלימים של הסיפור כרכיבים מנוגדים** — למשל אסור לכתוב "לא תוצאה של תהליך פוליטי אלא התממשות של דבר אלוהי" כאשר פסוק אחד יכול לכלול גם ברית אנושית וגם מימוש דבר ה'. נסחי בשילוב, לא בניגוד.
7. אל תסיקי מסקנות השוואתיות ביחס לשמואל/מלכים גם אם צוינה מקבילה. אל תקבעי זיקה לחזון הנבואי. אלה שלבים 6-7.
8. **כל sourceId בקלט חייב להופיע לפחות פעם אחת ב-assignedSourceIds או ב-needsReview. אין להמציא sourceIds שלא בקלט.** מותר לשייך מקור ליותר מתופעה אחת כאשר הוא כולל ממצאים מובחנים — יש להסביר את ההבחנה ב-aspect.
9. לכל תופעה ציינו בקצרה (justification) מדוע הממצאים שויכו אליה. אם תופעה יחידנית — ציינו כך בלי לנסות איחוד מלאכותי.
10. אל תסיקי שפעולה היא חיובית/שלילית/מרכזית/חוזרת רק משום שהיא מתאימה למושג מסוים או מופיעה בכמה מושגים. שמרי גם ממצאים מסייגים, חריגים ומורכבים.
11. השתמשי ב-needsReview רק כאשר קיימת בעיה ממשית בזיהוי/שיוך/ביסוס. אין להעביר לשם ממצא רק משום שהוא מתייחס למספר או לדמות אחרת.
12. אל תתקני בשקט סתירות בין הממצאים. סמני אותן לבדיקה.
13. **actor — מי שפועל או מדבר בפועל בטקסט**, אם ניתן לזהותו. אם האירוע הוא מסגור של המספר (למשל: "כדבר ה' ביד שמואל"), השאירי actor = "לא רלוונטי" והבהירי בתיאור התופעה שהיא נוגעת למלך. **עדיף שדה שאינו חל במקרה מסוים מאשר שיוך פעולה לדמות הלא נכונה.** **כאשר תופעה אחת כוללת פעולות של כמה דמויות — למשל המלך יוזם ואנשי העם, הכוהנים או הלוויים מבצעים — יש לציין את חלוקת הפעולות בתוך השדה עצמו** (למשל: "המלך יוזם; גורם ב' מבצע; גורם ג' משתתף"). **אין לייחס למלך פעולה שביצעה דמות אחרת רק מפני שהמלך יזם או אישר אותה.**

14. **הבחנה בין שינוי טקסטואלי לבין משמעותו המחקרית** — כאשר תופעה מבוססת על שינוי במילה, בביטוי או במבנה משפט, יש להבחין בין שלוש רמות:
   (א) **השינוי הטקסטואלי:** תיאור מדויק של מה שנוסף, הושמט או הוחלף ביחס למקבילה, **על סמך הנתונים שסופקו בלבד**.
   (ב) **המשמעות הלשונית הישירה:** מה ניתן ללמוד מן ההבדל עצמו, בלי לייחס לו משמעות שאינה מתחייבת ממנו.
   (ג) **המשמעות האפשרית לעיצוב דמות המלך:** טענה פרשנית מצומצמת, רק אם קיימת לה הצדקה בטקסט ובהקשרו. יש להבהיר כאשר מדובר בהצעה פרשנית ולא בקביעה מפורשת (למשל: "ייתכן ש...", "הניסוח עשוי להבליט...").

   **אין להסיק** משינוי לשוני יחיד על מניעים, תכונות, כוונות או מגמות אידאולוגיות ללא בסיס נוסף.

   **אין להציג** את המקבילה כחסרת משמעות מסוימת רק משום שנוסחה שונה, ואין ליצור ניגוד בין רכיבים משלימים של הסיפור.

   **אין חובה** להעניק לכל שינוי לשוני משמעות מחקרית חיובית או משמעותית. אם ההבדל ברור אך תרומתו לעיצוב הדמות אינה מבוססת — יש להשאיר את analyticalClaim ריק או לנסח בו הסתייגות מפורשת ("ההבדל הלשוני ברור, אך משמעותו דורשת בדיקה נוספת").

   **כאשר נוסח המקבילה אינו כלול בנתוני הקלט, אין לקבוע שהתרחשה תוספת, השמטה או החלפה על סמך השערה בלבד. יש לסמן את הטענה ההשוואתית כטעונה אימות** (למשל ב-needsReview, או בניסוח "נוסח המקבילה לא נבדק בשלב זה"). שלב ד'1 פועל רק מתוך הממצאים שסופקו — אין להשלים נוסחי מקבילות מידע חיצוני.

### דוגמה מנחה לזיהוי תופעה טקסטואלית

**הדוגמה הבאה היפותטית לחלוטין ואינה מתארת אירוע מקראי. היא נועדה להמחיש את שיטת העיבוד בלבד. אין להשתמש בתוכנה כראיה, להעתיק ממנה ממצאים או לחפש תופעות דומות ביחידות המחקר.**

נניח שביחידה המתארת מלך דמיוני התקבלו ארבעה ממצאים ממושגים שונים:

1. המלך מזהה סכנה המאיימת על עירו.
2. המלך מקצה משאבים להקמת ביצורים.
3. המספר מתאר את פעולות הבנייה שביצעו אנשי העיר.
4. לאחר השלמת הבנייה המלך משבח את הבונים על עבודתם.

**זיהוי אפשרי של התופעה:**

- **title:** "היערכות המלך להגנת העיר באמצעות הקמת ביצורים"
- **description:** המלך מזהה סכנה לעיר, מקצה משאבים לביצורה, ואנשי העיר מבצעים את הבנייה. לאחר השלמת העבודה המלך משבח את הבונים.
- **actor:** המלך יוזם את ההיערכות ומקצה משאבים; אנשי העיר מבצעים את הבנייה
- **presentation:** תיאור פעולות המלך והבונים באמצעות המספר, לצד דברי המלך
- **designMeans:** רצף סיפורי של זיהוי סכנה, היערכות, ביצוע והכרה בעבודת המבצעים
- **analyticalClaim:** המלך מוצג כמי שפועל להיערכות העיר לנוכח סכנה באמצעות הקצאת משאבים והפעלת אנשי העיר.
- **justification:** הממצאים מתייחסים לשלבים הקשורים לאותו מהלך של היערכות להגנת העיר. ניתן לאחדם לתופעה אחת תוך שימור ההבחנה בין פעולות המלך לפעולות אנשי העיר.

**אין להסיק מריבוי המושגים שהמלך בהכרח חכם, גיבור, צדיק או רועה נאמן. הזיקה של כל מושג לתופעה תיבחן בשלב ד'2.**

**דוגמה נגדית:** אם כמה ממצאים ממושגים שונים נשענים על אותה אמירה של המלך, אין ליצור מהם תופעה המתארת את המלך כבעל כמה תכונות רק בשל שיוכם המושגי. יש לתאר את האמירה ואת הקשרה ולהסיק רק את מה שהראיות מאפשרות.

**עיקרון מחייב:** הדוגמה ממחישה אפשרות אחת של איחוד. אין חובה לאחד כל רצף פעולות לתופעה אחת, ואין לקבוע מראש את מספר התופעות. ההכרעה תתקבל על בסיס הממצאים של היחידה הנבדקת בלבד.

  // בקרת שלמות דטרמיניסטית (קוד, לא AI)
  function validateD1Result(inputFindings,parsed){
    const inputSids=new Set(inputFindings.map(f=>f.sid));
    const phenomena=Array.isArray(parsed.phenomena)?parsed.phenomena:[];
    const needsReview=Array.isArray(parsed.needsReview)?parsed.needsReview:[];
    const assignedUnion=new Set();
    const foreignIds=new Set();
    const evidenceMismatch=[]; // {phenIdx, sid}

    phenomena.forEach((p,pi)=>{
      const assigned=new Set(Array.isArray(p.assignedSourceIds)?p.assignedSourceIds:[]);
      assigned.forEach(s=>{
        if(!inputSids.has(s)) foreignIds.add(s);
        assignedUnion.add(s);
      });
      (Array.isArray(p.textualEvidence)?p.textualEvidence:[]).forEach(te=>{
        if(te.sourceId){
          if(!inputSids.has(te.sourceId)) foreignIds.add(te.sourceId);
          if(!assigned.has(te.sourceId)) evidenceMismatch.push({phenIdx:pi,sid:te.sourceId,phenTitle:p.title||`תופעה ${pi+1}`});
          assignedUnion.add(te.sourceId);
        }
      });
    });
    needsReview.forEach(r=>{
      if(r.sourceId){
        if(!inputSids.has(r.sourceId)) foreignIds.add(r.sourceId);
        assignedUnion.add(r.sourceId);
      }
    });

    const missing=[...inputSids].filter(s=>!assignedUnion.has(s));
    const valid=missing.length===0&&foreignIds.size===0&&evidenceMismatch.length===0;
    return {valid,missing,foreign:[...foreignIds],evidenceMismatch,phenomenaCount:phenomena.length,needsReviewCount:needsReview.length};
  }

  // רשימת היחידות המוכנות לעיבוד (עם הממצאים שלהן) — ממוינות לפי chapter
  const unitsToProcess=useMemo(()=>{
    const result=[];
    Object.entries(ingest.unitHits||{}).forEach(([uid,sids])=>{
      const u=rawUnits.find(x=>String(x.id)===uid); if(!u) return;
      const findings=ingest.findings.filter(f=>f.matchedUnitId===uid);
      const uniqueConcepts=[...new Set(findings.map(f=>f.concept))];
      result.push({unit:u,findings,uniqueConcepts});
    });
    result.sort((a,b)=>{const [a1,a2]=parseCh(a.unit),[b1,b2]=parseCh(b.unit); return a1-b1||a2-b2;});
    return result;
  },[ingest,rawUnits]);

  // סטטוס של יחידה מסוימת
  function unitStatus(uid){
    const st=d1State[uid];
    if(st&&st.user_approved) return {status:"approved",label:"✓ מאושר (חוקרת)"};
    if(st&&st.ai_proposal){
      if(st.ai_proposal.validatedByCode) return {status:"ai-valid",label:"🤖 הצעת AI תקינה — ממתינה לאישור"};
      return {status:"ai-invalid",label:"⚠ הצעת AI לא תקינה — הרץ שוב"};
    }
    return {status:"pending",label:"⏳ טרם רץ"};
  }

  // הפעלת ד'1 — על יחידה אחת או על כל שלא רצו
  async function runD1(mode){ // mode: "all" | "unit:{uid}"
    if(!apiKey){ setD1Error("חסר מפתח API"); return; }
    setD1Error(null); setD1Loading(true);
    const todo=mode==="all"
      ? unitsToProcess.filter(u=>{ const s=unitStatus(String(u.unit.id)); return s.status!=="approved"&&s.status!=="ai-valid"; })
      : unitsToProcess.filter(u=>mode===`unit:${u.unit.id}`);
    setD1Progress({current:0,total:todo.length,unitName:"",status:""});
    const localState={...d1State};
    for(let i=0;i<todo.length;i++){
      const {unit,findings,uniqueConcepts}=todo[i];
      const uid=String(unit.id);
      setD1Progress({current:i+1,total:todo.length,unitName:unit.name||unit.label||uid,status:`עובד על ${findings.length} אינדיקטורים...`});
      try{
        const {parsed,prompt}=await runD1ForUnit(unit,findings,uniqueConcepts);
        const validation=validateD1Result(findings,parsed);
        const proposal={
          phenomena:parsed.phenomena||[],
          needsReview:parsed.needsReview||[],
          methodNote:parsed.methodNote||"",
          inputSids:findings.map(f=>f.sid),
          promptVersion:PROMPT_VERSION_D1,
          runAt:new Date().toISOString(),
          model:"claude-sonnet-4-5-20250929",
          validatedByCode:validation.valid,
          validationReport:validation
        };
        // גיבוי אוטומטי של ai_proposal הקיים לפני דריסה — שומר את גרסאות ה-AI הקודמות
        const existingAi=localState[uid]&&localState[uid].ai_proposal;
        if(existingAi&&existingAi.promptVersion&&existingAi.promptVersion!==PROMPT_VERSION_D1){
          await fbSaveStage4Unit(characterDimKey,uid,"previous_ai_proposal",existingAi);
          localState[uid]={...(localState[uid]||{}),previous_ai_proposal:existingAi};
        }
        await fbSaveStage4Unit(characterDimKey,uid,"ai_proposal",proposal);
        localState[uid]={...(localState[uid]||{}),ai_proposal:proposal};
        setD1State({...localState});
      }catch(e){
        console.error(`ד'1 כשל ביחידה ${uid}:`,e);
        const errProposal={
          error:String(e.message||e),
          inputSids:findings.map(f=>f.sid),
          promptVersion:PROMPT_VERSION_D1,
          runAt:new Date().toISOString(),
          validatedByCode:false,
          validationReport:{valid:false,missing:[],foreign:[],evidenceMismatch:[]}
        };
        await fbSaveStage4Unit(characterDimKey,uid,"ai_proposal",errProposal);
        localState[uid]={...(localState[uid]||{}),ai_proposal:errProposal};
        setD1State({...localState});
      }
    }
    setD1Loading(false);
    setD1Progress({current:0,total:0,unitName:"",status:""});
  }

  const d1Stats=useMemo(()=>{
    let approved=0, valid=0, invalid=0, pending=0;
    unitsToProcess.forEach(u=>{
      const s=unitStatus(String(u.unit.id));
      if(s.status==="approved") approved++;
      else if(s.status==="ai-valid") valid++;
      else if(s.status==="ai-invalid") invalid++;
      else pending++;
    });
    return {approved,valid,invalid,pending,total:unitsToProcess.length};
  },[unitsToProcess,d1State]);

  // ─ ניווט לפאנל סקירה פר-יחידה ─
  const [reviewingUid,setReviewingUid]=useState(null);
  const reviewingData=useMemo(()=>{
    if(!reviewingUid) return null;
    const entry=unitsToProcess.find(x=>String(x.unit.id)===reviewingUid);
    if(!entry) return null;
    const st=d1State[reviewingUid]||{};
    return {...entry,aiProposal:st.ai_proposal||null,userApproved:st.user_approved||null,previousApproved:st.previous_approved||null};
  },[reviewingUid,unitsToProcess,d1State]);

  async function saveUserApproved(uid,approvedData){
    const prev=(d1State[uid]&&d1State[uid].user_approved)||null;
    const newState={...(d1State[uid]||{}),user_approved:approvedData};
    if(prev) newState.previous_approved=prev;
    await fbSaveStage4Unit(characterDimKey,uid,"user_approved",approvedData);
    if(prev) await fbSaveStage4Unit(characterDimKey,uid,"previous_approved",prev);
    setD1State({...d1State,[uid]:newState});
  }
  async function reopenApproved(uid){
    const cur=(d1State[uid]&&d1State[uid].user_approved)||null;
    if(!cur) return;
    // מעבירים את הגרסה הנוכחית ל-previous_approved ומוחקים את user_approved
    await fbSaveStage4Unit(characterDimKey,uid,"previous_approved",cur);
    await db.ref(_stage4UnitPath(characterDimKey,uid,"user_approved")).remove();
    const newEntry={...(d1State[uid]||{}),previous_approved:cur,user_approved:null};
    setD1State({...d1State,[uid]:newEntry});
  }

  // אם במצב סקירה — החזר את הפאנל במקום הרשימה
  if(reviewingData){
    return (<UnitReviewPanel
      unit={reviewingData.unit}
      findings={reviewingData.findings}
      aiProposal={reviewingData.aiProposal}
      userApproved={reviewingData.userApproved}
      previousApproved={reviewingData.previousApproved}
      characterDimKey={characterDimKey}
      dimColor={dimColor} dimLabel={dimLabel} character={character}
      onBack={()=>setReviewingUid(null)}
      onSaveApproved={async(data)=>{ await saveUserApproved(reviewingUid,data); }}
      onReopen={async()=>{ await reopenApproved(reviewingUid); }}
    />);
  }

  return(
    <div style={{maxWidth:"1100px",margin:"0 auto",padding:"20px 16px"}}>
      {/* כותרת */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"20px",flexWrap:"wrap",gap:"12px"}}>
        <div>
          <div style={{fontSize:"20px",fontWeight:"bold",color:"#f1f5f9",marginBottom:"3px"}}>
            📊 שלב ד': איחוד ממצאים — <span style={{color:dimColor}}>{dimLabel}</span> · ב{charName}
          </div>
          <div style={{fontSize:"12px",color:"#64748b"}}>קליטת כל האינדיקטורים מ-{concepts.length} המושגים של הממד, לקראת זיהוי תופעות טקסטואליות</div>
        </div>
        <button onClick={onBack} style={{padding:"7px 14px",borderRadius:"7px",border:"1px solid #475569",cursor:"pointer",background:"transparent",color:"#94a3b8",fontSize:"12px",fontWeight:"600"}}>↩ חזרה</button>
      </div>

      {/* דוח קליטה */}
      <div style={{padding:"16px 20px",background:"#1e293b",borderRadius:"10px",border:`1px solid ${canProceed?"#34d39944":"#f59e0b44"}`,marginBottom:"18px"}}>
        <div style={{fontSize:"14px",fontWeight:"700",color:"#f1f5f9",marginBottom:"12px"}}>📥 דוח קליטה (דטרמיניסטי — בלי AI)</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(180px, 1fr))",gap:"12px",marginBottom:"12px"}}>
          <StatBox label="מושגים בממד" value={concepts.length} color={dimColor}/>
          <StatBox label="מושגים מוכנים" value={`${concepts.length-ingest.missingConcepts.length}/${concepts.length}`} color={ingest.missingConcepts.length===0?"#34d399":"#f59e0b"}/>
          <StatBox label="סה״כ אינדיקטורים" value={ingest.totalFindings} color="#60a5fa"/>
          <StatBox label="יחידות במאגר (raw)" value={ingest.totalRawUnits} color="#a78bfa"/>
          <StatBox label="יחידות שאותרו" value={`${ingest.unitsWithFindings}/${ingest.totalRawUnits}`} color={ingest.unitsWithFindings===ingest.totalRawUnits?"#34d399":ingest.unitsWithFindings>0?"#fbbf24":"#64748b"}/>
          <StatBox label="אינדיקטורים מותאמים" value={`${ingest.matchedCount}/${ingest.totalFindings}`} color={ingest.unmatchedCount===0?"#34d399":"#ef4444"}/>
          <StatBox label="אינדיקטורים לא מותאמים" value={ingest.unmatchedCount} color={ingest.unmatchedCount===0?"#34d399":"#ef4444"}/>
          <StatBox label="יחידות יתומות (ללא ממצא)" value={ingest.orphanUnits.length} color={ingest.orphanUnits.length===0?"#34d399":"#94a3b8"}/>
          <StatBox label="מועמדי כפילות" value={ingest.duplicateCandidates.length} color={ingest.duplicateCandidates.length>0?"#fbbf24":"#64748b"}/>
          <StatBox label="מזהים חסרים" value={ingest.totalMissingSids} color={ingest.totalMissingSids===0?"#34d399":"#ef4444"}/>
        </div>
        {ingest.missingConcepts.length>0&&(
          <div style={{marginTop:"10px",padding:"10px 12px",background:"#78350f22",border:"1px solid #f59e0b",borderRadius:"6px",fontSize:"11px",color:"#fcd34d"}}>
            ⚠ מושגים שחסר להם שלב 3 מוכן: {ingest.missingConcepts.join(", ")}. יש להשלים ולאשר קודם.
          </div>
        )}
        {ingest.totalMissingSids>0&&(
          <div style={{marginTop:"10px",padding:"10px 12px",background:"#7f1d1d22",border:"1px solid #ef4444",borderRadius:"6px",fontSize:"11px",color:"#fca5a5",display:"flex",alignItems:"center",justifyContent:"space-between",gap:"10px",flexWrap:"wrap"}}>
            <span>⚠ {ingest.totalMissingSids} אינדיקטורים ללא מזהה קבוע. אפשר לפתוח כל מושג ידנית, או ללחוץ כאן →</span>
            <button onClick={migrateAllMissingIds} style={{padding:"6px 12px",borderRadius:"6px",border:"none",cursor:"pointer",background:"#f59e0b",color:"white",fontSize:"11px",fontWeight:"700"}}>🔧 יצור מזהים חסרים</button>
          </div>
        )}
      </div>

      {/* פירוט פר-מושג */}
      <div style={{padding:"16px 20px",background:"#1e293b",borderRadius:"10px",border:"1px solid #334155",marginBottom:"18px"}}>
        <div style={{fontSize:"13px",fontWeight:"700",color:"#f1f5f9",marginBottom:"10px"}}>פירוט לפי מושג</div>
        <table style={{fontSize:"12px",width:"100%"}}>
          <thead><tr style={{background:"#0f172a"}}>
            <th style={{textAlign:"right",color:"#94a3b8",padding:"6px 10px"}}>מושג</th>
            <th style={{textAlign:"right",color:"#94a3b8",padding:"6px 10px"}}>אינדיקטורים</th>
            <th style={{textAlign:"right",color:"#94a3b8",padding:"6px 10px"}}>עם מזהה</th>
            <th style={{textAlign:"right",color:"#94a3b8",padding:"6px 10px"}}>סטטוס</th>
          </tr></thead>
          <tbody>
            {concepts.map(c=>{
              const pc=ingest.perConcept[c]||{};
              const okIds=pc.hasSourceIds===pc.total&&pc.total>0;
              return(<tr key={c} style={{borderBottom:"1px solid #334155"}}>
                <td style={{color:"#cbd5e1",padding:"6px 10px",fontWeight:"600"}}>{c}</td>
                <td style={{color:"#cbd5e1",padding:"6px 10px"}}>{pc.total||0}</td>
                <td style={{color:okIds?"#34d399":(pc.missingSourceIds>0?"#f59e0b":"#64748b"),padding:"6px 10px"}}>{pc.hasSourceIds||0}/{pc.total||0}</td>
                <td style={{color:pc.approved?"#34d399":"#f59e0b",padding:"6px 10px",fontSize:"11px"}}>{pc.approved?"✓ מאושר":pc.total>0?"⚠ לא מאושר":"✗ אין נתונים"}</td>
              </tr>);
            })}
          </tbody>
        </table>
      </div>

      {/* אינדיקטורים שלא זוהו ל-u.id — בעיה דטרמיניסטית */}
      {ingest.unmatchedCount>0&&(
        <div style={{padding:"14px 18px",background:"#7f1d1d22",borderRadius:"10px",border:"1px solid #ef4444",marginBottom:"18px"}}>
          <div style={{fontSize:"13px",fontWeight:"700",color:"#fca5a5",marginBottom:"8px"}}>
            ⚠ {ingest.unmatchedCount} אינדיקטורים לא זוהו ל-u.id במאגר
          </div>
          <div style={{fontSize:"11px",color:"#fecaca",marginBottom:"10px",lineHeight:"1.6"}}>
            אלה אינדיקטורים ששם היחידה שה-AI החזיר אינו מכיל את מזהה היחידה (u.id) או את שם היחידה כפי שמופיע ב-raw.units. יש לפתור לפני המעבר לד'1 — אחרת לא נדע ליחידה הספרותית האמיתית אנחנו מתייחסים.
          </div>
          <div style={{maxHeight:"200px",overflowY:"auto",fontSize:"10px",fontFamily:"monospace",color:"#fef3c7"}}>
            {ingest.unmatchedFindings.slice(0,20).map((f,i)=>(
              <div key={i} style={{padding:"4px 0",borderBottom:"1px solid #7f1d1d66"}}>
                <span style={{color:"#fca5a5"}}>[{f.label}]</span> <span style={{color:"#fecaca"}}>יחידה (AI):</span> "{f.unit}" <span style={{color:"#64748b"}}>· מושג: {f.concept}</span>
              </div>
            ))}
            {ingest.unmatchedFindings.length>20&&<div style={{color:"#fca5a5",marginTop:"6px"}}>...ועוד {ingest.unmatchedFindings.length-20}</div>}
          </div>
        </div>
      )}

      {/* יחידות יתומות — ב-raw אך ללא אינדיקטור בממד */}
      {ingest.orphanUnits.length>0&&(
        <div style={{padding:"14px 18px",background:"#1e293b",borderRadius:"10px",border:"1px solid #475569",marginBottom:"18px"}}>
          <div style={{fontSize:"13px",fontWeight:"700",color:"#cbd5e1",marginBottom:"8px"}}>
            ℹ {ingest.orphanUnits.length} יחידות ב-raw שלא מופיע להן אינדיקטור בממד זה
          </div>
          <div style={{fontSize:"11px",color:"#94a3b8",marginBottom:"10px",lineHeight:"1.6"}}>
            אלה יחידות שאת הוספת לכלי האנליטי, אבל אין להן אף אינדיקטור חיובי לממד "{dimLabel}" באף מושג. זה **לא בהכרח בעיה** — פשוט אומר שהממד הזה לא נמצא בהן. (ייתכן שהן יהיו רלוונטיות לממדים אחרים.)
          </div>
          <div style={{maxHeight:"150px",overflowY:"auto",fontSize:"10px"}}>
            {ingest.orphanUnits.slice(0,20).map((u,i)=>(
              <span key={i} style={{display:"inline-block",padding:"3px 7px",margin:"2px",background:"#0f172a",color:"#94a3b8",borderRadius:"4px"}}>
                {u.name||u.label||u.id} ({u.id})
              </span>
            ))}
            {ingest.orphanUnits.length>20&&<span style={{color:"#64748b",marginRight:"6px"}}>...ועוד {ingest.orphanUnits.length-20}</span>}
          </div>
        </div>
      )}

      {/* יחידות שחוזרות בכמה מושגים (הכפילות המחקרית האמיתית) */}
      {ingest.unitRepeats.length>0&&(
        <div style={{padding:"16px 20px",background:"#1e293b",borderRadius:"10px",border:`1px solid ${dimColor}44`,marginBottom:"18px"}}>
          <div style={{fontSize:"13px",fontWeight:"700",color:"#f1f5f9",marginBottom:"4px"}}>
            🔗 יחידות חוזרות בכמה מושגים ({ingest.unitRepeats.length} יחידות מתוך {ingest.uniqueUnits})
          </div>
          <div style={{fontSize:"11px",color:"#94a3b8",marginBottom:"12px",lineHeight:"1.6"}}>
            זהו הגרעין המחקרי של ד'1 — כל יחידה כזו תעובד כקבוצת-מנה אחת, שבה ה-AI מקבל את כל האינדיקטורים שלה מכל המושגים כדי לזהות תופעות משותפות. {ingest.unitsInOneConcept} יחידות נוספות מופיעות רק במושג אחד.
          </div>
          <div style={{maxHeight:"400px",overflowY:"auto"}}>
            <table style={{fontSize:"11px",width:"100%"}}>
              <thead><tr style={{background:"#0f172a",position:"sticky",top:0}}>
                <th style={{textAlign:"right",color:dimColor,padding:"6px 10px"}}>יחידה</th>
                <th style={{textAlign:"right",color:dimColor,padding:"6px 10px",width:"80px"}}>במושגים</th>
                <th style={{textAlign:"right",color:dimColor,padding:"6px 10px",width:"80px"}}>אינדיקטורים</th>
                <th style={{textAlign:"right",color:dimColor,padding:"6px 10px"}}>מושגים</th>
              </tr></thead>
              <tbody>
                {ingest.unitRepeats.map((ur,i)=>(
                  <tr key={i} style={{borderBottom:"1px solid #334155"}}>
                    <td style={{color:"#cbd5e1",padding:"5px 10px",fontWeight:"600"}} title={`u.id: ${ur.unitId}`}>{ur.unitName} <span style={{fontSize:"9px",color:"#64748b"}}>({ur.unitId})</span></td>
                    <td style={{color:ur.concepts.length>=5?"#34d399":"#cbd5e1",padding:"5px 10px",fontWeight:"700"}}>{ur.concepts.length}</td>
                    <td style={{color:"#94a3b8",padding:"5px 10px"}}>{ur.totalIndicators}</td>
                    <td style={{color:"#94a3b8",padding:"5px 10px",fontSize:"10px"}}>{ur.concepts.join(", ")}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{marginTop:"10px",fontSize:"10px",color:"#64748b"}}>
            💡 יחידה המופיעה ב-5+ מושגים — מודגשת בירוק. אלו הן היחידות ה"עשירות" ביותר, הסביר שה-AI יזהה בהן תופעה משותפת חזקה.
          </div>
        </div>
      )}

      {/* מועמדי כפילות טקסט (אם יש) */}
      {ingest.duplicateCandidates.length>0&&(
        <div style={{padding:"14px 18px",background:"#78350f22",borderRadius:"10px",border:"1px solid #fbbf2466",marginBottom:"18px"}}>
          <div style={{fontSize:"13px",fontWeight:"700",color:"#fcd34d",marginBottom:"8px"}}>⚠ מועמדי כפילות טכנית ({ingest.duplicateCandidates.length}) — אותו טקסט מופיע ביותר ממזהה אחד</div>
          <div style={{fontSize:"11px",color:"#fde68a",lineHeight:"1.6",marginBottom:"8px"}}>
            אלה **מועמדים** בלבד. ה-AI (בשלב הבא) יבדוק אם זו באמת אותה תופעה או ממצאים שונים באותו טקסט.
          </div>
          <div style={{maxHeight:"200px",overflowY:"auto",fontSize:"10px",fontFamily:"monospace",color:"#fef3c7"}}>
            {ingest.duplicateCandidates.slice(0,10).map((dc,i)=>(
              <div key={i} style={{padding:"4px 0",borderBottom:"1px solid #78350f66"}}>
                <div style={{color:"#fcd34d",fontWeight:"700"}}>({dc.count} מופעים): {dc.basis}...</div>
                <div style={{color:"#fde68a"}}>sids: {dc.sids.join(", ")}</div>
              </div>
            ))}
            {ingest.duplicateCandidates.length>10&&<div style={{color:"#fcd34d",marginTop:"4px"}}>...ועוד {ingest.duplicateCandidates.length-10}</div>}
          </div>
        </div>
      )}

      {/* כפתור המשך */}
      <div style={{marginTop:"24px",textAlign:"center"}}>
        {!canProceed&&(
          <div style={{fontSize:"12px",color:"#f59e0b"}}>
            ⚠ לא ניתן להמשיך — יש לפתור:
            {ingest.missingConcepts.length>0&&<div style={{marginTop:"4px"}}>• {ingest.missingConcepts.length} מושגים חסרים/לא מאושרים</div>}
            {ingest.totalMissingSids>0&&<div style={{marginTop:"4px"}}>• {ingest.totalMissingSids} אינדיקטורים ללא מזהה קבוע</div>}
            {ingest.unmatchedCount>0&&<div style={{marginTop:"4px"}}>• {ingest.unmatchedCount} אינדיקטורים לא זוהו ליחידה מהמאגר</div>}
          </div>
        )}
        {canProceed&&d1Loaded&&(
          <div style={{marginTop:"24px",padding:"18px 20px",background:"#1e293b",borderRadius:"10px",border:`2px solid ${dimColor}66`}}>
            <div style={{fontSize:"15px",fontWeight:"700",color:"#f1f5f9",marginBottom:"4px"}}>🤖 ד'1 — זיהוי תופעות באמצעות AI</div>
            <div style={{fontSize:"11px",color:"#94a3b8",marginBottom:"14px",lineHeight:"1.6"}}>עיבוד {unitsToProcess.length} יחידות בטור. לכל יחידה: AI מקבל את כל האינדיקטורים ממנה ומזהה תופעות. בקרת שלמות דטרמיניסטית אוטומטית.</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(140px, 1fr))",gap:"10px",marginBottom:"14px"}}>
              <StatBox label="יחידות סה״כ" value={d1Stats.total} color={dimColor}/>
              <StatBox label="מאושרות" value={d1Stats.approved} color="#34d399"/>
              <StatBox label="הצעת AI תקינה" value={d1Stats.valid} color="#60a5fa"/>
              <StatBox label="נכשלו/לא תקינות" value={d1Stats.invalid} color={d1Stats.invalid>0?"#ef4444":"#64748b"}/>
              <StatBox label="ממתינות" value={d1Stats.pending} color={d1Stats.pending>0?"#fbbf24":"#64748b"}/>
            </div>
            {d1Loading?(
              <div style={{padding:"14px",background:"#0f172a",borderRadius:"8px",border:`1px solid ${dimColor}`}}>
                <div style={{fontSize:"13px",color:dimColor,fontWeight:"700"}}>⏳ עובד על יחידה {d1Progress.current}/{d1Progress.total}: {d1Progress.unitName}</div>
                <div style={{fontSize:"11px",color:"#94a3b8",marginTop:"4px"}}>{d1Progress.status}</div>
              </div>
            ):(
              <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
                <button onClick={()=>runD1("all")} disabled={d1Stats.pending===0&&d1Stats.invalid===0}
                  style={{padding:"10px 22px",borderRadius:"8px",border:"none",cursor:(d1Stats.pending>0||d1Stats.invalid>0)?"pointer":"not-allowed",background:(d1Stats.pending>0||d1Stats.invalid>0)?dimColor:"#334155",color:(d1Stats.pending>0||d1Stats.invalid>0)?"white":"#64748b",fontSize:"13px",fontWeight:"700"}}>
                  {d1Stats.pending+d1Stats.invalid>0?`▶ הפעל AI על ${d1Stats.pending+d1Stats.invalid} יחידות שלא רצו/נכשלו`:"✓ הכל רץ בהצלחה"}
                </button>
              </div>
            )}
            {d1Error&&<div style={{marginTop:"10px",padding:"8px 12px",background:"#7f1d1d44",color:"#fca5a5",borderRadius:"6px",fontSize:"11px"}}>⚠ {d1Error}</div>}

            {/* רשימת יחידות */}
            {d1Stats.total>0&&(
              <div style={{marginTop:"18px"}}>
                <div style={{fontSize:"12px",fontWeight:"700",color:"#cbd5e1",marginBottom:"8px"}}>רשימת יחידות ({d1Stats.total})</div>
                <div style={{maxHeight:"400px",overflowY:"auto",border:"1px solid #334155",borderRadius:"7px"}}>
                  <table style={{fontSize:"11px",width:"100%"}}>
                    <thead><tr style={{background:"#0f172a",position:"sticky",top:0}}>
                      <th style={{textAlign:"right",color:"#94a3b8",padding:"6px 10px"}}>יחידה</th>
                      <th style={{textAlign:"right",color:"#94a3b8",padding:"6px 10px",width:"60px"}}>אינדיק'</th>
                      <th style={{textAlign:"right",color:"#94a3b8",padding:"6px 10px",width:"50px"}}>מושגים</th>
                      <th style={{textAlign:"right",color:"#94a3b8",padding:"6px 10px",width:"180px"}}>סטטוס</th>
                      <th style={{textAlign:"right",color:"#94a3b8",padding:"6px 10px",width:"100px"}}>פרטים</th>
                    </tr></thead>
                    <tbody>
                      {unitsToProcess.map(({unit,findings,uniqueConcepts})=>{
                        const uid=String(unit.id);
                        const st=unitStatus(uid);
                        const ai=d1State[uid]&&d1State[uid].ai_proposal;
                        const color=st.status==="approved"?"#34d399":st.status==="ai-valid"?"#60a5fa":st.status==="ai-invalid"?"#ef4444":"#94a3b8";
                        return(<tr key={uid} style={{borderBottom:"1px solid #334155"}}>
                          <td style={{color:"#cbd5e1",padding:"5px 10px",fontWeight:"600"}} title={unit.chapter}>{unit.name||unit.label||uid}</td>
                          <td style={{color:"#94a3b8",padding:"5px 10px"}}>{findings.length}</td>
                          <td style={{color:"#94a3b8",padding:"5px 10px"}}>{uniqueConcepts.length}</td>
                          <td style={{color,padding:"5px 10px",fontSize:"10px"}}>{st.label}
                            {ai&&ai.phenomena&&<span style={{color:"#64748b"}}> · {ai.phenomena.length} תופעות{ai.needsReview&&ai.needsReview.length>0?`, ${ai.needsReview.length} לבדיקה`:""}</span>}
                            {ai&&ai.error&&<span style={{color:"#ef4444"}}> · שגיאה</span>}
                            {ai&&!ai.validatedByCode&&!ai.error&&ai.validationReport&&(
                              <div style={{color:"#f59e0b",fontSize:"9px",marginTop:"2px"}}>
                                {ai.validationReport.missing&&ai.validationReport.missing.length>0&&<div>חסרים: {ai.validationReport.missing.length}</div>}
                                {ai.validationReport.foreign&&ai.validationReport.foreign.length>0&&<div>זרים: {ai.validationReport.foreign.length}</div>}
                                {ai.validationReport.evidenceMismatch&&ai.validationReport.evidenceMismatch.length>0&&<div>אי-התאמה: {ai.validationReport.evidenceMismatch.length}</div>}
                              </div>
                            )}
                          </td>
                          <td style={{padding:"5px 10px"}}>
                            <div style={{display:"flex",gap:"4px",flexWrap:"wrap"}}>
                              {(st.status==="ai-valid"||st.status==="approved")&&<button onClick={()=>setReviewingUid(uid)} style={{padding:"3px 8px",borderRadius:"4px",border:`1px solid ${dimColor}66`,cursor:"pointer",background:"transparent",color:dimColor,fontSize:"9px",fontWeight:"700"}}>👁 סקור</button>}

הופעת מילה מן השדה הסמנטי אינה מוכיחה לבדה את המושג, והיעדרה אינו מוכיח את היעדרו. יש לבדוק את משמעות הביטוי, את ההקשר ואת הדמות או הגורם שאליהם הוא מיוחס.

### התאמת הראיות להגדרה
ציין אילו ראיות עשויות לבסס את המושג ואילו אינן מספיקות כשלעצמן, לפי ההגדרה המסוימת בלבד. אין להחיל על כלל המושגים דרישות השייכות למושג אחר, כגון הכוונה אלוהית, שיקול דעת, הצלחה או פעולה מתמשכת.

הבחן בין מה שהטקסט מציג לבין מה שמוסק ממנו. אל תשלים מניעים, כוונות, תהליכים או תוצאות שאינם מבוססים בחומר.
אם ההגדרה מאפשרת יותר מיישום סביר אחד, ציין את האפשרויות ואת אי־הוודאות. אל תהפוך עמימות לתנאי מחמיר חדש או להיתר לקבל כל זיקה אפשרית.

### דיוקים מתודולוגיים (חובה לכלול בהבהרה)

**יכולת ≠ תיאור מפורש של תהליך:** אם ההגדרה מתארת "יכולת" או "כושר", אין להציג אותם כ"תהליך שחייב להופיע מפורשות בטקסט". יכולת ניתנת להסקה מפעולה, מהחלטה, מהתאמה לנסיבות, או מקשר מבוסס בין הנחיה להכרעה — ובלבד שההסקה מנומקת מתוך הטקסט שסופק. אל תהפוך "יכולת" ל"תהליך גלוי" — זה צמצום לא מוצדק של אפשרויות הזיהוי.

**שמירת לשון ההגדרה:** אל תייחס להגדרה מילים או סייגים שאינם כתובים בנוסחה המקורי. אם ההגדרה אינה אומרת "משתמע" או "מפורש" — אל תוסיף קטגוריות אלה כאילו הן חלק מההגדרה. דבר על אפשרויות הזיהוי בשם שלא מייחס להגדרה דברים שאינם בה.

**הסקת יכולת דורשת בסיס טקסטואלי מסוים:** הסקה שהטקסט מבטא את היכולת שבהגדרה דורשת לפחות אחד מהבאים: נימוק של דמות, בחירה בין אפשרויות, התאמת ההחלטה לנסיבות, תיקון טעות קודמת, או קשר מבוסס בין הנחיה (אלוהית, נבואית, מוסרית) לבין הכרעה. **הצלחה כשלעצמה, או התאמה כללית לאופי התיאולוגי של הספר, אינן מספיקות.** אין לדרוש "מורכבות" כתנאי מחייב — גם הכרעה פשוטה ומנומקת עשויה להתאים להגדרה. השאלה היא מה הראיות מלמדות על ההבנה וההכרעה, לא כמה קשה הייתה ההחלטה.

**ציות אינו שלילי מראש:** ציות מיידי להוראה אלוהית/נבואית אינו בהכרח שולל זיהוי. יש לבדוק אם יש ראיות נוספות להבנה ושיקול דעת (נימוק, התאמה לנסיבות, יישום). עצם מהירות הציות אינה מכריעה.

**הפרדה בין לשון מפורשת להתנהגות:** בעת תיאור "דרך זיהוי לשונית", הפרד בין (1) ייחוס לשוני מפורש של המושג (הופעת שם המושג או נגזרותיו בהקשר רלוונטי) ובין (2) תיאורי התנהגות (שאילת עצה, שקילת אפשרויות, הכרעה מנומקת). הסוג השני יכול **לתמוך** בזיהוי, אבל אינו **ייחוס לשוני מפורש** של המושג ואינו מוכיח אותו לבדו.

**מעמד הפרשנות המתועדת:** פרשנות המתועדת בחומר המחקר יכולה לתמוך בזיהוי, אך אינה מעניקה לו אישור אוטומטי. אל תמנה פרשנים ספציפיים (רש"י, רד"ק וכו') — אין לדעת מראש אילו פרשנים נכללו. אם הפרשנות היא הראיה היחידה, יש לציין זאת כסייג מפורש.

**דרכי זיהוי = אפשרויות, לא תנאים:** דרכי הזיהוי שאת מציינת הן דוגמאות לאופנים אפשריים לזיהוי המושג, לא רשימת תנאים שחייבים להתקיים בכל יחידה. אל תהפוך אותן לרשימת check-list מחייבת.

### הוראות קבועות לשלב 4 — חלות על כל המושגים ללא יוצא מן הכלל

**1. ההגדרה מפרק ב׳ היא אמת המידה.** אין להוסיף לה תנאים מחייבים, כגון תהליך מחשבתי גלוי, מורכבות הפעולה או אזכור מפורש, אלא אם ההגדרה מחייבת זאת.

**2. יש להשתמש במלוא החומר** המאושר משלבים 2 ו־3, בטקסט היחידה ובמקבילה, ולהתייחס להנמקות ולפרשנות המתועדת שסופקו.

**3. יש להפריד בין ממצא טקסטואלי או השוואתי לבין ההסקה שהוא מבטא את המושג.** טענה מעורבת תפוצל לפי הצורך לרכיב ממצא (findingStatus) ולרכיב הסקה מושגית (conceptualStatus).

**4. היעדר מילה אינו מוכיח היעדר מושג; הופעתה אינה מספיקה לבדה לזיהויו.**

**5. היעדר תמיכה מספקת בטענה אינו מוכיח את היפוכה.** בפרט, אי־אפשר להסיק שהמושג נחלש רק משום שלא הוכח שהתחזק.

**6. אין להעמיד פעולה אנושית והכוונה אלוהית כניגודים מעצם הגדרתן.** יש לבחון את הקשר ביניהן בהתאם למושג ולראיות.

**7. יש לזהות במדויק** למי מיוחסים הכושר, הפעולה או האמירה, ולהבחין בין **כוונה, יכולת, פעולה ותוצאה**.

**8. הסיווג הכולל צריך להסביר מה נתמך ומה מסויג בטענה המרכזית,** ולא להיגזר מספירת הסיווגים או מטענות שוליות.

**9. הבדיקה מתמקדת בדברי הימים, במקבילה ובפרשנות המתועדת.** אין לייצר השוואה עצמאית לנביאים; הגדרת פרק ב׳ כבר מספקת את המסגרת המושגית. אם המסקנה המקורית של החוקרת כוללת טענה על נביאים — שמר אותה במקור והערך אותה בנפרד; אין להוסיף טענות נבואיות משלך.

**10. אין להעדיף מראש סיווג מחמיר או מקל,** ואין לכוון להתפלגות מסוימת של תוצאות. אין לקבוע כללים אוטומטיים לפי נוכחות או היעדר של ביטוי מסוים.

### סיווגים (לא היררכיה; כל אחד עצמאי)
- **supported** — הטענה נתמכת בראיות מזוהות שסופקו ובהגדרה.
- **qualified** — יש בסיס חיובי מזוהה, אך נדרש צמצום, הבחנה או הכרה במחלוקת. ציין את הסייג המדויק.
- **exceeded** — הטענה כוללת קביעה שהראיות שסופקו אינן מבססות (הרחבה מעבר לחומר).
- **insufficient** — חסר מידע הנחוץ לבדיקה (אין מספיק נתונים — לא נקבע נגד הטענה).
- **irrelevant** (רק ל-conceptualStatus) — הטענה היא ממצא טקסטואלי בלבד, ללא השתמעות מושגית. אין לברוח ל-irrelevant כדי להתחמק מהכרעה: טענה שמייחסת תכונה או קשר לדמות **אינה** irrelevant.

### תפעול

**פירוק המסקנה לטענות:** פרק את המסקנה המחקרית של החוקרת לטענות עצמאיות ב-perClaim. אל תשנה את ניסוח הטענות המקוריות; צטט מתוך המסקנה.

**הנמקות:** כל נימוק (findingJustification ו-conceptualJustification) חייב להצביע על ראיה ספציפית מתוך החומר שסופק — פסוק מזוהה, אינדיקטור משלב 2, פרשנות מתועדת. אין להמציא פסוקים, ציטוטים או פרשנים. פרשנות מתועדת יש להציג עם שם המחבר, החיבור והעמוד כפי שהם מופיעים בחומר.

**חומר שלא סופק:** אם רכיב כלשהו של ההגדרה אינו מופיע בחומר שסופק (אינדיקטורים, מסקנה, טקסט, פרשנות) — כתוב במפורש "לא נמצא בחומר שסופק". אל תקבע שהרכיב "נעדר מהיחידה" — אין לך גישה למלוא החומר האפשרי על היחידה.

**יחידה ללא מסקנה:** אם לא נכתבה מסקנה מחקרית בשלב 3 → conclusionStatus="no_conclusion", perClaim=[], summary="אין מסקנה מחקרית בשלב 3 — אין מה לבדוק". אין להסיק מהעדר מסקנה שהיא הייתה חורגת לו נכתבה.

**הסיכום הכולל (summary):** יסביר מה נתמך ומה מסויג בטענה המרכזית של המסקנה (כלל 8). אם יש פער בין ממצאים נתמכים להסקה שאינה נתמכת — הסבר את הפער במפורש. conclusionStatus נגזר מהסיכום, לא מספירת הסיווגים הפרטניים.

### שני השדות — שומרת זהב מתודית

החוקרת עובדת לפי שני שדות ראיה:
- **שדה גלוי** (explicit) — מילים מהשדה הסמנטי של המושג שאכן מופיעות בטקסט, בציטוט ישיר של פסוק. בחומר שסופק: תחת הכותרת "שדה גלוי · דה"י" ו"שדה גלוי · מקבילה".
- **שדה נרמז** (implicit) — הסקה דרך פעולות דמות, בחירות ספרותיות, פרמטרי המושג ועיצוב הכרוניסט. **לא** לשון מפורשת של המושג. **הפירוש של השדה הנרמז לכל יחידה כבר כלול במסקנה המחקרית (compareNotes) של החוקרת** — אין לו שדה נפרד בחומר שסופק, כי לרוב החוקרת עצמה מבחינה בטקסט המסקנה בין "השדה הגלוי" ל"השדה הנרמז" (ולעתים נוקטת לשון "בשדה הסמוי").

**חובת ההפרדה:** כל טענת משנה חייבת לציין את מקור ראיותיה (fieldBasis: "explicit" / "implicit" / "both"). ראיות לשדה הגלוי שאב מהסעיפים המיוחדים "שדה גלוי · דה"י"/"שדה גלוי · מקבילה". ראיות לשדה הנרמז שאב מתוך המסקנה המחקרית של החוקרת לאותה יחידה, שם היא פירשה את הפעולות והאינדיקטורים.
**בתרומת ההשוואה למקבילה:** הבחן בין שינויים בשדה הגלוי (למשל: השמטת/תוספת מילה, שינוי לשון) לבין שינויים בשדה הנרמז (למשל: הוספת פעולה, שינוי נושא הפעולה), כפי שהחוקרת מתארת אותם במסקנותיה.

### הוראות קבועות — חלות על כל המושגים

**1. ההגדרה מפרק ב׳ היא אמת המידה.** אין להוסיף תנאים מחייבים אא"כ ההגדרה מחייבת.
**2. יש להשתמש במלוא החומר** שסופק: המסקנות, הפרשנות המתועדת, שני השדות, הניתוח העובדתי.
**3. יש להפריד בין ממצא טקסטואלי/השוואתי לבין ההסקה שהוא מבטא את המושג.**
**4. היעדר מילה אינו מוכיח היעדר מושג; הופעתה אינה מספיקה לבדה לזיהויו.**
**5. היעדר תמיכה מספקת בטענה אינו מוכיח את היפוכה.**
**6. אין להעמיד פעולה אנושית והכוונה אלוהית כניגודים מעצם הגדרתן.**
**7. יש לזהות במדויק למי מיוחסים הכושר/הפעולה, ולהבחין בין כוונה, יכולת, פעולה ותוצאה.**
**8. הטיעון מסביר מה נתמך ומה מסויג — לא נגזר מספירה.**
**9. אין לייצר השוואה עצמאית לנביאים.** הגדרת פרק ב׳ מספקת את המסגרת.
**10. אין להעדיף סיווג מחמיר או מקל.**

### הוראות ייחודיות לפאזת הסינתזה

**ס1. אין להפיק מחדש סיווג פר-יחידה.** זו **לא** בדיקת התאמה. אם מסקנה מסוימת אינה מתיישבת עם הראיות שתועדו לה — סמן ב-flaggedIssues; אל תשנה אותה.

**ס2. אין לכפות טענה אחידה.** התוצר כולל מסקנה מרכזית וטענות משנה. יחידות שונות עשויות ללמד דברים שונים — שמר את ההבדלים.

**ס3. סתירה בין יחידות ≠ חריגה מהראיות.** flaggedIssues מיועד **רק** לפערים בין מסקנה בודדת לראיותיה שלה, לא לפערים בין יחידות.

**ס4. אין לספור יחידות כתנאי.** מספרים ייכללו רק אם מבוססים ושימושיים. העיקר הוא **משמעות הממצאים לעיצוב דמות המלך**.

**ס5. יחידות ללא מסקנה אינן ראיה שלילית.** אפשר להזכיר בחוסרים.

**ס6. ייחוס מקורות — חובה שלמה:** בכל טענת משנה הצבע על יחידות + פסוקים + פרשנות מתועדת. **שמר שם מחבר, חיבור ועמוד כפי שהם בחומר. אל תמציא פרשנים, פסוקים או עמודים. אם פרשן מופיע במסקנתה של החוקרת לגבי יחידה — הוא חייב להופיע בטענת המשנה שמסתמכת עליה.**

**ס7. סדר הדיון.** בסוף הפלט, הצע סדר כתיבה לפרק: אילו טענות לפתוח בהן, איפה למקם סייגים.

  // ניסיון פיענוח JSON עם 4 שלבי fallback (אותו קוד כמו בפאזה 2)
  function tryParseJson(text){
    let parsed=null; let parseError=null;
    try{ const clean=text.trim().replace(/^```json\s*/,"").replace(/\s*```$/,""); parsed=JSON.parse(clean); }catch(e){ parseError=e; }
    if(!parsed){
      const first=text.indexOf("{"),last=text.lastIndexOf("}");
      if(first>=0&&last>first){ try{ parsed=JSON.parse(text.substring(first,last+1)); parseError=null; }catch(e){ parseError=e; } }
    }
    if(!parsed){
      const first=text.indexOf("{"),last=text.lastIndexOf("}");
      if(first>=0&&last>first){
        let fixed=text.substring(first,last+1);
        fixed=fixed.replace(/,(\s*[}\]])/g,"$1").replace(/[“”״]/g,"ʼ");
        try{ parsed=JSON.parse(fixed); parseError=null; }catch(e){ parseError=e; }
      }
    }
    if(!parsed){
      const first=text.indexOf("{"),last=text.lastIndexOf("}");
      if(first>=0&&last>first){
        let fixed=text.substring(first,last+1);
        fixed=fixed.replace(/([֐-׿])"([֐-׿])/g,"$1\\\"$2").replace(/\s"([֐-׿])/g," \\\"$1").replace(/([֐-׿])"(?=[\s.,;])/g,"$1\\\"").replace(/,(\s*[}\]])/g,"$1");
        try{ parsed=JSON.parse(fixed); parseError=null; }catch(e){ parseError=e; }
      }
    }
    return {parsed,error:parseError};
  }

  function buildVerifyPrompt(synthesis,unitsData,batchIdx,totalBatches){
    const who=character==="solomon"?"שלמה":"דוד";

    const unitsSection=Object.entries(unitsData).map(([uid,data])=>{
      const commentaryText=data.commentary&&typeof data.commentary==="object"
        ? Object.entries(data.commentary).map(([author,text])=>`--- ${author} ---\n${text}`).join("\n\n")
        : (typeof data.commentary==="string"?data.commentary:"");
      return `=== יחידה [uid: ${uid}]: ${data.unitName} (${data.chapter}) ${data.sourceRef?"[מקבילה: "+data.sourceRef+"]":"[סונדרגוט]"}

[טקסט דה"י המלא]
${data.chroniclesText||"(לא נטען)"}

${data.sourceText?`[טקסט המקבילה המלא]\n${data.sourceText}\n`:""}
[פרשנות מלאה — כל המחברים ליחידה זו]
${commentaryText||"(אין פרשנות מתועדת)"}
`;
    }).join("\n");

    return `אתה עוזר מחקר. מטרתך: לבצע **בדיקת תקינות ציטוטים** של סינתזה שהופקה למושג "${concept}" בפרקי ${who} בדברי הימים.

### קריטריוני בדיקה

לכל ציטוט בסינתזה, הגדר אחד משלושה סוגים:

**(A) ציטוט פסוק** — תוכן מצוטט שמוצג כפסוק מדה״י/שמואל/מלכים.
בדיקה: האם הטקסט הזה אכן קיים ביחידה המדווחת (uid) בטקסט דה״י או במקבילה?

**(B) שיוך ליחידה** — טענה שאירוע/תוכן/ביטוי "נמצא" או "מתבטא" ביחידה מסוימת (ב-supportingUnits.quote).

**(C) ציטוט פרשן** — טענה שהמחבר X אומר Y בעמוד Z.
בדיקה: האם הטקסט המיוחס למחבר X אכן מופיע בפרשנות המלאה של אותו מחבר (באותה יחידה)? האם זה המחבר הנכון?

### קטגוריות ווידוא
- **verified**: הציטוט תקין לחלוטין.
- **partial**: רוב הציטוט תקין, דורש דיוק קטן בנוסח או ניסוח.
- **misassigned**: הציטוט נכון מבחינת תוכן, אך משויך ליחידה הלא נכונה או למחבר הלא נכון.
- **not_found**: הציטוט אינו נמצא בחומר שסופק.
- **not_verifiable**: אין בחומר שסופק מספיק מידע לוודא (יחידה בלי פרשנות, פרשן שאין לו טקסט, וכו').

  // תכנון קבוצות ווידוא: מחלק את היחידות שמצוטטות בסינתזה ל-6 קבוצות
  function initP3VerifyPlan(){
    if(!p3Synthesis) return null;
    const citedUids=[];
    const seen=new Set();
    (p3Synthesis.subClaims||[]).forEach(sc=>{
      (sc.supportingUnits||[]).forEach(su=>{
        if(su&&su.uid){
          const u=String(su.uid);
          if(!seen.has(u)){ seen.add(u); citedUids.push(u); }
        }
      });
    });
    if(citedUids.length===0) return null;
    const existing=stage4Data.phase3_verify_in_progress;
    const batchSize=p3BatchSizeFor(citedUids.length);
    // המשך תכנון קיים אם מתאים לגרסה ולסינתזה הנוכחית
    if(existing&&existing.promptVersion===VERIFY_PROMPT_VERSION&&existing.sourceSynthesisGeneratedAt===(p3Synthesis.generatedAt||null)&&existing.totalUids===citedUids.length) return existing;
    const batches=[];
    for(let i=0;i<citedUids.length;i+=batchSize){
      batches.push({idx:batches.length,unitUids:citedUids.slice(i,i+batchSize),status:"pending"});
    }
    return {
      startedAt:new Date().toISOString(),
      promptVersion:VERIFY_PROMPT_VERSION,
      sourceSynthesisGeneratedAt:p3Synthesis.generatedAt||null,
      totalUids:citedUids.length,
      batchSize,
      batches,
      totalUsage:{input_tokens:0,output_tokens:0},
      totalCost:0
    };
  }

  async function verifyCitations(){
    if(!p3Synthesis){ setP3VerifyError("אין סינתזה לוודא."); return; }
    setP3VerifyError(""); setP3VerifyLoading(true);
    let plan=initP3VerifyPlan();
    if(!plan){
      setP3VerifyError("לא נמצאו ציטוטים לוודא בסינתזה."); setP3VerifyLoading(false); setP3VerifyProgress(""); return;
    }
    saveP3VerifyInProgress(plan);
    const unitsByIdSyn={};
    (raw.units||[]).forEach(u=>{ unitsByIdSyn[String(u.id)]=u; });
    try{
      // הרץ קבוצות שלא הושלמו
      for(let bi=0;bi<plan.batches.length;bi++){
        if(plan.batches[bi].status==="done") continue;
        setP3VerifyProgress(`קבוצה ${bi+1}/${plan.batches.length}: טוען פרשנות ל-${plan.batches[bi].unitUids.length} יחידות...`);
        const unitsData={};
        plan.batches[bi].unitUids.forEach(uid=>{
          const u=unitsByIdSyn[uid]||{};
          const commentary=(raw.commentary&&raw.commentary[uid])||{};
          unitsData[uid]={
            unitName:u.name||"?",
            chapter:u.chapter||"?",
            chroniclesText:u.chroniclesText||"",
            sourceText:u.sourceText||"",
            sourceRef:u.sourceRef||null,
            commentary
          };
        });
        const prompt=buildVerifyPrompt(p3Synthesis,unitsData,bi,plan.batches.length);
        setP3VerifyProgress(`קבוצה ${bi+1}/${plan.batches.length}: שולח ל-AI (${prompt.length.toLocaleString()} תווים)...`);
        try{
          const r=await aiCallDirectWithUsage(prompt,16000);
          const {parsed,error}=tryParseJson(r.text);
          if(!parsed){
            plan.batches[bi]={...plan.batches[bi],status:"error",error:`JSON parse: ${error?error.message:"לא נמצא"}`,processedAt:new Date().toISOString()};
            saveP3VerifyInProgress(plan);
            setP3VerifyError(`קבוצה ${bi+1} בבדיקת פרשנים נכשלה: ${error?error.message:"JSON parse"}. ההתקדמות נשמרה.`);
            setP3VerifyLoading(false); setP3VerifyProgress(""); return;
          }
          plan.batches[bi]={
            ...plan.batches[bi],
            status:"done",
            report:parsed,
            processedAt:new Date().toISOString(),
            usage:r.usage,
            costUsd:r.costUsd,
            _promptLength:prompt.length
          };
          plan.totalUsage.input_tokens+=(r.usage?.input_tokens||0);
          plan.totalUsage.output_tokens+=(r.usage?.output_tokens||0);
          plan.totalCost+=(r.costUsd||0);
          saveP3VerifyInProgress(plan);
        }catch(batchErr){
          plan.batches[bi]={...plan.batches[bi],status:"error",error:String(batchErr.message||batchErr),processedAt:new Date().toISOString()};
          saveP3VerifyInProgress(plan);
          setP3VerifyError(`קבוצה ${bi+1} נכשלה: ${batchErr.message||batchErr}. ההתקדמות נשמרה — נסי להמשיך.`);
          setP3VerifyLoading(false); setP3VerifyProgress(""); return;
        }
      }
      // מיזוג סופי — דטרמיניסטי (ללא קריאת AI נוספת)
      setP3VerifyProgress("מאחד דוחות קבוצות...");
      const mergedUnit=[]; const mergedScholar=[]; const mergedVerse=[];
      const perBatchSummaries=[];
      plan.batches.forEach(b=>{
        const r=b.report||{};
        (r.unitAssignmentChecks||[]).forEach(x=>mergedUnit.push(x));
        (r.scholarCitationChecks||[]).forEach(x=>mergedScholar.push(x));
        (r.verseCitationChecks||[]).forEach(x=>mergedVerse.push(x));
        if(r.summary) perBatchSummaries.push(`[קבוצה ${b.idx+1}] ${r.summary}`);
      });
      // ספירות
      const countAll=(arr)=>{
        const c={verified:0,partial:0,misassigned:0,not_found:0,not_verifiable:0,other:0};
        arr.forEach(it=>{ if(c[it.status]!==undefined) c[it.status]++; else c.other++; });
        return c;
      };
      const unitC=countAll(mergedUnit),scholarC=countAll(mergedScholar),verseC=countAll(mergedVerse);
      const totalIssues=unitC.misassigned+unitC.not_found+unitC.partial+scholarC.misassigned+scholarC.not_found+scholarC.partial+verseC.misassigned+verseC.not_found+verseC.partial;
      const overallRec=totalIssues===0?"accept_as_is":(totalIssues<=5?"accept_with_fixes":"regenerate");
      const report={
        unitAssignmentChecks:mergedUnit,
        scholarCitationChecks:mergedScholar,
        verseCitationChecks:mergedVerse,
        summary:`אוחדו דוחות מ-${plan.batches.length} קבוצות. ציטוטי יחידות: ${mergedUnit.length} (${unitC.verified} ✓, ${unitC.partial} חלקי, ${unitC.misassigned} שיוך שגוי, ${unitC.not_found} לא נמצא). ציטוטי פרשנים: ${mergedScholar.length} (${scholarC.verified} ✓, ${scholarC.partial} חלקי, ${scholarC.misassigned} שיוך שגוי, ${scholarC.not_found} לא נמצא). ציטוטי פסוקים: ${mergedVerse.length} (${verseC.verified} ✓, ${verseC.misassigned} שיוך שגוי, ${verseC.not_found} לא נמצא). סה"כ בעיות הדורשות תיקון: ${totalIssues}.`,
        overallRecommendation:overallRec,
        batchSummaries:perBatchSummaries,
        verifiedAt:new Date().toISOString(),
        promptVersion:VERIFY_PROMPT_VERSION,
        sourceSynthesisGeneratedAt:p3Synthesis.generatedAt||null,
        usage:plan.totalUsage,
        costUsd:plan.totalCost,
        unitsChecked:plan.totalUids,
        batchCount:plan.batches.length,
        batchSize:plan.batchSize
      };
      const newStage4={
        ...stage4Data,
        phase3_verification:report,
        phase3_verify_in_progress:null,
        lastUpdated:Date.now()
      };
      const newData={...stageData,stage4:newStage4,lastUpdated:Date.now()};
      setStageData(newData);
      const all=stageResults||LS_get("stageResults",{});
      const updated={...all,[resultsKey]:newData};
      if(setStageResults) setStageResults(updated);
      LS_set("stageResults",updated);
      fbSaveStageResults(updated);
      setP3VerifyProgress("");
    }catch(e){
      setP3VerifyError(`שגיאה כללית: ${e.message||e}`);
    }
    setP3VerifyLoading(false);
  }

  // עדכון נקודתי ב-p3Draft דרך path
  function updateDraft(path,value){
    setP3Draft(prev=>{
      if(!prev) return prev;
      const copy=JSON.parse(JSON.stringify(prev));
      const parts=path.split(".");
      let cur=copy;
      for(let i=0;i<parts.length-1;i++){
        const p=parts[i];
        const match=p.match(/^(\w+)\[(\d+)\]$/);
        if(match){ cur=cur[match[1]][parseInt(match[2])]; }
        else{ cur=cur[p]; }
      }
      const last=parts[parts.length-1];
      const lastMatch=last.match(/^(\w+)\[(\d+)\]$/);
      if(lastMatch){ cur[lastMatch[1]][parseInt(lastMatch[2])]=value; }
      else{ cur[last]=value; }
      return copy;
    });
  }

  // מחיקת פריט מרשימה (subClaims/qualifications/flaggedIssues) ב-p3Draft
  function deleteDraftItem(arrayPath,index){
    setP3Draft(prev=>{
      if(!prev) return prev;
      const copy=JSON.parse(JSON.stringify(prev));
      const parts=arrayPath.split(".");
      let cur=copy;
      for(let i=0;i<parts.length-1;i++){ cur=cur[parts[i]]; }
      const key=parts[parts.length-1];
      if(Array.isArray(cur[key])) cur[key]=cur[key].filter((_,i)=>i!==index);
      return copy;
    });
  }

    // ל-Firebase: שומרים הכל (מקור האמת, אין מגבלת quota מעשית)
    fbSaveStageResults(updated);

    // (ה-result יכול להיות עשרות KB לקבוצה × 6 קבוצות × 22 מושגים × 2 דמויות = הצפת quota)
    try{
      const leanInProg=inProg?{
        ...inProg,
        batches:(inProg.batches||[]).map(b=>({
          idx:b.idx,
          unitUids:b.unitUids,
          status:b.status,
          error:b.error,
          processedAt:b.processedAt,
          usage:b.usage,
          costUsd:b.costUsd,
          _promptLength:b._promptLength,
          _findingsCount:b.result&&Array.isArray(b.result.batchFindings)?b.result.batchFindings.length:0,

        }))
      }:null;
      const leanStage4={...newStage4,phase3_academic_in_progress:leanInProg};
      const leanData={...newData,stage4:leanStage4};
      const leanUpdated={...all,[resultsKey]:leanData};
      LS_set("stageResults",leanUpdated);
    }catch(e){
      console.warn("LS lean save failed, מסתמכים על Firebase",e);
    }
  }

  function initP3DraftPlan(){
    const s3=stageData.stage3;
    const allUnits=s3.detailedConclusions||[];
    const batchSize=p3BatchSizeFor(allUnits.length);
    const existing=stage4Data.phase3_academic_in_progress;
    if(existing&&existing.promptVersion===PROMPT_VERSION_DRAFT&&existing.totalUnits===allUnits.length) return existing;
    const batches=[];
    for(let i=0;i<allUnits.length;i+=batchSize){
      const slice=allUnits.slice(i,i+batchSize);
      batches.push({idx:batches.length,unitUids:slice.map(u=>u.uid),status:"pending"});

    return {
      startedAt:new Date().toISOString(),

      totalUnits:allUnits.length,
      batchSize,
      batches,
      mergeStatus:"pending",
      totalUsage:{input_tokens:0,output_tokens:0},
      totalCost:0
    };

עבור על ${batchUnits.length} היחידות שבקבוצה הנוכחית וחלץ **ממצאים שההגדרה הופכת לרלוונטיים עבור "${concept}" ספציפית**. אל תאסוף ממצאים "חביבים" — שאל לכל ממצא: **מה בהתנהגות המלך או בהצגת מעמדו כאן מבטא את "${concept}" כפי שהוגדר למעלה**? אם אין תשובה ספציפית — אל תכלול.

### מה לחלץ מהקבוצה
- **ממצאים בשדה הגלוי** — הופעה מפורשת של המושג או של השדה הסמנטי שלו, פסוקים קונקרטיים.
- **ממצאים בשדה הנרמז** — פעולות ובחירות ספרותיות **שספציפית תואמות את ההגדרה** (לא רק "נראות דתיות").
- **שינויי הכרוניסט ביחס למקבילה** — תוספת/השמטה/החלפה. חובה להסביר **את משמעות השינוי למושג**, לא רק את העובדה שהוא קיים.
- **ציטוטי פרשנים רלוונטיים** — אך ורק פרשנים שקראת את טקסטם בחומר הזה, עם שם מחבר, חיבור ועמוד כפי שהם בחומר.

### כללי כתיבה נוקשים
1. **פרוזה אקדמית רציפה** 350-500 מילים (צמצום מהגרסה הקודמת — פחות ראיות מבוססות היטב עדיף על יותר ראיות חלשות). ללא כותרות, סעיפים ממוספרים או רשימות.
2. **כל פסקה חייבת לחבר במפורש בין הממצא לבין ההגדרה**: לא לכתוב "המעשה X מראה אדיקות" ולהישען על זה בלבד; לכתוב "X מממש את ${concept} משום ש[חיבור ספציפי להגדרה]". אם לא תוכל לנסח את החיבור בלי להשתמש במילים ממושג סמוך — זה לא ממצא ל-${concept}.
3. **אין ספירת אינדיקטורים** כהוכחה למושג.
4. **הבחן בין הממצא למשמעותו בהשוואה**: תוספת/השמטה/שינוי של הכרוניסט הם **נתון**. התרומה שלהם לעיצוב ${concept} טעונה הנמקה. אל תסתפק ב"הכרוניסט הוסיף X, כלומר ${concept}" — הסבר את הגשר.
5. **ניסוח היקף נכון**: אם הראיות באות מ-5 יחידות מתוך 48, כתוב "ביחידות אלה מצטייר דפוס של..." ולא "פרקי ${who} בדה״י מאופיינים ב...". אל תעשה הכללה מעבר לבסיס הראיות.
6. **הפרד בין דברי פרשן למסקנת המחקר**. שמות הפרשנים והעמודים **רק** בהערות שוליים.
7. **אין ליצור ציטוט מניסוח משוער**. אם אין נוסח מדויק — פרפרזה והפניה.
8. **אין להוסיף השוואה עצמאית לנביאים** או למושגים אחרים (זה שייך לפרקי השוואה).
9. **אל תסיים ב-"לסיכום" פורמלי**.
10. **הערות שוליים = ציטוטים ביבליוגרפיים בלבד** (מחבר + חיבור + עמוד). **אסור** לכתוב בהערת שוליים הפניה פנימית מהסוג "ראה ראיות נגד, יחידה X" או "ראה הערה למעלה". גם **אסור UID** בהערות שוליים או בטקסט הטיוטה — השתמש בהפניה אנושית ("דה״י א׳ י״ד").

  async function generateAcademicDraft(){
    if(!conceptDef||!conceptDef.text){ setP3DraftError("יש להזין ולשמור הגדרה בפאזה 1 קודם."); return; }
    if(!conceptDef.clarification||!conceptDef.clarification.text){ setP3DraftError("יש ליצור הבהרת יישום בפאזה 1 קודם."); return; }
    const s2=stageData.stage2, s3=stageData.stage3;
    if(!s2||!Array.isArray(s2.tableRows)||!s2.tableRows.length){ setP3DraftError("אין נתוני שלב 2."); return; }
    if(!s3||s3.source!=="compareNotes"||!Array.isArray(s3.detailedConclusions)){ setP3DraftError("אין נתוני שלב 3."); return; }
    if(p3AcademicDraft&&!p3AcademicInProgress){
      if(!confirm("קיימת טיוטה. ליצור חדשה (הקיימת תימחק)?")) return;
      // ניקוי מה-draft הקיים
      const cleaned={...stage4Data,phase3_academic_draft:null,phase3_academic_in_progress:null,lastUpdated:Date.now()};
      const newData={...stageData,stage4:cleaned,lastUpdated:Date.now()};
      setStageData(newData);
      const all=stageResults||LS_get("stageResults",{});
      const upd={...all,[resultsKey]:newData};
      if(setStageResults) setStageResults(upd);
      LS_set("stageResults",upd);
      fbSaveStageResults(upd);
      await new Promise(r=>setTimeout(r,80));
    }
    setP3DraftError(""); setP3DraftLoading(true);

    const allUnits=s3.detailedConclusions;
    const unitsByUid={};
    allUnits.forEach(u=>{ unitsByUid[u.uid]=u; });

    // תכנון או טעינת מצב קיים
    let plan=initP3DraftPlan();
    saveP3AcademicInProgress(plan);

    try{
      // ─ שלב א': הרצת קבוצות שלא הושלמו ─
      for(let bi=0;bi<plan.batches.length;bi++){
        if(plan.batches[bi].status==="done") continue;
        setP3DraftProgress(`קבוצה ${bi+1}/${plan.batches.length}: שולף פרשנות ל-${plan.batches[bi].unitUids.length} יחידות...`);
        const batchUnits=plan.batches[bi].unitUids.map(uid=>unitsByUid[uid]).filter(Boolean);
        const prompt=buildDraftBatchPrompt(bi,batchUnits,plan.batches.length,allUnits.length);
        setP3DraftProgress(`קבוצה ${bi+1}/${plan.batches.length}: שולח ל-AI (${prompt.length.toLocaleString()} תווים)...`);
        try{
          const r=await aiCallDirectWithUsage(prompt,16000);
          const {parsed,error}=tryParseJson(r.text);
          if(!parsed){
            plan.batches[bi]={...plan.batches[bi],status:"error",error:`JSON parse: ${error?error.message:"לא נמצא"}`,processedAt:new Date().toISOString()};
            saveP3AcademicInProgress(plan);
            setP3DraftError(`קבוצה ${bi+1} נכשלה: ${error?error.message:"JSON parse"}. ההתקדמות נשמרה — לחצי שוב להמשיך.`);
            setP3DraftLoading(false); setP3DraftProgress(""); return;
          }
          plan.batches[bi]={
            ...plan.batches[bi],
            status:"done",
            result:parsed,
            processedAt:new Date().toISOString(),
            usage:r.usage,
            costUsd:r.costUsd,
            _promptLength:prompt.length
          };
          plan.totalUsage.input_tokens+=(r.usage?.input_tokens||0);
          plan.totalUsage.output_tokens+=(r.usage?.output_tokens||0);
          plan.totalCost+=(r.costUsd||0);
          saveP3AcademicInProgress(plan);
        }catch(batchErr){
          plan.batches[bi]={...plan.batches[bi],status:"error",error:String(batchErr.message||batchErr),processedAt:new Date().toISOString()};
          saveP3AcademicInProgress(plan);
          setP3DraftError(`קבוצה ${bi+1} נכשלה: ${batchErr.message||batchErr}. ההתקדמות נשמרה — לחצי שוב להמשיך.`);
          setP3DraftLoading(false); setP3DraftProgress(""); return;
        }
      }

      // ─ שלב ב': מיזוג סופי לפרוזה אקדמית ─
      setP3DraftProgress(`מיזוג סופי של ${plan.batches.length} קבוצות — כותב טיוטה...`);
      const mergePrompt=buildDraftMergePrompt(plan.batches);
      try{
        const mr=await aiCallDirectWithUsage(mergePrompt,16000);
        const {parsed,error}=tryParseJson(mr.text);
        if(!parsed){
          plan.mergeStatus="error";
          plan.mergeError=`JSON parse: ${error?error.message:"לא נמצא"}`;
          saveP3AcademicInProgress(plan);
          setP3DraftError(`מיזוג סופי נכשל: ${error?error.message:"JSON parse"}. הממצאים נשמרו — לחצי שוב להרץ רק את המיזוג.`);
          setP3DraftLoading(false); setP3DraftProgress(""); return;
        }
        plan.totalUsage.input_tokens+=(mr.usage?.input_tokens||0);
        plan.totalUsage.output_tokens+=(mr.usage?.output_tokens||0);
        plan.totalCost+=(mr.costUsd||0);
        const draft={
          ...parsed,
          promptVersion:PROMPT_VERSION_DRAFT,
          generatedAt:new Date().toISOString(),
          definitionAt:conceptDef.editedAt||conceptDef.savedAt||null,
          clarificationId:conceptDef.clarification.id||null,
          clarificationGeneratedAt:conceptDef.clarification.generatedAt||conceptDef.clarification.editedAt||null,
          usage:plan.totalUsage,
          costUsd:plan.totalCost,

        };

  // המרה ל-Markdown להורדה
  function academicDraftToMarkdown(draft,meta){
    const {character,concept,dimLabel,conceptDef}=meta||{};
    const who=character==="solomon"?"שלמה":"דוד";
    const lines=[];
    lines.push(`# ${concept} · ${who} — טיוטה אקדמית`);
    lines.push("");
    if(dimLabel) lines.push(`**ממד:** ${dimLabel}`);
    lines.push(`**הופק:** ${draft.generatedAt?draft.generatedAt.slice(0,16).replace("T"," "):todayStamp()}`);
    if(draft.wordCount) lines.push(`**מילים בטיוטה:** ${draft.wordCount}`);
    if(draft.totalUnitsInCorpus) lines.push(`**יחידות עובדו:** ${draft.totalUnitsInCorpus} ב-${draft.batchCount||"?"} קבוצות`);
    if(draft.usage) lines.push(`**שימוש:** קלט ${draft.usage.input_tokens||0} tok · פלט ${draft.usage.output_tokens||0} tok · עלות $${(draft.costUsd||0).toFixed(4)}`);
    lines.push("");
    lines.push("---");
    lines.push("");
    if(draft.centralClaim){
      lines.push("## טיעון מרכזי");
      lines.push("");
      lines.push(draft.centralClaim);
      lines.push("");
    }
    lines.push("## הטיוטה");
    lines.push("");
    lines.push(draft.draft||"(ריק)");
    lines.push("");
    if(Array.isArray(draft.footnotes)&&draft.footnotes.length){
      lines.push("---");
      lines.push("");
      lines.push("## הערות שוליים");
      lines.push("");
      draft.footnotes.forEach(fn=>{
        lines.push(`${fn.num||"?"}. ${fn.text||""}`);
      });
      lines.push("");
    }
    if(Array.isArray(draft.evidenceMap)&&draft.evidenceMap.length){
      lines.push("---");
      lines.push("");
      lines.push("## מפת ביסוס (עבודה פנימית, לא לכתיבה)");
      lines.push("");
      draft.evidenceMap.forEach((em,i)=>{
        lines.push(`### ${i+1}. ${em.paragraph||""}`);
        const unitRefs=Array.isArray(em.basedOnUnitRefs)&&em.basedOnUnitRefs.length?em.basedOnUnitRefs:(Array.isArray(em.basedOnUnits)?em.basedOnUnits:[]);
        if(unitRefs.length) lines.push(`**יחידות:** ${unitRefs.join(", ")}`);
        if(em.defAnchor) lines.push(`**עיגון להגדרה:** ${em.defAnchor}`);
        if(em.mainEvidence) lines.push(`**ראיה מרכזית:** ${em.mainEvidence}`);
        if(em.boundaryCheck) lines.push(`**בדיקת גבול מושגי:** ${em.boundaryCheck}`);
        lines.push("");
      });
    }
    if(Array.isArray(draft.rejectedForBoundary)&&draft.rejectedForBoundary.length){
      lines.push("---");
      lines.push("");
      lines.push("## ממצאים שנדחו בגלל גבול מושגי (שייכים למושג סמוך)");
      lines.push("");
      draft.rejectedForBoundary.forEach(r=>lines.push(`- ${r}`));
      lines.push("");
    }
    if(draft.definitionAnchorStatement){
      lines.push("---");
      lines.push("");
      lines.push("## עיגון להגדרה (הצהרת ה-AI)");
      lines.push("");
      lines.push(draft.definitionAnchorStatement);
      lines.push("");
    }
    if(Array.isArray(draft.gaps)&&draft.gaps.length){
      lines.push("---");
      lines.push("");
      lines.push("## חוסרים / בעיות נקודתיות");
      lines.push("");
      draft.gaps.forEach(g=>lines.push(`- ${g}`));
      lines.push("");
    }
    if(draft.definitionVersionUsed||draft.clarificationVersionUsed){
      lines.push("---");
      lines.push("");
      lines.push("## גרסאות קלט");
      lines.push("");
      if(draft.definitionVersionUsed) lines.push(`- **הגדרה:** ${draft.definitionVersionUsed}`);
      if(draft.clarificationVersionUsed) lines.push(`- **הבהרת יישום:** ${draft.clarificationVersionUsed}`);
      lines.push("");
    }
    return lines.join("\n");
  }

  function saveNow(newData){

  const dimLabel=(DIMS.find(d=>d.id===dimId)||{}).label||dimId;
