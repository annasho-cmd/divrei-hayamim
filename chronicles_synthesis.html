// ─ מערכת מזהים קבועים לשורות שלב 3 (שלב 1 של ד') ─
// sourceId: מזהה פנימי יציב — נוצר פעם אחת ונשמר, לא תלוי בסדר
// sourceLabel: מזהה קריא לתצוגה — concept.unit.n
function newSourceId(){
  try{ if(window.crypto&&window.crypto.randomUUID) return "s_"+crypto.randomUUID().slice(0,13); }catch(e){}
  return "s_"+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
}
function makeSourceLabel(concept,unitName,ordinal){
  // ordinal: המספר הסידורי של השורה בתוך היחידה (למרבית: 1)
  const unitSafe=String(unitName||"?").replace(/[^֐-׿\w_-]/g,"").slice(0,40);
  const conceptSafe=String(concept||"?").replace(/[^֐-׿\w_-]/g,"").slice(0,20);
  return `${conceptSafe}.${unitSafe}.${ordinal||1}`;
}
// מילוי מזהים חסרים לנתוני שלב 3 ישנים (מיגרציה בעת קריאה)
function ensureSourceIds(stage3Data,concept){
  if(!stage3Data||!Array.isArray(stage3Data.tableRows)) return stage3Data;
  const existing=Array.isArray(stage3Data.sourceIds)?stage3Data.sourceIds:[];
  if(existing.length===stage3Data.tableRows.length) return stage3Data;
  // מספר לפי יחידה (לטיפול בכמה שורות לאותה יחידה)
  const unitCounters={};
  const filled=stage3Data.tableRows.map((row,i)=>{
    if(existing[i]&&existing[i].sid) return existing[i];
    const unit=row&&row[0]?row[0]:"?";
    unitCounters[unit]=(unitCounters[unit]||0)+1;
    return{sid:newSourceId(),label:makeSourceLabel(concept,unit,unitCounters[unit])};
  });
  return{...stage3Data,sourceIds:filled};
}

function LS_get(k,def){ try{const v=localStorage.getItem(k); return v?JSON.parse(v):def;}catch{return def;} }
function LS_set(k,v){
  try{ localStorage.setItem(k,JSON.stringify(v)); return true; }
  catch(e){
    // התאוששות אוטומטית מ-QuotaExceededError:
    // Firebase הוא מקור האמת, ולכן אם ה-LS מלא — ננקה אותו (נשמור רק apiKey) וננסה שוב.
    if(e&&(e.name==="QuotaExceededError"||e.code===22||String(e).includes("quota"))){
      try{
        const apiKey=localStorage.getItem("apiKey");
        localStorage.clear();
        if(apiKey) localStorage.setItem("apiKey",apiKey);
        localStorage.setItem(k,JSON.stringify(v));
        console.log("LS: ניקוי אוטומטי הצליח, נשמר מחדש:",k);
        return true;
      }catch(e2){
        console.warn("LS: גם ניקוי אוטומטי נכשל; מסתמכים על Firebase בלבד",e2);
      }
    } else {
      console.warn("LS save failed",e);
    }
    return false;
  }
}
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }

// ── הורדת קבצים (markdown/טקסט/Word/PDF) ────────────────────────────────
function downloadTextFile(filename,content,mimeType){
  try{
    const type=mimeType||"text/markdown;charset=utf-8";
    const blob=new Blob(["﻿"+content],{type}); // BOM לתמיכה בעברית ב-Word
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=filename; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },100);
    return true;
  }catch(e){ alert("שגיאה בהורדה: "+(e.message||e)); return false; }
}

// המרה פשוטה של ה-markdown שלנו ל-HTML (כותרות, הדגשות, רשימות)
function mdToSimpleHtml(md){
  // חילוץ בלוקים לפי שורה ריקה כפולה
  let html=md
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  // headers
  html=html.replace(/^### (.+)$/gm,"<h3>$1</h3>");
  html=html.replace(/^## (.+)$/gm,"<h2>$1</h2>");
  html=html.replace(/^# (.+)$/gm,"<h1>$1</h1>");
  // bold + italic
  html=html.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  html=html.replace(/(^|\s)_([^_\n]+?)_(\s|[.,;:]|$)/g,"$1<em>$2</em>$3");
  // horizontal rule
  html=html.replace(/^---$/gm,"<hr/>");
  // list items
  html=html.replace(/^- (.+)$/gm,"<li>$1</li>");
  html=html.replace(/^  - (.+)$/gm,"<li style='margin-right:1.2em;'>$1</li>");
  // group consecutive <li>
  html=html.replace(/(<li[\s\S]*?<\/li>)(\n(?!<li))/g,"$1</ul>$2").replace(/((^|\n)(?!<li))(<li)/g,"$1<ul>$3");
  // paragraphs: wrap non-block lines
  html=html.split(/\n\n+/).map(block=>{
    const trimmed=block.trim();
    if(!trimmed) return "";
    if(trimmed.match(/^<(h\d|ul|hr|li|p)/)) return trimmed;
    return "<p>"+trimmed.replace(/\n/g,"<br/>")+"</p>";
  }).join("\n");
  // תיקון <ul> לא סגורים
  const openUls=(html.match(/<ul>/g)||[]).length;
  const closeUls=(html.match(/<\/ul>/g)||[]).length;
  for(let i=0;i<openUls-closeUls;i++) html+="</ul>";
  return html;
}

function styledHtmlDocument(title,bodyHtml,forPrint){
  const printCss=forPrint?`@page { margin: 1.5cm; } @media print { body { max-width: none; margin: 0; } }`:"";
  return `<!DOCTYPE html>
<html lang="he" dir="rtl" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="UTF-8"/>
<title>${title}</title>
<style>
body { font-family: "David", "Times New Roman", "DejaVu Serif", serif; font-size: 12pt; line-height: 1.65; direction: rtl; max-width: 800px; margin: 2em auto; padding: 0 2em; color: #1a1a1a; }
h1 { font-size: 20pt; color: #1e3a5f; border-bottom: 2px solid #64748b; padding-bottom: 8px; margin-top: 0; }
h2 { font-size: 15pt; color: #065f46; margin-top: 1.5em; margin-bottom: 0.4em; }
h3 { font-size: 13pt; color: #334155; margin-top: 1.2em; margin-bottom: 0.3em; }
p { margin: 0.4em 0; }
strong { font-weight: 700; color: #0f172a; }
em { font-style: italic; color: #475569; }
ul { padding-right: 1.5em; margin: 0.4em 0; }
li { margin: 0.25em 0; }
hr { border: none; border-top: 1px solid #cbd5e1; margin: 1.2em 0; }
${printCss}
</style>
</head>
<body dir="rtl">
${bodyHtml}
</body>
</html>`;
}

// הורדה כקובץ Word (.doc שנפתח ב-Word עם RTL)
function downloadAsWord(markdown,filename){
  const bodyHtml=mdToSimpleHtml(markdown);
  const title=filename.replace(/\.(doc|docx)$/i,"");
  const html=styledHtmlDocument(title,bodyHtml,false);
  downloadTextFile(filename,html,"application/msword");
}

// פתיחת חלון מעוצב להדפסה (המשתמשת בוחרת "שמור כ-PDF" בדיאלוג ההדפסה)
function openPrintableWindow(markdown,title){
  const bodyHtml=mdToSimpleHtml(markdown);
  const htmlDoc=styledHtmlDocument(title,bodyHtml,true);
  const w=window.open("","_blank");
  if(!w){ alert("לא ניתן לפתוח חלון חדש — אפשרי שחסום על ידי הדפדפן. בדקי בסרגל הכלים."); return; }
  w.document.open();
  w.document.write(htmlDoc);
  w.document.close();
  // המתן לטעינה ואז פתח את דיאלוג ההדפסה
  w.onload=()=>{ setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} },400); };
}

// פונקציית עזר אחת לכל הורדות — מחזירה 3 פעולות: md, word, pdf
function downloadAllFormats(markdown,baseName,title){
  return {
    md: ()=>downloadTextFile(baseName+".md",markdown),
    word: ()=>downloadAsWord(markdown,baseName+".doc"),
    pdf: ()=>openPrintableWindow(markdown,title||baseName)
  };
}

// פורמט תאריך לשם קובץ: YYYY-MM-DD
function todayStamp(){
  const d=new Date(); const p=(n)=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

// המר אובייקט סינתזה (פאזה 3) ל-Markdown
function synthesisToMarkdown(syn,meta){
  const {character,concept,dimLabel,conceptDef}=meta||{};
  const who=character==="solomon"?"שלמה":"דוד";
  const lines=[];
  lines.push(`# סינתזה: ${concept} · ${who}`);
  lines.push("");
  if(dimLabel) lines.push(`**ממד:** ${dimLabel}`);
  lines.push(`**הופק:** ${syn.generatedAt?syn.generatedAt.slice(0,16).replace("T"," "):todayStamp()}`);
  if(syn.promptVersion) lines.push(`**גרסת פרומפט:** ${syn.promptVersion}`);
  if(syn.totalUnits) lines.push(`**יחידות שסוכמו:** ${syn.totalUnits}`);
  if(syn.batchCount) lines.push(`**קבוצות:** ${syn.batchCount} × ${syn.batchSize||"?"} יחידות`);
  if(syn.usage) lines.push(`**שימוש:** קלט ${syn.usage.input_tokens||0} tok · פלט ${syn.usage.output_tokens||0} tok · עלות $${(syn.costUsd||0).toFixed(4)}`);
  lines.push("");

  if(conceptDef&&conceptDef.text){
    lines.push("## ההגדרה (פרק ב׳)");
    lines.push("");
    lines.push(conceptDef.text);
    lines.push("");
  }
  if(conceptDef&&conceptDef.clarification&&conceptDef.clarification.text){
    lines.push("## הבהרת היישום");
    lines.push("");
    lines.push(conceptDef.clarification.text);
    lines.push("");
  }

  lines.push("---");
  lines.push("");
  lines.push("## 1. מסקנה מרכזית");
  lines.push("");
  lines.push(syn.centralConclusion||"(חסר)");
  lines.push("");

  if(Array.isArray(syn.subClaims)&&syn.subClaims.length){
    lines.push("## 2. טענות משנה");
    lines.push("");
    syn.subClaims.forEach((sc,si)=>{
      const fbLabel={explicit:"שדה גלוי",implicit:"שדה נרמז",both:"שני השדות"}[sc.fieldBasis]||sc.fieldBasis||"";
      lines.push(`### ${si+1}. ${sc.claim||"(ללא ניסוח)"}`);
      lines.push("");
      if(fbLabel) lines.push(`**בסיס ראיות:** ${fbLabel}`);
      lines.push("");
      if(sc.explicitEvidence){ lines.push(`**ראיות מהשדה הגלוי:** ${sc.explicitEvidence}`); lines.push(""); }
      if(sc.implicitEvidence){ lines.push(`**ראיות מהשדה הנרמז:** ${sc.implicitEvidence}`); lines.push(""); }
      if(Array.isArray(sc.supportingUnits)&&sc.supportingUnits.length){
        lines.push("**יחידות תומכות:**");
        sc.supportingUnits.forEach(su=>{
          const q=su.quote?` — \"${su.quote}\"`:"";
          lines.push(`- **${su.unitName||"?"}** (${su.chapter||"?"})${q}`);
        });
        lines.push("");
      }
      if(Array.isArray(sc.commentary)&&sc.commentary.length){
        lines.push("**פרשנות תומכת:**");
        sc.commentary.forEach(cm=>{
          const w=cm.work?`, ${cm.work}`:"";
          const p=cm.page?`, עמ' ${cm.page}`:"";
          const q=cm.quote?` — \"${cm.quote}\"`:"";
          lines.push(`- **${cm.author||"?"}**${w}${p}${q}`);
        });
        lines.push("");
      }
      if(sc.differences){ lines.push(`**הבדלים בין יחידות:** ${sc.differences}`); lines.push(""); }
    });
  }

  if(syn.comparativeContribution){
    lines.push("## 3. תרומת ההשוואה למקבילה");
    lines.push("");
    const cc=syn.comparativeContribution;
    const sect=(label,data)=>{
      if(!data) return;
      lines.push(`### ${label}`);
      if(typeof data==="string"){ lines.push(data); lines.push(""); return; }
      if(data.explicit){ lines.push(`**שדה גלוי:** ${data.explicit}`); lines.push(""); }
      if(data.implicit){ lines.push(`**שדה נרמז:** ${data.implicit}`); lines.push(""); }
    };
    sect("נשמר",cc.preserved);
    sect("השתנה",cc.changes);
    sect("סונדרגוט",cc.sondergut);
  }

  // המרת מערך של uid/יחידה למחרוזת, גם כשה-items הם אובייקטים
  const unitsToStr=(arr)=>{
    if(!Array.isArray(arr)||!arr.length) return "";
    return arr.map(x=>{
      if(typeof x==="string") return x;
      if(x&&typeof x==="object") return x.uid||x.unitName||x.chapter||JSON.stringify(x).replace(/[{}"]/g,"");
      return String(x);
    }).join(", ");
  };

  // רשימת שינויים טקסטואליים — הטבלה המכרעת לתזה
  if(Array.isArray(syn.textualChanges)&&syn.textualChanges.length){
    lines.push("## 4. שינויים טקסטואליים של הכרוניסט ביחס למקבילה");
    lines.push("");
    lines.push(`סה"כ שינויים זוהו: ${syn.textualChanges.length}`);
    lines.push("");
    syn.textualChanges.forEach((tc,ti)=>{
      const ctype={addition:"➕ תוספת",omission:"➖ השמטה",substitution:"⇄ החלפה",restructuring:"⟲ שינוי מבני",sondergut:"★ סונדרגוט"}[tc.changeType]||tc.changeType||"שינוי";
      const field={explicit:"שדה גלוי",implicit:"שדה נרמז",both:"שני השדות"}[tc.field]||tc.field||"";
      lines.push(`### ${ti+1}. ${tc.unitName||"?"} (${tc.chapter||"?"}) — ${ctype}`);
      lines.push("");
      if(field) lines.push(`**שדה:** ${field}  `);
      if(tc.parallelCitation) lines.push(`**במקבילה:** "${tc.parallelCitation}"  `);
      if(tc.chroniclesCitation) lines.push(`**בדה״י:** "${tc.chroniclesCitation}"  `);
      if(tc.significance){ lines.push(""); lines.push(`**משמעות:** ${tc.significance}`); }
      if(Array.isArray(tc.supportsSubClaims)&&tc.supportsSubClaims.length) lines.push(`_(תומך בטענות: ${tc.supportsSubClaims.join(", ")})_`);
      lines.push("");
    });
  }

  if(Array.isArray(syn.qualifications)&&syn.qualifications.length){
    lines.push("## 5. סייגים, ראיות נגד וחוסרים");
    lines.push("");
    syn.qualifications.forEach((q,qi)=>{
      const lb={sayag:"סייג","counter-evidence":"ראיית נגד",gap:"חוסר"}[q.type]||q.type||"";
      const auStr=unitsToStr(q.affectedUnits);
      const au=auStr?` _(יחידות: ${auStr})_`:"";
      lines.push(`- **[${lb}]** ${q.text||""}${au}`);
    });
    lines.push("");
  }

  if(Array.isArray(syn.flaggedIssues)&&syn.flaggedIssues.length){
    lines.push("## 6. בעיות נקודתיות (לבדיקתך)");
    lines.push("");
    syn.flaggedIssues.forEach(fi=>{
      lines.push(`- **${fi.unitName||"?"}** _(${fi.severity||"?"})_: ${fi.issue||""}`);
    });
    lines.push("");
  }

  if(syn.suggestedOrder){
    lines.push("## 7. סדר מוצע לכתיבת הדיון");
    lines.push("");
    lines.push(syn.suggestedOrder);
    lines.push("");
  }

  return lines.join("\n");
}

function stage3ToMarkdown(detailedConclusions,meta){
  const {character,concept,dimLabel}=meta||{};

  lines.push(`**הופק:** ${todayStamp()}  `);

  lines.push(`**יחידות עם מסקנה:** ${detailedConclusions.filter(c=>c.hasConclusion).length}`);
  lines.push("");
  lines.push("---");
  lines.push("");
  detailedConclusions.forEach((ud,i)=>{

// ── Firebase ─────────────────────────────────────────────────────────────
// הכלי האנליטי שומר ב-"research2" (sharded + lz-string). הסינתזה קוראת משם ל-raw,
// ושומרת את תוצאות השלבים ב-"synthesis_v1" הנפרד (בלי להתנגש עם האנליטי).
const FB_RESEARCH_PATH = "research2";
const FB_SYNTH_PATH    = "synthesis_v1";
const PER_UNIT_KEYS = ["analysis","analysis_chronicles","analysis_source","unitSummary","compareNotes","compareFactual","commentary"];

function __packJson(data){ const s=JSON.stringify(data); try{ return (window.LZString)?("z:"+LZString.compressToBase64(s)):s; }catch(e){ return s; } }
function __unpackJson(str){ if(str==null) return null; try{ if(typeof str==="string" && str.slice(0,2)==="z:" && window.LZString){ const d=LZString.decompressFromBase64(str.slice(2)); if(d) return JSON.parse(d); } }catch(e){} try{ return JSON.parse(str); }catch{ return null; } }
function __unshard(sh){ if(!sh) return null; const data=__unpackJson(sh.meta)||{}; for(const k of PER_UNIT_KEYS){ if(data[k]===undefined) data[k]={}; } const u=sh.u||{}; for(const uid of Object.keys(u)){ const slice=__unpackJson(u[uid])||{}; for(const k of PER_UNIT_KEYS){ if(slice[k]!==undefined) data[k][uid]=slice[k]; } } return data; }

// טעינת המחקר (raw) מהכלי האנליטי. מחזיר null אם אין נתונים או שגיאה.
function fbLoadResearch(cb){
  db.ref(FB_RESEARCH_PATH).once("value").then(snap=>{
    const sh=snap.val();
    if(sh && (sh.meta || (sh.u && Object.keys(sh.u||{}).length))){ cb(__unshard(sh)); return; }
    cb(null);
  }).catch(e=>{ console.error("fbLoadResearch",e); cb(null); });
}

// טעינת תוצאות הסינתזה
function fbLoadStageResults(cb){
  db.ref(FB_SYNTH_PATH+"/stageResults").once("value").then(snap=>{
    const v=snap.val();
    if(!v){ cb({}); return; }
    const parsed=__unpackJson(v); cb(parsed||{});
  }).catch(e=>{ console.error("fbLoadStageResults",e); cb({}); });
}

// שמירה דחויה (debounced) כדי לא להציף את Firebase
let _synthSaveTimer=null, _synthSavePending=null;
function fbSaveStageResults(stageResults){
  _synthSavePending=stageResults;
  if(_synthSaveTimer) clearTimeout(_synthSaveTimer);
  _synthSaveTimer=setTimeout(()=>{
    const payload=__packJson(_synthSavePending);
    db.ref(FB_SYNTH_PATH+"/stageResults").set(payload).catch(e=>console.error("fbSaveStageResults",e));
    _synthSavePending=null; _synthSaveTimer=null;
  },800);
}

// ─ שלב 4 (חדש) — הגדרת מושג משותפת לשני המלכים ─
// נתיב: synthesis_v1/conceptDefinitions/{concept}
function _fbConceptDefPath(concept){
  const safe=String(concept).replace(/[.#$[\]/]/g,"_");
  return `${FB_SYNTH_PATH}/conceptDefinitions/${safe}`;
}
function fbSaveConceptDefinition(concept,data){
  return db.ref(_fbConceptDefPath(concept)).set(__packJson(data));
}
function fbLoadConceptDefinition(concept,cb){
  db.ref(_fbConceptDefPath(concept)).once("value").then(snap=>{
    const v=snap.val();
    cb(v?__unpackJson(v):null);
  }).catch(e=>{ console.error("fbLoadConceptDefinition",concept,e); cb(null); });
}

// ─ חישוב עלות משוערת לפי טוקנים (Claude Sonnet 4.5 pricing נכון ל-2026-10) ─
// $3/MTok input, $15/MTok output
function _estimateCostUsd(usage){
  if(!usage) return 0;
  const inTok=usage.input_tokens||0;
  const outTok=usage.output_tokens||0;
  return (inTok*3/1e6)+(outTok*15/1e6);
}

// ─ Stage 4 (ד') — Firebase helpers ─
// נתיב: synthesis_v1/stage4/{character__dim}/perUnit/{unitId}/{ai_proposal|user_approved}
function _stage4UnitPath(characterDimKey,unitId,section){
  // סניטיזציה — Firebase לא מקבל . # $ [ ] /
  const safe=String(unitId).replace(/[.#$[\]/]/g,"_");
  return `${FB_SYNTH_PATH}/stage4/${characterDimKey}/perUnit/${safe}/${section||"ai_proposal"}`;
}
function fbSaveStage4Unit(characterDimKey,unitId,section,data){
  const path=_stage4UnitPath(characterDimKey,unitId,section);
  const payload=__packJson(data);
  return db.ref(path).set(payload);
}
function fbLoadStage4Unit(characterDimKey,unitId,section,cb){
  const path=_stage4UnitPath(characterDimKey,unitId,section);
  db.ref(path).once("value").then(snap=>{
    const v=snap.val();
    if(!v){ cb(null); return; }
    cb(__unpackJson(v));
  }).catch(e=>{ console.error("fbLoadStage4Unit",path,e); cb(null); });
}
function fbLoadStage4Dim(characterDimKey,cb){
  // טוען את כל יחידות הממד בבת אחת
  db.ref(`${FB_SYNTH_PATH}/stage4/${characterDimKey}/perUnit`).once("value").then(snap=>{
    const v=snap.val()||{};
    const out={}; // {unitId: {ai_proposal, user_approved}}
    Object.keys(v).forEach(uid=>{
      const sections=v[uid]||{};
      out[uid]={};
      Object.keys(sections).forEach(sec=>{
        try{ out[uid][sec]=__unpackJson(sections[sec]); }catch(e){ out[uid][sec]=null; }
      });
    });
    cb(out);
  }).catch(e=>{ console.error("fbLoadStage4Dim",characterDimKey,e); cb({}); });
}

function parseCh(u){
  try{ const p=String(u.chapter||"").split("_"); return [parseInt(p[0]||"999",10),parseInt(p[1]||"999",10)]; }
  catch{ return [999,999]; }
}

// ─ קריאה ישירה ל-Anthropic — מודול level (זמין לכל רכיב) ─
async function aiCallDirect_module(apiKey,prompt,maxTokens){
  if(!apiKey) throw new Error("חסר מפתח API. הזן אותו דרך סמל ה-🔑 בסרגל העליון.");
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key":apiKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify({
      model:"claude-sonnet-4-5-20250929",
      max_tokens:maxTokens,
      messages:[{role:"user",content:prompt}]
    })
  });
  if(!res.ok){
    let errMsg=`שגיאת API (${res.status})`;
    try{const d=await res.json(); if(d.error&&d.error.message) errMsg+=`: ${d.error.message}`;}catch{}
    throw new Error(errMsg);
  }
  const data=await res.json();
  if(!data.content||!data.content.length) throw new Error("תשובה ריקה מ-API");
  if(data.stop_reason==="max_tokens"){
    console.warn("aiCallDirect: תשובה נקטעה במגבלת max_tokens");
    throw new Error(`התשובה נקטעה במגבלת ${maxTokens} טוקנים (stop_reason=max_tokens). נסי שוב — המערכת תמשיך מהקבוצה הזאת, או דווחי לי להעלות את המגבלה.`);
  }
  return data.content.map(b=>b.text||"").join("");
}

function parseJSON_module(text){
  const clean=String(text||"").replace(/```json|```/g,"").trim();
  try{ return JSON.parse(clean); }
  catch(e){
    const first=clean.indexOf("{"); const last=clean.lastIndexOf("}");
    if(first>=0&&last>first){
      try{ return JSON.parse(clean.substring(first,last+1)); }catch{}
    }
    throw new Error("התשובה אינה בפורמט JSON תקין: "+clean.substring(0,120));
  }
}

function validParams(params){ return (params||[]).filter(p=>p&&(typeof p==="object"?p.q:p).toString().trim()); }

function dim4concept(name,raw){
  const d=DIMS.find(d=>d.concepts.includes(name));
  if(d) return d;
  const cc=(raw&&raw.customConcepts||[]).find(c=>c.name===name);
  if(cc){ const dd=DIMS.find(x=>x.id===cc.dimId); if(dd) return dd; }
  return null;
}

function allConceptsFrom(raw){
  const r=[]; const seen=new Set();
  DIMS.forEach(d=>d.concepts.forEach(n=>{ r.push({name:n,dimId:d.id}); seen.add(n); }));
  ((raw&&raw.customConcepts)||[]).forEach(c=>{ if(!seen.has(c.name)){ r.push({name:c.name,dimId:c.dimId}); seen.add(c.name); } });
  return r;
}

function getParams(name,raw){
  // מושג מובנה
  const c=raw&&raw.concepts&&raw.concepts[name];
  if(c&&Array.isArray(c.params)&&c.params.length) return c.params;
  // מושג מותאם אישית
  const cc=(raw&&raw.customConcepts||[]).find(x=>x.name===name);
  if(cc&&Array.isArray(cc.params)) return cc.params;
  return [];
}

function getSemantic(name,raw){
  const custom=(raw&&raw.customSemantic&&raw.customSemantic[name])||null;
  if(custom) return custom;
  const inRaw=(raw&&raw.concepts&&raw.concepts[name]&&raw.concepts[name].sem)||null;
  if(inRaw) return inRaw;
  return SEMANTIC_FALLBACK[name]||null;
}

function getEntry(uid,cname,mode,raw){
  const store=mode==="source"?"analysis_source":"analysis_chronicles";
  return (raw&&raw[store]&&raw[store][String(uid)]&&raw[store][String(uid)][cname])||null;

function ConceptSelector({raw,onPick,onPickDimension,onBackHome,stageResults}){

  const dimLabel=dimId?(DIMS.find(d=>d.id===dimId)||{}).label||"":"";

  function getConceptStats(name){
    const results=stageResults||{};
    const key=`${character}__${dimId}__${name}`;
    const r=results[key];
    if(!r||!r.approvedStages) return 0;
    return r.approvedStages.length;
  }
  // מספר מושגים שהשלימו שלבים 1-3 (לפחות — יותר זה בסדר)
  function dimReadyForStage4(){
    if(!character||!dimId) return {ready:0,total:0,allReady:false};
    const total=concepts.length;
    const ready=concepts.filter(c=>{
      const key=`${character}__${dimId}__${c}`;
      const r=(stageResults||{})[key];
      if(!r||!r.approvedStages) return false;
      return r.approvedStages.includes(1)&&r.approvedStages.includes(2)&&r.approvedStages.includes(3);
    }).length;
    return {ready,total,allReady:total>0&&ready===total};
  }
  const dim4Status=dimReadyForStage4();

  return(
    <div style={{maxWidth:"920px",margin:"0 auto",padding:"28px 20px"}}>

      <div style={{marginBottom:"22px"}}>
        <div style={{fontSize:"13px",fontWeight:"700",color:"#94a3b8",marginBottom:"10px"}}>1. דמות</div>
        <div style={{display:"flex",gap:"12px"}}>
          {[["david","דוד המלך",'דה"א י"א–כ"ט'],["solomon","שלמה המלך",'דה"ב א׳–ט׳']].map(([id,name,ref])=>{
            const sel=character===id;
            return(
              <button key={id} onClick={()=>{setCharacter(id);setDimId(null);setConcept(null);}}
                style={{flex:1,padding:"16px 20px",borderRadius:"12px",border:sel?"2px solid #818cf8":"1px solid #334155",cursor:"pointer",background:sel?"#818cf822":"#1e293b",color:sel?"#c7d2fe":"#f1f5f9",fontSize:"15px",fontWeight:"700",textAlign:"right"}}>
                👑 {name}
                <div style={{fontSize:"11px",color:"#64748b",marginTop:"4px",fontWeight:"400"}}>{ref}</div>
              </button>
            );
          })}
        </div>
      </div>

      {/* ממד */}
      {character&&(
        <div style={{marginBottom:"22px"}}>
          <div style={{fontSize:"13px",fontWeight:"700",color:"#94a3b8",marginBottom:"10px"}}>2. ממד נבואי</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"}}>
            {dimsForUI.map(d=>{
              const sel=dimId===d.id;
              return(

                  style={{padding:"13px 15px",borderRadius:"10px",border:sel?`2px solid ${d.color}`:"1px solid #334155",cursor:"pointer",background:sel?`${d.color}22`:"#1e293b",color:sel?d.color:"#f1f5f9",fontSize:"14px",fontWeight:"700",textAlign:"right"}}>

                  style={{padding:"9px 14px",borderRadius:"8px",border:sel?"2px solid #818cf8":"1px solid #334155",cursor:"pointer",background:sel?"#818cf822":"#1e293b",color:sel?"#c7d2fe":"#cbd5e1",fontSize:"13px",fontWeight:"600",display:"flex",alignItems:"center",gap:"7px"}}>

// ── פאנל סקירת יחידה (Screen 1 של ד"ר עמר) ─────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
function UnitReviewPanel({unit,findings,aiProposal,userApproved,previousApproved,characterDimKey,onBack,onSaveApproved,onReopen,dimColor,dimLabel,character}){
  const [drillDown,setDrillDown]=useState(null); // {finding, phenomenonTitle, aspect}
  const [savingApproval,setSavingApproval]=useState(false);

  // מצב התצוגה: user_approved אם קיים (גם אם לא אושר עדיין — זה המצב הערוך), אחרת ai_proposal
  const activeData=userApproved||aiProposal||{phenomena:[],needsReview:[]};
  const isApproved=!!(userApproved&&userApproved.approvedAt);
  const hasEdits=!!(userApproved&&!userApproved.approvedAt);

  // ─ Editing state ─
  const [editingIdx,setEditingIdx]=useState(null); // index של תופעה בעריכה
  const [draft,setDraft]=useState(null); // טיוטה של התופעה הנערכת
  const [savingEdit,setSavingEdit]=useState(false);
  const [splitDialog,setSplitDialog]=useState(null); // {phenomenonIdx}
  const [mergeDialog,setMergeDialog]=useState(null); // {phenomenonIdx}
  const [reviewPromptIdx,setReviewPromptIdx]=useState(null); // אם מבקשים הערה בעת סימון "דורש בדיקה"

  // רשימות ל-dropdowns
  const ACTORS=["דוד","שלמה","דמות אחרת","קבוצה","לא רלוונטי","לא ברור"];
  const PRESENTATIONS=["דיבור ישיר של המלך","תיאור המספר","דברי דמות אחרת","בחירה ספרותית","משולב"];
  const MEANS=["פעולה","אמירה","תיאור","מבנה ספרותי","בחירה לשונית","משולב"];

  // כלי עזר לבניית נתון לשמירה
  function buildToSave(newPhenomena,newNeedsReview,historyEntry){
    return {
      ...activeData,
      phenomena:newPhenomena||activeData.phenomena,
      needsReview:newNeedsReview||activeData.needsReview,
      editHistory:[...(activeData.editHistory||[]),historyEntry],
      approvedAt:null, // כל עריכה מורידה את האישור
      approvedBy:"user",
      basedOnProposal:aiProposal?aiProposal.runAt:null,
      lastEditedAt:new Date().toISOString()
    };
  }

  // ───────── עריכת תופעה ─────────
  function startEdit(i){
    const p=activeData.phenomena[i]||{};
    setDraft({
      title:p.title||"",
      description:p.description||"",
      actor:p.actor||"",
      presentation:p.presentation||"",
      designMeans:p.designMeans||"",
      analyticalClaim:p.analyticalClaim||"",
      justification:p.justification||"",
      researcherNote:p.researcherNote||""
    });
    setEditingIdx(i);
  }
  function cancelEdit(){ setDraft(null); setEditingIdx(null); }
  async function saveEdit(){
    if(editingIdx==null) return;
    setSavingEdit(true);
    const newPhenomena=[...activeData.phenomena];
    const prev=newPhenomena[editingIdx]||{};
    const changes=Object.keys(draft).filter(k=>draft[k]!==(prev[k]||""));
    newPhenomena[editingIdx]={...prev,...draft};
    const entry={at:new Date().toISOString(),type:"edit_phenomenon",phenomenonIndex:editingIdx,phenomenonTitle:newPhenomena[editingIdx].title,fieldsChanged:changes};
    await onSaveApproved(buildToSave(newPhenomena,null,entry));
    setSavingEdit(false); setDraft(null); setEditingIdx(null);
  }

  // ───────── דורש בדיקה ─────────
  async function toggleNeedsReview(i,note){
    const newPhenomena=[...activeData.phenomena];
    const was=!!newPhenomena[i].needsReview;
    newPhenomena[i]={...newPhenomena[i],needsReview:!was,reviewNote:!was?(note||""):""};
    const entry={at:new Date().toISOString(),type:was?"unmark_review":"mark_review",phenomenonIndex:i,phenomenonTitle:newPhenomena[i].title,note:note||""};
    await onSaveApproved(buildToSave(newPhenomena,null,entry));
  }

  // ───────── פיצול ─────────
  async function performSplit(i,plan){
    // plan = {evidenceDispositions: [{sourceId, action: "stay"|"move"|"copy", newAspect?}], newPhen: {title, description, actor, presentation, designMeans, justification}}
    const newPhenomena=[...activeData.phenomena];
    const original={...newPhenomena[i]};
    const origEvidence=Array.isArray(original.textualEvidence)?[...original.textualEvidence]:[];
    const origSids=Array.isArray(original.assignedSourceIds)?[...original.assignedSourceIds]:[];
    const stayEvidence=[],stayAssigned=new Set();
    const newEvidence=[],newAssigned=new Set();
    plan.evidenceDispositions.forEach(d=>{
      const ev=origEvidence.find(e=>e.sourceId===d.sourceId);
      if(!ev) return;
      if(d.action==="stay"){ stayEvidence.push(ev); stayAssigned.add(d.sourceId); }
      else if(d.action==="move"){ newEvidence.push({...ev,aspect:d.newAspect||ev.aspect}); newAssigned.add(d.sourceId); }
      else if(d.action==="copy"){
        stayEvidence.push(ev); stayAssigned.add(d.sourceId);
        newEvidence.push({...ev,aspect:d.newAspect||ev.aspect}); newAssigned.add(d.sourceId);
      }
    });
    newPhenomena[i]={...original,textualEvidence:stayEvidence,assignedSourceIds:[...stayAssigned]};
    const newPhen={
      title:plan.newPhen.title,description:plan.newPhen.description||"",
      actor:plan.newPhen.actor||original.actor||"",presentation:plan.newPhen.presentation||original.presentation||"",
      designMeans:plan.newPhen.designMeans||original.designMeans||"",
      analyticalClaim:"",justification:plan.newPhen.justification||`פוצל מתופעה "${original.title}" (${new Date().toLocaleDateString("he-IL")})`,
      textualEvidence:newEvidence,assignedSourceIds:[...newAssigned]
    };
    newPhenomena.push(newPhen);
    const entry={at:new Date().toISOString(),type:"split",fromPhenomenonIndex:i,fromTitle:original.title,toTitle:newPhen.title,
      sidsMoved:[...newAssigned].filter(s=>!stayAssigned.has(s)),sidsCopied:[...newAssigned].filter(s=>stayAssigned.has(s))};
    await onSaveApproved(buildToSave(newPhenomena,null,entry));
  }

  // ───────── איחוד ─────────
  async function performMerge(fromIdx,toIdx,mergedTitleDesc){
    // mergedTitleDesc = {title, description, actor?, presentation?, designMeans?, analyticalClaim?, justification?, researcherNote?}
    const newPhenomena=[...activeData.phenomena];
    const a=newPhenomena[fromIdx]||{}, b=newPhenomena[toIdx]||{};
    const combinedEvidence=[...(a.textualEvidence||[]),...(b.textualEvidence||[])];
    const combinedSids=[...new Set([...(a.assignedSourceIds||[]),...(b.assignedSourceIds||[])])];
    const merged={
      title:mergedTitleDesc.title,description:mergedTitleDesc.description||"",
      actor:mergedTitleDesc.actor||a.actor||b.actor||"",
      presentation:mergedTitleDesc.presentation||a.presentation||b.presentation||"",
      designMeans:mergedTitleDesc.designMeans||a.designMeans||b.designMeans||"",
      analyticalClaim:mergedTitleDesc.analyticalClaim||"",
      justification:mergedTitleDesc.justification||`אוחדו שתי תופעות: "${a.title}" + "${b.title}" (${new Date().toLocaleDateString("he-IL")})`,
      researcherNote:mergedTitleDesc.researcherNote||a.researcherNote||b.researcherNote||"",
      textualEvidence:combinedEvidence,assignedSourceIds:combinedSids
    };
    // מסירים את שתי המקוריות ומוסיפים את המאוחדת
    const filtered=newPhenomena.filter((_,i)=>i!==fromIdx&&i!==toIdx);
    filtered.push(merged);
    const entry={at:new Date().toISOString(),type:"merge",fromTitles:[a.title,b.title],toTitle:merged.title,sidsCombined:combinedSids};
    await onSaveApproved(buildToSave(filtered,null,entry));
  }
  const unitName=unit.name||unit.label||unit.id;
  const chapter=unit.chapter||"?";
  const uniqueConcepts=[...new Set(findings.map(f=>f.concept))];

  // אינדקס findings לפי sid לדריל-דאון מהיר
  const findingBySid=useMemo(()=>{
    const m={}; findings.forEach(f=>{m[f.sid]=f;}); return m;
  },[findings]);

  // בקרת כיסוי דטרמיניסטית (קוד, לא AI) — לפי מזהי מקור ייחודיים
  const coverage=useMemo(()=>{
    const inputSids=[...new Set(findings.map(f=>f.sid))]; // ייחודיים
    const inputSet=new Set(inputSids);
    const assignmentCount={}; // sid -> כמה תופעות מכילות אותו
    const phenomenaBySid={}; // sid -> [{phenomenonIdx, title}]
    const emptyPhen=[];
    (activeData.phenomena||[]).forEach((p,i)=>{
      const sids=[...new Set(p.assignedSourceIds||[])];
      if(!sids.length) emptyPhen.push(i);
      sids.forEach(s=>{
        assignmentCount[s]=(assignmentCount[s]||0)+1;
        if(!phenomenaBySid[s]) phenomenaBySid[s]=[];
        phenomenaBySid[s].push({phenomenonIdx:i,title:p.title||`תופעה ${i+1}`});
      });
    });
    const needsReviewMap={}; // sid -> reason
    (activeData.needsReview||[]).forEach(r=>{ if(r.sourceId) needsReviewMap[r.sourceId]=r.reason||""; });
    const needsReviewSids=new Set(Object.keys(needsReviewMap));
    const assignedValid=Object.keys(assignmentCount).filter(s=>inputSet.has(s));
    const needsReviewValid=[...needsReviewSids].filter(s=>inputSet.has(s));
    const untreated=inputSids.filter(s=>!assignmentCount[s]&&!needsReviewSids.has(s));
    const invalidIds=[...new Set([...Object.keys(assignmentCount),...needsReviewSids])].filter(s=>!inputSet.has(s));
    const duplicates=Object.entries(assignmentCount).filter(([s,c])=>c>1&&inputSet.has(s)).map(([s,c])=>({sourceId:s,count:c,phenomena:phenomenaBySid[s]}));
    const canApprove=untreated.length===0&&invalidIds.length===0&&emptyPhen.length===0;
    return {
      inputCount:inputSids.length,
      assignedCount:assignedValid.length,
      needsReviewCount:needsReviewValid.length,
      untreated,
      invalidIds,
      duplicates,
      emptyPhen,
      canApprove,
      needsReviewMap
    };
  },[activeData,findings]);

  function openDrill(sid,phenTitle,aspect){
    const f=findingBySid[sid]; if(!f) return;
    setDrillDown({finding:f,phenomenonTitle:phenTitle,aspect});
  }

  // ────── טיפול בממצאים לא מטופלים ──────
  async function assignUntreatedToPhenomenon(sid,phenomenonIdx,aspect){
    const f=findingBySid[sid]; if(!f) return;
    const newPhenomena=[...activeData.phenomena];
    const p={...newPhenomena[phenomenonIdx]};
    const assigned=[...new Set([...(p.assignedSourceIds||[]),sid])];
    const evidence=Array.isArray(p.textualEvidence)?[...p.textualEvidence]:[];
    if(!evidence.find(e=>e.sourceId===sid)){
      evidence.push({sourceId:sid,reference:f.chapter||"",evidence:f.basis||"",aspect:aspect||f.concept});
    }
    newPhenomena[phenomenonIdx]={...p,assignedSourceIds:assigned,textualEvidence:evidence};
    const entry={at:new Date().toISOString(),type:"assign_untreated",sourceId:sid,sourceLabel:f.label,toPhenomenonIdx:phenomenonIdx,aspect};
    await onSaveApproved(buildToSave(newPhenomena,null,entry));
  }
  async function markUntreatedAsNeedsReview(sid,reason){
    const f=findingBySid[sid]; if(!f) return;
    const newNeedsReview=[...(activeData.needsReview||[]),{sourceId:sid,reason:reason||"סומן ידנית ע״י חוקרת"}];
    const entry={at:new Date().toISOString(),type:"mark_untreated_review",sourceId:sid,sourceLabel:f.label,reason};
    await onSaveApproved(buildToSave(activeData.phenomena,newNeedsReview,entry));
  }
  async function createPhenomenonFromUntreated(sid,title){
    const f=findingBySid[sid]; if(!f) return;
    const newPhen={
      title:title||`תופעה חדשה (${f.concept})`,
      description:f.basis||"",actor:"",presentation:"",designMeans:"",analyticalClaim:"",
      justification:`נוצרה ידנית מממצא לא מטופל: ${f.label} (${new Date().toLocaleDateString("he-IL")})`,
      textualEvidence:[{sourceId:sid,reference:f.chapter||"",evidence:f.basis||"",aspect:f.concept}],
      assignedSourceIds:[sid]
    };
    const newPhenomena=[...activeData.phenomena,newPhen];
    const entry={at:new Date().toISOString(),type:"new_phen_from_untreated",sourceId:sid,sourceLabel:f.label,title:newPhen.title};
    await onSaveApproved(buildToSave(newPhenomena,null,entry));
  }

  async function approveUnit(){
    if(!coverage.canApprove){ alert(`לא ניתן לאשר. יש לפתור את הבעיות הבאות:\n${coverage.untreated.length?`• ${coverage.untreated.length} ממצאים ללא טיפול\n`:""}${coverage.invalidIds.length?`• ${coverage.invalidIds.length} מזהים לא תקינים\n`:""}${coverage.emptyPhen.length?`• ${coverage.emptyPhen.length} תופעות ריקות`:""}`); return; }
    setSavingApproval(true);
    const approvedData={
      ...activeData,
      approvedAt:new Date().toISOString(),
      approvedBy:"user",
      basedOnProposal:aiProposal?aiProposal.runAt:null,
      editHistory:[...(activeData.editHistory||[]),{at:new Date().toISOString(),type:"approve",description:"אושרה ללא שינויים"}]
    };
    await onSaveApproved(approvedData);
    setSavingApproval(false);
  }

  async function reopenUnit(){
    if(!confirm("לפתוח מחדש את היחידה לעריכה? הגרסה הנוכחית תישמר ב-previous_approved.")) return;
    setSavingApproval(true);
    await onReopen();
    setSavingApproval(false);
  }

  return (
    <div style={{maxWidth:"1100px",margin:"0 auto",padding:"20px 16px"}}>
      {/* כותרת */}
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:"16px",flexWrap:"wrap",gap:"12px"}}>
        <div>
          <div style={{fontSize:"18px",fontWeight:"bold",color:"#f1f5f9",marginBottom:"4px"}}>📍 {unitName} <span style={{color:dimColor}}>({chapter})</span></div>
          <div style={{fontSize:"11px",color:"#94a3b8"}}>
            {unit.sourceRef?`מקבילה: ${unit.sourceRef}`:"סונדרגוט (ללא מקבילה)"}
            {" · "}{findings.length} אינדיקטורים מ-{uniqueConcepts.length} מושגים
            {" · "}ממד: <span style={{color:dimColor}}>{dimLabel}</span>
          </div>
          <div style={{marginTop:"8px"}}>
            {isApproved&&<span style={{fontSize:"11px",padding:"3px 10px",borderRadius:"5px",background:"#065f46",color:"#86efac",fontWeight:"700"}}>✓ מאושרת ע״י חוקרת</span>}
            {hasEdits&&<span style={{fontSize:"11px",padding:"3px 10px",borderRadius:"5px",background:"#78350f",color:"#fcd34d",fontWeight:"700"}}>✏ נערכה — ממתינה לאישור מחודש</span>}
            {!isApproved&&!hasEdits&&aiProposal&&aiProposal.validatedByCode&&<span style={{fontSize:"11px",padding:"3px 10px",borderRadius:"5px",background:"#1e3a5f",color:"#93c5fd",fontWeight:"700"}}>🤖 הצעת AI תקינה — ממתינה לאישור</span>}
            {!isApproved&&aiProposal&&!aiProposal.validatedByCode&&<span style={{fontSize:"11px",padding:"3px 10px",borderRadius:"5px",background:"#7f1d1d",color:"#fca5a5",fontWeight:"700"}}>⚠ הצעת AI לא תקינה</span>}
            {!isApproved&&!aiProposal&&<span style={{fontSize:"11px",padding:"3px 10px",borderRadius:"5px",background:"#1e293b",color:"#94a3b8",fontWeight:"700"}}>⏳ טרם רץ</span>}
            {previousApproved&&!isApproved&&<span style={{fontSize:"10px",color:"#f59e0b",marginRight:"8px"}}>· נפתחה מחדש (יש גרסה קודמת שנשמרה)</span>}
          </div>
        </div>
        <button onClick={onBack} style={{padding:"7px 14px",borderRadius:"7px",border:"1px solid #475569",cursor:"pointer",background:"transparent",color:"#94a3b8",fontSize:"12px",fontWeight:"600"}}>↩ חזרה לרשימה</button>
      </div>

      {/* תופעות */}
      {!activeData.phenomena||activeData.phenomena.length===0?(
        <div style={{padding:"24px",background:"#1e293b",borderRadius:"10px",textAlign:"center",color:"#94a3b8",fontSize:"13px"}}>
          אין תופעות ליחידה הזו. הריצי AI מהרשימה.
        </div>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>
          {activeData.phenomena.map((p,i)=>{
            const isEd=editingIdx===i;
            const d=isEd?draft:p;
            const fieldStyle={width:"100%",padding:"6px",background:"#0f172a",border:"1px solid #475569",borderRadius:"4px",color:"#f1f5f9",fontSize:"12px",fontFamily:"inherit",resize:"vertical",direction:"rtl"};
            return(
            <div key={i} style={{padding:"16px 20px",background:"#1e293b",borderRadius:"10px",border:`1px solid ${isEd?dimColor:(p.needsReview?"#f59e0b66":dimColor+"33")}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"8px",flexWrap:"wrap",gap:"8px"}}>
                <div style={{flex:1,minWidth:"300px"}}>
                  {isEd?(
                    <input type="text" value={d.title} onChange={e=>setDraft({...d,title:e.target.value})} placeholder="שם התופעה" style={{...fieldStyle,fontWeight:"700",fontSize:"14px"}}/>
                  ):(
                    <div style={{fontSize:"14px",fontWeight:"700",color:"#f1f5f9",marginBottom:"3px"}}>
                      תופעה {i+1}: {p.title||"(ללא שם)"}
                      {p.needsReview&&<span style={{fontSize:"10px",color:"#f59e0b",marginRight:"8px",padding:"2px 7px",background:"#78350f44",borderRadius:"4px"}}>⚠ דורש בדיקה</span>}
                    </div>
                  )}
                  {isEd?(
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"6px",marginTop:"8px"}}>
                      <div><div style={{fontSize:"10px",color:"#94a3b8",marginBottom:"2px"}}>actor</div>
                        <select value={d.actor} onChange={e=>setDraft({...d,actor:e.target.value})} style={fieldStyle}><option value="">—</option>{ACTORS.map(x=><option key={x} value={x}>{x}</option>)}</select></div>
                      <div><div style={{fontSize:"10px",color:"#94a3b8",marginBottom:"2px"}}>presentation</div>
                        <select value={d.presentation} onChange={e=>setDraft({...d,presentation:e.target.value})} style={fieldStyle}><option value="">—</option>{PRESENTATIONS.map(x=><option key={x} value={x}>{x}</option>)}</select></div>
                      <div><div style={{fontSize:"10px",color:"#94a3b8",marginBottom:"2px"}}>designMeans</div>
                        <select value={d.designMeans} onChange={e=>setDraft({...d,designMeans:e.target.value})} style={fieldStyle}><option value="">—</option>{MEANS.map(x=><option key={x} value={x}>{x}</option>)}</select></div>
                    </div>
                  ):(
                    <div style={{fontSize:"11px",color:"#94a3b8"}}>
                      actor: <span style={{color:"#cbd5e1"}}>{p.actor||"—"}</span>
                      {" · "}presentation: <span style={{color:"#cbd5e1"}}>{p.presentation||"—"}</span>
                      {" · "}means: <span style={{color:"#cbd5e1"}}>{p.designMeans||"—"}</span>
                    </div>
                  )}
                </div>
                <div style={{display:"flex",gap:"4px",flexWrap:"wrap"}}>
                  {isEd?(<>
                    <button onClick={saveEdit} disabled={savingEdit||!d.title.trim()} style={{padding:"5px 12px",borderRadius:"5px",border:"none",cursor:d.title.trim()?"pointer":"not-allowed",background:d.title.trim()?"#34d399":"#334155",color:"white",fontSize:"10px",fontWeight:"700"}}>{savingEdit?"⏳":"💾 שמור"}</button>
                    <button onClick={cancelEdit} disabled={savingEdit} style={{padding:"5px 10px",borderRadius:"5px",border:"1px solid #475569",cursor:"pointer",background:"transparent",color:"#94a3b8",fontSize:"10px"}}>ביטול</button>
                  </>):(<>
                    <button onClick={()=>startEdit(i)} disabled={editingIdx!=null} style={{padding:"4px 10px",borderRadius:"5px",border:"1px solid #475569",cursor:editingIdx!=null?"not-allowed":"pointer",background:"transparent",color:editingIdx!=null?"#475569":"#cbd5e1",fontSize:"10px"}}>✏ ערוך</button>
                    <button onClick={()=>setSplitDialog({phenomenonIdx:i})} disabled={editingIdx!=null||(p.assignedSourceIds||[]).length<2} style={{padding:"4px 10px",borderRadius:"5px",border:"1px solid #475569",cursor:(editingIdx!=null||(p.assignedSourceIds||[]).length<2)?"not-allowed":"pointer",background:"transparent",color:(editingIdx!=null||(p.assignedSourceIds||[]).length<2)?"#475569":"#cbd5e1",fontSize:"10px"}} title={(p.assignedSourceIds||[]).length<2?"פיצול דורש לפחות 2 ראיות":""}>🔀 פצל</button>
                    <button onClick={()=>setMergeDialog({phenomenonIdx:i})} disabled={editingIdx!=null||activeData.phenomena.length<2} style={{padding:"4px 10px",borderRadius:"5px",border:"1px solid #475569",cursor:(editingIdx!=null||activeData.phenomena.length<2)?"not-allowed":"pointer",background:"transparent",color:(editingIdx!=null||activeData.phenomena.length<2)?"#475569":"#cbd5e1",fontSize:"10px"}} title={activeData.phenomena.length<2?"צריך לפחות 2 תופעות":""}>🔗 אחד</button>
                    <button onClick={()=>p.needsReview?toggleNeedsReview(i,""):setReviewPromptIdx(i)} disabled={editingIdx!=null} style={{padding:"4px 10px",borderRadius:"5px",border:`1px solid ${p.needsReview?"#f59e0b":"#475569"}`,cursor:editingIdx!=null?"not-allowed":"pointer",background:p.needsReview?"#78350f44":"transparent",color:p.needsReview?"#fbbf24":"#cbd5e1",fontSize:"10px"}}>{p.needsReview?"✓ בטל סימון":"⚠ דורש בדיקה"}</button>
                  </>)}
                </div>
              </div>

              {isEd?(
                <div style={{marginTop:"10px",display:"flex",flexDirection:"column",gap:"8px"}}>
                  {/* תצוגת הצעת ה-AI המקורית — ייחוס לפי חפיפת sourceIds מרבית */}
                  {(()=>{
                    if(!aiProposal||!Array.isArray(aiProposal.phenomena))return null;
                    const draftSids=new Set(d.assignedSourceIds||[]);
                    let bestMatch=null, bestOverlap=0;
                    aiProposal.phenomena.forEach(ap=>{
                      const apSids=new Set(ap.assignedSourceIds||[]);
                      const overlap=[...draftSids].filter(s=>apSids.has(s)).length;
                      if(overlap>bestOverlap){ bestOverlap=overlap; bestMatch=ap; }
                    });
                    if(!bestMatch||!bestMatch.analyticalClaim)return null;
                    return (
                      <div style={{padding:"10px 12px",background:"#1e3a5f22",borderRadius:"6px",borderRight:"3px solid #60a5fa"}}>
                        <div style={{fontSize:"10px",color:"#60a5fa",fontWeight:"700",marginBottom:"3px"}}>🤖 הצעת ה-AI המקורית (לצפייה בלבד — להשוואה)</div>
                        <div style={{fontSize:"11px",color:"#94a3b8",lineHeight:"1.5",fontStyle:"italic"}}>{bestMatch.analyticalClaim}</div>
                      </div>
                    );
                  })()}
                  <div><div style={{fontSize:"10px",color:dimColor,fontWeight:"700",marginBottom:"3px"}}>📝 תיאור עובדתי</div>
                    <textarea value={d.description} onChange={e=>setDraft({...d,description:e.target.value})} rows={3} style={fieldStyle}/></div>
                  <div><div style={{fontSize:"10px",color:"#a78bfa",fontWeight:"700",marginBottom:"3px"}}>💭 טענה אנליטית מצומצמת (ריק = ללא טענה)</div>
                    <textarea value={d.analyticalClaim} onChange={e=>setDraft({...d,analyticalClaim:e.target.value})} rows={3} style={fieldStyle}/></div>
                  <div><div style={{fontSize:"10px",color:"#64748b",fontWeight:"700",marginBottom:"3px"}}>נימוק לאיחוד</div>
                    <textarea value={d.justification} onChange={e=>setDraft({...d,justification:e.target.value})} rows={2} style={fieldStyle}/></div>
                  <div><div style={{fontSize:"10px",color:"#fbbf24",fontWeight:"700",marginBottom:"3px"}}>📝 הערה מחקרית (חוקרת) — ילווה לד'2 ולא יחליף את הטענה האנליטית</div>
                    <textarea value={d.researcherNote} onChange={e=>setDraft({...d,researcherNote:e.target.value})} rows={3} placeholder="למשל: 'התופעה מבוססת היטב כמסגור של המספר, אך אין להסיק ממנה כשלעצמה תכונות אישיות של דוד'" style={{...fieldStyle,background:"#78350f22",border:"1px solid #f59e0b44"}}/></div>
                </div>
              ):(<>
                {p.description&&(
                  <div style={{marginTop:"8px",padding:"10px 12px",background:"#0f172a",borderRadius:"6px",borderRight:`3px solid ${dimColor}`}}>
                    <div style={{fontSize:"10px",color:dimColor,fontWeight:"700",marginBottom:"3px"}}>📝 תיאור עובדתי</div>
                    <div style={{fontSize:"12px",color:"#cbd5e1",lineHeight:"1.6"}}>{p.description}</div>
                  </div>
                )}
                {p.analyticalClaim&&p.analyticalClaim.trim()&&(
                  <div style={{marginTop:"8px",padding:"10px 12px",background:"#0f172a",borderRadius:"6px",borderRight:"3px solid #a78bfa"}}>
                    <div style={{fontSize:"10px",color:"#a78bfa",fontWeight:"700",marginBottom:"3px"}}>💭 טענה אנליטית מצומצמת</div>
                    <div style={{fontSize:"12px",color:"#cbd5e1",lineHeight:"1.6"}}>{p.analyticalClaim}</div>
                  </div>
                )}
                {p.justification&&(
                  <div style={{marginTop:"8px",padding:"8px 12px",background:"#0f172a",borderRadius:"6px",fontSize:"11px",color:"#94a3b8",fontStyle:"italic"}}>
                    <strong style={{color:"#cbd5e1"}}>נימוק לאיחוד:</strong> {p.justification}
                  </div>
                )}
                {p.researcherNote&&(
                  <div style={{marginTop:"8px",padding:"10px 12px",background:"#78350f22",borderRadius:"6px",borderRight:"3px solid #f59e0b"}}>
                    <div style={{fontSize:"10px",color:"#fbbf24",fontWeight:"700",marginBottom:"3px"}}>📝 הערה מחקרית (חוקרת)</div>
                    <div style={{fontSize:"12px",color:"#fef3c7",lineHeight:"1.6"}}>{p.researcherNote}</div>
                  </div>
                )}
                {p.needsReview&&p.reviewNote&&(
                  <div style={{marginTop:"8px",padding:"10px 12px",background:"#78350f22",borderRadius:"6px",borderRight:"3px solid #f59e0b",fontSize:"11px",color:"#fde68a"}}>
                    <strong>⚠ הערה (דורש בדיקה):</strong> {p.reviewNote}
                  </div>
                )}
              </>)}

              {/* ראיות */}
              {Array.isArray(p.textualEvidence)&&p.textualEvidence.length>0&&(()=>{
                // ספירת פסוקים ייחודיים (עם נירמול)
                const normalizeRef=r=>String(r||"").replace(/[–——–−-]/g,"-").replace(/[.,:'"\s]+/g,"").trim();
                const refs=p.textualEvidence.map(e=>normalizeRef(e.reference));
                const unique=[...new Set(refs.filter(r=>r.length>0))];
                const hasRange=refs.some(r=>r.includes("-")||r.match(/\d+_\d+_\d+/));
                const hasEmpty=refs.some(r=>!r);
                const verseLabel=hasEmpty||!unique.length?"לא אומת":hasRange?`~${unique.length} הפניות (כולל טווחים)`:`${unique.length} פסוק${unique.length===1?"":"ים"} ייחודיים`;
                return (
                <div style={{marginTop:"10px"}}>
                  <div style={{fontSize:"11px",fontWeight:"700",color:"#60a5fa",marginBottom:"6px"}}>
                    📚 ראיות: {p.textualEvidence.length} ממצא{p.textualEvidence.length===1?"":"ים"} מושגי{p.textualEvidence.length===1?"":"ים"} | {verseLabel} — לחצי על sourceId לצפייה בנתון המקורי משלב 3
                  </div>
                  <table style={{fontSize:"11px",width:"100%"}}>
                    <thead><tr style={{background:"#0f172a"}}>
                      <th style={{textAlign:"right",color:"#64748b",padding:"5px 8px",width:"120px"}}>sourceId</th>
                      <th style={{textAlign:"right",color:"#64748b",padding:"5px 8px",width:"120px"}}>הפניה</th>
                      <th style={{textAlign:"right",color:"#64748b",padding:"5px 8px"}}>evidence</th>
                      <th style={{textAlign:"right",color:"#64748b",padding:"5px 8px"}}>היבט בתופעה</th>
                    </tr></thead>
                    <tbody>
                      {p.textualEvidence.map((ev,j)=>{
                        const f=findingBySid[ev.sourceId];
                        return(<tr key={j} style={{borderBottom:"1px solid #334155"}}>
                          <td style={{padding:"5px 8px"}}>
                            <button onClick={()=>openDrill(ev.sourceId,p.title,ev.aspect)}
                              style={{padding:"2px 7px",borderRadius:"4px",border:"1px solid #60a5fa44",cursor:"pointer",background:"transparent",color:"#60a5fa",fontSize:"10px",fontFamily:"monospace"}}>
                              {f?f.label:ev.sourceId.slice(0,12)}
                            </button>
                          </td>
                          <td style={{color:"#94a3b8",padding:"5px 8px",fontSize:"10px"}}>{ev.reference||"—"}</td>
                          <td style={{color:"#cbd5e1",padding:"5px 8px"}}>{ev.evidence||"—"}</td>
                          <td style={{color:"#94a3b8",padding:"5px 8px",fontSize:"10px"}}>{ev.aspect||"—"}</td>
                        </tr>);
                      })}
                    </tbody>
                  </table>
                </div>
                );
              })()}
            </div>
            );
          })}
        </div>
      )}

      {/* needsReview */}
      {Array.isArray(activeData.needsReview)&&activeData.needsReview.length>0&&(
        <div style={{marginTop:"18px",padding:"14px 18px",background:"#78350f22",borderRadius:"10px",border:"1px solid #f59e0b"}}>
          <div style={{fontSize:"13px",fontWeight:"700",color:"#fcd34d",marginBottom:"8px"}}>⚠ ממצאים דורשים בדיקה ({activeData.needsReview.length})</div>
          <div style={{fontSize:"11px",color:"#fde68a",marginBottom:"10px"}}>ממצאים שה-AI לא הצליח לשייך או סימן כדורשים ביקורת.</div>
          {activeData.needsReview.map((r,i)=>{
            const f=findingBySid[r.sourceId];
            return(<div key={i} style={{padding:"8px 10px",background:"#0f172a",borderRadius:"5px",marginBottom:"6px",fontSize:"11px"}}>
              <button onClick={()=>openDrill(r.sourceId,"needsReview","")} style={{padding:"2px 7px",borderRadius:"4px",border:"1px solid #fbbf2466",cursor:"pointer",background:"transparent",color:"#fbbf24",fontSize:"10px",fontFamily:"monospace",marginLeft:"8px"}}>{f?f.label:r.sourceId}</button>
              <span style={{color:"#fde68a"}}>{r.reason||"(ללא נימוק)"}</span>
            </div>);
          })}
        </div>
      )}

      {/* methodNote */}
      {activeData.methodNote&&(
        <div style={{marginTop:"12px",padding:"10px 14px",background:"#1e293b",borderRadius:"8px",fontSize:"11px",color:"#94a3b8",fontStyle:"italic",border:"1px dashed #475569"}}>
          <strong style={{color:"#cbd5e1"}}>הערת שיטה (AI):</strong> {activeData.methodNote}
        </div>
      )}

      {/* ═══ טבלת בדיקת כיסוי ממצאים ═══ */}
      <div style={{marginTop:"20px",padding:"16px 20px",background:"#1e293b",borderRadius:"10px",border:`2px solid ${coverage.canApprove?"#34d399":"#f59e0b"}`}}>
        <div style={{fontSize:"13px",fontWeight:"700",color:"#f1f5f9",marginBottom:"10px"}}>🔍 בדיקת כיסוי ממצאים (לפי מזהי מקור ייחודיים)</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(150px, 1fr))",gap:"8px",marginBottom:"12px"}}>
          <div style={{padding:"10px",background:"#0f172a",borderRadius:"6px",textAlign:"center"}}>
            <div style={{fontSize:"20px",fontWeight:"bold",color:"#f1f5f9"}}>{coverage.inputCount}</div>
            <div style={{fontSize:"10px",color:"#94a3b8",marginTop:"2px"}}>ממצאים מקוריים (ייחודיים)</div>
          </div>
          <div style={{padding:"10px",background:"#0f172a",borderRadius:"6px",textAlign:"center",borderRight:"3px solid #34d399"}}>
            <div style={{fontSize:"20px",fontWeight:"bold",color:"#34d399"}}>{coverage.assignedCount}</div>
            <div style={{fontSize:"10px",color:"#94a3b8",marginTop:"2px"}}>ממצאים משויכים</div>
          </div>
          <div style={{padding:"10px",background:"#0f172a",borderRadius:"6px",textAlign:"center",borderRight:"3px solid #f59e0b"}}>
            <div style={{fontSize:"20px",fontWeight:"bold",color:"#fbbf24"}}>{coverage.needsReviewCount}</div>
            <div style={{fontSize:"10px",color:"#94a3b8",marginTop:"2px"}}>טעונים בדיקה</div>
          </div>
          <div style={{padding:"10px",background:"#0f172a",borderRadius:"6px",textAlign:"center",borderRight:`3px solid ${coverage.untreated.length?"#ef4444":"#475569"}`}}>
            <div style={{fontSize:"20px",fontWeight:"bold",color:coverage.untreated.length?"#f87171":"#64748b"}}>{coverage.untreated.length}</div>
            <div style={{fontSize:"10px",color:"#94a3b8",marginTop:"2px"}}>ללא טיפול</div>
          </div>
          <div style={{padding:"10px",background:"#0f172a",borderRadius:"6px",textAlign:"center",borderRight:`3px solid ${coverage.invalidIds.length?"#ef4444":"#475569"}`}}>
            <div style={{fontSize:"20px",fontWeight:"bold",color:coverage.invalidIds.length?"#f87171":"#64748b"}}>{coverage.invalidIds.length}</div>
            <div style={{fontSize:"10px",color:"#94a3b8",marginTop:"2px"}}>מזהים לא תקינים</div>
          </div>
          <div style={{padding:"10px",background:"#0f172a",borderRadius:"6px",textAlign:"center",borderRight:`3px solid ${coverage.duplicates.length?"#60a5fa":"#475569"}`}}>
            <div style={{fontSize:"20px",fontWeight:"bold",color:coverage.duplicates.length?"#93c5fd":"#64748b"}}>{coverage.duplicates.length}</div>
            <div style={{fontSize:"10px",color:"#94a3b8",marginTop:"2px"}}>שיוכים כפולים</div>
          </div>
        </div>

        {coverage.canApprove&&coverage.duplicates.length===0?(
          <div style={{fontSize:"12px",color:"#34d399",marginBottom:"12px",padding:"8px 12px",background:"#064e3b22",borderRadius:"6px"}}>✓ כיסוי טכני מלא: כל {coverage.inputCount} הממצאים טופלו (שיוך או סימון לבדיקה). ניתן לאשר.</div>
        ):null}

        {/* רשימת ממצאים ללא טיפול + פעולות */}
        {coverage.untreated.length>0&&(
          <div style={{marginTop:"8px",padding:"12px",background:"#7f1d1d22",borderRadius:"7px",border:"1px solid #ef444444"}}>
            <div style={{fontSize:"12px",fontWeight:"700",color:"#fca5a5",marginBottom:"8px"}}>⚠ {coverage.untreated.length} ממצאים ללא טיפול — יש לטפל לפני אישור</div>
            <div style={{display:"flex",flexDirection:"column",gap:"8px",maxHeight:"300px",overflowY:"auto"}}>
              {coverage.untreated.map(sid=>{
                const f=findingBySid[sid];
                return (
                  <div key={sid} style={{padding:"10px",background:"#0f172a",borderRadius:"6px",fontSize:"11px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"10px",flexWrap:"wrap"}}>
                      <div style={{flex:1,minWidth:"250px"}}>
                        <div style={{color:"#60a5fa",fontFamily:"monospace",fontSize:"10px",marginBottom:"3px"}}>{f?f.label:sid}</div>
                        {f&&<>
                          <div style={{color:"#cbd5e1",marginBottom:"3px"}}><strong>מושג:</strong> {f.concept}</div>
                          <div style={{color:"#94a3b8",fontSize:"10px"}}><strong>בסיס:</strong> {f.basis||"—"}</div>
                        </>}
                      </div>
                      <div style={{display:"flex",flexDirection:"column",gap:"4px",minWidth:"160px"}}>
                        <select onChange={async e=>{
                          const v=e.target.value;
                          if(v===""||v==="header")return;
                          if(v==="__new__"){
                            const title=prompt("שם התופעה החדשה:",`תופעה חדשה (${f?f.concept:"?"})`);
                            if(title) await createPhenomenonFromUntreated(sid,title);
                          }else if(v==="__review__"){
                            const reason=prompt("סיבה לסימון כדורש בדיקה (אופציונלי):","");
                            await markUntreatedAsNeedsReview(sid,reason||"");
                          }else{
                            const aspect=prompt("היבט שבו הממצא נוגע לתופעה (אופציונלי):",f?f.concept:"");
                            await assignUntreatedToPhenomenon(sid,parseInt(v,10),aspect||"");
                          }
                          e.target.value="";
                        }} defaultValue="" style={{padding:"5px",fontSize:"10px",background:"#1e293b",border:"1px solid #475569",borderRadius:"4px",color:"#f1f5f9"}}>
                          <option value="">בחרי פעולה...</option>
                          <option value="__new__">➕ צור תופעה חדשה</option>
                          <option value="__review__">⚠ סמן כטעון בדיקה</option>
                          <option value="header" disabled style={{color:"#64748b"}}>── שיוך לתופעה ──</option>
                          {activeData.phenomena.map((p,i)=>(
                            <option key={i} value={i}>{p.title||`תופעה ${i+1}`}</option>
                          ))}
                        </select>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* מזהים לא תקינים */}
        {coverage.invalidIds.length>0&&(
          <div style={{marginTop:"8px",padding:"10px 14px",background:"#7f1d1d33",borderRadius:"7px",border:"1px solid #ef444488"}}>
            <div style={{fontSize:"11px",color:"#fca5a5",fontWeight:"700",marginBottom:"4px"}}>⛔ {coverage.invalidIds.length} מזהים לא קיימים בקלט (צריכים להימחק מתופעה או מ-needsReview):</div>
            <div style={{fontSize:"10px",color:"#fecaca",fontFamily:"monospace"}}>{coverage.invalidIds.join(", ")}</div>
          </div>
        )}

        {/* תופעות ריקות */}
        {coverage.emptyPhen.length>0&&(
          <div style={{marginTop:"8px",padding:"10px 14px",background:"#78350f33",borderRadius:"7px",border:"1px solid #f59e0b88"}}>
            <div style={{fontSize:"11px",color:"#fcd34d",fontWeight:"700"}}>⚠ {coverage.emptyPhen.length} תופעות ללא ראיות (אינדקסים: {coverage.emptyPhen.join(", ")}) — ערכי או מחקי</div>
          </div>
        )}

        {/* שיוכים כפולים (אינפורמטיבי) */}
        {coverage.duplicates.length>0&&(
          <div style={{marginTop:"8px",padding:"10px 14px",background:"#1e3a8a22",borderRadius:"7px",border:"1px solid #3b82f688"}}>
            <div style={{fontSize:"11px",color:"#93c5fd",fontWeight:"700",marginBottom:"4px"}}>ℹ {coverage.duplicates.length} שיוכים כפולים — בדקי שההצדקה חזקה (ממצא בשתי תופעות כאשר יש בו היבטים מובחנים)</div>
            <div style={{maxHeight:"120px",overflowY:"auto"}}>
              {coverage.duplicates.map(d=>{
                const f=findingBySid[d.sourceId];
                return (
                  <div key={d.sourceId} style={{fontSize:"10px",color:"#bfdbfe",marginTop:"4px",paddingTop:"4px",borderTop:"1px solid #1e3a8a44"}}>
                    <strong>{f?f.label:d.sourceId}</strong> → {d.phenomena.map(ph=>`"${ph.title}"`).join(" + ")}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* הבחנה: כיסוי טכני vs אישור מחקרי */}
        <div style={{marginTop:"12px",padding:"10px 12px",background:"#0f172a",borderRadius:"6px",fontSize:"10px",color:"#94a3b8",border:"1px dashed #334155"}}>
          <strong style={{color:"#cbd5e1"}}>הבחנה חשובה:</strong> <span style={{color:"#86efac"}}>כיסוי טכני</span> — כל ממצא מקורי זכה לשיוך או לסימון לבדיקה (נבדק אוטומטית). <span style={{color:"#86efac"}}>אישור מחקרי</span> — החוקרת בחנה ואישרה את התופעות, השיוכים והטענות (נעשה ידנית בלחיצה על "אשר").
        </div>

        <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginTop:"12px"}}>
          {!isApproved&&(
            <button onClick={approveUnit} disabled={!coverage.canApprove||savingApproval}
              style={{padding:"10px 24px",borderRadius:"8px",border:"none",cursor:coverage.canApprove&&!savingApproval?"pointer":"not-allowed",background:coverage.canApprove?"#34d399":"#334155",color:coverage.canApprove?"white":"#64748b",fontSize:"13px",fontWeight:"700"}}>
              {savingApproval?"⏳ שומר..." :"✓ אשר יחידה"}
            </button>
          )}
          {isApproved&&(
            <button onClick={reopenUnit} disabled={savingApproval}
              style={{padding:"10px 20px",borderRadius:"8px",border:"1px solid #f59e0b",cursor:savingApproval?"wait":"pointer",background:"transparent",color:"#f59e0b",fontSize:"12px",fontWeight:"700"}}>
              {savingApproval?"⏳ שומר..." :"↩ פתח מחדש לעריכה"}
            </button>
          )}
          <button disabled style={{padding:"10px 20px",borderRadius:"8px",border:"1px solid #334155",cursor:"not-allowed",background:"transparent",color:"#475569",fontSize:"12px"}} title="בפיתוח">📄 הורד כ-Word</button>
        </div>
        <div style={{marginTop:"8px",fontSize:"10px",color:"#64748b"}}>
          💡 הכיסוי נבדק אוטומטית בכל שינוי. אין צורך לרענן.
        </div>
      </div>

      {drillDown&&<SourceDrillDownModal finding={drillDown.finding} phenomenonTitle={drillDown.phenomenonTitle} aiAspect={drillDown.aspect} onClose={()=>setDrillDown(null)}/>}

      {/* דיאלוג סימון "דורש בדיקה" עם הערה */}
      {reviewPromptIdx!=null&&<ReviewNotePrompt phenomenon={activeData.phenomena[reviewPromptIdx]} onConfirm={(note)=>{toggleNeedsReview(reviewPromptIdx,note); setReviewPromptIdx(null);}} onCancel={()=>setReviewPromptIdx(null)}/>}

      {/* דיאלוג פיצול */}
      {splitDialog!=null&&<SplitDialog phenomenon={activeData.phenomena[splitDialog.phenomenonIdx]} findings={findings} onConfirm={async(plan)=>{await performSplit(splitDialog.phenomenonIdx,plan); setSplitDialog(null);}} onCancel={()=>setSplitDialog(null)} dimColor={dimColor}/>}

      {/* דיאלוג איחוד */}
      {mergeDialog!=null&&<MergeDialog phenomenon={activeData.phenomena[mergeDialog.phenomenonIdx]} fromIdx={mergeDialog.phenomenonIdx} allPhenomena={activeData.phenomena} onConfirm={async(toIdx,merged)=>{await performMerge(mergeDialog.phenomenonIdx,toIdx,merged); setMergeDialog(null);}} onCancel={()=>setMergeDialog(null)} dimColor={dimColor}/>}
    </div>
  );
}

// ─── דיאלוג הערת "דורש בדיקה" ───
function ReviewNotePrompt({phenomenon,onConfirm,onCancel}){
  const [note,setNote]=useState("");
  return (
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"#000a",display:"flex",alignItems:"center",justifyContent:"center",zIndex:2000,padding:"20px"}}>
      <div style={{background:"#1e293b",borderRadius:"12px",padding:"24px",maxWidth:"560px",width:"100%",border:"1px solid #f59e0b"}}>
        <div style={{fontSize:"15px",fontWeight:"700",color:"#fcd34d",marginBottom:"8px"}}>⚠ סימון תופעה "{phenomenon.title}" כדורשת בדיקה</div>
        <div style={{fontSize:"11px",color:"#94a3b8",marginBottom:"12px"}}>הסברי מה הבעיה או מה דורש בדיקה נוספת (אופציונלי). ההערה תלווה את התופעה גם לד'2.</div>
        <textarea value={note} onChange={e=>setNote(e.target.value)} rows={4} placeholder="למשל: הטענה דורשת בדיקה מול פרשן X; יש פסוק נוסף שלא נבדק..." style={{width:"100%",padding:"8px",background:"#0f172a",border:"1px solid #475569",borderRadius:"6px",color:"#f1f5f9",fontSize:"12px",fontFamily:"inherit",resize:"vertical",direction:"rtl"}}/>
        <div style={{display:"flex",gap:"8px",marginTop:"14px",justifyContent:"flex-end"}}>
          <button onClick={onCancel} style={{padding:"8px 16px",borderRadius:"7px",border:"1px solid #475569",cursor:"pointer",background:"transparent",color:"#94a3b8",fontSize:"12px"}}>ביטול</button>
          <button onClick={()=>onConfirm(note)} style={{padding:"8px 16px",borderRadius:"7px",border:"none",cursor:"pointer",background:"#f59e0b",color:"white",fontSize:"12px",fontWeight:"700"}}>⚠ סמן כדורש בדיקה</button>
        </div>
      </div>
    </div>
  );
}

// ─── דיאלוג פיצול תופעה ───
function SplitDialog({phenomenon,findings,onConfirm,onCancel,dimColor}){
  const evidence=Array.isArray(phenomenon.textualEvidence)?phenomenon.textualEvidence:[];
  const [dispositions,setDispositions]=useState(()=>evidence.map(e=>({sourceId:e.sourceId,action:"stay",newAspect:""})));
  const [newTitle,setNewTitle]=useState("");
  const [newDesc,setNewDesc]=useState("");
  const [newActor,setNewActor]=useState("");
  const [newPresentation,setNewPresentation]=useState("");
  const [newMeans,setNewMeans]=useState("");
  const movedOrCopied=dispositions.filter(d=>d.action!=="stay").length;
  const stayCount=dispositions.filter(d=>d.action==="stay").length;
  const canSplit=newTitle.trim()&&movedOrCopied>0&&stayCount>0;
  const findingBySid={}; findings.forEach(f=>{findingBySid[f.sid]=f;});

  function setDisp(sid,field,val){ setDispositions(ds=>ds.map(d=>d.sourceId===sid?{...d,[field]:val}:d)); }

  return (
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"#000c",display:"flex",alignItems:"center",justifyContent:"center",zIndex:2000,padding:"20px"}}>
      <div style={{background:"#1e293b",borderRadius:"12px",padding:"24px",maxWidth:"900px",width:"100%",maxHeight:"90vh",overflowY:"auto",border:`1px solid ${dimColor}`}}>
        <div style={{fontSize:"16px",fontWeight:"700",color:"#f1f5f9",marginBottom:"4px"}}>🔀 פיצול תופעה: "{phenomenon.title}"</div>
        <div style={{fontSize:"11px",color:"#94a3b8",marginBottom:"14px"}}>לכל ראיה — החליטי: להישאר בתופעה המקורית, להעביר לתופעה חדשה, או להעתיק לשתיהן (עם היבט שונה)</div>
        <div style={{maxHeight:"300px",overflowY:"auto",border:"1px solid #334155",borderRadius:"6px",padding:"10px",marginBottom:"14px"}}>
          {evidence.map((ev,i)=>{
            const d=dispositions[i]; const f=findingBySid[ev.sourceId];
            return (<div key={i} style={{padding:"10px",borderBottom:"1px solid #334155",display:"flex",gap:"10px",alignItems:"flex-start"}}>
              <div style={{flex:1,fontSize:"11px"}}>
                <div style={{color:"#60a5fa",fontFamily:"monospace",marginBottom:"3px"}}>{f?f.label:ev.sourceId}</div>
                <div style={{color:"#cbd5e1"}}>{ev.evidence||"—"}</div>
                <div style={{color:"#94a3b8",fontSize:"10px",marginTop:"3px"}}>היבט נוכחי: {ev.aspect||"—"}</div>
              </div>
              <div style={{minWidth:"200px"}}>
                <select value={d.action} onChange={e=>setDisp(ev.sourceId,"action",e.target.value)} style={{width:"100%",padding:"5px",background:"#0f172a",border:"1px solid #475569",borderRadius:"4px",color:"#f1f5f9",fontSize:"11px"}}>
                  <option value="stay">נשארת (במקורית)</option>
                  <option value="move">מועברת לחדשה</option>
                  <option value="copy">מועתקת (לשתיהן, עם היבט אחר)</option>
                </select>
                {d.action==="copy"&&<input type="text" value={d.newAspect} onChange={e=>setDisp(ev.sourceId,"newAspect",e.target.value)} placeholder="היבט חדש בתופעה החדשה" style={{width:"100%",padding:"4px",marginTop:"4px",background:"#0f172a",border:"1px solid #475569",borderRadius:"4px",color:"#f1f5f9",fontSize:"10px"}}/>}
              </div>
            </div>);
          })}
        </div>
        <div style={{padding:"12px",background:"#0f172a",borderRadius:"6px",marginBottom:"14px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:"#f1f5f9",marginBottom:"8px"}}>פרטי התופעה החדשה</div>
          <input type="text" value={newTitle} onChange={e=>setNewTitle(e.target.value)} placeholder="שם התופעה החדשה (חובה)" style={{width:"100%",padding:"6px",marginBottom:"6px",background:"#1e293b",border:"1px solid #475569",borderRadius:"4px",color:"#f1f5f9",fontSize:"12px"}}/>
          <textarea value={newDesc} onChange={e=>setNewDesc(e.target.value)} rows={2} placeholder="תיאור עובדתי" style={{width:"100%",padding:"6px",marginBottom:"6px",background:"#1e293b",border:"1px solid #475569",borderRadius:"4px",color:"#f1f5f9",fontSize:"12px",fontFamily:"inherit"}}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"6px"}}>
            <input type="text" value={newActor} onChange={e=>setNewActor(e.target.value)} placeholder="actor" style={{padding:"5px",background:"#1e293b",border:"1px solid #475569",borderRadius:"4px",color:"#f1f5f9",fontSize:"11px"}}/>
            <input type="text" value={newPresentation} onChange={e=>setNewPresentation(e.target.value)} placeholder="presentation" style={{padding:"5px",background:"#1e293b",border:"1px solid #475569",borderRadius:"4px",color:"#f1f5f9",fontSize:"11px"}}/>
            <input type="text" value={newMeans} onChange={e=>setNewMeans(e.target.value)} placeholder="designMeans" style={{padding:"5px",background:"#1e293b",border:"1px solid #475569",borderRadius:"4px",color:"#f1f5f9",fontSize:"11px"}}/>
          </div>
        </div>
        <div style={{fontSize:"11px",color:"#94a3b8",marginBottom:"10px"}}>סיכום: {stayCount} ראיות נשארות | {movedOrCopied} מועברות/מועתקות</div>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>

            style={{padding:"8px 20px",borderRadius:"7px",border:"none",cursor:canSplit?"pointer":"not-allowed",background:canSplit?"#34d399":"#334155",color:canSplit?"white":"#64748b",fontSize:"12px",fontWeight:"700"}}>

  );
}
