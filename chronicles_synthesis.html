function LS_get(k,def){ try{const v=localStorage.getItem(k); return v?JSON.parse(v):def;}catch{return def;} }
function LS_set(k,v){
  try{ localStorage.setItem(k,JSON.stringify(v)); return true; }
  catch(e){
    // התאוששות אוטומטית מ-QuotaExceededError:
    // Firebase הוא מקור האמת, ולכן אם ה-LS מלא — ננקה אותו (נשמור רק apiKey) וננסה שוב.
    if(e&&(e.name==="QuotaExceededError"||e.code===22||String(e).includes("quota"))){
      try{
        const apiKey=localStorage.getItem("apiKey");
        localStorage.clear();
        if(apiKey) localStorage.setItem("apiKey",apiKey);
        localStorage.setItem(k,JSON.stringify(v));
        console.log("LS: ניקוי אוטומטי הצליח, נשמר מחדש:",k);
        return true;
      }catch(e2){
        console.warn("LS: גם ניקוי אוטומטי נכשל; מסתמכים על Firebase בלבד",e2);
      }
    } else {
      console.warn("LS save failed",e);
    }
    return false;
  }
}
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }

// ── Firebase ─────────────────────────────────────────────────────────────
// הכלי האנליטי שומר ב-"research2" (sharded + lz-string). הסינתזה קוראת משם ל-raw,
// ושומרת את תוצאות השלבים ב-"synthesis_v1" הנפרד (בלי להתנגש עם האנליטי).
const FB_RESEARCH_PATH = "research2";
const FB_SYNTH_PATH    = "synthesis_v1";
const PER_UNIT_KEYS = ["analysis","analysis_chronicles","analysis_source","unitSummary","compareNotes","compareFactual","commentary"];

function __packJson(data){ const s=JSON.stringify(data); try{ return (window.LZString)?("z:"+LZString.compressToBase64(s)):s; }catch(e){ return s; } }
function __unpackJson(str){ if(str==null) return null; try{ if(typeof str==="string" && str.slice(0,2)==="z:" && window.LZString){ const d=LZString.decompressFromBase64(str.slice(2)); if(d) return JSON.parse(d); } }catch(e){} try{ return JSON.parse(str); }catch{ return null; } }
function __unshard(sh){ if(!sh) return null; const data=__unpackJson(sh.meta)||{}; for(const k of PER_UNIT_KEYS){ if(data[k]===undefined) data[k]={}; } const u=sh.u||{}; for(const uid of Object.keys(u)){ const slice=__unpackJson(u[uid])||{}; for(const k of PER_UNIT_KEYS){ if(slice[k]!==undefined) data[k][uid]=slice[k]; } } return data; }

// טעינת המחקר (raw) מהכלי האנליטי. מחזיר null אם אין נתונים או שגיאה.
function fbLoadResearch(cb){
  db.ref(FB_RESEARCH_PATH).once("value").then(snap=>{
    const sh=snap.val();
    if(sh && (sh.meta || (sh.u && Object.keys(sh.u||{}).length))){ cb(__unshard(sh)); return; }
    cb(null);
  }).catch(e=>{ console.error("fbLoadResearch",e); cb(null); });
}

// טעינת תוצאות הסינתזה
function fbLoadStageResults(cb){
  db.ref(FB_SYNTH_PATH+"/stageResults").once("value").then(snap=>{
    const v=snap.val();
    if(!v){ cb({}); return; }
    const parsed=__unpackJson(v); cb(parsed||{});
  }).catch(e=>{ console.error("fbLoadStageResults",e); cb({}); });
}

// שמירה דחויה (debounced) כדי לא להציף את Firebase
let _synthSaveTimer=null, _synthSavePending=null;
function fbSaveStageResults(stageResults){
  _synthSavePending=stageResults;
  if(_synthSaveTimer) clearTimeout(_synthSaveTimer);
  _synthSaveTimer=setTimeout(()=>{
    const payload=__packJson(_synthSavePending);
    db.ref(FB_SYNTH_PATH+"/stageResults").set(payload).catch(e=>console.error("fbSaveStageResults",e));
    _synthSavePending=null; _synthSaveTimer=null;
  },800);
}

function parseCh(u){
  try{ const p=String(u.chapter||"").split("_"); return [parseInt(p[0]||"999",10),parseInt(p[1]||"999",10)]; }
  catch{ return [999,999]; }
}

function validParams(params){ return (params||[]).filter(p=>p&&(typeof p==="object"?p.q:p).toString().trim()); }

function dim4concept(name,raw){
  const d=DIMS.find(d=>d.concepts.includes(name));
  if(d) return d;
  const cc=(raw&&raw.customConcepts||[]).find(c=>c.name===name);
  if(cc){ const dd=DIMS.find(x=>x.id===cc.dimId); if(dd) return dd; }
  return null;
}

function allConceptsFrom(raw){
  const r=[]; const seen=new Set();
  DIMS.forEach(d=>d.concepts.forEach(n=>{ r.push({name:n,dimId:d.id}); seen.add(n); }));
  ((raw&&raw.customConcepts)||[]).forEach(c=>{ if(!seen.has(c.name)){ r.push({name:c.name,dimId:c.dimId}); seen.add(c.name); } });
  return r;
}

function getParams(name,raw){
  const c=raw&&raw.concepts&&raw.concepts[name];
  return (c&&Array.isArray(c.params))?c.params:[];
}

function getSemantic(name,raw){
  const custom=(raw&&raw.customSemantic&&raw.customSemantic[name])||null;
  if(custom) return custom;
  const inRaw=(raw&&raw.concepts&&raw.concepts[name]&&raw.concepts[name].sem)||null;
  if(inRaw) return inRaw;
  return SEMANTIC_FALLBACK[name]||null;
}

function getEntry(uid,cname,mode,raw){
  const store=mode==="source"?"analysis_source":"analysis_chronicles";
  return (raw&&raw[store]&&raw[store][String(uid)]&&raw[store][String(uid)][cname])||null;
}

function getCompareNote(uid,cname,raw){
  return (raw&&raw.compareNotes&&raw.compareNotes[String(uid)]&&raw.compareNotes[String(uid)][cname])||"";
}

function getUnitSummary(uid,raw){
  return (raw&&raw.unitSummary&&raw.unitSummary[String(uid)])||{};
}

// ── מסך 1: ברוך הבא / העלאת גיבוי ──────────────────────────────────────

function WelcomeScreen({onBackupLoaded,hasBackup,hasApiKey,onOpenApiKey,backupStats,fbStatus,rawSource,onDownloadSynth,onUploadSynth}){

      try{ const data=JSON.parse(ev.target.result); onBackupLoaded(data,f.name); }
      catch(err){ alert("שגיאה בטעינת הגיבוי: "+err.message); }
    };
    reader.readAsText(f);
  }
  const fromFirebase = hasBackup && rawSource==="firebase";
  return(
    <div style={{maxWidth:"880px",margin:"0 auto",padding:"38px 20px"}}>

      </div>

      {/* תיבת מקור הנתונים — Firebase או קובץ */}
      <div style={{background:"#1e293b",borderRadius:"12px",padding:"24px",border:`1px solid ${hasBackup?"#34d399":(fbStatus==="loading"?"#fbbf24":"#334155")}`,marginBottom:"18px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"10px"}}>
          <div>
            <div style={{fontSize:"16px",fontWeight:"700",color:"#f1f5f9",marginBottom:"3px"}}>🔥 1. נתוני המחקר</div>
            <div style={{fontSize:"12px",color:"#94a3b8"}}>
              {fbStatus==="loading" && "מתחבר ל-Firebase וטוען את הנתונים מהכלי האנליטי..."}
              {fbStatus==="loaded" && fromFirebase && "הנתונים נטענו אוטומטית מ-Firebase. אין צורך להעלות גיבוי."}
              {fbStatus==="loaded" && !fromFirebase && "משתמשת בגיבוי מקומי. Firebase נטען גם — אפשר להסתמך עליו."}
              {fbStatus==="empty" && "ה-Firebase ריק. העלי גיבוי JSON מהכלי האנליטי."}
              {fbStatus==="error" && "שגיאה בחיבור ל-Firebase. העלי גיבוי JSON כגיבוי זמני."}
            </div>
          </div>
          <span style={{fontSize:"24px",color:hasBackup?"#34d399":(fbStatus==="loading"?"#fbbf24":"#475569")}}>{hasBackup?"✓":(fbStatus==="loading"?"⏳":"○")}</span>
        </div>
        {hasBackup&&backupStats&&(
          <div style={{marginTop:"8px",fontSize:"11px",color:"#94a3b8",lineHeight:"1.7"}}>
            <strong style={{color:"#34d399"}}>נטען:</strong> {backupStats.units} יחידות ({backupStats.davidCount} דוד, {backupStats.solomonCount} שלמה), {backupStats.notes} מסקנות מחקריות, {backupStats.concepts} מושגים
            {fromFirebase && <span style={{color:"#64748b"}}> — מקור: Firebase (מתעדכן אוטומטית מהכלי האנליטי)</span>}

        {/* אפשרות החלפה — מוסתרת כברירת מחדל כאשר Firebase עובד */}

            <button onClick={()=>fileRef.current.click()} style={{padding:"10px 18px",borderRadius:"8px",border:"none",cursor:"pointer",background:hasBackup?"#334155":"#818cf8",color:"white",fontSize:"13px",fontWeight:"700"}}>

function AnalysisScreen({raw,character,dimId,concept,apiKey,onBackToSelector,stageResults,setStageResults}){
  const resultsKey=`${character}__${dimId}__${concept}`;
  const [stageData,setStageData]=useState(()=>{
    const all=stageResults||LS_get("stageResults",{}); return all[resultsKey]||{approvedStages:[]};
  });
  // סנכרון חוזר כש-stageResults מתעדכן ברמת האפליקציה (למשל אחרי טעינת Firebase)
  useEffect(()=>{
    const r=(stageResults||{})[resultsKey];
    if(r && r.lastUpdated !== stageData.lastUpdated){
      setStageData(r);
    }
  },[stageResults,resultsKey]);
  const [currentStage,setCurrentStage]=useState(()=>{
    const sd=stageData;
    const approved=sd.approvedStages||[];
    return [1,2,3,4,5,6,7].find(s=>!approved.includes(s))||7;
  });
  const [loading,setLoading]=useState(false);
  const [progressNote,setProgressNote]=useState("");
  // expandedStages — שלבים שאושרו אבל המשתמשת פתחה אותם מחדש לעיון/ביקורת
  const [expandedStages,setExpandedStages]=useState(new Set());
  function toggleExpanded(n){
    setExpandedStages(prev=>{ const s=new Set(prev); if(s.has(n)) s.delete(n); else s.add(n); return s; });
  }
  // expandedPhenomena[idx]==true כאשר שורת תופעה idx בשלב 4 פתוחה ל-drill-down לאינדיקטורי שלב 3
  const [expandedPhenomena,setExpandedPhenomena]=useState({});
  function togglePhenomenon(idx){ setExpandedPhenomena(p=>({...p,[idx]:!p[idx]})); }
  // editMode[n]==true כאשר שלב n במצב עריכה. editDraft[n] מכיל טיוטה שלא נשמרה עדיין.
  const [editMode,setEditMode]=useState({});
  const [editDraft,setEditDraft]=useState({});
  function startEdit(n,res){
    setEditDraft(p=>({...p,[n]:{tableRows:JSON.parse(JSON.stringify(res.tableRows||[])),summary:res.summary||"",selfCheck:res.selfCheck||""}}));
    setEditMode(p=>({...p,[n]:true}));
  }
  function cancelEdit(n){ setEditMode(p=>({...p,[n]:false})); }
  function saveEdit(n){
    const d=editDraft[n]; if(!d) return;
    const cur=stageData[`stage${n}`]||{};
    const updated={...cur,tableRows:d.tableRows,summary:d.summary,selfCheck:d.selfCheck,manuallyEdited:true,editedAt:new Date().toISOString()};
    saveNow({...stageData,[`stage${n}`]:updated});
    setEditMode(p=>({...p,[n]:false}));
  }
  function updateCell(n,r,c,v){ setEditDraft(p=>{ const d=JSON.parse(JSON.stringify(p[n])); if(!d.tableRows[r]) d.tableRows[r]=[]; d.tableRows[r][c]=v; return{...p,[n]:d}; }); }
  function updateField(n,f,v){ setEditDraft(p=>({...p,[n]:{...p[n],[f]:v}})); }

  // יצוא שלב כקובץ Word (.doc שנפתח ישירות ב-Word)
  function downloadStageAsWord(n,result){
    const dimLbl=(DIMS.find(d=>d.id===dimId)||{}).label||"";
    const chN=character==="solomon"?"שלמה":"דוד";
    const now=new Date().toLocaleString("he-IL");
    const headers=result.tableHeaders||[];
    const rows=result.tableRows||[];
    const html=`<!DOCTYPE html>
<html dir="rtl" lang="he">
<head><meta charset="UTF-8"><title>${escapeHtml(concept)} ${escapeHtml(chN)} שלב ${n}</title>
<style>
body{font-family:"David","Times New Roman",serif;font-size:12pt;direction:rtl;padding:20px;}
h1{font-size:18pt;margin:0 0 6pt;}
.sub{font-size:11pt;color:#555;margin-bottom:14pt;}
h2{font-size:14pt;color:#1a365d;margin:14pt 0 6pt;}
.desc{font-size:11pt;color:#444;margin-bottom:10pt;font-style:italic;}

th{background:#e2e8f0;border:1px solid #475569;padding:7px 9px;text-align:right;font-weight:bold;font-size:11pt;}

.summary{background:#f1f5f9;padding:10pt 12pt;border-right:4px solid #818cf8;margin:12pt 0;}
.selfcheck{background:#fef3c7;padding:10pt 12pt;border:1px dashed #d97706;margin:12pt 0;font-size:11pt;}
.footer{color:#64748b;font-size:9pt;margin-top:20pt;border-top:1px solid #ccc;padding-top:8pt;}
</style></head>
<body>
<h1>${escapeHtml(concept)} · ב${escapeHtml(chN)}</h1>
<div class="sub">ממד: ${escapeHtml(dimLbl)}</div>
<h2>שלב ${n}: ${escapeHtml(STAGE_LABELS[n]||"")}</h2>
<div class="desc">${escapeHtml(STAGE_DESC[n]||"")}</div>
${result.hasTable&&rows.length?`<table><thead><tr>${headers.map(h=>`<th>${escapeHtml(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${escapeHtml(c).replace(/\n/g,"<br>")}</td>`).join("")}</tr>`).join("")}</tbody></table>`:""}
${result.summary?`<div class="summary"><b>סיכום השלב:</b><br>${escapeHtml(result.summary).replace(/\n/g,"<br>")}</div>`:""}
${result.selfCheck?`<div class="selfcheck"><b>🔍 בדיקה עצמית:</b><br>${escapeHtml(result.selfCheck).replace(/\n/g,"<br>")}</div>`:""}
${result.manuallyEdited?`<div style="font-size:9pt;color:#92400e;margin-top:8pt;">⚠ שלב זה נערך ידנית ב-${result.editedAt||""}</div>`:""}
<div class="footer">הופק מכלי הסינתזה · ${now}</div>
</body></html>`;
    const blob=new Blob(["﻿"+html],{type:"application/msword"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`${concept.replace(/[\/\\]/g,"_")}_${chN}_שלב${n}.doc`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }

  function saveNow(newData){
    setStageData(newData);
    const current=stageResults||LS_get("stageResults",{});
    const all={...current,[resultsKey]:{...newData,lastUpdated:Date.now()}};
    if(setStageResults) setStageResults(all); // סנכרון ל-React state (האפליקציה)
    LS_set("stageResults",all);                 // סנכרון למטמון מקומי
    fbSaveStageResults(all);                     // סנכרון ל-Firebase (debounced 800ms)
  }

  const dimLabel=(DIMS.find(d=>d.id===dimId)||{}).label||dimId;
  const dimColor=(DIMS.find(d=>d.id===dimId)||{}).color||"#818cf8";
  const charName=character==="david"?"דוד":"שלמה";

  // ─────── איסוף יחידות רלוונטיות ───────
  function collectRelevant(){
    const list=(raw.units||[]).filter(u=>{
      if((u.character||"david")!==character) return false;
      const s=getUnitSummary(u.id,raw);
      if(s&&s.notInThesis) return false;
      return true;
    });
    list.sort((a,b)=>{const [a1,a2]=parseCh(a),[b1,b2]=parseCh(b); return a1-b1||a2-b2;});
    return list;
  }

  // ─────── שלב 1 חישובי ───────
  function runStage1(){
    const units=collectRelevant();
    const sem=getSemantic(concept,raw);
    const posWords=((sem&&sem.pos)||"").split(/[,،;]/).map(s=>s.trim()).filter(Boolean);
    const rows=[]; let cNN=0,cN=0,cS=0,cNone=0,cNR=0;
    units.forEach(u=>{
      const uid=String(u.id);
      const s=getUnitSummary(uid,raw);
      const nrList=(s&&Array.isArray(s.notRelevantConcepts))?s.notRelevantConcepts:[];
      if(nrList.includes(concept)){ cNR++; rows.push([`${u.name||"?"} (${u.chapter||"?"})`,"—","—","לא רלוונטי"]); return; }
      const text=u.chroniclesText||"";
      const hasSem=posWords.some(w=>w&&text.indexOf(w)>=0);
      const ec=getEntry(uid,concept,"chronicles",raw)||{};
      const hasN=(ec.params||[]).some(p=>p&&p.found===true);
      let sym="—";
      if(hasSem&&hasN){sym="ס+נ";cNN++;} else if(hasSem){sym="ס";cS++;} else if(hasN){sym="נ";cN++;} else cNone++;
      rows.push([`${u.name||"?"} (${u.chapter||"?"})`,hasSem?"✓":"—",hasN?"✓":"—",sym]);
    });
    return{
      status:"חישוב מיידי — מוכן לאישור",
      hasTable:true,
      tableHeaders:["יחידה","ס (סמנטי גלוי)","נ (נרמז)","סימון"],
      tableRows:rows,
      summary:`מתוך ${units.length} יחידות: ${cNN} ס+נ, ${cN} נ בלבד, ${cS} ס בלבד, ${cNone} ללא ממצא, ${cNR} לא רלוונטיות. סה"כ ${cNN+cN+cS} יחידות עם ממצא כלשהו למושג "${concept}".`,
      selfCheck:"חישוב דטרמיניסטי. ס מבוסס על השדה הסמנטי של המושג; נ מבוסס על פרמטר אחד לפחות עם found=true בשלב ב'."
    };
  }

  // ─────── שלב 2 חישובי ───────
  function runStage2(){
    const units=collectRelevant();
    const params=validParams(getParams(concept,raw));
    const labelOrder=[]; const l2i={};
    params.forEach((p,i)=>{const l=p.paramLabel||"אחר"; if(!l2i[l]){l2i[l]=[];labelOrder.push(l);} l2i[l].push(i);});
    const headers=["יחידה",...labelOrder,'סה"כ'];
    const rows=[]; let total=0;
    units.forEach(u=>{
      const uid=String(u.id);
      const s=getUnitSummary(uid,raw);
      const nrList=(s&&Array.isArray(s.notRelevantConcepts))?s.notRelevantConcepts:[];
      if(nrList.includes(concept)) return;
      const ec=getEntry(uid,concept,"chronicles",raw)||{};
      const pos=(ec.params||[]).map((p,i)=>p&&p.found===true?i:-1).filter(i=>i>=0);
      if(!pos.length) return;
      const row=[`${u.name||"?"} (${u.chapter||"?"})`];
      labelOrder.forEach(l=>row.push(String(pos.filter(i=>l2i[l].includes(i)).length)));
      row.push(String(pos.length)); total+=pos.length;
      rows.push(row);
    });
    return{
      status:"חישוב מיידי — מוכן לאישור",
      hasTable:true,
      tableHeaders:headers,
      tableRows:rows,
      summary:`${rows.length} יחידות עם אינדיקטורים חיוביים, סה"כ ${total} אינדיקטורים ב-${labelOrder.length} קטגוריות: ${labelOrder.join(", ")}.`,
      selfCheck:"חישוב דטרמיניסטי. הקטגוריות נגזרות מתוך paramLabel של פרמטרי המושג."
    };
  }

  // ─────── קריאה ישירה ל-Anthropic (בלי worker) ───────
  async function aiCallDirect(prompt,maxTokens){
    if(!apiKey) throw new Error("חסר מפתח API. הזן אותו דרך סמל ה-🔑 בסרגל העליון.");
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-api-key":apiKey,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body:JSON.stringify({
        model:"claude-sonnet-4-5-20250929",
        max_tokens:maxTokens,
        messages:[{role:"user",content:prompt}]
      })
    });
    if(!res.ok){
      let errMsg=`שגיאת API (${res.status})`;
      try{const d=await res.json(); if(d.error&&d.error.message) errMsg+=`: ${d.error.message}`;}catch{}
      throw new Error(errMsg);
    }
    const data=await res.json();
    if(!data.content||!data.content.length) throw new Error("תשובה ריקה מ-API");
    if(data.stop_reason==="max_tokens") console.warn("aiCallDirect: תשובה נקטעה במגבלת max_tokens");
    return data.content.map(b=>b.text||"").join("");
  }

  function parseJSON(text){
    const clean=text.replace(/```json|```/g,"").trim();
    try{ return JSON.parse(clean); }
    catch(e){
      // ניסיון לחלץ אובייקט שלם
      const first=clean.indexOf("{"); const last=clean.lastIndexOf("}");
      if(first>=0&&last>first){
        try{ return JSON.parse(clean.substring(first,last+1)); }catch{}
      }
      throw new Error("התשובה אינה בפורמט JSON תקין: "+clean.substring(0,120));
    }
  }

  // ─────── בניית בלוק נתונים ליחידה ───────
  function buildUnitBlock(u){
    const uid=String(u.id);
    const ec=getEntry(uid,concept,"chronicles",raw)||{};
    const params=validParams(getParams(concept,raw));
    const foundParams=(ec.params||[]).map((p,i)=>({...p,def:params[i]})).filter(x=>x&&x.found===true);
    const paramList=foundParams.map((p,i)=>`  פרמטר ${i+1} (${(p.def&&p.def.paramLabel)||""}): ${(p.def&&p.def.q)||""}${p.verse?` [פסוק ${p.verse}]`:""}`).join("\n");
    const explicitNote=ec.explicit_note?`\nהערת שדה גלוי: ${ec.explicit_note}`:"";
    const compareNote=getCompareNote(uid,concept,raw);
    const sourceInfo=u.sourceRef?`מקבילה: ${u.sourceRef}`:"יחידת סונדרגוט";
    return `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
### ${u.name||"?"} (${u.chapter||"?"}) — ${sourceInfo}

טקסט דה"י: ${(u.chroniclesText||"—").substring(0,750)}
${u.sourceText?`טקסט המקבילה: ${u.sourceText.substring(0,750)}`:""}

אינדיקטורים חיוביים (${foundParams.length}):
${paramList||"—"}${explicitNote}

מסקנה מחקרית של הכותבת:
${compareNote||"(טרם נכתבה)"}`;
  }

  // ─────── שלב 3: בסיס טקסטואלי + נושא ממצא, בפיצול לקבוצות ───────
  async function runStage3(extra=""){
    const isEternal=(concept==="נצח"||concept==="עולם");
    const who=character==="solomon"?"שלמה":"דוד";
    const units=collectRelevant();
    const withIndic=[]; const notRelCount=[];
    units.forEach(u=>{
      const uid=String(u.id);
      const s=getUnitSummary(uid,raw);
      const nrList=(s&&Array.isArray(s.notRelevantConcepts))?s.notRelevantConcepts:[];
      if(nrList.includes(concept)){ notRelCount.push(u.name||u.label); return; }
      const ec=getEntry(uid,concept,"chronicles",raw)||{};
      const hasP=(ec.params||[]).some(p=>p&&p.found===true);
      const hasE=!!(ec.explicit_note&&ec.explicit_note.trim());
      if(hasP||hasE) withIndic.push(u);
    });
    if(!withIndic.length){
      return{status:"אין נתונים",hasTable:false,
        summary:`לא נמצאו יחידות עם אינדיקטורים חיוביים למושג "${concept}" ב${who}.`,
        selfCheck:"אין נתונים לניתוח."};
    }
    const BATCH=8;
    const batches=[];
    for(let i=0;i<withIndic.length;i+=BATCH) batches.push(withIndic.slice(i,i+BATCH));
    const allRows=[]; const batchSummaries=[];
    for(let i=0;i<batches.length;i++){
      setProgressNote(`עובד על קבוצה ${i+1}/${batches.length} (${batches[i].length} יחידות)...`);
      const batch=batches[i];
      const blocks=batch.map(buildUnitBlock).join("\n\n");
      const batchInfo=batches.length>1?`\nזוהי קבוצה ${i+1} מתוך ${batches.length}. טפל רק ביחידות שבקבוצה הנוכחית.`:"";
      const notRelMention=(i===0&&notRelCount.length)?`\n\nהערה: ${notRelCount.length} יחידות סומנו "לא רלוונטי" ואינן נכללות.`:"";
      const eternalNote=isEternal?`\n\nהוראה: "${concept}" הוא פרמטר תחת "ברית". הסתמך רק על השדה הגלוי — הופעת המילים "נצח/לנצח/עולם/לעולם/לעולמים/עד עולם/לדור ודור". אין פרמטרים.`:"";
      const prompt=`אתה עוזר מחקר לתזה בתנ"ך. אנו מנתחים את עיצוב המושג "${concept}" בדמות ${who} בכרוניסט.${batchInfo}

שלב 3: בסיס טקסטואלי + נושא הממצא.

לכל יחידה — קבע שני דברים:
1. בסיס טקסטואלי: מה בפועל נאמר/קורה בטקסט שגרם לסימון
2. נושא הממצא: מי נושא התופעה (4 קטגוריות אפשריות):
   א) דוד עצמו — הפועל/האומר
   ב) המספר בעיצוב דוד — תיאור/מסגור של המספר
   ג) דמות אחרת ביחס לדוד — עמשי, יואב, בני יששכר, לויים וכו'
   ד) הסביבה המלכותית — מערכת/מוסד/קבוצה סביב דוד

כלל חמור: אל תייחס לדוד ממצא ששייך לדמות אחרת. "רוח לבשה את עמשי" → נושא הממצא עמשי. "יודעי בינה לעתים" → נושא הממצא בני יששכר.

חובת ציטוט: לכל ממצא, צטט פרשן ועמוד מתוך המסקנה המחקרית. אסור להמציא. אם אין פרשן ציטטת — "—".${eternalNote}

נתונים — ${batch.length} יחידות:

${blocks}${notRelMention}

${extra?`\nהנחיות נוספות: ${extra}\n`:""}

החזר JSON בלבד (ללא markdown):
{"tableRows":[["שם היחידה (פרק)","בסיס טקסטואלי קצר 2-3 משפטים","קטגוריית נושא + הסבר קצר","פרשן עמ' X; פרשן עמ' Y"]],"batchSummary":"סיכום 1-2 שורות של הקבוצה"}`;
      const resp=await aiCallDirect(prompt,4000);
      const parsed=parseJSON(resp);
      (parsed.tableRows||[]).forEach(r=>allRows.push(r));
      if(parsed.batchSummary) batchSummaries.push(parsed.batchSummary);
    }
    // ספירה גסה של נושאי ממצא
    let cD=0,cN=0,cO=0,cE=0;
    allRows.forEach(r=>{
      const sub=((r[2]||"")+"").toLowerCase();
      if(sub.includes("דוד עצמו")) cD++;
      else if(sub.includes("מספר")) cN++;
      else if(sub.includes("אחרת")) cO++;
      else if(sub.includes("סביבה")) cE++;
    });
    return{
      status:"מוכן לאישור",hasTable:true,
      tableHeaders:["יחידה","בסיס טקסטואלי","נושא הממצא","פרשנים"],
      tableRows:allRows,
      summary:`${allRows.length} יחידות נותחו ב-${batches.length} קבוצות. התפלגות נושאי הממצא: ${cD} דוד עצמו, ${cN} המספר, ${cO} דמויות אחרות, ${cE} הסביבה המלכותית.${batchSummaries.length>1?" | סיכומי קבוצות: "+batchSummaries.join(" || "):""}`,
      selfCheck:`בדיקה עצמית: 1) טופלו ${allRows.length} יחידות בפיצול לקבוצות של עד ${BATCH}. 2) בכל יחידה סווג נושא הממצא לאחת מ-4 קטגוריות. 3) האם אינדיקטורים ששייכים לדמויות אחרות (עמשי, בני יששכר, יואב, לויים) סווגו נכון ולא יוחסו לדוד? זו הבדיקה הקריטית — אם לא, לחצי "דחה והרץ שוב" עם הנחיות ממוקדות.`
    };
  }

  // ─────── שלב 4: איחוד אינדיקטורים לתופעות טקסטואליות ───────
  async function runStage4(extra=""){
    const s3=stageData.stage3;
    if(!s3||!s3.tableRows||!s3.tableRows.length){
      return{status:"אין נתונים",hasTable:false,
        summary:"לא ניתן להריץ שלב 4 — אין תוצאות משלב 3. הריצי ואשרי קודם את שלב 3.",
        selfCheck:"יש להריץ ואשרי קודם את שלב 3."};
    }
    const who=character==="solomon"?"שלמה":"דוד";
    const rows=s3.tableRows;
    const stage3Block=rows.map((r,i)=>`${i+1}. יחידה: ${r[0]||""}\n   בסיס טקסטואלי: ${r[1]||""}\n   נושא: ${r[2]||""}\n   פרשנים: ${r[3]||"—"}`).join("\n\n");
    const prompt=`אתה עוזר מחקר לתזה בתנ"ך על עיצוב דמות ${who} בכרוניסט. המושג הנחקר: "${concept}".

שלב 4: איחוד האינדיקטורים ל-3 עד 6 תופעות טקסטואליות.

לפניך ${rows.length} אינדיקטורים ממוספרים (1-${rows.length}) מכל היחידות הרלוונטיות — פלט שלב 3. יש לקבץ אותם לתופעות טקסטואליות. כל תופעה תהפוך לכותרת-משנה בפרק של התזה.

כללים מתודולוגיים קריטיים:
1. שם התופעה חייב להיות תיאורי בלבד — אסור שיכיל את המילה "${concept}" או נגזרת שלה (${concept==="רוח/ריח"?"כולל רוח או ריח":""}${concept==="אחד/יחד"?"כולל אחד או יחד":""}${concept==="נצח"?"כולל נצח, לנצח, תמיד":""}${concept==="עולם"?"כולל עולם, לעולם, לעולמים":""}). דוגמאות ראויות: "ייחוס תכונה למספר דמויות משנה", "פעולות הכנה למקדש", "אנשים שרוח ה' לבשה אותם".
2. הקיבוץ מתבצע לפי דפוס טקסטואלי מתוך הטקסטים — לא לפי הגדרה תאולוגית של המושג.
3. 3-6 תופעות הוא הטווח הרצוי. אם מעט אינדיקטורים — אפשר פחות; אם מגוון גדול — אפשר יותר.
4. **חובה מוחלטת**: כל ${rows.length} האינדיקטורים (1 עד ${rows.length}) חייבים להופיע בלפחות אחת מרשימות ה-indicatorIndices. **לא תשמיטי שום מספר**. לפני ההחזרה, בדקי שהאיחוד של כל ה-indicatorIndices מכסה את המספרים 1,2,3...${rows.length} ללא פערים. אם אינדיקטור מסוים לא מתאים לאף דפוס מהותי — הוסיפי תופעה שבעה נקראת "אינדיקטורים פזורים או ייחודיים" והכניסי אותו שם, עם הסבר קצר ב-description.
5. אינדיקטור יכול להופיע ביותר מתופעה אחת אם הוא תורם לכמה דפוסים שונים.
6. **חובה חדשה — indicatorIndices**: לכל תופעה החזירי מערך של מספרי האינדיקטורים (1-${rows.length}) ששייכים לה. זה מאפשר למשתמשת לפתוח כל תופעה ולראות את האינדיקטורים המקוריים והפסוקים התומכים בה — דרישה של ד"ר עמר.
7. נושא דומיננטי — הקטגוריה שהכי הרבה אינדיקטורים באותה תופעה שייכים אליה.

נתוני שלב 3 (${rows.length} אינדיקטורים ממוספרים):

${stage3Block}

${extra?`\nהנחיות נוספות מהמשתמשת: ${extra}\n`:""}

החזרי JSON בלבד (ללא markdown):
{"phenomena":[{"name":"שם תיאורי קצר (ללא המושג)","description":"2-3 משפטים — מה המכנה המשותף","unitsText":"יח1, יח2, יח3 (רשימת שמות היחידות, לקריאה אנושית)","indicatorIndices":[1,3,5,7],"subject":"דוד עצמו | המספר | דמות אחרת | סביבה | מעורב","commentators":"פרשן עמ' X; פרשן עמ' Y או —"}],"methodNote":"הערת שיטה 1-2 משפטים על אופן הקיבוץ"}`;
    const resp=await aiCallDirect(prompt,4000);
    const parsed=parseJSON(resp);
    const phenomena=parsed.phenomena||[];
    const tableRows=phenomena.map(p=>[p.name||"",p.description||"",p.unitsText||p.units||"",p.subject||"",p.commentators||"—"]);
    const phenomenaMeta=phenomena.map(p=>({
      indicatorIndices:Array.isArray(p.indicatorIndices)
        ?p.indicatorIndices.filter(i=>Number.isInteger(i)&&i>=1&&i<=rows.length)
        :[]
    }));
    // בדיקות בדיעבד
    const conceptWords=(concept.split("/")||[concept]).map(w=>w.trim()).filter(Boolean);
    const nameUsesConcept=phenomena.filter(p=>conceptWords.some(w=>(p.name||"").includes(w))).length;
    const mappedSet=new Set();
    phenomenaMeta.forEach(m=>m.indicatorIndices.forEach(i=>mappedSet.add(i)));
    const missingIndices=[];
    for(let i=1;i<=rows.length;i++){ if(!mappedSet.has(i)) missingIndices.push(i); }
    const unmappedCount=missingIndices.length;
    const missingList=missingIndices.length?` [חסרים: ${missingIndices.join(", ")}]`:"";
    return{
      status:"מוכן לאישור",hasTable:true,
      tableHeaders:["שם התופעה","תיאור","יחידות","נושא דומיננטי","פרשנים"],
      tableRows,
      phenomenaMeta, // חדש: מאפשר drill-down לאינדיקטורים משלב 3
      summary:`זוהו ${phenomena.length} תופעות טקסטואליות מתוך ${rows.length} אינדיקטורים (${mappedSet.size} משויכים, ${unmappedCount} לא משויכים${missingList}).${parsed.methodNote?` | הערת שיטה: ${parsed.methodNote}`:""}`,
      selfCheck:`בדיקה עצמית: 1) שמות התופעות ללא המושג "${concept}"? ${nameUsesConcept===0?"✓ כולן נייטרליות.":`⚠ ${nameUsesConcept} תופעות עדיין מכילות את המושג — דחי והרץ שוב עם הנחיה למחוק מהשמות.`} 2) מספר התופעות (${phenomena.length}) בטווח 3-6? ${phenomena.length>=3&&phenomena.length<=6?"✓":"⚠ מחוץ לטווח — ייתכן ונחוץ איחוד או פיצול."} 3) כיסוי אינדיקטורים: ${unmappedCount===0?`✓ כל ${rows.length} האינדיקטורים משויכים לתופעה.`:`⚠ ${unmappedCount} אינדיקטורים לא שויכו: ${missingIndices.join(", ")}. פתחי את טבלת "אינדיקטורים לא משויכים" מתחת לטבלת התופעות — זו הצגה אוטומטית של השורות החסרות משלב 3. דחי והריצי שוב עם הנחיה לכסות את כולם, או ערכי ידנית.`} 4) לחצי "▼ פרט" ליד כל תופעה כדי לוודא שהאינדיקטורים ששויכו אליה אכן מתאימים לדפוס. 5) האם שמות התופעות ישמשו ככותרות-משנה בפרק של התזה?`
    };
  }

  async function runStage(n,extra=""){
    setLoading(true); setProgressNote("");
    try{
      let result;
      if(n===1) result=runStage1();
      else if(n===2) result=runStage2();
      else if(n===3) result=await runStage3(extra);
      else if(n===4) result=await runStage4(extra);
      else {
        // שלבים 5-7 — יבואו בסבבים הבאים
        await new Promise(r=>setTimeout(r,500));
        result={
          status:"בפיתוח",hasTable:true,
          tableHeaders:["עמודה 1","עמודה 2","עמודה 3"],
          tableRows:[["שלב "+n,"יתווסף בסבב הבא","—"]],
          summary:`שלב ${n} (${STAGE_LABELS[n]}) — טרם נבנה. סבב בנייה הבא יוסיף אותו.`,
          selfCheck:"בפיתוח."
        };
      }
      const newData={...stageData,[`stage${n}`]:result};
      saveNow(newData);
    } catch(e){
      // שגיאות לא נשמרות
      setStageData({...stageData,[`stage${n}`]:{status:"שגיאה",hasTable:false,summary:`⚠️ ${e.message||e}`,selfCheck:"נסי שוב — השגיאה לא נשמרה."}});
    }
    setLoading(false); setProgressNote("");
  }

  function approveStage(n){
    const approved=[...(stageData.approvedStages||[]),n].filter((v,i,a)=>a.indexOf(v)===i);
    saveNow({...stageData,approvedStages:approved});
    if(n<7) setCurrentStage(n+1);
  }
  function unapproveStage(n){
    saveNow({...stageData,approvedStages:(stageData.approvedStages||[]).filter(s=>s!==n)});
    setCurrentStage(n);
  }

  return(
    <div style={{maxWidth:"1100px",margin:"0 auto",padding:"20px 16px"}}>
      {/* כותרת */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"16px",padding:"14px 18px",background:"#1e293b",borderRadius:"10px",border:`1px solid ${dimColor}44`}}>
        <div>
          <div style={{fontSize:"18px",fontWeight:"bold",color:"#f1f5f9"}}>{concept} <span style={{fontSize:"14px",color:dimColor,fontWeight:"600"}}>· ב{charName}</span></div>
          <div style={{fontSize:"11px",color:"#64748b",marginTop:"2px"}}>ממד: {dimLabel}</div>
        </div>
        <button onClick={onBackToSelector} style={{padding:"6px 14px",borderRadius:"7px",border:"1px solid #334155",cursor:"pointer",background:"transparent",color:"#94a3b8",fontSize:"12px",fontWeight:"600"}}>↩ בחירת מושג</button>
      </div>

      {/* סטטוס בנייה */}
      <div style={{marginBottom:"14px",padding:"10px 14px",background:"#1e3a5f",borderRadius:"7px",border:"1px solid #3b82f6",fontSize:"12px",color:"#bfdbfe",lineHeight:"1.6"}}>
        <strong>סטטוס בנייה:</strong> שלבים 1-4 בנויים. שלבים 5-7 בפיתוח. לחצי על כותרת שלב פעיל כדי לקפוץ אליו, או על שלב שאושר כדי לפתוח אותו לעיון/ביקורת.
      </div>

      {/* 7 שלבים */}
      {[1,2,3,4,5,6,7].map(n=>{
        const approved=(stageData.approvedStages||[]).includes(n);
        const current=n===currentStage&&!approved;
        const expanded=expandedStages.has(n);
        const showContent=current||(approved&&expanded);
        const hasResult=stageData[`stage${n}`];
        const mode=STAGE_MODE[n];
        const badge=mode==="computational"?{text:"חישוב מיידי",color:"#60a5fa",bg:"#1e3a5f44"}
                    :mode==="ai_defs"?{text:"AI + הגדרות",color:"#c084fc",bg:"#581c8744"}
                    :{text:"AI",color:"#fbbf24",bg:"#78350f44"};
        const icon=approved?(expanded?"▼":"✓"):current?"▶":"○";
        const color=approved?"#34d399":current?dimColor:"#475569";
        return(
          <div key={n} style={{marginBottom:"8px"}}>
            <div onClick={()=>{ if(approved){ toggleExpanded(n); } else { setCurrentStage(n); } }}
              style={{display:"flex",alignItems:"center",gap:"12px",padding:"10px 14px",borderRadius:"8px",background:(current||expanded)?"#1e293b":"#0f172a",border:`1px solid ${current?color:(expanded?"#34d39944":"#334155")}`,cursor:"pointer"}}>
              <span style={{fontSize:"18px",color,fontWeight:"700",minWidth:"18px"}}>{icon}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:"13px",fontWeight:"700",color:(current||expanded)?"#f1f5f9":approved?"#cbd5e1":"#64748b",display:"flex",alignItems:"center",gap:"8px"}}>
                  שלב {n}: {STAGE_LABELS[n]}
                  <span style={{fontSize:"10px",color:badge.color,background:badge.bg,padding:"1px 7px",borderRadius:"9px",fontWeight:"700"}}>{badge.text}</span>
                  {approved&&!expanded&&<span style={{fontSize:"10px",color:"#64748b",fontWeight:"400"}}>· לחצי לפתיחה</span>}
                  {approved&&expanded&&<span style={{fontSize:"10px",color:"#34d399",fontWeight:"400"}}>· במצב עיון</span>}
                </div>
                <div style={{fontSize:"11px",color:"#64748b",marginTop:"2px"}}>{STAGE_DESC[n]}</div>
              </div>
              {approved&&<button onClick={(e)=>{e.stopPropagation();unapproveStage(n);}} style={{padding:"4px 10px",borderRadius:"5px",border:"1px solid #475569",cursor:"pointer",background:"transparent",color:"#94a3b8",fontSize:"10px",fontWeight:"600"}}>בטל אישור</button>}
            </div>

            {showContent&&(
              <div style={{marginTop:"8px",marginRight:"30px",padding:"14px",background:"#1e293b",borderRadius:"8px",border:`1px solid ${dimColor}33`}}>
                {!hasResult&&(
                  <div>
                    <div style={{fontSize:"12px",color:"#94a3b8",marginBottom:"10px"}}>לחצי להרצת השלב.</div>
                    <button onClick={()=>runStage(n)} disabled={loading}
                      style={{padding:"9px 18px",borderRadius:"7px",border:"none",cursor:loading?"wait":"pointer",background:loading?"#475569":dimColor,color:"white",fontSize:"12px",fontWeight:"700"}}>
                      {loading?(progressNote||"רץ..."):"▶ הפעל שלב"}
                    </button>
                  </div>
                )}

                {hasResult&&(
                  <div>
                    {/* סרגל פעולות: עריכה / שמירה / ייצוא */}
                    <div style={{display:"flex",gap:"8px",marginBottom:"12px",flexWrap:"wrap"}}>
                      <button onClick={()=>downloadStageAsWord(n,hasResult)} style={{padding:"6px 12px",borderRadius:"6px",border:"1px solid #475569",cursor:"pointer",background:"#1e293b",color:"#cbd5e1",fontSize:"11px",fontWeight:"600"}}>📄 הורד כ-Word</button>
                      {!editMode[n]&&(<button onClick={()=>startEdit(n,hasResult)} style={{padding:"6px 12px",borderRadius:"6px",border:"1px solid #475569",cursor:"pointer",background:"#1e293b",color:"#cbd5e1",fontSize:"11px",fontWeight:"600"}}>✏️ עריכה</button>)}
                      {editMode[n]&&(<>
                        <button onClick={()=>saveEdit(n)} style={{padding:"6px 14px",borderRadius:"6px",border:"none",cursor:"pointer",background:"#34d399",color:"white",fontSize:"11px",fontWeight:"700"}}>💾 שמור שינויים</button>
                        <button onClick={()=>cancelEdit(n)} style={{padding:"6px 12px",borderRadius:"6px",border:"1px solid #475569",cursor:"pointer",background:"transparent",color:"#94a3b8",fontSize:"11px",fontWeight:"600"}}>ביטול</button>
                        <span style={{alignSelf:"center",fontSize:"10px",color:"#fbbf24"}}>במצב עריכה — שינויים לא נשמרו עדיין</span>
                      </>)}
                      {hasResult.manuallyEdited&&!editMode[n]&&(<span style={{alignSelf:"center",fontSize:"10px",color:"#fbbf24"}}>⚠ נערך ידנית</span>)}
                    </div>

                    {hasResult.hasTable&&(
                      <div style={{overflowX:"auto",marginBottom:"12px"}}>
                        <table style={{fontSize:"12px"}}>
                          <thead>
                            <tr style={{background:"#0f172a"}}>
                              {(hasResult.tableHeaders||[]).map((h,i)=>(<th key={i} style={{textAlign:"right",color:dimColor,fontWeight:"700",borderBottom:`1px solid ${dimColor}44`}}>{h}</th>))}
                              {n===4&&hasResult.phenomenaMeta&&!editMode[n]&&(<th style={{borderBottom:`1px solid ${dimColor}44`,width:"80px"}}></th>)}
                            </tr>
                          </thead>
                          <tbody>
                            {((editMode[n]?(editDraft[n]&&editDraft[n].tableRows):hasResult.tableRows)||[]).map((row,i)=>{
                              const meta=(n===4&&hasResult.phenomenaMeta&&hasResult.phenomenaMeta[i])||null;
                              const isOpen=!!expandedPhenomena[i];
                              const s3rows=(stageData.stage3&&stageData.stage3.tableRows)||[];
                              return (<React.Fragment key={i}>
                                <tr style={{borderBottom:isOpen?"none":"1px solid #334155"}}>
                                  {row.map((c,j)=>(<td key={j} style={{color:"#cbd5e1",verticalAlign:"top"}}>
                                    {editMode[n]?(
                                      <textarea value={c||""} onChange={e=>updateCell(n,i,j,e.target.value)}
                                        style={{width:"100%",minHeight:"60px",padding:"5px",background:"#0f172a",border:"1px solid #475569",borderRadius:"4px",color:"#f1f5f9",fontSize:"12px",fontFamily:"inherit",resize:"vertical",direction:"rtl"}}/>
                                    ):c}
                                  </td>))}
                                  {n===4&&meta&&!editMode[n]&&(
                                    <td style={{verticalAlign:"top"}}>
                                      <button onClick={()=>togglePhenomenon(i)}
                                        style={{padding:"4px 10px",borderRadius:"5px",border:`1px solid ${dimColor}44`,cursor:"pointer",background:isOpen?`${dimColor}22`:"transparent",color:dimColor,fontSize:"10px",fontWeight:"700",whiteSpace:"nowrap"}}>
                                        {isOpen?"▲ קפל":`▼ פרט (${meta.indicatorIndices.length})`}
                                      </button>
                                    </td>
                                  )}
                                </tr>
                                {n===4&&meta&&isOpen&&meta.indicatorIndices.length>0&&!editMode[n]&&(
                                  <tr style={{borderBottom:"1px solid #334155"}}>
                                    <td colSpan={row.length+1} style={{padding:"0 0 10px"}}>
                                      <div style={{padding:"10px 14px",background:"#0a0f1c",borderRadius:"6px",borderRight:`3px solid ${dimColor}`,marginRight:"20px"}}>
                                        <div style={{fontSize:"11px",color:"#94a3b8",marginBottom:"8px",fontWeight:"600"}}>אינדיקטורי שלב 3 שתורמים לתופעה זו ({meta.indicatorIndices.length}):</div>
                                        <table style={{fontSize:"11px",width:"100%"}}>
                                          <thead><tr style={{background:"#1e293b"}}>
                                            <th style={{textAlign:"right",color:"#64748b",padding:"5px 8px",width:"30px"}}>#</th>
                                            <th style={{textAlign:"right",color:"#64748b",padding:"5px 8px"}}>יחידה</th>
                                            <th style={{textAlign:"right",color:"#64748b",padding:"5px 8px"}}>בסיס טקסטואלי</th>
                                            <th style={{textAlign:"right",color:"#64748b",padding:"5px 8px"}}>נושא</th>
                                            <th style={{textAlign:"right",color:"#64748b",padding:"5px 8px"}}>פרשנים</th>
                                          </tr></thead>
                                          <tbody>
                                            {meta.indicatorIndices.map(idx=>{
                                              const r=s3rows[idx-1];
                                              if(!r) return (<tr key={idx}><td colSpan={5} style={{color:"#ef4444",padding:"4px 8px"}}>⚠ אינדיקטור #{idx} לא נמצא בשלב 3</td></tr>);
                                              return (<tr key={idx} style={{borderBottom:"1px solid #1e293b"}}>
                                                <td style={{color:"#64748b",padding:"4px 8px",verticalAlign:"top"}}>{idx}</td>
                                                <td style={{color:"#cbd5e1",padding:"4px 8px",verticalAlign:"top",fontWeight:"600"}}>{r[0]||""}</td>
                                                <td style={{color:"#cbd5e1",padding:"4px 8px",verticalAlign:"top"}}>{r[1]||""}</td>
                                                <td style={{color:"#94a3b8",padding:"4px 8px",verticalAlign:"top"}}>{r[2]||""}</td>
                                                <td style={{color:"#94a3b8",padding:"4px 8px",verticalAlign:"top",fontSize:"10px"}}>{r[3]||"—"}</td>
                                              </tr>);
                                            })}
                                          </tbody>
                                        </table>
                                      </div>
                                    </td>
                                  </tr>
                                )}
                              </React.Fragment>);
                            })}
                          </tbody>
                        </table>
                      </div>
                    )}
                    {/* שלב 4: הצגה אוטומטית של אינדיקטורים לא משויכים לאף תופעה */}
                    {n===4&&hasResult.phenomenaMeta&&(()=>{
                      const mSet=new Set();
                      hasResult.phenomenaMeta.forEach(m=>(m.indicatorIndices||[]).forEach(i=>mSet.add(i)));
                      const s3r=(stageData.stage3&&stageData.stage3.tableRows)||[];
                      const missing=[];
                      for(let i=1;i<=s3r.length;i++){ if(!mSet.has(i)) missing.push(i); }
                      if(missing.length===0) return null;
                      return (
                        <div style={{marginBottom:"12px",padding:"12px 14px",background:"#78350f22",border:"1px solid #f59e0b",borderRadius:"6px"}}>
                          <div style={{fontSize:"12px",color:"#fcd34d",fontWeight:"700",marginBottom:"8px"}}>⚠ אינדיקטורים לא משויכים ({missing.length} מתוך {s3r.length}): {missing.join(", ")}</div>
                          <div style={{fontSize:"10px",color:"#fde68a",marginBottom:"10px"}}>אלה אינדיקטורים משלב 3 שלא נכנסו לאף תופעה. אפשרויות: (א) להריץ את שלב 4 שוב עם הנחיה לכסות אותם; (ב) להיכנס למצב עריכה ולהוסיף אותם ידנית לתופעה קיימת (עדכני את עמודת "יחידות") או ליצור תופעה חדשה.</div>
                          <table style={{fontSize:"11px",width:"100%"}}>
                            <thead><tr style={{background:"#1e293b"}}>
                              <th style={{textAlign:"right",color:"#fcd34d",padding:"4px 8px",width:"30px"}}>#</th>
                              <th style={{textAlign:"right",color:"#fcd34d",padding:"4px 8px"}}>יחידה</th>
                              <th style={{textAlign:"right",color:"#fcd34d",padding:"4px 8px"}}>בסיס טקסטואלי</th>
                              <th style={{textAlign:"right",color:"#fcd34d",padding:"4px 8px"}}>נושא</th>
                              <th style={{textAlign:"right",color:"#fcd34d",padding:"4px 8px"}}>פרשנים</th>
                            </tr></thead>
                            <tbody>
                              {missing.map(idx=>{
                                const r=s3r[idx-1];
                                if(!r) return (<tr key={idx}><td colSpan={5} style={{color:"#ef4444",padding:"4px 8px"}}>אינדיקטור #{idx} לא נמצא בשלב 3</td></tr>);
                                return (<tr key={idx} style={{borderBottom:"1px solid #1e293b"}}>
                                  <td style={{color:"#fcd34d",padding:"4px 8px",verticalAlign:"top"}}>{idx}</td>
                                  <td style={{color:"#fef3c7",padding:"4px 8px",verticalAlign:"top",fontWeight:"600"}}>{r[0]||""}</td>
                                  <td style={{color:"#fef3c7",padding:"4px 8px",verticalAlign:"top"}}>{r[1]||""}</td>
                                  <td style={{color:"#fde68a",padding:"4px 8px",verticalAlign:"top"}}>{r[2]||""}</td>
                                  <td style={{color:"#fde68a",padding:"4px 8px",verticalAlign:"top",fontSize:"10px"}}>{r[3]||"—"}</td>
                                </tr>);
                              })}
                            </tbody>
                          </table>
                        </div>
                      );
                    })()}
                    {hasResult.summary&&(
                      <div style={{marginBottom:"10px",padding:"10px 12px",background:"#0f172a",borderRadius:"6px",borderRight:`3px solid ${dimColor}`}}>
                        <div style={{fontSize:"10px",color:dimColor,fontWeight:"700",marginBottom:"4px"}}>סיכום השלב</div>
                        {editMode[n]?(
                          <textarea value={(editDraft[n]&&editDraft[n].summary)||""} onChange={e=>updateField(n,"summary",e.target.value)}
                            style={{width:"100%",minHeight:"80px",padding:"6px",background:"#1e293b",border:"1px solid #475569",borderRadius:"4px",color:"#f1f5f9",fontSize:"12px",fontFamily:"inherit",resize:"vertical",direction:"rtl"}}/>
                        ):(
                          <div style={{fontSize:"12px",color:"#cbd5e1",lineHeight:"1.6"}}>{hasResult.summary}</div>
                        )}
                      </div>
                    )}
                    {hasResult.selfCheck&&(
                      <div style={{marginBottom:"12px",padding:"9px 12px",background:"#0f172a",borderRadius:"6px",border:"1px dashed #475569"}}>
                        <div style={{fontSize:"10px",color:"#94a3b8",fontWeight:"700",marginBottom:"4px"}}>🔍 בדיקה עצמית</div>
                        {editMode[n]?(
                          <textarea value={(editDraft[n]&&editDraft[n].selfCheck)||""} onChange={e=>updateField(n,"selfCheck",e.target.value)}
                            style={{width:"100%",minHeight:"60px",padding:"6px",background:"#1e293b",border:"1px solid #475569",borderRadius:"4px",color:"#f1f5f9",fontSize:"11px",fontFamily:"inherit",resize:"vertical",direction:"rtl"}}/>
                        ):(
                          <div style={{fontSize:"11px",color:"#94a3b8",lineHeight:"1.6"}}>{hasResult.selfCheck}</div>
                        )}
                      </div>
                    )}
                    <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
                      {approved?(
                        <div style={{fontSize:"11px",color:"#64748b",padding:"6px 0"}}>👁 מצב עיון בלבד. להרצה מחדש או שינוי — לחצי "בטל אישור" למעלה.</div>
                      ):hasResult.status==="שגיאה"?(
                        <button onClick={()=>runStage(n)} disabled={loading} style={{padding:"8px 18px",borderRadius:"7px",border:"none",cursor:"pointer",background:"#f59e0b",color:"white",fontSize:"12px",fontWeight:"700"}}>🔄 הפעל שוב</button>
                      ):(
                        <>
                          <button onClick={()=>approveStage(n)} style={{padding:"8px 16px",borderRadius:"7px",border:"none",cursor:"pointer",background:"#34d399",color:"white",fontSize:"12px",fontWeight:"700"}}>✓ אשר {n<7?"ועבור לשלב הבא":"סיים ניתוח"}</button>
                          <button onClick={()=>runStage(n)} disabled={loading} style={{padding:"8px 16px",borderRadius:"7px",border:"1px solid #ef4444",cursor:"pointer",background:"transparent",color:"#ef4444",fontSize:"12px",fontWeight:"700"}}>🔄 הפעל שוב</button>
                        </>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════
// ── אפליקציה ראשית ─────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
function App(){
  const [screen,setScreen]=useState("home");
  // ה-raw נטען אוטומטית מ-Firebase מהכלי האנליטי (אין צורך להעלות גיבוי).
  // גיבוי JSON מהמחשב נשאר כאופציה חלופית.
  const [raw,setRaw]=useState(null);
  const [rawSource,setRawSource]=useState(""); // "firebase" | "file" | ""
  const [fbStatus,setFbStatus]=useState("loading"); // "loading" | "loaded" | "empty" | "error"
  // stageResults — מקור האמת לתוצאות השלבים (נטען מ-Firebase, נמשך ללוקאל ולפיירבייס בכל שמירה)
  const [stageResults,setStageResults]=useState(()=>LS_get("stageResults",{}));
  // bootDone — דגל שחוסם את הכניסה לניתוח עד שהטעינה מ-Firebase הסתיימה
  const [bootDone,setBootDone]=useState(false);
  const [apiKey,setApiKey]=useState(()=>LS_get("apiKey",""));
  const [showApiModal,setShowApiModal]=useState(false);
  const [selection,setSelection]=useState(null);

  // טעינה חד-פעמית מ-Firebase: גם ה-raw (research2) וגם תוצאות הסינתזה (synthesis_v1).
  useEffect(()=>{
    let rawDone=false, srDone=false;
    const check=()=>{ if(rawDone&&srDone) setBootDone(true); };
    fbLoadResearch(data=>{
      if(data){
        setRaw(data);
        setRawSource("firebase");
        setFbStatus("loaded");
      }else{
        setFbStatus("empty");
      }
      rawDone=true; check();
    });
    fbLoadStageResults(sr=>{
      // Firebase הוא המקור הסמכותי; מעדכן את ה-React state ואת ה-LS כמטמון מקומי.
      if(sr && Object.keys(sr).length){
        LS_set("stageResults",sr);
        setStageResults(sr);
      }
      srDone=true; check();
    });
  },[]);

  function handleBackup(data,name){
    // העלאת גיבוי מקומי (fallback) — דורס את מה שהגיע מ-Firebase.
    setRaw(data);
    setRawSource("file");
  }

  // גיבוי ושחזור של עבודת הסינתזה — נשארים כאופציה למשתמשת (למקרה שצריך קובץ חיצוני).
  function downloadSynthBackup(){
    const stageResults=LS_get("stageResults",{});
    const payload={
      version:"synthesis-v1",
      exportedAt:new Date().toISOString(),
      stageResults:stageResults,
    };
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`synthesis_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }
  function uploadSynthBackup(e){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.stageResults){ alert("קובץ לא תקין — לא נמצא stageResults"); return; }
        const current=LS_get("stageResults",{});
        const merged={...current,...data.stageResults};
        LS_set("stageResults",merged);
        fbSaveStageResults(merged); // סנכרון מיידי ל-Firebase
        alert(`✓ שוחזרו ${Object.keys(data.stageResults).length} מושגים (סה"כ כעת: ${Object.keys(merged).length}). סונכרן ל-Firebase.`);
        e.target.value=""; // reset
      }catch(err){ alert("שגיאה בטעינה: "+err.message); }
    };
    r.readAsText(f);
  }

  function handleApiKey(key){
    setApiKey(key); LS_set("apiKey",key);
  }

  const backupStats=useMemo(()=>{
    if(!raw) return null;
    const units=raw.units||[];
    const notesCount=Object.values(raw.compareNotes||{}).reduce((s,o)=>s+Object.values(o).filter(v=>v&&v.trim()).length,0);
    const conceptCount=allConceptsFrom(raw).length;
    return{
      units:units.length,
      davidCount:units.filter(u=>u.character==="david").length,
      solomonCount:units.filter(u=>u.character==="solomon").length,
      notes:notesCount,
      concepts:conceptCount
    };
  },[raw]);

  const canStart=raw&&apiKey;

  return(
    <div>
      {/* סרגל עליון */}
      <div style={{background:"#1e293b",borderBottom:"1px solid #334155",padding:"10px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:"14px"}}>
          <div style={{fontSize:"15px",fontWeight:"bold",color:"#f1f5f9",cursor:"pointer"}} onClick={()=>setScreen("home")}>🧬 כלי סינתזה — דברי הימים</div>
          {raw&&(
            <button onClick={()=>setScreen(screen==="home"?"selector":"home")} style={{padding:"5px 12px",borderRadius:"6px",border:"1px solid #475569",cursor:"pointer",background:"transparent",color:"#94a3b8",fontSize:"11px",fontWeight:"600"}}>
              {screen==="home"?"📊 התחלת ניתוח":"🏠 ראשי"}
            </button>
          )}
        </div>
        <div style={{display:"flex",gap:"8px",alignItems:"center",fontSize:"10px"}}>
          <span style={{color:fbStatus==="loading"?"#fbbf24":(fbStatus==="loaded"?"#34d399":(fbStatus==="empty"?"#94a3b8":"#f87171"))}}>
            🔥 {fbStatus==="loading"?"מתחבר...":(fbStatus==="loaded"?"Firebase":(fbStatus==="empty"?"ריק":"שגיאה"))}
          </span>
          <span style={{color:"#475569"}}>·</span>
          <span style={{color:raw?"#34d399":"#64748b"}}>📥 {raw?(rawSource==="firebase"?"נתונים":"מקומי"):"ללא"}</span>
          <span style={{color:"#475569"}}>·</span>
          <span style={{color:apiKey?"#34d399":"#64748b",cursor:"pointer"}} onClick={()=>setShowApiModal(true)}>🔑 {apiKey?"API":"ללא מפתח"}</span>
        </div>
      </div>

      {/* תוכן */}
      {screen==="home"&&<WelcomeScreen onBackupLoaded={handleBackup} hasBackup={!!raw} hasApiKey={!!apiKey} onOpenApiKey={()=>setShowApiModal(true)} backupStats={backupStats} fbStatus={fbStatus} rawSource={rawSource} onDownloadSynth={downloadSynthBackup} onUploadSynth={uploadSynthBackup}/>}
      {screen==="home"&&canStart&&bootDone&&(
        <div style={{textAlign:"center",marginTop:"-20px",paddingBottom:"30px"}}>
          <button onClick={()=>setScreen("selector")} style={{padding:"14px 36px",borderRadius:"10px",border:"none",cursor:"pointer",background:"#34d399",color:"white",fontSize:"15px",fontWeight:"700"}}>
            🚀 התחלת ניתוח
          </button>
          <div style={{marginTop:"10px",fontSize:"11px",color:"#64748b"}}>
            {Object.keys(stageResults).length>0 ? `✓ נטענו ${Object.keys(stageResults).length} מושגים עם תוצאות שלבים מ-Firebase` : "ללא תוצאות שלבים שמורות — נתחיל מאפס"}
          </div>
        </div>
      )}
      {screen==="home"&&canStart&&!bootDone&&(
        <div style={{textAlign:"center",marginTop:"-20px",paddingBottom:"30px"}}>
          <div className="pulse" style={{display:"inline-block",padding:"12px 30px",borderRadius:"10px",background:"#334155",color:"#cbd5e1",fontSize:"14px"}}>
            ⏳ טוען תוצאות שלבים מ-Firebase... (יתעדכן לכפתור ברגע שנסיים)
          </div>
        </div>
      )}
      {screen==="selector"&&raw&&<ConceptSelector raw={raw} onPick={sel=>{setSelection(sel);setScreen("analyze");}} onBackHome={()=>setScreen("home")} stageResults={stageResults}/>}
      {screen==="analyze"&&selection&&<AnalysisScreen raw={raw} character={selection.character} dimId={selection.dimId} concept={selection.concept} apiKey={apiKey} onBackToSelector={()=>setScreen("selector")} stageResults={stageResults} setStageResults={setStageResults}/>}

      {showApiModal&&<ApiKeyModal currentKey={apiKey} onSave={handleApiKey} onClose={()=>setShowApiModal(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
