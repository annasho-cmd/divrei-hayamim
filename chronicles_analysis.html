// ── Diff engine ───────────────────────────────────────────────────────
function stripNiqqud(s){ return s.replace(/[\u0591-\u05C7]/g,''); }
const NORM_MAP = {'דויד':'דוד','ירושלים':'ירושלם'};
function norm(w){
  const str = typeof w==='object'?w.word:w;
  const s = stripNiqqud(str).replace(/[׃׀:.,;()\[\]״׳"'!?]+/g,'').trim();
  return NORM_MAP[s]||s;
}
// tokenize returns [{raw, clean, isVerse}]
// raw  = original token (e.g. "(א)")
// clean = stripped of punctuation (e.g. "א" or "ישראל")
// isVerse = true only for tokens like (א) (יב) — paren-wrapped 1-4 Hebrew letters
function tokenize(t){
  if(!t) return [];
  return t.trim().split(/[\s\n\r]+/).map(raw=>{
    const isVerse = /^\([\u05D0-\u05EA]{1,4}\)$/.test(raw.trim());
    const clean   = raw.replace(/^[׃:,.;()\[\]״׳"'!?]+|[׃:,.;()\[\]״׳"'!?]+$/g,'');
    return {raw, clean, isVerse};
  }).filter(t=>t.raw.length>0);
}

// ── LCS diff ─────────────────────────────────────────────────────────
// Deterministic ID based on position — so IDs survive re-renders
function mkId(i){ return 'chunk_'+i; }

function lcs(a,b){
  // a,b are arrays of non-verse token objects
  const m=a.length,n=b.length;
  const dp=[];
  for(let i=0;i<=m;i++){dp[i]=new Array(n+1).fill(0);}
  for(let i=1;i<=m;i++)
    for(let j=1;j<=n;j++)
      dp[i][j]=norm(a[i-1].clean)===norm(b[j-1].clean)
        ?dp[i-1][j-1]+1
        :Math.max(dp[i-1][j],dp[i][j-1]);
  const r=[];let i=m,j=n;
  while(i>0||j>0){
    if(i>0&&j>0&&norm(a[i-1].clean)===norm(b[j-1].clean)){r.unshift({t:'eq',a:a[i-1].raw,b:b[j-1].raw});i--;j--;}
    else if(j>0&&(i===0||dp[i][j-1]>=dp[i-1][j])){r.unshift({t:'om',b:b[j-1].raw});j--;}
    else{r.unshift({t:'ad',a:a[i-1].raw});i--;}
  }
  return r;
}

function buildChunks(raw){
  const res=[];let i=0,pos=0;
  while(i<raw.length){
    const c=raw[i];
    if(c.t==='ad'&&raw[i+1]&&raw[i+1].t==='om'){
      res.push({id:mkId(pos++),type:'changed',aW:[c.a],bW:[raw[i+1].b]});i+=2;
    } else if(c.t==='om'&&raw[i+1]&&raw[i+1].t==='ad'){
      res.push({id:mkId(pos++),type:'changed',aW:[raw[i+1].a],bW:[c.b]});i+=2;
    } else if(c.t==='ad'){
      res.push({id:mkId(pos++),type:'added',aW:[c.a],bW:[]});i++;
    } else if(c.t==='om'){
      res.push({id:mkId(pos++),type:'omitted',aW:[],bW:[c.b]});i++;
    } else {
      res.push({id:mkId(pos++),type:'equal',aW:[c.a],bW:[c.b]});i++;
    }
  }
  return res;
}

// Split text into verse segments: [{label, tokens}]
function splitToVerses(allTokens){
  const segs=[];let cur={label:'',tokens:[]};
  allTokens.forEach(t=>{
    if(t.isVerse){if(cur.tokens.length||cur.label)segs.push(cur);cur={label:t.raw,tokens:[]};}
    else{cur.tokens.push(t);}
  });
  if(cur.tokens.length||cur.label)segs.push(cur);
  return segs;
}
function verseSim(tokensA,tokensB){
  if(!tokensA.length&&!tokensB.length)return 1;
  if(!tokensA.length||!tokensB.length)return 0;
  const setA=new Set(tokensA.map(t=>norm(t.clean)).filter(w=>w.length>1));
  const setB=new Set(tokensB.map(t=>norm(t.clean)).filter(w=>w.length>1));
  if(!setA.size&&!setB.size)return 1;
  if(!setA.size||!setB.size)return 0;
  let common=0;setA.forEach(w=>{if(setB.has(w))common++;});
  return common/Math.max(setA.size,setB.size);
}
function matchVerses(versesA,versesB,threshold=0.25){
  const m=versesA.length,n=versesB.length;
  const sim=Array.from({length:m},(_,i)=>Array.from({length:n},(_,j)=>verseSim(versesA[i].tokens,versesB[j].tokens)));
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=sim[i-1][j-1]>=threshold?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const pairs=[];let i=m,j=n;
  while(i>0&&j>0){
    if(sim[i-1][j-1]>=threshold&&dp[i][j]===dp[i-1][j-1]+1){pairs.unshift({aIdx:i-1,bIdx:j-1});i--;j--;}
    else if(dp[i-1][j]>=dp[i][j-1])i--;else j--;
  }
  return pairs;
}
function computeDiff(tA,tB){
  try{
    const allA=tokenize(tA),allB=tokenize(tB);
    if(!allA.length&&!allB.length)return[];
    const versesA=splitToVerses(allA),versesB=splitToVerses(allB);
    const pairs=matchVerses(versesA,versesB);
    const matchedB=new Set(pairs.map(p=>p.bIdx));
    const result=[];let pos=0,aIdx=0,bPtr=0;
    for(const pair of pairs){
      while(aIdx<pair.aIdx){
        const vA=versesA[aIdx];
        result.push({id:'v_'+pos++,type:'verse',aW:[vA.label],bW:[]});
        vA.tokens.forEach(t=>result.push({id:'c_'+pos++,type:'unmatched',aW:[t.raw],bW:[]}));
        aIdx++;
      }
      while(bPtr<pair.bIdx){
        if(!matchedB.has(bPtr)){
          const vB=versesB[bPtr];
          result.push({id:'v_'+pos++,type:'verse',aW:[],bW:[vB.label]});
          vB.tokens.forEach(t=>result.push({id:'c_'+pos++,type:'unmatched',aW:[],bW:[t.raw]}));
        }
        bPtr++;
      }
      const vA=versesA[pair.aIdx],vB=versesB[pair.bIdx];
      result.push({id:'v_'+pos++,type:'verse',aW:[vA.label],bW:[vB.label]});
      buildChunks(lcs(vA.tokens,vB.tokens)).forEach(ch=>{ch.id='c_'+pos++;result.push(ch);});
      aIdx=pair.aIdx+1;bPtr=pair.bIdx+1;
    }
    while(aIdx<versesA.length){
      const vA=versesA[aIdx];
      result.push({id:'v_'+pos++,type:'verse',aW:[vA.label],bW:[]});
      vA.tokens.forEach(t=>result.push({id:'c_'+pos++,type:'unmatched',aW:[t.raw],bW:[]}));
      aIdx++;
    }
    while(bPtr<versesB.length){
      const vB=versesB[bPtr];
      result.push({id:'v_'+pos++,type:'verse',aW:[],bW:[vB.label]});
      vB.tokens.forEach(t=>result.push({id:'c_'+pos++,type:'unmatched',aW:[],bW:[t.raw]}));
      bPtr++;
    }
    return result;
  }catch(e){console.error('diff error',e);return[];}
}

const DIFF_COLORS={
  added:   {bg:"#166534",border:"1px solid #86efac",tc:"#dcfce7"},
  omitted: {bg:"#7f1d1d",border:"1px solid #fca5a5",tc:"#fee2e2"},
  changed: {bg:"#713f12",border:"1px solid #fde047",tc:"#fef9c3"},
};

function DiffPanel({unit}){
  const [open,setOpen]=useState(true);
  if(!unit||(!unit.chroniclesText&&!unit.sourceText)) return null;
  const diff=useMemo(()=>{try{return computeDiff(unit.chroniclesText||"",unit.sourceText||"");}catch{return [];}},
    [unit.chroniclesText,unit.sourceText]);
  function side(s,chunks){
    return chunks.map(ch=>{
      const t=ch.type;
      if(t==="verse") return <span key={ch.id} style={{color:"#475569",fontSize:"12px"}}>{(s==="a"?ch.aW:ch.bW).join(" ")} </span>;
      if(t==="equal") return <span key={ch.id} style={{color:"#e2e8f0"}}>{(s==="a"?ch.aW:ch.bW).join(" ")} </span>;
      let words,st=t;
      if(s==="a"){
        if(t==="omitted")return <span key={ch.id}/>;
        words=ch.aW; st=t==="changed"?"changed":"added";
      }else{
        if(t==="added")return <span key={ch.id}/>;
        words=ch.bW; st=t==="changed"?"changed":"omitted";
      }
      const c=DIFF_COLORS[st]||{};
      return <span key={ch.id}><span style={{background:c.bg,border:c.border,borderRadius:"4px",padding:"2px 5px",color:c.tc,fontWeight:"600",display:"inline-block"}}>{words.join(" ")}</span> </span>;
    });
  }
  return(
    <div style={{background:"#0f172a",border:"1px solid #334155",borderRadius:"10px",marginBottom:"12px"}}>
      <button onClick={()=>setOpen(o=>!o)} style={{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",background:"none",border:"none",cursor:"pointer"}}>
        <span style={{fontSize:"13px",fontWeight:"700",color:"#f1f5f9"}}>📜 השוואה מסומנת</span>
        <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
          {[["תוספת","#166534","#86efac"],["השמטה","#7f1d1d","#fca5a5"],["שינוי","#713f12","#fde047"]].map(([l,bg,tc])=>
            <span key={l} style={{background:bg,color:tc,padding:"1px 6px",borderRadius:"8px",fontSize:"10px",fontWeight:"700"}}>{l}</span>
          )}
          <span style={{color:"#64748b",fontSize:"12px"}}>{open?"▲":"▼"}</span>
        </div>
      </button>
      {open&&(
        <div style={{padding:"0 12px 12px"}}>
          <div style={{marginBottom:"12px"}}>
            <div style={{fontSize:"11px",fontWeight:"700",color:"#93c5fd",marginBottom:"6px"}}>דברי הימים</div>
            <div style={{background:"#1e293b",borderRadius:"6px",padding:"10px 14px",fontSize:"14px",lineHeight:"2.4"}}>
              {side("a",diff)}
            </div>
          </div>
          <div>
            <div style={{fontSize:"11px",fontWeight:"700",color:"#fbbf24",marginBottom:"6px"}}>{unit.sourceRef||"שמואל / מלכים"}</div>
            <div style={{background:"#1e293b",borderRadius:"6px",padding:"10px 14px",fontSize:"14px",lineHeight:"2.4"}}>
              {side("b",diff)}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

    {id:"yirah_4",paramLabel:"ציות לרצון ה'",q:"האם הדמות פועלת בהתאם לרצון ה' גם כאשר הדבר כרוך בקושי?",markers:["המשך ביצוע דבר ה' למרות התנגדות.","קיום הציווי למרות סכנה.","התמדה בדרך ה' בעת קושי.","אי - סטייה מן הדרך בעקבות לחץ.","קבלת המחיר הכרוך בציות."]},
    {id:"yirah_5",paramLabel:"ציות לרצון ה'",q:"האם פעולותיה של הדמות מעידות על הכרה בסמכותו של ה' גם ללא פנייה ישירה אליו?",markers:["קיום מצוות ה'.","פעולה בהתאם לחוקי ה'.","עשיית הישר בעיני ה'.","שמירת הברית.","הימנעות ממעשה האסור על פי רצון ה'."]},
    {id:"yirah_6",paramLabel:"נאמנות מתמשכת",q:"האם הדמות שומרת על נאמנותה לה' לאורך תקופת הנהגתה?",markers:["תיאור עקבי של נאמנות.","חזרה על דרישת ה' במספר אירועים.","התמדה בעבודת ה'.","שמירה על אותה דרך לאורך זמן.","הערכה מסכמת על נאמנות הדמות."]},
    {id:"yirah_7",paramLabel:"נאמנות מתמשכת",q:"האם הדמות ממשיכה לדרוש את ה' גם לאחר הצלחה או תקופה של שקט?",markers:["דרישת ה' לאחר ניצחון.","פנייה אל ה' בתקופת שלום.","תפילה לאחר הצלחה.","המשך בקשת הכוונה גם לאחר השגת היעד.","יוזמה דתית בתקופת רווחה."]},

  "צניעות": { params: [
    {id:"tzniut_0",paramLabel:"איפוק ושליטה עצמית",q:"האם הדמות נמנעת מפעולה פזיזה או בלתי מבוקרת?",markers:["עיכוב הפעולה עד לבירור המצב.","הימנעות מתגובה מיידית.","פעולה מדורגת ולא חפוזה.","שליטה בתגובה למרות לחץ.","בחירה בדרך פעולה מאופקת."]},

    {id:"tzniut_2",paramLabel:"הכרת המגבלות והימנעות מהבלטה עצמית",q:"האם הדמות נמנעת מהבלטת עצמה או מהאדרת הישגיה?",markers:["הימנעות מהתרברבות.","אי - ייחוס ההצלחה לעצמה בלבד.","הימנעות מהאדרת מעשיה.","מתן מקום לאחרים.","הצגת ההצלחה ללא הדגשת עצמה."]},
    {id:"tzniut_3",paramLabel:"הכרת המגבלות והימנעות מהבלטה עצמית",q:"האם פעולותיה של הדמות מעידות על מודעות למגבלותיה?",markers:["הכרה בצורך בעזרת אחרים.","בקשת עזרה או עצה.","הכרה בתלות בה'.","הימנעות מפעולה החורגת מיכולתה.","הודאה במגבלה או בקושי."]},
    {id:"tzniut_4",paramLabel:"זהירות ושיקול דעת",q:"האם הדמות בוחרת בדרך פעולה מתונה ושקולה?",markers:["בחירת דרך פעולה שאינה קיצונית.","תכנון מסודר לפני הביצוע.","בחירת אמצעים מתונים.","התאמת הפעולה לנסיבות.","פעולה לאחר בחינה ושקילה."]},

    {id:"tzniut_6",paramLabel:"הימנעות מגאווה ומשרירות לב",q:"האם הדמות נמנעת מפעולה המבטאת גאווה או התרברבות?",markers:["הימנעות מהתרברבות.","הימנעות מהאדרת הכוח או ההישגים.","דיבור שאינו מבטא עליונות.","אי - ייחוס הצלחות לעצמה בלבד.","הימנעות מהפגנת עליונות כלפי אחרים."]},

    {id:"tzniut_9",paramLabel:"מתינות והכרת המקום לפני ה'",q:"האם הדמות מבטאת הכרה במקומה לפני ה'?",markers:["ייחוס הכוח או ההצלחה לה'.","הכרה בתלות בה'.","ביטויי ענווה לפני ה'.","תפילה המבטאת הכנעה לפני ה'.","הודאה כי ה' הוא מקור הסמכות וההצלחה."]}

    {id:"anava_4",paramLabel:"קבלת מרות ומוסר",q:"האם הדמות מקבלת את דבר ה' או את דבר נביאו?",markers:["קבלת דבר ה'.","קבלת דבר הנביא.","ציות להוראה נבואית.","שינוי פעולה בעקבות דבר ה'.","הימנעות מהתנגדות לדבר ה'."]},

    {id:"anava_7",paramLabel:"מחויבות לצדק ולשלום",q:"האם פעולותיה של הדמות מכוונות לקידום שלום ויציבות?",markers:["יוזמה להשכנת שלום.","מניעת עימותים מיותרים.","חיזוק היציבות בממלכה.","יצירת תנאים של ביטחון ושלום.","פעולות המחזקות את הסדר הציבורי."]},

    {id:"anava_9",paramLabel:"הכרת מקומו של האדם לפני ה'",q:"האם הדמות מייחסת את סמכותה, כוחה או הצלחתה לה' ולא לעצמה?",markers:["ייחוס הניצחון לה'.","הודיה לה' על ההצלחה.","הכרה בכך שהכוח ניתן מאת ה'.","הימנעות מהתרברבות בהישגים.","הצגת ההצלחה כתוצאה מפעולת ה'."]}

  "משפט": { params: [

    {id:"mishpat_2",paramLabel:"הכרעה משפטית",q:"האם הדמות משתמשת בסמכותה על מנת לקבוע נהלים?",markers:["קביעת נהלים.","מינוי בעלי תפקידים.","חלוקת תחומי אחריות.","קביעת סדרי עבודה.","ארגון מערכות שלטוניות או ציבוריות."]},
    {id:"mishpat_3",paramLabel:"הכרעה משפטית",q:"האם הדמות נוהגת להורות על דרך התנהלות תקינה?",markers:["מתן הוראות.","הנחיית העם או בעלי התפקידים.","קביעת כללי התנהגות.","הוראה כיצד יש לפעול.","דרישה לשמירה על סדר קבוע."]},
    {id:"mishpat_4",paramLabel:"הגנה על החלש",q:"האם הדמות פועלת למניעת עוולות ולהבטחת יושר במרחב הציבורי והחברתי?",markers:["טיפול בעוול.","תיקון פגיעה.","מניעת ניצול.","התערבות במקרה של אי - צדק.","השבת הסדר לאחר פגיעה."]},

    {id:"mishpat_6",paramLabel:"הגנה על החלש",q:"האם הדמות מגלה רגישות גבוהה למצבים של ניצול או עושק ופועלת אקטיבית להגן על אלו שאין בידם כוח להגן על עצמם?",markers:["הגנה על חלשים.","סיוע לנפגעים.","מניעת עושק.","פעולה למען יתומים, אלמנות, גרים או עניים.","התערבות לטובת חסרי כוח."]},
    {id:"mishpat_7",paramLabel:"צדק והגינות",q:"האם הדמות שומרת על יחס שווה והוגן כלפי הצדדים המעורבים?",markers:["שמיעת הצדדים.","יחס שווה לבעלי הדין.","הכרעה ללא משוא פנים.","שמירה על זכויות כל הצדדים.","קבלת החלטה מנומקת והוגנת."]},

  ]},
  "צדקה": { params: [
    {id:"tzedaka_0",paramLabel:"מימוש הצדק בפעולה",q:"האם הדמות פועלת באופן אקטיבי ליצירת סדר חברתי הוגן?",markers:["יוזמה להסדרת חיי החברה.","תיקון מצב חברתי בלתי תקין.","קביעת סדרי התנהלות המקדמים הגינות.","פעולה היוצרת יציבות חברתית.","הנהגת רפורמה או שינוי לטובת הציבור."]},
    {id:"tzedaka_1",paramLabel:"מימוש הצדק בפעולה",q:"האם הדמות פועלת באופן פעיל למימוש הערכים העולים מן הברית?",markers:["יישום ערכי הברית בפעולה.","קיום הוראות ה' מתוך יוזמה.","פעולה המשקפת נאמנות לברית.","עשיית הטוב בהתאם לרצון ה'.","מעשים המבטאים מחויבות לערכי הברית."]},
    {id:"tzedaka_2",paramLabel:"יוזמה מוסרית",q:"האם הדמות יוזמת פעולות למניעת עוול או אי - צדק?",markers:["יוזמה לתיקון עוול.","התערבות למניעת אי - צדק.","מניעת ניצול.","פעולה לתיקון מצב בלתי הוגן.","עשייה אקטיבית לקידום הגינות."]},
    {id:"tzedaka_3",paramLabel:"הגנה על החלשים",q:"האם הדמות פועלת להגנתם של החלשים או חסרי הכוח?",markers:["הגנה על יתום, אלמנה, גר או עני.","סיוע לחסרי כוח.","פעולה למען מי שאינם יכולים להגן על עצמם.","הצלה מידי עושק.","התערבות לטובת החלש."]},
    {id:"tzedaka_4",paramLabel:"הגנה על החלשים",q:"האם הדמות פועלת באופן יזום כדי למנוע מצבי ניצול, עושק או עיוות דין כלפי החלשים בחברה?",markers:["מניעת עושק.","מניעת ניצול בעלי כוח.","תיקון עיוות דין.","הגנה מפני פגיעה בזכויות החלשים.","פעולה יזומה למניעת פגיעה בקבוצות מוחלשות."]},
    {id:"tzedaka_5",paramLabel:"נאמנות לערכי הברית",q:"האם הדמות פועלת בהתאם לערכי הברית גם כאשר אין חובה מפורשת לעשות כן?",markers:["יוזמה לעשיית טוב.","פעולה מעבר לנדרש בחוק.","עשיית חסד ללא חובה מפורשת.","החלטה המונעת מערכי הברית.","פעולה המבטאת נאמנות לרוח החוק."]},
    {id:"tzedaka_6",paramLabel:"נאמנות לערכי הברית",q:"האם פעולותיה של הדמות מבטאות חתירה להגינות ולא רק ליישום פורמלי של החוק?",markers:["העדפת פתרון הוגן.","התחשבות בנסיבות המקרה.","פעולה לטובת הצדק המהותי.","הימנעות מיישום טכני בלבד של החוק.","הכרעה המבטאת רחמים והגינות."]},
    {id:"tzedaka_7",paramLabel:"נאמנות לערכי הברית",q:"האם הדמות משלבת בין אכיפת הסדר לבין הגנה על החלשים?",markers:["אכיפת חוק תוך שמירה על זכויות החלשים.","קבלת החלטות המאזנות בין סדר לבין הגנה על חסרי הכוח.","טיפול בעבירה תוך דאגה לנפגע.","שימוש בסמכות כדי להגן על החלשים.","הנהגה המשלבת סדר חברתי עם אחריות מוסרית."]},
    {id:"tzedaka_8",paramLabel:"חיזוק הסדר החברתי",q:"האם פעולותיה של הדמות מבטאות כי הגינות וחסד כלפי הזולת הם חלק מעבודת ה'?",markers:["קישור בין עבודת ה' לבין יחס לזולת.","פעולה מוסרית המוצגת כביטוי לנאמנות לה'.","עשיית חסד כחלק מהנהגת העם.","הדגשת אחריות חברתית במסגרת עבודת ה'.","מעשים המחברים בין פולחן לבין מוסר."]},
    {id:"tzedaka_9",paramLabel:"חיזוק הסדר החברתי",q:"האם מעשיה של הדמות מבטאים את ערכי המוסר של חוקי ה'?",markers:["שמירת ערכי הברית במעשה.","יישום עקרונות מוסריים שמקורם בברית.","פעולה המבטאת נאמנות מוסרית לה'.","שילוב בין חוק, מוסר ואחריות חברתית.","תיאור עקבי של הנהגה על פי ערכי הברית."]}
  ]},
  "מוסר": { params: [
    {id:"musar_0",paramLabel:"הדרכה והכוונה",q:"האם הדמות מורה לאחרים כיצד לנהוג?",markers:["מתן הוראות או הנחיות.","הוראת דרך פעולה.","הדרכת העם או בעלי תפקידים.","קריאה לשמירת דרך מסוימת.","הוראה כיצד יש לנהוג במצב מסוים."]},
    {id:"musar_1",paramLabel:"תיקון והתפתחות",q:"האם הדמות מתקנת את התנהגותה בעקבות טעות, חטא או סטייה מן הדרך?",markers:["קבלת תוכחה.","שינוי דרך הפעולה.","הודאה בטעות.","חזרה לדרך הראויה.","תיקון המעשים בעקבות ביקורת או דבר ה'."]},
    {id:"musar_2",paramLabel:"תיקון והתפתחות",q:"האם פעולותיה של הדמות מבטאות מחויבות להתנהגות ראויה ולא רק ציות טכני?",markers:["פעולה מעבר לנדרש באופן פורמלי.","עשיית הטוב גם כאשר אין הוראה מפורשת.","יישום רוח ההוראה ולא רק לשונה.","התנהגות עקבית התואמת את ערכי הברית.","פעולה המבטאת אחריות מוסרית ולא רק ציות."]},
    {id:"musar_3",paramLabel:"עיצוב התנהגות מוסרית",q:"האם הדמות פועלת לעיצוב התנהגות מוסרית של היחיד או של הציבור?",markers:["חינוך העם.","קביעת נורמות התנהגות.","עידוד להתנהגות ראויה.","תיקון דרכי העם.","הנהגת שינויים המקדמים התנהגות מוסרית."]},
    {id:"musar_4",paramLabel:"עיצוב התנהגות מוסרית",q:"האם הדמות מקדמת התנהגות המבוססת על צדק, הגינות ואחריות?",markers:["עידוד עשיית צדק.","דרישה להגינות.","קידום אחריות אישית או ציבורית.","הנהגת כללים המבטאים יושר.","פעילות המחזקת התנהגות מוסרית."]},
    {id:"musar_5",paramLabel:"עיצוב התנהגות מוסרית",q:"האם הדמות נמנעת מניצול כוחה, סמכותה או מעמדה כדי לפגוע באחרים?",markers:["הימנעות משימוש לרעה בסמכות.","ריסון הכוח שבידי הדמות.","הימנעות מפגיעה בחלשים.","שימוש בסמכות לטובת הציבור.","פעולה המבטאת אחריות ולא שרירות לב."]},
    {id:"musar_6",paramLabel:"מנהיגות חינוכית",q:"האם התנהגותה של הדמות משמשת דוגמה לאחרים?",markers:["העם הולך בעקבות הדמות.","הצגת הדמות כמופת.","תיאור חיובי של אורח חייה.","השפעת מעשיה על התנהגות אחרים.","שבח המספר להתנהגותה."]},
    {id:"musar_7",paramLabel:"אחריות מוסרית - חברתית",q:"האם הדמות פועלת להגנתם של החלשים או חסרי הכוח?",markers:["הגנה על יתום, אלמנה, גר או עני.","התערבות לטובת חסרי כוח.","סיוע לנפגעי עוול.","מניעת ניצול או עושק.","פעולה המבטאת אחריות כלפי החלשים."]}
  ]},
  "יושר": { params: [
    {id:"yosher_0",paramLabel:"התמדה בדרך הישר",q:"האם הדמות שומרת על דרך פעולה עקבית לאורך זמן?",markers:["חזרה עקבית על אותו דפוס פעולה.","תיאור מתמשך של הליכה בדרך אחת.","היעדר שינוי לרעה בהתנהגות הדמות.","הערכה מסכמת של המספר על עקביות הנהגתה.","שמירה על אותה דרך לאורך תקופות שונות."]},
    {id:"yosher_1",paramLabel:"התמדה בדרך הישר",q:"האם הדמות נמנעת מסטייה מן הדרך הראויה גם כאשר הדבר כרוך בקושי או בלחץ?",markers:["המשך קיום דרכה למרות קושי.","עמידה בפני לחץ או פיתוי.","הימנעות מהפרת חוקי ה'.","דבקות בדרך שנבחרה גם בתקופת משבר.","תיאור מפורש של אי - סטייה מן הדרך."]},
    {id:"yosher_2",paramLabel:"עשיית הישר בעיני ה'",q:"האם הדמות פועלת בהתאם לחוקי ה' ולדרישות הברית?",markers:["שמירת מצוות ה'.","קיום הוראות הברית.","ציות לדבר ה'.","שמירת חוקי התורה.","פעולה בהתאם לציווי אלוהי."]},
    {id:"yosher_3",paramLabel:"עשיית הישר בעיני ה'",q:"האם הדמות פועלת בהתאם למה שנכון בעיני ה'?",markers:["הביטוי \"עשה הישר בעיני ה'\".","שבח המספר על התנהגות הדמות.","פעולה המאושרת על ידי ה'.","הימנעות ממעשה המוגדר כרע בעיני ה'.","תיאור מפורש של הליכה בדרך הישר."]},
    {id:"yosher_4",paramLabel:"יושר בהפעלת סמכות",q:"האם הדמות מפעילה את סמכותה ללא משוא פנים?",markers:["יחס שווה לבעלי דין.","היעדר העדפה פסולה.","הכרעה ללא משוא פנים.","הפעלת סמכות באופן שוויוני.","שמירה על זכויות כלל הצדדים."]},
    {id:"yosher_5",paramLabel:"יושר בהפעלת סמכות",q:"האם הדמות מקבלת החלטות באופן הוגן ועקבי?",markers:["החלטות התואמות את אותם עקרונות.","אחידות באופן קבלת ההחלטות.","הכרעות המבטאות הגינות.","פעולה בהתאם לאמות מידה קבועות.","היעדר סתירה בין החלטות דומות."]},
    {id:"yosher_6",paramLabel:"נאמנות לברית",q:"האם הדמות שומרת על נאמנותה לברית ולחוקי ה' לאורך תקופת הנהגתה?",markers:["שמירה מתמשכת על הברית.","קיום חוקי ה' לאורך תקופת ההנהגה.","המשך עבודת ה' במשך שנים.","היעדר תיאור של נטישת דרך ה'.","הערכה מסכמת על נאמנות הדמות."]},
    {id:"yosher_7",paramLabel:"הנהגה מייצבת",q:"האם הנהגתה של הדמות יוצרת יציבות וסדר בקרב העם?",markers:["תיאור של שלום בממלכה.","יציבות שלטונית.","סדר ציבורי.","שגשוג העם בעקבות ההנהגה.","היעדר מהומות או אנרכיה בתקופת שלטונה."]},
    {id:"yosher_8",paramLabel:"הנהגה מייצבת",q:"האם פעולותיה של הדמות תורמות לחיזוק הלגיטימיות של הנהגתה?",markers:["קבלת המלך על ידי העם.","תמיכת העם בהנהגה.","התכנסות העם סביב המלך.","נאמנות העם למנהיג.","תיאורים של חיזוק המלוכה בעקבות הנהגת הדמות."]}
  ]},
  "חסד": { params: [
    {id:"chesed_0",paramLabel:"יוזמה של חסד",q:"האם הדמות יוזמת מעשה טוב כלפי אדם אחר גם כאשר אינה מחויבת לכך?",markers:["יוזמה לעזרה ללא בקשה מוקדמת.","הענקת טובה ללא ציפייה לתמורה.","פעולה לטובת אדם אחר ללא חובה מפורשת.","עשיית חסד ביוזמת הדמות.","מתן סיוע מתוך רצון להיטיב."]},
    {id:"chesed_1",paramLabel:"יוזמה של חסד",q:"האם הדמות מעניקה סיוע, הגנה או טובה מעבר לנדרש ממנה?",markers:["הענקת הגנה לאדם הנתון בסכנה.","סיוע מעבר לחובה או להסכם.","מחילה או ויתור לטובת האחר.","הענקת משאבים, מקלט או תמיכה.","פעולה המיטיבה עם האחר מעבר למצופה."]},
    {id:"chesed_2",paramLabel:"נאמנות לברית ולמערכת היחסים",q:"האם הדמות שומרת על מחויבותה כלפי אדם או קבוצה לאורך זמן?",markers:["קיום הבטחה שניתנה בעבר.","המשך נאמנות לבעל ברית.","עמידה במחויבות גם לאחר שנים.","שמירה על קשר מחייב למרות שינוי נסיבות.","הימנעות מהפרת ברית או התחייבות."]},
    {id:"chesed_3",paramLabel:"נאמנות לברית ולמערכת היחסים",q:"האם הדמות זוכרת מעשה חסד, שנעשה עמה בעבר?",markers:["עשיית טובה כתגובה לטובה שנעשתה בעבר.","שמירת זיכרון של ברית או התחייבות קודמת.","תגמול חיובי בעקבות חסד קודם.","פעולה המבוססת על נאמנות לקשר עבר."]},
    {id:"chesed_4",paramLabel:"רחמים והתחשבות",q:"האם הדמות מגלה רחמים כלפי אדם המצוי במצוקה או בחולשה?",markers:["חנינה או מחילה.","סיוע לאדם במצוקה.","הגנה על חסר ישע.","הימנעות מפגיעה כאשר קיימת אפשרות לפגוע.","פעולה מתוך חמלה כלפי אדם חלש."]},
    {id:"chesed_5",paramLabel:"רחמים והתחשבות",q:"האם הדמות שומרת אמונים גם כאשר הדבר כרוך במחיר אישי?",markers:["קיום התחייבות למרות הפסד אישי.","נאמנות לבעל ברית בתקופת קושי.","ויתור על רווח אישי לשם שמירת הקשר.","סיכון אישי למען אדם אחר.","המשך נאמנות למרות שינוי נסיבות."]},
    {id:"chesed_6",paramLabel:"טיפוח יחסי אמון ויציבות",q:"האם פעולותיה של הדמות מחזקות את יחסי האמון בינה לבין אחרים?",markers:["יצירת אמון בין הצדדים.","חיזוק קשרי נאמנות.","קיום התחייבויות המחזקות את הקשר.","פעולה המבססת מערכת יחסים יציבה.","תגובת אמון מצד הצד השני בעקבות מעשי הדמות."]},
    {id:"chesed_7",paramLabel:"טיפוח יחסי אמון ויציבות",q:"האם הדמות פועלת לשימור מערכת יחסים לאורך זמן?",markers:["חידוש קשר קיים.","שימור ברית או הסכם.","פעולות למניעת ניתוק היחסים.","טיפוח קשר מתמשך.","שמירה על נאמנות לאורך זמן."]},
    {id:"chesed_8",paramLabel:"מימוש החסד בפעולה",q:"האם הדמות מתרגמת את מחויבותה למעשים ממשיים?",markers:["פעולה המממשת הבטחה.","עשיית טובה בפועל.","קיום מחויבות באמצעות מעשה.","יישום ערכי החסד בהתנהגות.","ביטוי מעשי של נאמנות."]},
    {id:"chesed_9",paramLabel:"מימוש החסד בפעולה",q:"האם פעולותיה של הדמות מבטאות נאמנות לברית או למחויבות שקיבלה על עצמה?",markers:["קיום ברית.","עמידה בהתחייבות.","פעולה הנעשית מכוח נאמנות לברית.","שמירה על קשר מחייב לאורך זמן.","תיאור מפורש של עשיית חסד במסגרת הברית."]}
  ]},
  "אחד/יחד": { params: [
    {id:"echadyachad_0",paramLabel:"יצירת אחדות",q:"האם הדמות פועלת ליצירת אחדות בין יחידים או קבוצות?",markers:["איחוד שבטים, קבוצות או קהילות.","קיבוץ אנשים למסגרת אחת.","יצירת ברית או שיתוף פעולה בין קבוצות.","כינוס כלל העם למטרה משותפת.","תיאור מפורש של הפיכת קבוצות שונות לעם אחד."]},
    {id:"echadyachad_1",paramLabel:"גיבוש זהות משותפת",q:"האם הדמות מחזקת את תחושת השייכות של היחידים לקהילה?",markers:["כינוס העם.","שילוב קבוצות שונות במסגרת אחת.","יצירת תחושת השתייכות לעם.","חיזוק הקשר בין היחיד לבין הקהילה.","תיאורים המדגישים את כלל ישראל כקהילה אחת."]},
    {id:"echadyachad_2",paramLabel:"גיבוש זהות משותפת",q:"האם הדמות פועלת ליצירת זהות משותפת סביב ערך או מטרה?",markers:["הצבת מטרה משותפת לכלל העם.","איחוד סביב עבודת ה'.","איחוד סביב המקדש או ירושלים.","הדגשת ערכים משותפים.","יצירת שפה משותפת של זהות ושייכות."]},
    {id:"echadyachad_3",paramLabel:"שיתוף פעולה",q:"האם הדמות מגייסת אנשים לפעול יחד למען מטרה משותפת?",markers:["גיוס העם למשימה.","חלוקת תפקידים במסגרת פעולה משותפת.","קריאה להשתתפות כללית.","שיתוף קבוצות שונות בביצוע המשימה.","פעולה משותפת להשגת יעד אחד."]},

    {id:"amen_3",paramLabel:"נאמנות למחויבויות",q:"האם דבריה של הדמות תואמים את מעשיה?",markers:["ביצוע בפועל של מה שהדמות הצהירה.","התאמה בין דברי הדמות לבין התנהגותה.","עקביות בין הוראותיה לבין מעשיה.","היעדר סתירה בין הצהרותיה לבין פעולותיה.","תיאור של אמינות הדמות בעיני אחרים."]},
    {id:"amen_4",paramLabel:"אמת ואמון בה'",q:"האם הדמות פועלת מתוך הסתמכות על הבטחות ה'?",markers:["הסתמכות על דבר ה'.","קבלת החלטות על סמך הבטחת ה'.","ציפייה למימוש הבטחות ה'.","ביטוי של אמון בדברי ה'.","פעולה בעקבות הבטחה אלוהית."]},
    {id:"amen_5",paramLabel:"אמת ואמון בה'",q:"האם פעולותיה של הדמות מבטאות מחויבות לאמת?",markers:["דיבור אמת.","קבלת החלטות על פי העובדות.","שיפוט אמת.","הימנעות משקר או מרמה.","פעולה בהתאם לעקרונות הצדק והאמת."]},
    {id:"amen_6",paramLabel:"ביסוס אמון ויציבות",q:"האם התנהגותה של הדמות מעוררת אמון בקרב אחרים?",markers:["אחרים נשענים על הנהגת הדמות.","הבעת אמון של העם או הכפופים לה.","קבלת דבריה כאמינים.","שיתוף פעולה הנובע מן האמון בה.","תיאור מפורש של נאמנות כלפי הדמות."]},
    {id:"amen_7",paramLabel:"ביסוס אמון ויציבות",q:"האם הנהגתה של הדמות יוצרת יציבות לאורך זמן?",markers:["יציבות שלטונית.","המשכיות ההנהגה.","שמירה על סדר לאורך זמן.","חיזוק מוסדות ההנהגה.","תיאור של הנהגה יציבה ומתמשכת."]},
    {id:"amen_8",paramLabel:"אחריות נאמנה",q:"האם הדמות מקבלת אחריות כלפי האנשים שהופקדו בידיה?",markers:["קבלת אחריות מפורשת על העם.","דאגה לאנשים שהופקדו בידי הדמות.","נשיאה באחריות לתוצאות ההנהגה.","פעולה לטובת הכפופים לה.","מילוי תפקיד של אפוטרופוס או אומן."]},

const FB_PATH = "research";
let pendingFbSaves = 0; // counts saves that haven't been confirmed by the server yet
const FB_BASE_SHAPE = {units:[],overrides:{},concepts:{},analysis:{},analysis_chronicles:{},analysis_source:{},customConcepts:[],compareNotes:{},compareFactual:{},unitSummary:{}};
// fbSave — שמירה "עוורת" (כותבת בדיוק את מה שקיבלה, בלי לבדוק מה יש בשרת). נשמרת לתאימות, אך עדיף שלא להשתמש בה לשינויים חלקיים.
const FB_PATH2 = "research2";
const PER_UNIT_KEYS = ["analysis","analysis_chronicles","analysis_source","unitSummary","compareNotes","compareFactual","commentary"];
function __packJson(data){ const s=JSON.stringify(data); try{ return (window.LZString)?("z:"+LZString.compressToBase64(s)):s; }catch(e){ return s; } }
function __unpackJson(str){ if(str==null) return null; try{ if(typeof str==="string" && str.slice(0,2)==="z:" && window.LZString){ const d=LZString.decompressFromBase64(str.slice(2)); if(d) return JSON.parse(d); } }catch(e){} return JSON.parse(str); }
function __shard(data){ data=data||{}; const meta={}; for(const k of Object.keys(data)){ if(!PER_UNIT_KEYS.includes(k)) meta[k]=data[k]; } const uids=new Set(); for(const k of PER_UNIT_KEYS){ const o=data[k]; if(o&&typeof o==="object") for(const u of Object.keys(o)) uids.add(u); } const u={}; for(const uid of uids){ const slice={}; for(const k of PER_UNIT_KEYS){ if(data[k]&&data[k][uid]!==undefined) slice[k]=data[k][uid]; } u[uid]=__packJson(slice); } return { meta: __packJson(meta), u }; }
function __unshard(sh){ if(!sh) return null; const data=__unpackJson(sh.meta)||{}; for(const k of PER_UNIT_KEYS){ if(data[k]===undefined) data[k]={}; } const u=sh.u||{}; for(const uid of Object.keys(u)){ const slice=__unpackJson(u[uid])||{}; for(const k of PER_UNIT_KEYS){ if(slice[k]!==undefined) data[k][uid]=slice[k]; } } return data; }
const fbSave = (data) => {
  pendingFbSaves++;
  let p;
  try{
    p = db.ref(FB_PATH2).set(__shard(data));
  }catch(e){
    console.error("FB save error",e);
    pendingFbSaves--;
    return Promise.reject(e);
  }
  return p.then(()=>{ pendingFbSaves--; })
          .catch(err=>{ pendingFbSaves--; console.error("FB save error",err); throw err; });
};
// fbSaveMerge — קוראת קודם את המצב העדכני בפועל מהשרת, ומחילה את ה-patch שלך *מעל* התמונה הטרייה הזו (לא מעל מה שהיה בזיכרון המקומי).
// כך לשונית "ישנה" לא יכולה לדרוס נתונים שנכתבו במקביל ע"י לשונית/כלי אחר — היא רק משנה את מה שהתבקש לשנות.
// כל הקריאות מסודרות בתור (fbMergeQueue) כדי שלא יתבצעו שתי קריאות-שינוי-כתיבה במקביל מתוך הלשונית הזו עצמה.
// patchFn מקבל את הנתונים הטריים מהשרת ומחזיר אובייקט מעודכן. מחזירה את התוצאה הסופית שנכתבה, כדי שאפשר לסנכרן אליה את ה-state המקומי.
let fbMergeQueue = Promise.resolve();
const fbSaveMerge = (patchFn) => {
  pendingFbSaves++;
  const run = async () => {
    try{
      const snap = await db.ref(FB_PATH2).once("value");
      const v = snap.val();
      let serverData;
      try{ serverData = __unshard(v) || {...FB_BASE_SHAPE}; }
      catch{ serverData = {...FB_BASE_SHAPE}; }
      const merged = patchFn({...FB_BASE_SHAPE, ...serverData});
      await db.ref(FB_PATH2).set(__shard(merged));
      return merged;
    }catch(err){
      console.error("FB save error",err);
      throw err;
    }finally{
      pendingFbSaves--;
    }
  };
  const result = fbMergeQueue.then(run);
  fbMergeQueue = result.catch(()=>{}); // השרשרת ממשיכה לרוץ גם אחרי כשלון, כדי שכשלון אחד לא יחסום שמירות עתידיות
  return result;
};
const fbLoad = (cb) => {
  db.ref(FB_PATH2).once("value").then(snap => {
    const sh = snap.val();
    if(sh && (sh.meta || (sh.u && Object.keys(sh.u).length))){ cb(__unshard(sh)); return; }
    db.ref(FB_PATH).once("value").then(old => {
      const v = old.val();
      if(!v){ cb(null); return; }
      let legacy; try{ legacy = __unpackJson(v.json); }catch(e){ legacy=null; }
      if(!legacy){ cb(null); return; }
      cb(legacy);
      try{ db.ref(FB_PATH2).set(__shard(legacy))
        .then(()=>console.log("migrated to sharded storage (research2); legacy 'research' kept as backup"))
        .catch(e=>console.error("migration write failed (legacy kept)",e)); }catch(e){ console.error(e); }
    }).catch(()=>cb(null));
  }).catch(()=>cb(null));
};

const AI_URL="https://anthropic-proxy.anna-sho-ea8.workers.dev";
async function aiCall(prompt,maxTokens){
  const res=await fetch(AI_URL,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:maxTokens,messages:[{role:"user",content:prompt}]})});
  const data=await res.json();
  if(!data.content||!data.content.length) throw new Error("שגיאת AI: "+aiErrorText(data));
  if(data.stop_reason==="max_tokens") console.warn("aiCall: התשובה נקטעה עקב מגבלת max_tokens");
  return data.content.map(b=>b.text||"").join("");
}
function parseParamJSON(rawText){
  const clean=rawText.replace(/```json|```/g,"").trim();
  try{ return JSON.parse(clean); }
  catch(e){
    // ניסיון 1: לחתוך בסוף הפריט השלם האחרון (מטפל בתשובה שנקטעה בסוף)
    try{ const last=clean.lastIndexOf("},"); if(last>0) return JSON.parse(clean.substring(0,last+1)+"]"); }
    catch(e2){/* ממשיכים לניסיון הבא */}
    // ניסיון 2: לסרוק את המחרוזת ולחלץ כל אובייקט {...} בנפרד (סוגריים מאוזנים, בלי להיכנס לתוך מחרוזות),
    // ולנסות לפרסר כל אחד לחוד — כך פריט פגום בודד לא מפיל את כל השאר.
    const items=[]; let depth=0,start=-1,inStr=false,esc=false;
    for(let i=0;i<clean.length;i++){
      const ch=clean[i];
      if(inStr){ if(esc)esc=false; else if(ch==="\\")esc=true; else if(ch==='"')inStr=false; continue; }
      if(ch==='"'){inStr=true;continue;}
      if(ch==="{"){ if(depth===0)start=i; depth++; }
      else if(ch==="}"){ depth--; if(depth===0&&start>=0){ items.push(clean.substring(start,i+1)); start=-1; } }
    }
    const parsed=[]; let skipped=0;
    items.forEach(it=>{ try{ parsed.push(JSON.parse(it)); }catch(e3){ skipped++; } });
    if(parsed.length){ if(skipped) console.warn(`parseParamJSON: שוחזרו ${parsed.length} פריטים, ${skipped} נפלטו כפגומים`); return parsed; }
    throw e;
  }
}
function validParamDefs(params){ return (params||[]).filter(p=>p&&(typeof p==="object"?p.q:p).toString().trim()); }
function alignParams(existing,n){
  const a=Array.isArray(existing)?existing.map(p=>({found:(p&&p.found!==undefined)?p.found:null,verse:(p&&p.verse)||"",note:(p&&p.note)||""})):[];
  while(a.length<n)a.push({found:null,verse:"",note:""});
  return a.slice(0,n);
}
function paramText(p){ return typeof p==="object"?(p.q||""):String(p||""); }
function paramLabelOf(p){ return typeof p==="object"?(p.paramLabel||""):""; }
function paramMarkersArr(p){ return (typeof p==="object"&&Array.isArray(p.markers))?p.markers:[]; }
function paramMarkersStr(p){ return paramMarkersArr(p).join(", "); }
function paramId(p){ return (typeof p==="object"&&p&&p.id)?p.id:null; }
function genPid(){ return "p_"+Math.random().toString(36).slice(2,9); }
// יישור ממצאים לפי מזהה פרמטר (לא לפי מיקום) — כך שינוי סדר לא שובר צימוד.
// findings יכול להיות מערך מתויג-מזהה [{id,found,verse,note}] או מערך ישן לפי מיקום (תאימות לאחור).
function alignedFindings(entry,validParams){
  const arr=Array.isArray(entry&&entry.params)?entry.params:[];
  const byId={}; let anyId=false;
  arr.forEach((f,idx)=>{ if(f&&f.id){byId[f.id]=f;anyId=true;} });
  return validParams.map((p,i)=>{
    const pid=paramId(p);
    let f=null;
    if(pid&&byId[pid]) f=byId[pid];           // צימוד לפי מזהה
    else if(!anyId&&arr[i]) f=arr[i];          // נתונים ישנים לפי מיקום
    return {found:(f&&f.found!==undefined)?f.found:null, verse:(f&&f.verse)||"", note:(f&&f.note)||""};
  });
}
// בונה מערך ממצאים מתויג-מזהה לשמירה
function taggedFindings(validParams,alignedArr){
  return validParams.map((p,i)=>({id:paramId(p)||("i"+i),found:alignedArr[i].found,verse:alignedArr[i].verse||"",note:alignedArr[i].note||""}));
}

function buildParamPrompt({conceptName,validParams,sem,unitText,modeLabel,character,explicitNote,scholarship}){
  const paramsList=validParams.map((p,i)=>{const label=paramLabelOf(p),q=paramText(p),markers=paramMarkersStr(p);return `${i+1}. ${label?`[פרמטר: ${label}] `:""}אינדיקטור: ${q}${markers?`\n   סימנים בטקסט (ראיות לחיפוש): ${markers}`:""}`;}).join("\n\n");
  const semInfo=sem?`\nשדה סמנטי חיובי: ${sem.pos}\nשדה סמנטי שלילי: ${sem.neg}`:"";
  const who=character==="solomon"?"שלמה":"דוד";
  const scholarBlock=scholarship?`\n📝 השוואת פרשנים על יחידה זו (יש להתחשב בה ולשקלל אותה בבדיקה):\n${scholarship}\n`:"";
  return `אתה עוזר מחקר לתזה בתנ"ך. בדוק${scholarship?" מחדש":""} האם המושג "${conceptName}" נרמז בטקסט לפי הפרמטרים${scholarship?", בהתחשב בהשוואת הפרשנים המצורפת":""}.

⚠️ הנחיה קריטית: המחקר עוסק אך ורק בדמותו של ${who} המלך. בדוק את הפרמטרים רק ביחס ל${who} — לא ביחס לדמויות אחרות המופיעות ביחידה כגון שרים, זקנים, עם, לויים או כל דמות אחרת.

טקסט (${modeLabel}):
${unitText}
${semInfo}
${explicitNote?`\nממצא גלוי שכבר נמצא:\n${explicitNote}`:""}${scholarBlock}

פרמטרים לבדיקה:
${paramsList}

הוראות קריטיות:
- ענה ONLY ב-JSON תקני, ללא טקסט לפני או אחרי
- עבור כל פרמטר לפי מספרו הסדרי (1 עד ${validParams.length})
- found: true אם יש ראיה ברורה בטקסט שמתייחסת ל${who} ספציפית${scholarship?", בהתחשב בפרשנים":""}, false אם לא
- verse: מספר הפסוק אם found=true (למשל "(א)" או "(ג)"), אחרת ""
- note: הסבר קצר בעברית (מקסימום 50 מילים)${scholarship?" — ציין כיצד הפרשנים השפיעו על המסקנה, אם בכלל":` — ציין את הקשר ל${who}`}

פורמט JSON:
[
  {"param":1,"found":true,"verse":"(א)","note":"הסבר"},
  {"param":2,"found":false,"verse":"","note":"לא נמצא"}
]`;
}
async function aiParams(opts){
  const raw=await aiCall(buildParamPrompt(opts),4000);
  const parsed=parseParamJSON(raw);
  return opts.validParams.map((p,i)=>{const it=parsed.find(x=>x.param-1===i);return it?{found:it.found,verse:it.verse||"",note:it.note||""}:{found:null,verse:"",note:""};});
}

// ── סטטוס בן-4-מצבים — מוסק מהנתונים בלבד ──
function conceptStatusA(entry,mode,hasParams){
  const hasExplicit=!!(entry&&entry.explicit_note&&entry.explicit_note.trim());
  const hasImplicit=!!(entry&&(entry.params||[]).some(p=>p&&p.found!==null));
  const hasScholar=!!(entry&&entry.scholarRecommendations&&Object.keys(entry.scholarRecommendations).length>0);
  if(!hasExplicit&&!hasImplicit&&!hasScholar) return "none";
  if(!hasParams) return hasExplicit?"done":"progress";          // מושג עם שדה סמנטי בלבד — הושלם אחרי גלוי
  if(mode==="source") return (hasExplicit&&hasImplicit)?"done":"progress";  // מקבילה — שני שלבים
  if(hasExplicit&&hasImplicit&&hasScholar) return "done";        // דה"י — שלושה שלבים
  if(hasImplicit&&!hasScholar) return "await_scholar";           // ממתין לפרשנים
  return "progress";
}
const STATUS_META={
  none:{c:"#475569",ic:"○",t:"טרם התחיל"},
  progress:{c:"#818cf8",ic:"◐",t:"בתהליך"},
  await_scholar:{c:"#c084fc",ic:"◑",t:"ממתין לאימות בפרשנים"},
  done:{c:"#34d399",ic:"●",t:"הושלם"},
};
function unitProgress(uid,mode,allConcepts,getE,getParams){
  let done=0;
  allConcepts.forEach(c=>{
    const hp=validParamDefs(getParams(c.name)).length>0;
    if(conceptStatusA(getE(uid,c.name,mode),mode,hp)==="done") done++;
  });
  return {done,total:allConcepts.length};
}
function ProgressBadge({done,total}){

}
function StatusDot({status}){

  return <span title={m.t} style={{color:m.c,fontSize:"12px",marginLeft:"5px",fontWeight:"700"}}>{m.ic}</span>;
}

        style={{width:"100%",marginBottom:"10px",padding:"9px",borderRadius:"7px",border:"none",cursor:load?"wait":"pointer",
          background:load?"#1e293b":"#064e3b",color:load?"#475569":"#34d399",fontSize:"13px",fontWeight:"700"}}>
        {load?"⏳ מחפש...":"🔍 בדיקת ה-AI לגלוי"}
      </button>
      {err&&<div style={{fontSize:"12px",color:"#fca5a5",marginBottom:"10px",padding:"6px 10px",background:"#1e293b",borderRadius:"6px"}}>{err}</div>}
      <label style={{...S.label,marginTop:"4px"}}>ממצאי הגלוי (ערכי ותקני לפני שמירה)</label>
      <textarea value={note} onChange={e=>setNote(e.target.value)} rows={8}
        placeholder="ה-AI ימלא כאן — את עוברת, מתקנת, ושומרת..."
        style={{...S.input,resize:"vertical",lineHeight:"1.8"}}/>
      <div style={{display:"flex",gap:"10px",marginTop:"12px"}}>
        <button onClick={()=>onSave({explicit_note:note})}
          style={{flex:1,padding:"10px",borderRadius:"8px",border:"none",cursor:"pointer",background:"#16a34a",color:"white",fontSize:"14px",fontWeight:"700"}}>💾 שמור</button>
        <button onClick={onClose}
          style={{padding:"10px 18px",borderRadius:"8px",border:"none",cursor:"pointer",background:"#334155",color:"#cbd5e1",fontSize:"13px",fontWeight:"600"}}>ביטול</button>
      </div>
    </div>
  );
}

// ── תחנה: נרמז (מסך 4) ──
function ImplicitStation({conceptName,params,sem,unitText,modeLabel,character,entry,onSave,onClose}){
  const validParams=validParamDefs(params);
  const [ps,setPs]=useState(()=>alignedFindings(entry,validParams));
  const [note,setNote]=useState((entry&&entry.implicit_note)||"");
  const [load,setLoad]=useState(false);
  const [msg,setMsg]=useState("");
  function updP(i,k,v){ setPs(prev=>{const a=[...prev];a[i]={...a[i],[k]:v};return a;}); }
  async function run(){
    if(!unitText){setMsg("אין טקסט ביחידה זו.");return;}
    if(!validParams.length){setMsg("אין פרמטרים מוגדרים.");return;}
    setLoad(true);setMsg("");
    try{
      const filled=await aiParams({conceptName,validParams,sem,unitText,modeLabel,character,explicitNote:entry&&entry.explicit_note});
      setPs(filled);
      setNote(filled.map((r,i)=>r.note?`פרמטר ${i+1}: ${r.found?"✅":"❌"} ${r.note}`:"").filter(Boolean).join("\n"));
      setMsg(`✓ ${filled.filter(r=>r.found).length} פרמטרים נמצאו — עברי ותקני`);
    }catch(e){ setMsg("⚠️ "+e.message); }
    setLoad(false);
  }
  return(
    <div style={{background:"#0f172a",borderRadius:"10px",padding:"16px",border:"1px solid #818cf844"}}>
      <div style={{fontSize:"14px",fontWeight:"700",color:"#818cf8",marginBottom:"12px"}}>
        📘 מבנה נרמז — {ps.filter(p=>p.found===true).length}/{validParams.length} פרמטרים נמצאו
      </div>
      <button onClick={run} disabled={load}
        style={{width:"100%",marginBottom:"10px",padding:"9px",borderRadius:"7px",border:"none",cursor:load?"wait":"pointer",
          background:load?"#1e293b":"#312e81",color:load?"#475569":"#a5b4fc",fontSize:"13px",fontWeight:"700"}}>
        {load?"⏳ בודק פרמטרים...":"🤖 בדיקת ה-AI לנרמז"}
      </button>
      {msg&&<div style={{fontSize:"12px",color:msg.startsWith("✓")?"#34d399":"#fca5a5",marginBottom:"10px",padding:"6px 10px",background:"#1e293b",borderRadius:"6px"}}>{msg}</div>}
      {!validParams.length?(
        <div style={{fontSize:"12px",color:"#475569",padding:"10px"}}>אין פרמטרים למושג זה (שדה סמנטי בלבד).</div>
      ):(
        <div style={{marginBottom:"10px"}}>
          {validParams.map((param,i)=>{
            const p=ps[i]||{found:null,verse:"",note:""};
            const label=paramLabelOf(param);
            const prevLabel=i>0?paramLabelOf(validParams[i-1]):null;
            const showGroupHeader=label&&label!==prevLabel;
            const markers=paramMarkersArr(param);
            return(
              <React.Fragment key={i}>
                {showGroupHeader&&<div style={{fontSize:"11px",fontWeight:"700",color:"#a5b4fc",marginTop:i>0?"10px":"0",marginBottom:"4px",padding:"0 2px"}}>▸ {label}</div>}
                <div style={{background:"#1e293b",borderRadius:"7px",padding:"10px",marginBottom:"7px",border:`1px solid ${p.found===true?"#818cf866":p.found===false?"#47456633":"#334155"}`}}>
                  <div style={{fontSize:"12px",color:"#cbd5e1",marginBottom:"5px",lineHeight:"1.6",fontWeight:"600"}}>{i+1}. {paramText(param)}</div>
                  {markers.length>0&&(
                    <div style={{fontSize:"11px",color:"#7dd3fc",background:"#0a1628",borderRadius:"5px",padding:"6px 10px",marginBottom:"7px",lineHeight:"1.8",borderRight:"2px solid #0ea5e9"}}>
                      <div style={{color:"#0ea5e9",fontSize:"10px",fontWeight:"700",marginBottom:"3px"}}>סימנים בטקסט:</div>
                      {markers.map((m,mi)=>(<div key={mi}>• {m}</div>))}
                    </div>
                  )}
                  {p.note&&<div style={{fontSize:"11px",color:"#94a3b8",background:"#0f172a",borderRadius:"5px",padding:"5px 8px",marginBottom:"6px",lineHeight:"1.6",fontStyle:"italic"}}>💬 {p.note}</div>}
                  <div style={{display:"flex",gap:"7px",alignItems:"center",flexWrap:"wrap"}}>
                    {[["true","כן ✓","#818cf8"],["false","לא ✗","#475569"],["null","לא נבדק","#334155"]].map(([v,l,bg])=>(
                      <button key={v} onClick={()=>updP(i,"found",v==="null"?null:v==="true")}
                        style={{padding:"4px 12px",borderRadius:"14px",border:"none",cursor:"pointer",fontSize:"12px",fontWeight:"600",
                          background:String(p.found)===v?bg:"#0f172a",color:String(p.found)===v?"white":"#475569"}}>{l}</button>
                    ))}
                    {p.found===true&&<input value={p.verse||""} onChange={e=>updP(i,"verse",e.target.value)} placeholder="פסוק..." style={{...S.input,flex:1,minWidth:"100px",padding:"4px 8px",fontSize:"12px"}}/>}
                  </div>
                </div>
              </React.Fragment>
            );
          })}
        </div>
      )}
      <div style={{display:"flex",gap:"10px",marginTop:"6px"}}>
        <button onClick={()=>onSave({params:taggedFindings(validParams,ps),implicit_note:note})}
          style={{flex:1,padding:"10px",borderRadius:"8px",border:"none",cursor:"pointer",background:"#16a34a",color:"white",fontSize:"14px",fontWeight:"700"}}>💾 שמור</button>
        <button onClick={onClose}
          style={{padding:"10px 18px",borderRadius:"8px",border:"none",cursor:"pointer",background:"#334155",color:"#cbd5e1",fontSize:"13px",fontWeight:"600"}}>ביטול</button>
      </div>
    </div>
  );
}

// ── תחנה: פרשנים (מסך 5) — רק לדה"י. המלצות בלבד; לא ממלא את הטבלה. שומר ל-scholarRecommendations ──
function ScholarStation({conceptName,params,sem,unitText,modeLabel,character,scholarship,entry,onSave,onClose}){
  const validParams=validParamDefs(params);
  const savedRecs=(entry&&entry.scholarRecommendations)||{};
  const initRecs=validParams.map(p=>{const r=savedRecs[paramId(p)]; return r?{text:r.text||"",commentators:r.commentators||[],suggestFound:(r.suggestFound===undefined?null:r.suggestFound),suggestVerse:r.suggestVerse||"",noteAdopted:!!r.noteAdopted,foundAdopted:!!r.foundAdopted}:null;});
  const [recs,setRecs]=useState(initRecs);
  const initialFindings=useMemo(()=>alignedFindings(entry,validParams),[]); // תמונת מצב קבועה של הנרמז בכניסה למסך — קו הבסיס שלא נוגעים בו בלי פעולה מפורשת
  const [findings,setFindings]=useState(()=>initialFindings);
  const [changed,setChanged]=useState(false); // true רק אם בוצעה פעולת אימוץ בפועל
  const [load,setLoad]=useState(false);
  const [msg,setMsg]=useState("");
  const [missingIdx,setMissingIdx]=useState([]);
  const who=character==="solomon"?"שלמה":"דוד";

  async function run(){
    if(!scholarship||!scholarship.trim()){setMsg("אין הערות פרשנים שמורות ליחידה זו — יש להזין אותן בכלי ההשוואה.");return;}
    if(!validParams.length){setMsg("אין פרמטרים מוגדרים.");return;}
    // אם כבר יש המלצות, זו הרצה משלימה: מבקשים רק את האינדיקטורים שעדיין חסרה להם המלצה, ולא נוגעים בקיימים.
    const targetIdx=recs.some(Boolean)?validParams.map((_,i)=>i).filter(i=>!recs[i]):validParams.map((_,i)=>i);
    if(!targetIdx.length){setMsg("יש כבר המלצה לכל האינדיקטורים — אין מה להשלים.");return;}
    setLoad(true);setMsg("");setMissingIdx([]);
    const paramLines=targetIdx.map(i=>{const p=validParams[i];const f=findings[i]||{};const cur=f.found===true?`כן${f.verse?` ${f.verse}`:""}`:f.found===false?"לא":"לא נבדק";const label=paramLabelOf(p);const markers=paramMarkersStr(p);return `${i+1}. ${label?`פרמטר: ${label} | `:""}אינדיקטור: ${paramText(p)}${markers?` | סימנים: ${markers}`:""}\n   בדיקת החוקרת כעת: ${cur}${f.note?` — ${f.note}`:""}`;}).join("\n\n");
    const prompt=`אתה עוזר מחקר לתזה בתנ"ך. קראת את פירושי הפרשנים על היחידה "${conceptName}" (דמות ${who}). תפקידך: להמליץ לחוקרת — לא למלא את הטבלה בעצמך. חובה להתייחס לכל אחד מ-${targetIdx.length} הפרמטרים המנוספרים למטה (המספור תואם את מספרם המקורי ברשימה המלאה), גם אם אין לך המלצה עבור חלקם (במקרה זה כתבי "אין המלצה").

לכל פרמטר, המלץ האם ועל מה כדאי לחזק או להוסיף על סמך הפרשנים, וציין במפורש על אילו פרשנים אתה נשען. אל תשנה את הבדיקה — רק המלץ.

טקסט (${modeLabel}):
${unitText}

פרמטרים ובדיקת החוקרת הנוכחית (רק אלו שעדיין חסרה להם המלצה):
${paramLines}

פירושי הפרשנים על היחידה:
${scholarship}

ענה ONLY ב-JSON תקני, ללא טקסט לפני/אחרי, וחובה להחזיר בדיוק ${targetIdx.length} איברים, כאשר "param" הוא המספר המקורי כפי שמופיע למעלה (לא רצף מ-1):
[
  {"param":${targetIdx[0]+1},"recommendation":"מה כדאי לחזק/להוסיף על סמך הפרשנים, או 'אין המלצה' אם הפרשנים אינם מוסיפים","commentators":["שם פרשן"],"suggest_found":true,"suggest_verse":"(ג)"}
]
- recommendation: המלצה קצרה ומעשית בעברית.
- commentators: שמות הפרשנים שעליהם ההמלצה נשענת (מערך).
- suggest_found: דעת הפרשנים על הסימון הנכון, ללא קשר לבדיקת החוקרת — true/false; אם אין עמדה, null.
- suggest_verse: פסוק שהפרשנים מצביעים עליו אם רלוונטי, אחרת "".`;
    try{
      const parsed=parseParamJSON(await aiCall(prompt,4000));
      setRecs(prev=>{
        const a=[...prev];
        targetIdx.forEach(i=>{
          const it=parsed.find(x=>x.param-1===i);
          a[i]=it?{text:it.recommendation||"",commentators:it.commentators||[],suggestFound:(it.suggest_found===undefined?null:it.suggest_found),suggestVerse:it.suggest_verse||"",noteAdopted:false,foundAdopted:false}:a[i];
        });
        return a;
      });
      const missing=targetIdx.filter(i=>!parsed.some(x=>x.param-1===i));
      setMissingIdx(missing);
      setMsg(missing.length?`⚠️ הושלמו חלק מהחסרים, אך עדיין חסרות המלצות ל-${missing.length} אינדיקטורים (${missing.map(i=>i+1).join(", ")}) — אפשר להריץ שוב.`:"✓ הושלמו כל ההמלצות — קראי והחליטי מה לאמץ (ההמלצות הקודמות לא נפגעו)");
    }catch(e){ setMsg("⚠️ "+e.message); }
    setLoad(false);
  }

  // מוסיף רק את הערת הפרשן לתיעוד — לעולם אינו נוגע ב-found. פעולה בטוחה תמיד.
  function adoptNote(i){
    const r=recs[i]; if(!r)return;
    setFindings(prev=>{
      const a=[...prev];
      const cur=a[i]||{found:null,verse:"",note:""};
      const src=r.commentators&&r.commentators.length?` [פרשנים: ${r.commentators.join(", ")}]`:"";
      const addNote=`${r.text}${src}`;
      a[i]={...cur, note: cur.note?`${cur.note}\n↳ ${addNote}`:addNote};
      return a;
    });
    setRecs(prev=>{const a=[...prev];a[i]={...a[i],noteAdopted:true};return a;});
    setChanged(true);
    setMsg(`✓ ההערה נוספה לתיעוד הפרמטר ${i+1} (הסימון שלך לא השתנה) — זכרי לשמור`);
  }

  // פעולה נפרדת ומפורשת: לשנות בפועל את הסימון לפי דעת הפרשנים. מוצגת רק כשיש חוסר הסכמה אמיתי.
  function adoptFoundChange(i){
    const r=recs[i]; if(!r||(r.suggestFound!==true&&r.suggestFound!==false))return;
    setFindings(prev=>{
      const a=[...prev];
      const cur=a[i]||{found:null,verse:"",note:""};
      a[i]={...cur, found:r.suggestFound, verse:r.suggestVerse?(cur.verse?cur.verse:r.suggestVerse):cur.verse};
      return a;
    });
    setRecs(prev=>{const a=[...prev];a[i]={...a[i],foundAdopted:true};return a;});
    setChanged(true);
    setMsg(`✓ הסימון של פרמטר ${i+1} עודכן לפי דעת הפרשנים — זכרי לשמור`);
  }

  function save(){
    const recObj={};
    validParams.forEach((p,i)=>{ if(recs[i]) recObj[paramId(p)||("i"+i)]={text:recs[i].text,commentators:recs[i].commentators,suggestFound:recs[i].suggestFound,suggestVerse:recs[i].suggestVerse,noteAdopted:recs[i].noteAdopted,foundAdopted:recs[i].foundAdopted}; });
    // אם לא בוצעה שום פעולת אימוץ בפועל, אין לגעת בכלל בטבלת ה-params של הנרמז — נשמרות רק ההמלצות עצמן.
    const patch=changed?{params:taggedFindings(validParams,findings),scholarRecommendations:recObj}:{scholarRecommendations:recObj};
    onSave(patch);
  }

  return(
    <div style={{background:"#0f172a",borderRadius:"10px",padding:"16px",border:"1px solid #c084fc44"}}>
      <div style={{fontSize:"14px",fontWeight:"700",color:"#c084fc",marginBottom:"4px"}}>📖 בדיקה מול פרשנים — {conceptName}</div>
      <div style={{fontSize:"11px",color:"#64748b",marginBottom:"12px"}}>הפרשנים ממליצים בלבד. הסימון שלך מהנרמז נשאר קבוע: "הוסיפי הערה" רק מוסיפה תיעוד ולעולם לא נוגעת בסימון. שינוי סימון בפועל מתבצע רק בלחיצה נפרדת ומפורשת, ומוצג רק כשיש חוסר הסכמה אמיתי בין דעתך לדעת הפרשנים.</div>

      <div style={{background:"#1e293b",borderRadius:"8px",padding:"12px",marginBottom:"12px",border:"1px solid #334155"}}>
        <div style={{fontSize:"12px",fontWeight:"700",color:"#fbbf24",marginBottom:"6px"}}>📝 פירושי הפרשנים (מכלי ההשוואה)</div>
        {scholarship&&scholarship.trim()
          ?<div style={{fontSize:"12px",color:"#e2e8f0",lineHeight:"1.8",whiteSpace:"pre-wrap",maxHeight:"150px",overflowY:"auto"}}>{scholarship}</div>
          :<div style={{fontSize:"12px",color:"#64748b"}}>אין הערות פרשנים שמורות ליחידה זו — יש להזין אותן בכלי ההשוואה.</div>}
      </div>

      <button onClick={run} disabled={load||!scholarship} style={{width:"100%",marginBottom:"12px",padding:"9px",borderRadius:"7px",border:"none",cursor:(load||!scholarship)?"not-allowed":"pointer",background:(load||!scholarship)?"#1e293b":"#3b0764",color:(load||!scholarship)?"#475569":"#e9d5ff",fontSize:"13px",fontWeight:"700"}}>
        {load?"⏳ מפיק המלצות...":recs.some(Boolean)?"🔄 השלימי המלצות חסרות":"🤖 קבל המלצות מהפרשנים"}
      </button>
      {msg&&<div style={{fontSize:"12px",color:msg.startsWith("✓")?"#34d399":"#fca5a5",marginBottom:"12px",padding:"6px 10px",background:"#1e293b",borderRadius:"6px"}}>{msg}</div>}

      <div style={{marginBottom:"12px"}}>
        {validParams.map((param,i)=>{
          const r=recs[i]; const f=findings[i]||{found:null,verse:"",note:""};
          const curTxt=f.found===true?`כן ✓${f.verse?` ${f.verse}`:""}`:f.found===false?"לא ✗":"לא נבדק";
          const disagreement=r&&(r.suggestFound===true||r.suggestFound===false)&&r.suggestFound!==f.found;
          return(
            <div key={i} style={{background:"#1e293b",borderRadius:"8px",padding:"11px",marginBottom:"8px",border:"1px solid #334155"}}>
              <div style={{fontSize:"12px",color:"#cbd5e1",fontWeight:"600",marginBottom:"4px",lineHeight:"1.5"}}>{i+1}. {paramText(param)}</div>
              <div style={{fontSize:"11px",color:"#818cf8",marginBottom:"6px"}}>הבדיקה שלך (מהנרמז, קבועה): <span style={{fontWeight:"700"}}>{curTxt}</span></div>
              {!r?(
                missingIdx.includes(i)
                  ?<div style={{fontSize:"11px",color:"#fbbf24"}}>⚠️ לא התקבלה המלצה עבור אינדיקטור זה בהרצה האחרונה — אפשר להריץ שוב.</div>
                  :<div style={{fontSize:"11px",color:"#475569"}}>— טרם התקבלה המלצה —</div>
              ):(
                <div style={{background:"#0f172a",borderRadius:"6px",padding:"9px",border:"1px solid #3b0764"}}>
                  <div style={{fontSize:"12px",color:"#e9d5ff",lineHeight:"1.7",marginBottom:"6px"}}>💡 {r.text||"אין המלצה"}</div>
                  {r.commentators&&r.commentators.length>0&&<div style={{fontSize:"10px",color:"#c084fc",marginBottom:"6px"}}>נשען על: {r.commentators.join(", ")}</div>}
                  {disagreement&&<div style={{fontSize:"10px",color:"#fbbf24",marginBottom:"6px"}}>לדעת הפרשנים ראוי לשקול: {r.suggestFound?"כן ✓":"לא ✗"}{r.suggestVerse?` ${r.suggestVerse}`:""} (שונה מהסימון שלך — שינוי בפועל דורש לחיצה נפרדת למטה)</div>}
                  {(r.text&&r.text!=="אין המלצה")&&(
                    <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginTop:"4px"}}>
                      {r.noteAdopted
                        ?<div style={{fontSize:"11px",color:"#34d399",fontWeight:"700"}}>✓ ההערה נוספה לתיעוד</div>
                        :<button onClick={()=>adoptNote(i)} style={{padding:"5px 14px",borderRadius:"8px",border:"none",cursor:"pointer",background:"#7e22ce",color:"white",fontSize:"12px",fontWeight:"700"}}>➕ הוסיפי הערה לתיעוד (לא נוגע בסימון)</button>}
                      {disagreement&&(r.foundAdopted
                        ?<div style={{fontSize:"11px",color:"#fbbf24",fontWeight:"700"}}>✓ הסימון עודכן לפי הפרשנים</div>
                        :<button onClick={()=>adoptFoundChange(i)} style={{padding:"5px 14px",borderRadius:"8px",border:"1px solid #fbbf24",cursor:"pointer",background:"transparent",color:"#fbbf24",fontSize:"12px",fontWeight:"700"}}>⚠️ שני בפועל לסימון {r.suggestFound?"כן":"לא"}</button>)}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div style={{display:"flex",gap:"10px"}}>
        <button onClick={save} style={{flex:1,padding:"10px",borderRadius:"8px",border:"none",cursor:"pointer",background:"#16a34a",color:"white",fontSize:"14px",fontWeight:"700"}}>💾 שמור</button>
        <button onClick={onClose} style={{padding:"10px 18px",borderRadius:"8px",border:"none",cursor:"pointer",background:"#334155",color:"#cbd5e1",fontSize:"13px",fontWeight:"600"}}>ביטול</button>
      </div>
    </div>
  );
}

// ── מסך 1 — בחירת יחידה ספרותית ──

// ── מסך 2 — רכזת הניתוח ──
function Screen2Hub({unit,mode,allConcepts,getParams,getE,setE,dim4concept,raw,onBack}){
  const [activeConcept,setActiveConcept]=useState(null);
  const [station,setStation]=useState(null); // null | explicit | implicit | scholar
  const isChr=mode==="chronicles";
  const modeColor=isChr?"#93c5fd":"#fbbf24";
  const modeLabel=isChr?'📘 דה"י':'📙 מקבילה';
  const unitText=isChr?unit.chroniclesText:unit.sourceText;
  const diffChunks=useMemo(()=>{try{return computeDiff(unit.chroniclesText||"",unit.sourceText||"");}catch{return [];}},[unit.chroniclesText,unit.sourceText]);
  function renderColoredText(){
    if(!unitText) return <span style={{color:"#475569"}}>אין טקסט ליחידה זו</span>;
    if(!diffChunks.length) return unitText;
    return diffChunks.map(ch=>{
      const t=ch.type;
      if(t==="verse") return <span key={ch.id} style={{color:"#64748b",fontSize:"12px"}}>{(isChr?ch.aW:ch.bW).join(" ")} </span>;
      if(t==="equal") return <span key={ch.id}>{(isChr?ch.aW:ch.bW).join(" ")} </span>;
      let words,st=t;
      if(isChr){
        if(t==="omitted")return <span key={ch.id}/>;
        words=ch.aW; st=t==="changed"?"changed":"added";
      }else{
        if(t==="added")return <span key={ch.id}/>;
        words=ch.bW; st=t==="changed"?"changed":"omitted";
      }
      const c=DIFF_COLORS[st]||{};
      return <span key={ch.id}><span style={{background:c.bg,border:c.border,borderRadius:"4px",padding:"1px 4px",color:c.tc,fontWeight:"600"}}>{words.join(" ")}</span> </span>;
    });
  }
  const character=unit.character||"david";
  const entry=activeConcept?getE(unit.id,activeConcept,mode):null;
  const params=activeConcept?getParams(activeConcept):[];
  const validCount=validParamDefs(params).length;
  const hasParams=validCount>0;
  const sem=activeConcept?((raw.customSemantic||{})[activeConcept]||SEMANTIC[activeConcept]||null):null;

  const orderedConcepts=[];
  DIMS.forEach(d=>d.concepts.forEach(name=>{ if(allConcepts.find(c=>c.name===name)) orderedConcepts.push(name); }));
  allConcepts.forEach(c=>{ if(!orderedConcepts.includes(c.name)) orderedConcepts.push(c.name); });

  function pickConcept(name){ setActiveConcept(name); setStation(null); }
  function commit(patch){ setE(unit.id,activeConcept,{...(entry||{}),...patch},mode); setStation(null); }
  function nextConcept(){
    const idx=orderedConcepts.indexOf(activeConcept);
    const nxt=orderedConcepts[idx+1];
    if(nxt){ setActiveConcept(nxt); setStation(null); }
    else { setActiveConcept(null); setStation(null); }
  }

  const stationProps={conceptName:activeConcept,params,sem,unitText,modeLabel,character,
    scholarship:unit.scholarship,entry,onSave:commit,onClose:()=>setStation(null)};

  return(
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 46px)"}}>
      {/* ── אזור עליון קבוע: טקסט + שם היחידה ── */}
      <div style={{flexShrink:0,padding:"10px 16px",borderBottom:"1px solid #334155",background:"#0f172a"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}}>
          <button onClick={onBack} style={{padding:"5px 12px",borderRadius:"8px",border:"none",cursor:"pointer",background:"#334155",color:"#cbd5e1",fontSize:"12px",fontWeight:"600"}}>↩ בחירת יחידה</button>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:"15px",fontWeight:"bold",color:"#f1f5f9"}}>{unit.label} <span style={{fontSize:"12px",color:modeColor}}>· {modeLabel}</span></div>
            {unit.sourceRef&&<div style={{fontSize:"11px",color:"#64748b"}}>מקביל: {unit.sourceRef}</div>}
          </div>
          <div style={{width:"90px"}}/>
        </div>
        <div style={{background:"#1e293b",border:`1px solid ${modeColor}44`,borderRadius:"8px",padding:"10px 14px",fontSize:"13px",lineHeight:"2.2",color:"#e2e8f0",maxHeight:"170px",overflowY:"auto"}}>
          {renderColoredText()}
        </div>
      </div>

      {/* ── מתחת לטקסט: מרכז עבודה (ימין) + רשימת מושגים (שמאל) ── */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 240px",flex:1,overflow:"hidden"}}>
        {/* מרכז */}
        <div style={{overflowY:"auto",padding:"16px"}}>
          {!activeConcept?(
            <div style={{padding:"50px",textAlign:"center",color:"#475569",fontSize:"14px"}}>בחרי מושג מהרשימה משמאל</div>
          ):station==="explicit"?(
            <ExplicitStation {...stationProps}/>
          ):station==="implicit"?(
            <ImplicitStation {...stationProps}/>
          ):station==="scholar"?(
            <ScholarStation {...stationProps}/>
          ):(
            // ── רכזת: שלושת הכפתורים ──
            <div style={{maxWidth:"560px",margin:"0 auto"}}>
              <div style={{fontSize:"17px",fontWeight:"700",color:"#f1f5f9",marginBottom:"4px"}}>{activeConcept}</div>
              <div style={{fontSize:"12px",color:"#64748b",marginBottom:"20px"}}>בחרי חלק לעבודה. אחרי שמירה החלק נסגר וחוזרים לכאן.</div>
              {[
                {key:"explicit",label:"📗 מבנה גלוי",desc:"שדה סמנטי — בדיקת ה-AI ואישור",color:"#34d399",done:!!(entry&&entry.explicit_note&&entry.explicit_note.trim()),active:true},
                {key:"implicit",label:"📘 מבנה נרמז",desc:hasParams?"פרמטרים ואינדיקטורים":"אין פרמטרים (שדה סמנטי בלבד)",color:"#818cf8",done:!!(entry&&(entry.params||[]).some(p=>p&&p.found!==null)),active:hasParams},
                ...(isChr?[{key:"scholar",label:"📖 בדיקה מול פרשנים",desc:unit.scholarship?"המלצות הפרשנים":"אין פרשנים שמורים ליחידה",color:"#c084fc",done:!!(entry&&entry.scholarRecommendations&&Object.keys(entry.scholarRecommendations).length>0),active:hasParams&&!!unit.scholarship}]:[])
              ].map(b=>(
                <button key={b.key} onClick={()=>b.active&&setStation(b.key)} disabled={!b.active}
                  style={{display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%",textAlign:"right",padding:"16px 18px",borderRadius:"12px",marginBottom:"12px",
                    cursor:b.active?"pointer":"not-allowed",border:`1px solid ${b.active?b.color+"55":"#334155"}`,
                    background:b.active?b.color+"14":"#1e293b",color:b.active?b.color:"#475569"}}>
                  <div>
                    <div style={{fontSize:"15px",fontWeight:"700"}}>{b.label} {b.done&&<span style={{color:"#34d399",fontSize:"13px"}}>✓ נשמר</span>}</div>
                    <div style={{fontSize:"12px",color:"#64748b",marginTop:"3px",fontWeight:"400"}}>{b.desc}</div>
                  </div>
                  <span style={{fontSize:"18px"}}>{b.active?"›":"🔒"}</span>
                </button>
              ))}
              <button onClick={nextConcept}
                style={{width:"100%",marginTop:"10px",padding:"12px",borderRadius:"10px",border:"1px dashed #475569",cursor:"pointer",background:"transparent",color:"#94a3b8",fontSize:"13px",fontWeight:"700"}}>
                המשך למושג הבא ↩
              </button>
            </div>
          )}
        </div>

        {/* רשימת מושגים — משמאל */}
        <div style={{background:"#1e293b",borderRight:"1px solid #334155",overflowY:"auto",padding:"10px"}}>
          <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",marginBottom:"8px"}}>מושגים ({orderedConcepts.length})</div>
          {DIMS.map(dim=>{
            const cs=allConcepts.filter(c=>c.dimId===dim.id);
            if(!cs.length)return null;
            return(
              <div key={dim.id} style={{marginBottom:"10px"}}>
                <div style={{fontSize:"10px",color:dim.color,fontWeight:"700",marginBottom:"4px"}}>{dim.label.split(":")[1]?dim.label.split(":")[1].trim():dim.label}</div>
                {cs.map(c=>{
                  const e=getE(unit.id,c.name,mode);
                  const hp=validParamDefs(getParams(c.name)).length>0;
                  const st=conceptStatusA(e,mode,hp);
                  const isActive=activeConcept===c.name;
                  return(
                    <button key={c.name} onClick={()=>pickConcept(c.name)}
                      style={{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",textAlign:"right",padding:"6px 8px",borderRadius:"6px",border:"none",cursor:"pointer",marginBottom:"2px",fontSize:"12px",
                        background:isActive?dim.color+"33":"transparent",color:isActive?dim.color:st==="done"?"#34d399":"#94a3b8",
                        borderRight:isActive?`3px solid ${dim.color}`:"3px solid transparent",fontWeight:isActive?"700":"400"}}>
                      <span>{c.name}</span>
                      <StatusDot status={st}/>
                    </button>
                  );
                })}
              </div>
            );
          })}
          <div style={{marginTop:"12px",paddingTop:"10px",borderTop:"1px solid #334155",fontSize:"10px",color:"#64748b",lineHeight:"1.9"}}>
            <div><span style={{color:STATUS_META.done.c}}>●</span> הושלם</div>
            <div><span style={{color:STATUS_META.await_scholar.c}}>◑</span> ממתין לפרשנים</div>
            <div><span style={{color:STATUS_META.progress.c}}>◐</span> בתהליך</div>
            <div><span style={{color:STATUS_META.none.c}}>○</span> טרם התחיל</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── מסך 0 — בחירת מצב (דה"י / מקבילות) — הצעד הראשון בכניסה לשלב א' ──
function Screen0ModeChooser({allUnits,allConcepts,getE,getParams,onPick}){
  function progFor(mode){
    let done=0,tot=0;
    allUnits.forEach(u=>{
      const hasTxt=mode==="source"?!!u.sourceText:!!u.chroniclesText;
      if(!hasTxt)return;
      allConcepts.forEach(c=>{
        tot++;
        const hp=validParamDefs(getParams(c.name)).length>0;
        if(conceptStatusA(getE(u.id,c.name,mode),mode,hp)==="done") done++;
      });
    });
    return {done,tot,pct:tot?Math.round(done/tot*100):0};
  }
  const chr=progFor("chronicles"), src=progFor("source");
  return(
    <div style={{maxWidth:"720px",margin:"0 auto",padding:"40px 16px"}}>
      <div style={{fontSize:"20px",fontWeight:"bold",color:"#f1f5f9",marginBottom:"4px"}}>שלב א׳ — ניתוח עצמאי של יחידה</div>
      <div style={{fontSize:"13px",color:"#64748b",marginBottom:"28px"}}>בחרי באיזה טקסט לעבוד</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px"}}>
        {[["chronicles",'📘 דברי הימים',"#93c5fd",chr],["source",'📙 מקבילות (שמ"ב / מל"א)',"#fbbf24",src]].map(([m,l,c,p])=>(
          <div key={m} onClick={()=>onPick(m)}
            style={{...S.card,cursor:"pointer",background:`linear-gradient(135deg, ${c}18, #0f172a)`,border:`1px solid ${c}44`}}>
            <div style={{fontSize:"15px",fontWeight:"bold",color:c,marginBottom:"6px"}}>{l}</div>
            <div style={{fontSize:"26px",fontWeight:"bold",color:c,marginBottom:"6px"}}>{p.pct}%</div>
            <div style={{background:"#0f172a",borderRadius:"6px",height:"7px",overflow:"hidden",marginBottom:"6px"}}>
              <div style={{width:p.pct+"%",height:"100%",background:c,transition:"width 0.5s"}}/>
            </div>
            <div style={{fontSize:"11px",color:"#64748b"}}>{p.done} / {p.tot} תאים</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── עוטף שלב א' ──
function StageA({allUnits,allConcepts,getE,setE,getParams,dim4concept,raw}){
  const [phase,setPhase]=useState("mode"); // mode | pick | hub
  const [mode,setMode]=useState(null);
  const [sel,setSel]=useState(null); // {unit}
  if(phase==="mode"||!mode)
    return <Screen0ModeChooser allUnits={allUnits} allConcepts={allConcepts} getE={getE} getParams={getParams} onPick={m=>{setMode(m);setPhase("pick");}}/>;
  if(phase==="pick"||!sel)
    return <Screen1Picker allUnits={allUnits} allConcepts={allConcepts} getE={getE} getParams={getParams} mode={mode} onBack={()=>{setPhase("mode");setMode(null);}} onStart={(unit)=>{setSel({unit});setPhase("hub");}}/>;
  return <Screen2Hub unit={sel.unit} mode={mode} allConcepts={allConcepts} getParams={getParams} getE={getE} setE={setE} dim4concept={dim4concept} raw={raw} onBack={()=>{setPhase("pick");setSel(null);}}/>;
}


// ════════════════════════════════════════════════════════════════════════
// ── שלב ב' — סינתזה והשוואה  (מסך 1 בחירה → מסך 2 השוואה → מסך 3 סיכום) ──
// קורא בלבד מנתוני שלב א' (getE לשני המצבים). תוצריו נשמרים במפתחות נפרדים:
//   compareNotes (מסקנה מחקרית — קיים) · compareFactual (ניתוח עובדתי) · unitSummary (סיכום יחידה)
// ════════════════════════════════════════════════════════════════════════
function fmtParamStatus(pe){
  if(!pe) return "לא נבדק";
  return pe.found===true?`כן${pe.verse?` ${pe.verse}`:""}`:pe.found===false?"לא":"לא נבדק";
}
function buildCompareParamsText(validParams,ec,es){
  if(!validParams.length) return "אין פרמטרים מוגדרים למושג זה.";
  const cf=alignedFindings(ec,validParams), sf=alignedFindings(es,validParams);
  return validParams.map((p,i)=>{
    const c=cf[i]||{}, s=sf[i]||{};
    return `${i+1}. ${paramText(p)}\n   דה"י: ${fmtParamStatus(c)}${c.note?` — ${c.note}`:""}\n   מקבילה: ${fmtParamStatus(s)}${s.note?` — ${s.note}`:""}`;
  }).join("\n");
}
// חישוב מקדים של הצלבת פרמטרים — כדי למנוע מה-AI לטעות בספירה
function buildParamsCrosstab(validParams,ec,es){
  if(!validParams.length) return "אין פרמטרים מוגדרים למושג זה.";
  const cf=alignedFindings(ec,validParams), sf=alignedFindings(es,validParams);
  const added=[],removed=[],inBoth=[],inNeither=[];
  validParams.forEach((p,i)=>{
    const c=cf[i]||{}, s=sf[i]||{};
    const inC=c.found===true, inS=s.found===true;
    const label=`פרמטר ${i+1}`;
    if(inC&&!inS)added.push(label);
    else if(!inC&&inS)removed.push(label);
    else if(inC&&inS)inBoth.push(label);
    else inNeither.push(label);
  });
  const lines=[];
  lines.push(`סה"כ פרמטרים: ${validParams.length}`);
  lines.push(`נוספו בדה"י (קיימים רק בדה"י): ${added.length?added.join(", "):"אין"}`);
  lines.push(`נגרעו מהמקבילה (קיימים רק במקבילה): ${removed.length?removed.join(", "):"אין"}`);
  lines.push(`מתקיימים בשני הטקסטים: ${inBoth.length?inBoth.join(", "):"אין"}`);
  lines.push(`אינם מתקיימים באף טקסט: ${inNeither.length?inNeither.join(", "):"אין"}`);
  return lines.join("\n");
}
function buildDiffSummaryText(unit){
  try{
    const diff=computeDiff(unit.chroniclesText||"",unit.sourceText||"");
    const added=[],omitted=[],changed=[];
    diff.forEach(ch=>{
      if(ch.type==="added"&&ch.aW&&ch.aW.length)added.push(ch.aW.join(" "));
      else if(ch.type==="omitted"&&ch.bW&&ch.bW.length)omitted.push(ch.bW.join(" "));
      else if(ch.type==="changed")changed.push(`"${(ch.bW||[]).join(" ")}" ← "${(ch.aW||[]).join(" ")}"`);
    });
    const parts=[];
    if(added.length)parts.push(`תוספות בדה"י (${added.length}): ${added.join(", ")}`);
    if(omitted.length)parts.push(`השמטות מהמקבילה (${omitted.length}): ${omitted.join(", ")}`);
    if(changed.length)parts.push(`שינויי מילים (${changed.length}): ${changed.join(", ")}`);
    return parts.length?parts.join("\n"):"אין הבדלים מסומנים אוטומטית";
  }catch{ return "אין הבדלים מסומנים אוטומטית"; }
}

// ── מסך 1 — בחירת יחידת ההשוואה ──
function StageBPick({allUnits,allConcepts,getE,getParams,onOpen,onSummary,isAnalyzed,getCompareNote,getUnitSummary,setUnitSummary}){
  const [character,setCharacter]=useState(null);
  const [selUnitId,setSelUnitId]=useState(null);
  const units=allUnits.filter(u=>u.character===character||(character==="david"&&!u.character));
  const sel=selUnitId?allUnits.find(u=>u.id===selUnitId):null;
  const isSondergut=sel?!(sel.sourceText&&sel.sourceText.trim()):false;
  const chrOk=sel?isAnalyzed(sel.id,"chronicles"):false;
  const srcOk=sel?isAnalyzed(sel.id,"source"):false;
  const ready=chrOk&&(isSondergut||srcOk);

  // חישוב סטטוס עבודת שלב ב' לכל יחידה — מבוסס על מספר המסקנות המחקריות שנכתבו
  function stageBStatus(uid){
    const summary=getUnitSummary?getUnitSummary(uid):{};
    if(summary&&summary.notInThesis) return {icon:"⏭️",label:"אינה בתזה",color:"#7c3aed",count:0,total:allConcepts.length,notInThesis:true};
    const concls=allConcepts.filter(c=>((getCompareNote(uid,c.name)||"").trim().length>0)).length;
    const total=allConcepts.length;
