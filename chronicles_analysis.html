טקסט היחידה בדברי הימים:
${unit.chroniclesText||"—"}

תוצאות הפרמטרים ביחידה:
${paramsText}${scholarText}

הערות פרשנים על היחידה (מכלי ההשוואה):
${scholarship&&scholarship.trim()?scholarship:"אין הערות פרשנים שמורות ליחידה זו"}

הנחיות לכתיבת המסקנה: כתבי בעברית אקדמית, כ-220-280 מילה, בפרוזה רציפה בלבד.

איסור מוחלט על כל סימן עיצוב טקסט: אסור להשתמש בסולמיות (###, ##, #) לכותרות, אסור בכוכביות כפולות (**מילה**) להדגשה, אסור בקווי הפרדה (---, ***), אסור ברשימות ממוספרות (1. 2. 3.) או בתבליטים (-, •, *). כתבי הכל כפסקאות פרוזה רגילות בלבד. אסור בשורות ריקות מיותרות בין הפסקאות — לכל היותר שורה ריקה אחת בין פסקה לפסקה.

כלל חובה בציטוט חוקרים: הערות הפרשנים לעיל מלוות במספרי עמוד מדויקים (בפורמט "עמ' XXX"). בכל פעם שאת מזכירה חוקר בשמו במסקנה, חובה לצרף מיד לאחר שמו את מספר העמוד בסוגריים על סמך המספר המדויק המופיע בהערות. הפורמט הנדרש: "שם החוקר (עמ' XXX)". אם החוקר מוזכר ביחס לטענה שאין לה מספר עמוד ספציפי בהערות שלעיל, אל תנקבי בשמו כלל אלא נסחי את התובנה באופן כללי (למשל "הפרשנות המחקרית מדגישה" או "מקובל בפרשנות"). אין להמציא מספרי עמוד בשום מקרה — רק להשתמש במספרים המופיעים במפורש בהערות.

המבנה הפנימי הוא שלוש פסקאות רצופות. כיוון שיחידה זו היא סונדרגוט (ללא מקבילה בשמואל/מלכים), הניתוח מבוסס על שלושה עמודי תווך: נוכחות לקסיקלית, מבנה מיקום וכמות, והד לספרות הנבואית של חזון המלך האידיאלי.

פסקה ראשונה — השדה הגלוי ונוכחות לקסיקלית: האם המושג "${conceptName}" מופיע במפורש בטקסט היחידה? באילו פסוקים ובאילו ביטויים ספציפיים? אילו מונחים מהמשפחה הסמנטית של המושג (מילים קרובות, שורשים דומים, ביטויים נלווים) עולים מן היחידה? ציינו במפורש אם המושג נעדר לחלוטין מהרובד הגלוי.

פסקה שנייה — מבנה, מיקום, כמות והד נבואי: כיצד היחידה בנויה סביב המושג? כמה מקום מוקדש להיבט זה בתוך היחידה? האם מיקום היחידה במבנה הרחב של פרקי ${who} בדברי הימים מלמד על משקלה בעיצוב הדמות? האם ניתן לזהות בטקסט הדים לביטויים, לתמונות או לתבניות של חזון המלך האידיאלי מישעיהו, מירמיהו ומיחזקאל? עברו על הפרמטרים שהתקיימו ביחידה והסבירו מה הם חושפים על עיצוב המושג. השתמשו בהערות הפרשנים לביסוס, תוך הקפדה על כלל החובה לציון מספר העמוד בסוגריים לאחר כל שם חוקר.

פסקה שלישית — מסקנה: באיזה אופן היחידה מבססת את המושג "${conceptName}" בדמותו של ${who}? האם מדובר בביסוס מרכזי, בעיגון משני, או שהמושג נעדר מן החומר?`;
    try{
      let text=await aiCall(prompt,2500);
      try{
        text=text
          .replace(/^\s*#{1,6}\s+/gm,"")
          .replace(/\*\*([^*]+?)\*\*/g,"$1")
          .replace(/__([^_]+?)__/g,"$1")
          .replace(/^\s*[-=*_]{3,}\s*$/gm,"")
          .replace(/^\s*[\-•]\s+/gm,"")
          .replace(/\n{3,}/g,"\n\n")
          .replace(/[ \t]+\n/g,"\n")
          .trim();
      }catch(cleanErr){console.warn("markdown cleanup failed:",cleanErr);}
      setConclusion(text);
    }catch(e){ setConclusion("⚠️ "+e.message); }
    setLoadC(false);
  }

  return(
    <>
      {/* טבלת השוואת פרמטרים */}
      <div style={{background:"#1e293b",borderRadius:"10px",padding:"14px",border:"1px solid #334155",marginBottom:"14px"}}>
        <div style={{fontSize:"13px",fontWeight:"700",color:"#f1f5f9",marginBottom:"10px"}}>טבלת השוואה — {conceptName}</div>
        {validParams.length===0?(
          <div style={{fontSize:"12px",color:"#475569"}}>אין פרמטרים למושג זה (שדה סמנטי בלבד).</div>
        ):(
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:"12px"}}>
              <thead>
                <tr style={{color:"#64748b",fontSize:"11px",fontWeight:"700"}}>
                  <th style={{textAlign:"right",padding:"5px 6px",borderBottom:"1px solid #334155"}}>#</th>
                  <th style={{textAlign:"right",padding:"5px 6px",borderBottom:"1px solid #334155"}}>פרמטר</th>
                  <th style={{textAlign:"center",padding:"5px 6px",borderBottom:"1px solid #334155",color:"#93c5fd"}}>דה"י</th>
                  <th style={{textAlign:"center",padding:"5px 6px",borderBottom:"1px solid #334155",color:"#fbbf24"}}>מקבילה</th>
                </tr>
              </thead>
              <tbody>
                {validParams.map((p,i)=>{
                  const c=alignedFindings(ec,[p])[0]||{}, s=alignedFindings(es,[p])[0]||{};
                  const cell=(pe,col)=>{
                    const yes=pe.found===true,no=pe.found===false;
                    return <td style={{textAlign:"center",padding:"6px",borderBottom:"1px solid #1e293b"}}>
                      <span style={{color:yes?col:no?"#64748b":"#475569",fontWeight:"700"}}>{yes?"✓":no?"✗":"—"}</span>
                      {yes&&pe.verse&&<span style={{color:"#64748b",fontSize:"10px"}}> {pe.verse}</span>}
                    </td>;
                  };
                  return(
                    <tr key={i}>
                      <td style={{padding:"6px",borderBottom:"1px solid #1e293b",color:"#64748b"}}>{i+1}</td>
                      <td style={{padding:"6px",borderBottom:"1px solid #1e293b",color:"#cbd5e1",lineHeight:"1.5"}}>{paramText(p)}</td>
                      {cell(c,"#93c5fd")}
                      {cell(s,"#fbbf24")}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {/* אזור ג' — ניתוח השוואתי עובדתי */}
      <div style={{background:"#0f172a",borderRadius:"10px",padding:"14px",border:"1px solid #818cf844",marginBottom:"14px"}}>
        <div style={{fontSize:"13px",fontWeight:"700",color:"#818cf8",marginBottom:"10px"}}>📊 ניתוח השוואתי (עובדתי בלבד)</div>
        <button onClick={runFactual} disabled={loadF}
          style={{width:"100%",marginBottom:"10px",padding:"9px",borderRadius:"7px",border:"none",cursor:loadF?"wait":"pointer",background:loadF?"#1e293b":"#312e81",color:loadF?"#475569":"#a5b4fc",fontSize:"13px",fontWeight:"700"}}>
          {loadF?"⏳ מנתח...":factual?"🔄 הרץ ניתוח מחדש":"🤖 ניתוח השוואתי"}
        </button>
        <textarea value={factual} onChange={e=>setFactualText(e.target.value)} rows={6}
          placeholder="אילו פרמטרים נוספו / נגרעו / התחזקו — תיאור עובדתי..." style={{...S.input,resize:"vertical",lineHeight:"1.7"}}/>
        <button onClick={saveFactual}
          style={{width:"100%",marginTop:"10px",padding:"9px",borderRadius:"8px",border:"none",cursor:"pointer",background:savedF?"#16a34a":"#1d4ed8",color:"white",fontSize:"13px",fontWeight:"700"}}>{savedF?"✓ נשמר!":"💾 שמור"}</button>
      </div>

      {/* אזור ד' — מסקנה מחקרית */}
      <div style={{background:"#0f172a",borderRadius:"10px",padding:"14px",border:"1px solid #34d39944"}}>
        <div style={{fontSize:"13px",fontWeight:"700",color:"#34d399",marginBottom:"10px"}}>✍️ מסקנה מחקרית</div>
        <div style={{display:"flex",gap:"8px",marginBottom:"10px"}}>
          <button onClick={runConclusion} disabled={loadC}
            style={{flex:1,padding:"9px",borderRadius:"7px",border:"none",cursor:loadC?"wait":"pointer",background:loadC?"#1e293b":"#064e3b",color:loadC?"#475569":"#34d399",fontSize:"13px",fontWeight:"700"}}
            title="מסקנה השוואתית: משווה בין דה&quot;י למקבילה בשמואל/מלכים">
            {loadC?"⏳ כותב מסקנה...":conclusion?"🔄 מסקנה השוואתית":"✍️ מסקנה השוואתית"}
          </button>
          <button onClick={runSondergutConclusion} disabled={loadC}
            style={{flex:1,padding:"9px",borderRadius:"7px",border:"none",cursor:loadC?"wait":"pointer",background:loadC?"#1e293b":"#3b0764",color:loadC?"#475569":"#c084fc",fontSize:"13px",fontWeight:"700"}}
            title="מסקנה עצמאית: ליחידות סונדרגוט (בלי מקבילה) — מנתח את היחידה בפני עצמה לפי נוכחות לקסיקלית, מבנה והד נבואי">
            {loadC?"⏳ כותב מסקנה...":conclusion?"🔄 מסקנה עצמאית (סונדרגוט)":"✍️ מסקנה עצמאית (סונדרגוט)"}
          </button>
        </div>
        <textarea value={conclusion} onChange={e=>setConclusion(e.target.value)} rows={9}
          placeholder="המסקנה המחקרית תופיע כאן — ניתן לערוך לפני שמירה..." style={{...S.input,resize:"vertical",lineHeight:"1.8"}}/>
        <button onClick={saveConclusion}
          style={{width:"100%",marginTop:"10px",padding:"10px",borderRadius:"8px",border:"none",cursor:"pointer",background:savedC?"#16a34a":"#059669",color:"white",fontSize:"14px",fontWeight:"700"}}>{savedC?"✓ נשמר!":"💾 שמור מסקנה"}</button>
      </div>
    </>
  );
}

// ── מסך 2 — סביבת ההשוואה ──
function StageBCompare({unit,allConcepts,getE,getParams,getFactual,setFactual,getCompareNote,setCompareNote,onBack,onSummary,initConcept}){
  const [activeConcept,setActiveConcept]=useState(initConcept||null);
  React.useEffect(()=>{ if(initConcept) setActiveConcept(initConcept); },[initConcept]);
  const ec=activeConcept?(getE(unit.id,activeConcept,"chronicles")||{}):{};
  const es=activeConcept?(getE(unit.id,activeConcept,"source")||{}):{};
  const validParams=activeConcept?validParamDefs(getParams(activeConcept)):[];

  return(
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 46px)"}}>
      {/* כותרת + ניווט */}
      <div style={{flexShrink:0,padding:"10px 16px",borderBottom:"1px solid #334155",background:"#0f172a",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <button onClick={onBack} style={{padding:"5px 12px",borderRadius:"8px",border:"none",cursor:"pointer",background:"#334155",color:"#cbd5e1",fontSize:"12px",fontWeight:"600"}}>↩ בחירת יחידה</button>
        <div style={{fontSize:"15px",fontWeight:"bold",color:"#f1f5f9"}}>{unit.label} <span style={{fontSize:"12px",color:"#64748b"}}>· מסך 2 השוואה</span></div>
        <button onClick={onSummary} style={{padding:"5px 12px",borderRadius:"8px",border:"1px solid #475569",cursor:"pointer",background:"transparent",color:"#94a3b8",fontSize:"12px",fontWeight:"700"}}>סיכום היחידה →</button>
      </div>

      <div style={{flex:1,overflowY:"auto"}}>
        <div style={{padding:"14px 16px"}}>
          {/* אזור א' — שני הטקסטים המסומנים + מקרא */}
          <DiffPanel unit={unit}/>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 240px",alignItems:"start"}}>
          {/* אזור ג'+ד' — מרכז */}
          <div style={{padding:"0 16px 24px"}}>
            {!activeConcept?(
              <div style={{padding:"40px",textAlign:"center",color:"#475569",fontSize:"14px"}}>בחרי מושג מהרשימה משמאל כדי לראות את ההשוואה</div>
            ):(
              <CompareConceptBlock key={unit.id+activeConcept} unit={unit} conceptName={activeConcept} validParams={validParams}
                ec={ec} es={es} esc={ec} scholarship={unit.scholarship}
                getFactual={getFactual} setFactual={setFactual} getCompareNote={getCompareNote} setCompareNote={setCompareNote}/>
            )}
          </div>

          {/* אזור ב' — רשימת מושגים משמאל */}
          <div style={{background:"#1e293b",borderRight:"1px solid #334155",minHeight:"100%",padding:"10px"}}>
            <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",marginBottom:"8px"}}>מושגים</div>
            {DIMS.map(dim=>{
              const cs=allConcepts.filter(c=>c.dimId===dim.id);
              if(!cs.length)return null;
              return(
                <div key={dim.id} style={{marginBottom:"10px"}}>
                  <div style={{fontSize:"10px",color:dim.color,fontWeight:"700",marginBottom:"4px"}}>{dim.label.split(":")[1]?dim.label.split(":")[1].trim():dim.label}</div>
                  {cs.map(c=>{
                    const hasConcl=!!(getCompareNote(unit.id,c.name)||"").trim();
                    const isActive=activeConcept===c.name;
                    return(
                      <button key={c.name} onClick={()=>setActiveConcept(c.name)}
                        style={{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",textAlign:"right",padding:"6px 8px",borderRadius:"6px",border:"none",cursor:"pointer",marginBottom:"2px",fontSize:"12px",
                          background:isActive?dim.color+"33":"transparent",color:isActive?dim.color:hasConcl?"#34d399":"#94a3b8",
                          borderRight:isActive?`3px solid ${dim.color}`:"3px solid transparent",fontWeight:isActive?"700":"400"}}>
                        <span>{c.name}</span>{hasConcl&&<span style={{color:"#34d399",fontSize:"11px"}}>✓</span>}
                      </button>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── מסך 3 — סיכום היחידה הספרותית ──
function StageBSummary({unit,allUnits,allConcepts,getCompareNote,getUnitSummary,setUnitSummary,onBack,onCompareConcept,onNextUnit}){
  const saved=getUnitSummary(unit.id);
  const [patterns,setPatterns]=useState(saved.patterns||"");
  const [conclusion,setConclusion]=useState(saved.conclusion||"");
  const [notes,setNotes]=useState(saved.notes||"");
  const [changes,setChanges]=useState(saved.changes||{});
  const [loadP,setLoadP]=useState(false);
  const [loadC,setLoadC]=useState(false);
  const [flash,setFlash]=useState("");
  React.useEffect(()=>{ const s=getUnitSummary(unit.id); setPatterns(s.patterns||"");setConclusion(s.conclusion||"");setNotes(s.notes||"");setChanges(s.changes||{}); },[unit.id]);

  const conceptConcls=allConcepts.map(c=>({name:c.name,concl:(getCompareNote(unit.id,c.name)||"").trim()})).filter(x=>x.concl);
  const who=unit.character==="solomon"?"שלמה":"דוד";
  const CHANGE_OPTS=["—","התחזק","ללא שינוי","נוסף","נחלש","רק בדה\"י"];

  function persist(extra){ setUnitSummary(unit.id,{patterns,conclusion,notes,changes,...extra}); setFlash("✓ נשמר!"); setTimeout(()=>setFlash(""),2000); }
  function setChange(name,v){ setChanges(prev=>({...prev,[name]:v})); }

  async function runPatterns(){
    if(!conceptConcls.length){setPatterns("יש לכתוב מסקנות מחקריות למושגים במסך 2 לפני זיהוי דפוסים.");return;}
    setLoadP(true);
    const prompt=`אתה עוזר מחקר לתזה בתנ"ך. לפניך המסקנות המחקריות שאושרו עבור מושגים שונים ביחידה "${unit.label}" (דמות ${who}), בהשוואה בין דברי הימים למקבילה.

${conceptConcls.map(x=>`### ${x.name}\n${x.concl}`).join("\n\n")}

נתחי את הדפוסים המרכזיים העולים מכלל המסקנות. ציין בעברית, בארבעה סעיפים תמציתיים:
1. **מושגים שהתחזקו** אצל הכרוניסט.
2. **מושגים שכמעט לא השתנו**.
3. **מושגים המופיעים רק בדה"י** (נוספו).
4. **מושגים שנחלשו**.
לכל סעיף מנה את שמות המושגים הרלוונטיים בקצרה. ללא הקדמות.`;
    try{ setPatterns(await aiCall(prompt,1000)); }catch(e){ setPatterns("⚠️ "+e.message); }
    setLoadP(false);
  }
  async function runConclusion(){
    if(!conceptConcls.length){setConclusion("יש לכתוב מסקנות מחקריות למושגים במסך 2 לפני ניסוח מסקנת היחידה.");return;}
    setLoadC(true);
    const prompt=`אתה עוזר מחקר לתזה בתנ"ך. לפניך המסקנות המחקריות שאושרו עבור מושגים ביחידה "${unit.label}" (דמות ${who}), בהשוואה בין דברי הימים למקבילה (${unit.sourceRef||"שמואל/מלכים"}).

${conceptConcls.map(x=>`### ${x.name}\n${x.concl}`).join("\n\n")}

${patterns?`דפוסים מרכזיים שזוהו:\n${patterns}\n`:""}
נסחי פסקת סיכום מחקרית אחת ליחידה כולה (עברית אקדמית, כ-200-300 מילה). על המסקנה:
- לתאר כיצד עיצב הכרוניסט את דמות ${who} ביחידה זו לעומת המקבילה, על בסיס המגמות החוצות-מושגים.
- להתייחס במפורש לשינויי הכרוניסט (השמטות, תוספות, שינויים) וגם לתרומת הפרשנים שנשקלו בניתוח.
- לסיים בקביעה מסכמת על אופי העיצוב ביחידה.`;
    try{ setConclusion(await aiCall(prompt,1500)); }catch(e){ setConclusion("⚠️ "+e.message); }
    setLoadC(false);
  }
  function exportReport(){
    const lines=[];
    lines.push(`# סיכום יחידה — ${unit.label}`);
    if(unit.sourceRef)lines.push(`מקביל: ${unit.sourceRef}`);
    lines.push(`דמות: ${who}`,"");
    lines.push("## תמונת מצב");
    conceptConcls.forEach(x=>lines.push(`- ${x.name}: ${changes[x.name]&&changes[x.name]!=="—"?changes[x.name]:"מסקנה נכתבה"}`));
    lines.push("","## דפוסים מרכזיים",patterns||"—","","## מסקנת היחידה",conclusion||"—");
    if(notes.trim())lines.push("","## הערות מחקר של החוקרת",notes);
    lines.push("","## מסקנות לפי מושג");
    conceptConcls.forEach(x=>lines.push(`### ${x.name}`,x.concl,""));
    const blob=new Blob([lines.join("\n")],{type:"text/markdown"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`דוח_${unit.label}.md`;a.click();
    setFlash("✓ הדוח יוצא");setTimeout(()=>setFlash(""),2000);
  }

  return(
    <div style={{maxWidth:"900px",margin:"0 auto",padding:"20px 16px 60px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}}>
        <button onClick={onBack} style={{padding:"5px 12px",borderRadius:"8px",border:"none",cursor:"pointer",background:"#334155",color:"#cbd5e1",fontSize:"12px",fontWeight:"600"}}>↩ חזרה להשוואה</button>
        {flash&&<span style={{color:"#34d399",fontSize:"12px",fontWeight:"700"}}>{flash}</span>}
      </div>
      <div style={{fontSize:"20px",fontWeight:"bold",color:"#f1f5f9",marginBottom:"2px"}}>סיכום היחידה — {unit.label}</div>
      <div style={{fontSize:"13px",color:"#64748b",marginBottom:"20px"}}>מסך 3 · {unit.sourceRef?`מקביל: ${unit.sourceRef} · `:""}דמות {who}</div>

// ── עוטף שלב ב' ──
function StageB({allUnits,allConcepts,getE,getParams,getCompareNote,setCompareNote,getFactual,setFactual,getUnitSummary,setUnitSummary,raw}){
  const [screen,setScreen]=useState("pick"); // pick | compare | summary
  const [unitId,setUnitId]=useState(null);
  const [jumpConcept,setJumpConcept]=useState(null);
  const unit=unitId?allUnits.find(u=>u.id===unitId):null;

  function isAnalyzed(uid,mode){
    return allConcepts.some(c=>{const e=getE(uid,c.name,mode);return e&&((e.explicit_note&&e.explicit_note.trim())||(e.params||[]).some(p=>p&&p.found!==null));});
  }
  function nextUnit(){
    if(!unit)return;
    const sameChar=allUnits.filter(u=>(u.character||"david")===(unit.character||"david"));
    const idx=sameChar.findIndex(u=>u.id===unit.id);
    const nxt=sameChar[idx+1];
    if(nxt){ setUnitId(nxt.id); setScreen("compare"); }
    else { setScreen("pick"); setUnitId(null); }
  }

  if(screen==="pick"||!unit)
    return <StageBPick allUnits={allUnits} allConcepts={allConcepts} getE={getE} getParams={getParams} isAnalyzed={isAnalyzed} getCompareNote={getCompareNote} getUnitSummary={getUnitSummary} setUnitSummary={setUnitSummary}
      onOpen={uid=>{setUnitId(uid);setScreen("compare");}} onSummary={uid=>{setUnitId(uid);setScreen("summary");}}/>;

  if(screen==="summary")
    return <StageBSummary unit={unit} allUnits={allUnits} allConcepts={allConcepts}
      getCompareNote={getCompareNote} getUnitSummary={getUnitSummary} setUnitSummary={setUnitSummary}
      onBack={()=>setScreen("compare")} onCompareConcept={name=>{setJumpConcept(name);setScreen("compare");}} onNextUnit={nextUnit}/>;

  return <StageBCompare key={unitId} unit={unit} allConcepts={allConcepts} getE={getE} getParams={getParams}
    getFactual={getFactual} setFactual={setFactual} getCompareNote={getCompareNote} setCompareNote={setCompareNote}
    initConcept={jumpConcept}
    onBack={()=>{setScreen("pick");setUnitId(null);setJumpConcept(null);}} onSummary={()=>setScreen("summary")}/>;
}

// ── מטריצת המחקר — תצוגת ממצאים (read-only) ──
// אוספת אוטומטית מכל היחידות שיש בהן נתונים, משלב א' וב'. אין הזנה.
// ════════════════════════════════════════════════════════════════════════
function ResearchMatrix({allUnits,allConcepts,getE,getParams,getCompareNote,getUnitSummary}){
  const [fChar,setFChar]=useState("all");
  const [fDim,setFDim]=useState("all");
  const [fConcept,setFConcept]=useState("all");
  const [fUnit,setFUnit]=useState("all");

  const rows=useMemo(()=>{
    const out=[];
    allUnits.forEach(u=>{
      const ch=u.character||"david";
      allConcepts.forEach(c=>{
        const vp=validParamDefs(getParams(c.name));
        const hasParams=vp.length>0;
        const ec=getE(u.id,c.name,"chronicles")||{};
        const es=getE(u.id,c.name,"source")||{};
        const concl=(getCompareNote(u.id,c.name)||"").trim();
        const change=((getUnitSummary(u.id).changes)||{})[c.name]||"";
        const chrData=(ec.explicit_note&&ec.explicit_note.trim())||(ec.params||[]).some(p=>p&&p.found!==null);
        const srcData=(es.explicit_note&&es.explicit_note.trim())||(es.params||[]).some(p=>p&&p.found!==null);
        if(!chrData&&!srcData&&!concl) return;
        out.push({
          u,c,dimId:c.dimId,ch,
          chrExp:!!(ec.explicit_note&&ec.explicit_note.trim()),
          chrImp:(ec.params||[]).filter(p=>p&&p.found===true).length,
          chrSch:!!(ec.scholarRecommendations&&Object.keys(ec.scholarRecommendations).length>0),
          srcExp:!!(es.explicit_note&&es.explicit_note.trim()),
          srcImp:(es.params||[]).filter(p=>p&&p.found===true).length,
          vpCount:vp.length, hasParams, concl:!!concl, change,
          stChr:conceptStatusA(ec,"chronicles",hasParams),
          stSrc:conceptStatusA(es,"source",hasParams),
        });
      });
    });
    return out;
  },[allUnits,allConcepts]);

  const filtered=rows.filter(r=>(fChar==="all"||r.ch===fChar)&&(fDim==="all"||r.dimId===fDim)&&(fConcept==="all"||r.c.name===fConcept)&&(fUnit==="all"||String(r.u.id)===fUnit));
  const dimOf=id=>DIMS.find(d=>d.id===id);
  const conceptsForFilter=fDim==="all"?allConcepts:allConcepts.filter(c=>c.dimId===fDim);

  function exportCsv(){
    const head=["יחידה","דמות","ממד","מושג",'גלוי דה"י','נרמז דה"י',"פרשנים",'גלוי מקבילה','נרמז מקבילה',"השוואה","שינוי"];
    const lines=[head.join(",")];
    filtered.forEach(r=>{
      lines.push([r.u.label,r.ch==="solomon"?"שלמה":"דוד",(dimOf(r.dimId)||{}).label||"",r.c.name,
        r.chrExp?"כן":"לא",`${r.chrImp}/${r.vpCount}`,r.chrSch?"כן":"לא",
        r.srcExp?"כן":"לא",`${r.srcImp}/${r.vpCount}`,r.concl?"כן":"לא",r.change||""].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(","));
    });
    const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="מטריצת_מחקר.csv";a.click();
  }

  const Sel=({value,onChange,children})=>(<select value={value} onChange={e=>onChange(e.target.value)} style={{...S.input,width:"auto",padding:"6px 10px",fontSize:"12px"}}>{children}</select>);
  const cellNum=(n,tot,col)=> <span style={{color:n>0?col:"#475569",fontWeight:n>0?"700":"400"}}>{n}/{tot}</span>;
  const yn=(b,col)=> <span style={{color:b?col:"#475569",fontWeight:"700"}}>{b?"✓":"—"}</span>;

  return(
    <div style={{maxWidth:"1200px",margin:"0 auto",padding:"22px 16px"}}>
      <div style={{fontSize:"20px",fontWeight:"bold",color:"#f1f5f9",marginBottom:"2px"}}>מטריצת המחקר</div>
      <div style={{fontSize:"13px",color:"#64748b",marginBottom:"18px"}}>תצוגת ממצאים — נטענת אוטומטית משלב א׳ וב׳ · {filtered.length} ממצאים</div>

      <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center",marginBottom:"16px",background:"#1e293b",borderRadius:"10px",padding:"12px",border:"1px solid #334155"}}>
        <span style={{fontSize:"11px",color:"#64748b",fontWeight:"700"}}>סינון:</span>
        <Sel value={fChar} onChange={setFChar}><option value="all">כל הדמויות</option><option value="david">דוד</option><option value="solomon">שלמה</option></Sel>
        <Sel value={fDim} onChange={v=>{setFDim(v);setFConcept("all");}}><option value="all">כל הממדים</option>{DIMS.map(d=><option key={d.id} value={d.id}>{d.label}</option>)}</Sel>
        <Sel value={fConcept} onChange={setFConcept}><option value="all">כל המושגים</option>{conceptsForFilter.map(c=><option key={c.name} value={c.name}>{c.name}</option>)}</Sel>
        <Sel value={fUnit} onChange={setFUnit}><option value="all">כל היחידות</option>{allUnits.map(u=><option key={u.id} value={u.id}>{u.label}</option>)}</Sel>
        <div style={{flex:1}}/>
        <button onClick={()=>{setFChar("all");setFDim("all");setFConcept("all");setFUnit("all");}} style={{padding:"6px 12px",borderRadius:"8px",border:"1px solid #334155",background:"transparent",color:"#94a3b8",cursor:"pointer",fontSize:"12px"}}>נקה</button>
        <button onClick={exportCsv} style={{padding:"6px 12px",borderRadius:"8px",border:"none",background:"#334155",color:"#cbd5e1",cursor:"pointer",fontSize:"12px",fontWeight:"700"}}>⬇ ייצא CSV</button>
      </div>

      {filtered.length===0?(
        <div style={{padding:"50px",textAlign:"center",color:"#475569"}}>אין ממצאים התואמים את הסינון. השלימי ניתוחים בשלב א׳/ב׳ כדי שיופיעו כאן.</div>
      ):(
        <div style={{overflowX:"auto",background:"#1e293b",borderRadius:"10px",border:"1px solid #334155"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:"12px"}}>
            <thead>
              <tr style={{color:"#64748b",fontSize:"11px",fontWeight:"700",background:"#0f172a"}}>
                {["יחידה","דמות","ממד","מושג",'גלוי דה"י','נרמז דה"י',"פרשנים",'גלוי מקבילה','נרמז מקבילה',"השוואה","שינוי"].map((h,i)=>(
                  <th key={i} style={{padding:"8px 10px",textAlign:i<4?"right":"center",borderBottom:"1px solid #334155",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((r,i)=>{
                const dim=dimOf(r.dimId)||{};
                return(
                  <tr key={i} style={{borderBottom:"1px solid #0f172a"}}>
                    <td style={{padding:"7px 10px",color:"#e2e8f0"}}>{r.u.label}</td>
                    <td style={{padding:"7px 10px",color:r.ch==="solomon"?"#d8b4fe":"#93c5fd"}}>{r.ch==="solomon"?"שלמה":"דוד"}</td>
                    <td style={{padding:"7px 10px",color:dim.color||"#94a3b8",whiteSpace:"nowrap"}}>{dim.label?dim.label.split(":")[1].trim():""}</td>
                    <td style={{padding:"7px 10px",color:"#cbd5e1",fontWeight:"600"}}>{r.c.name}</td>
                    <td style={{padding:"7px 10px",textAlign:"center"}}>{yn(r.chrExp,"#34d399")}</td>
                    <td style={{padding:"7px 10px",textAlign:"center"}}>{r.hasParams?cellNum(r.chrImp,r.vpCount,"#93c5fd"):"—"}</td>
                    <td style={{padding:"7px 10px",textAlign:"center"}}>{r.hasParams?yn(r.chrSch,"#c084fc"):"—"}</td>
                    <td style={{padding:"7px 10px",textAlign:"center"}}>{yn(r.srcExp,"#34d399")}</td>
                    <td style={{padding:"7px 10px",textAlign:"center"}}>{r.hasParams?cellNum(r.srcImp,r.vpCount,"#fbbf24"):"—"}</td>
                    <td style={{padding:"7px 10px",textAlign:"center"}}>{yn(r.concl,"#34d399")}</td>
                    <td style={{padding:"7px 10px",textAlign:"center",color:r.change&&r.change!=="—"?"#fde047":"#475569"}}>{r.change&&r.change!=="—"?r.change:"—"}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ── מחולל הדו"חות ──
// חמישה סוגים: יחידה / מושג / דמות / ממד / השוואתי. אוסף מנתוני שלב א'+ב', AI כותב טיוטה.
// ════════════════════════════════════════════════════════════════════════
function ReportGenerator({allUnits,allConcepts,getE,getParams,getCompareNote,getFactual,getUnitSummary}){
  const [type,setType]=useState("unit");      // unit|concept|character|dimension|comparative
  const [target,setTarget]=useState("");      // unit id / concept name / character / dim id / concept (for comparative)
  const [changeFilter,setChangeFilter]=useState("התחזק"); // for comparative
  const [draft,setDraft]=useState("");
  const [load,setLoad]=useState(false);
  const [flash,setFlash]=useState("");
  const CHANGE_OPTS=["התחזק","נחלש","נוסף","ללא שינוי",'רק בדה"י'];

  // ── איסוף חומר גלם ──
  function unitConceptBlock(u,cname){
    const concl=(getCompareNote(u.id,cname)||"").trim();
    const fact=(getFactual(u.id,cname)||"").trim();
    if(!concl&&!fact) return "";
    return `#### ${cname} — ${u.label}\n${fact?`ניתוח עובדתי: ${fact}\n`:""}${concl?`מסקנה: ${concl}`:""}`;
  }
  function assemble(){
    const parts=[];
    if(type==="unit"){
      const u=allUnits.find(x=>x.id==target); if(!u) return {title:"",text:""};
      allConcepts.forEach(c=>{const b=unitConceptBlock(u,c.name); if(b)parts.push(b);});
      const s=getUnitSummary(u.id);
      if(s.patterns)parts.push(`### דפוסים מרכזיים\n${s.patterns}`);
      if(s.conclusion)parts.push(`### מסקנת היחידה\n${s.conclusion}`);
      return {title:`דוח יחידה — ${u.label}`,text:parts.join("\n\n")};
    }
    if(type==="concept"){
      allUnits.forEach(u=>{const b=unitConceptBlock(u,target); if(b)parts.push(b);});
      return {title:`דוח מושג — ${target}`,text:parts.join("\n\n")};
    }
    if(type==="character"){
      const us=allUnits.filter(u=>(u.character||"david")===target);
      us.forEach(u=>{const s=getUnitSummary(u.id); if(s.conclusion)parts.push(`### ${u.label}\n${s.conclusion}`); else { allConcepts.forEach(c=>{const b=unitConceptBlock(u,c.name);if(b)parts.push(b);}); }});
      return {title:`דוח דמות — ${target==="solomon"?"שלמה":"דוד"}`,text:parts.join("\n\n")};
    }
    if(type==="dimension"){
      const dim=DIMS.find(d=>d.id===target); if(!dim) return {title:"",text:""};
      dim.concepts.forEach(cn=>{ allUnits.forEach(u=>{const b=unitConceptBlock(u,cn);if(b)parts.push(b);}); });
      return {title:`דוח ממד — ${dim.label}`,text:parts.join("\n\n")};
    }
    if(type==="comparative"){
      allUnits.forEach(u=>{
        const ch=((getUnitSummary(u.id).changes)||{})[target];
        if(ch===changeFilter){const b=unitConceptBlock(u,target); parts.push(b||`#### ${target} — ${u.label}\n(סומן "${changeFilter}", טרם נכתבה מסקנה)`);}
      });
      return {title:`דוח השוואתי — ${target} (${changeFilter})`,text:parts.join("\n\n")};
    }
    return {title:"",text:""};
  }

  const INSTRUCTION={
    unit:"כתבי דוח מחקר רציף על היחידה, המשלב את ממצאי המושגים השונים למסקנה כוללת על עיצוב הדמות ביחידה.",
    concept:"כתבי דוח מחקר על המושג לאורך כל היחידות — כיצד הכרוניסט מעצב אותו, מגמות חוזרות, ושינויים בולטים. מתאים כבסיס לפרק במחקר.",
    character:"כתבי דוח מסכם על הדמות — אופי העיצוב של הכרוניסט לאורך כל יחידותיה, כשלד לפרק במחקר.",
    dimension:"כתבי דוח על הממד הנבואי — כיצד מתבטאים מושגיו לאורך היחידות, ומה המגמה המשותפת.",
    comparative:"כתבי דוח השוואתי הממוקד ביחידות שבהן המושג סומן בשינוי הנבחר — מה משותף להן וכיצד פעל הכרוניסט.",
  };

  async function generate(){
    const {title,text}=assemble();
    if(!text.trim()){ setDraft("אין חומר מספיק להפקת דוח זה — השלימי מסקנות בשלב ב'."); return; }
    setLoad(true);
    const prompt=`אתה עוזר מחקר לתזה בתנ"ך על עיצוב דמויות דוד ושלמה בדברי הימים לאור החזון הנבואי.
${INSTRUCTION[type]}

להלן החומר שנאסף מן המחקר (מסקנות וניתוחים שאושרו):

${text}

כתבי בעברית אקדמית, מובנה (עם כותרות משנה במידת הצורך), נאמן לחומר שנמסר בלבד — אל תמציאי ממצאים שלא הופיעו. סיימי בפסקת סיכום.`;
    try{ setDraft(await aiCall(prompt,3000)); }catch(e){ setDraft("⚠️ "+e.message); }
    setLoad(false);
  }
  function showSource(){ const {text}=assemble(); setDraft(text||"אין חומר."); }
  function exportMd(){
    const {title}=assemble();
    const blob=new Blob([`# ${title}\n\n${draft}`],{type:"text/markdown"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${title||"דוח"}.md`;a.click();
    setFlash("✓ הדוח יוצא");setTimeout(()=>setFlash(""),2000);
  }

  // אתחול ברירת מחדל ל-target כשמשנים סוג
  React.useEffect(()=>{
    if(type==="unit")setTarget(allUnits[0]?allUnits[0].id:"");
    else if(type==="concept"||type==="comparative")setTarget(allConcepts[0]?allConcepts[0].name:"");
    else if(type==="character")setTarget("david");
    else if(type==="dimension")setTarget(DIMS[0].id);
    setDraft("");
  },[type]);

  const TYPES=[["unit","דוח יחידה"],["concept","דוח מושג"],["character","דוח דמות"],["dimension","דוח ממד"],["comparative","דוח השוואתי"]];

  return(
    <div style={{maxWidth:"980px",margin:"0 auto",padding:"22px 16px 60px"}}>
      <div style={{fontSize:"20px",fontWeight:"bold",color:"#f1f5f9",marginBottom:"2px"}}>מחולל הדו"חות</div>
      <div style={{fontSize:"13px",color:"#64748b",marginBottom:"18px"}}>אוסף את החומר מהמחקר, וה-AI כותב טיוטה לעריכה ולייצוא</div>

      <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginBottom:"14px"}}>
        {TYPES.map(([t,l])=>(
          <button key={t} onClick={()=>setType(t)}
            style={{padding:"10px 16px",borderRadius:"10px",border:type===t?"1px solid #818cf8":"1px solid #334155",cursor:"pointer",
              background:type===t?"#818cf822":"#1e293b",color:type===t?"#a5b4fc":"#94a3b8",fontSize:"13px",fontWeight:"700"}}>{l}</button>
        ))}
      </div>

      <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center",marginBottom:"16px",background:"#1e293b",borderRadius:"10px",padding:"12px",border:"1px solid #334155"}}>
        <span style={{fontSize:"12px",color:"#94a3b8",fontWeight:"700"}}>נושא הדוח:</span>
        {type==="unit"&&<select value={target} onChange={e=>setTarget(e.target.value)} style={{...S.input,width:"auto"}}>{allUnits.map(u=><option key={u.id} value={u.id}>{u.label}</option>)}</select>}
        {(type==="concept"||type==="comparative")&&<select value={target} onChange={e=>setTarget(e.target.value)} style={{...S.input,width:"auto"}}>{allConcepts.map(c=><option key={c.name} value={c.name}>{c.name}</option>)}</select>}
        {type==="character"&&<select value={target} onChange={e=>setTarget(e.target.value)} style={{...S.input,width:"auto"}}><option value="david">דוד</option><option value="solomon">שלמה</option></select>}
        {type==="dimension"&&<select value={target} onChange={e=>setTarget(e.target.value)} style={{...S.input,width:"auto"}}>{DIMS.map(d=><option key={d.id} value={d.id}>{d.label}</option>)}</select>}
        {type==="comparative"&&<><span style={{fontSize:"12px",color:"#94a3b8"}}>שסומן:</span><select value={changeFilter} onChange={e=>setChangeFilter(e.target.value)} style={{...S.input,width:"auto"}}>{CHANGE_OPTS.map(o=><option key={o} value={o}>{o}</option>)}</select></>}
      </div>

      <div style={{display:"flex",gap:"10px",flexWrap:"wrap",marginBottom:"14px"}}>
        <button onClick={generate} disabled={load} style={{flex:1,minWidth:"180px",padding:"12px",borderRadius:"10px",border:"none",cursor:load?"wait":"pointer",background:load?"#1e293b":"#818cf8",color:load?"#475569":"white",fontSize:"14px",fontWeight:"700"}}>{load?"⏳ כותב דוח...":"🤖 צור טיוטת דוח"}</button>
        <button onClick={showSource} style={{padding:"12px 16px",borderRadius:"10px",border:"1px solid #334155",cursor:"pointer",background:"transparent",color:"#94a3b8",fontSize:"13px",fontWeight:"700"}}>📋 הצג חומר גלם</button>
        <button onClick={exportMd} disabled={!draft} style={{padding:"12px 16px",borderRadius:"10px",border:"1px solid #475569",cursor:draft?"pointer":"not-allowed",background:"transparent",color:draft?"#cbd5e1":"#475569",fontSize:"13px",fontWeight:"700"}}>📄 ייצא Markdown</button>
        {flash&&<span style={{color:"#34d399",fontSize:"12px",fontWeight:"700",alignSelf:"center"}}>{flash}</span>}
      </div>

      <textarea value={draft} onChange={e=>setDraft(e.target.value)} rows={22}
        placeholder="הטיוטה תופיע כאן לאחר הפקה — ניתן לערוך לפני הייצוא..." style={{...S.input,resize:"vertical",lineHeight:"1.9",fontSize:"14px"}}/>
    </div>
  );
}


function App(){
  const [raw,setRaw]=useState({units:[],overrides:{},concepts:{},analysis:{},analysis_chronicles:{},analysis_source:{},customConcepts:[],compareNotes:{},compareFactual:{},unitSummary:{}});
  const [tab,setTab]=useState("home");
  // analysisMode: "chronicles" = ניתוח דה"י, "source" = ניתוח מקבילה
  const [analysisMode,setAnalysisMode]=useState("chronicles");
  const [activeUnit,setActiveUnit]=useState(null);
  const [initConcept,setInitConcept]=useState(null);
  const [msg,setMsg]=useState("");
  const [editConcept,setEditConcept]=useState(null);
  const [showAdd,setShowAdd]=useState(false);
  const [newName,setNewName]=useState("");
  const [newDim,setNewDim]=useState("d1");
  const [newParams,setNewParams]=useState(Array(10).fill(""));

  function flash(m){setMsg(m);setTimeout(()=>setMsg(""),m&&m.startsWith("⚠️")?6000:2000);}
  function cloudSave(){const d=window.__rawData||raw;fbSave(d).then(()=>flash("☁️ נשמר לענן")).catch(()=>flash("⚠️ השמירה לענן נכשלה — בדקי חיבור לאינטרנט!"));}

  function setData(fn){
    setRaw(prev=>{
      const next=typeof fn==="function"?fn(prev):fn;
      LS.save(next);
      if(gFH)fsWrite(next).catch(()=>{});
      window.__rawData = next;
      return next;
    });
  }

  useEffect(()=>{ window.__rawData = raw; },[raw]);

  useEffect(()=>{
    let base={units:[],overrides:{},concepts:{},analysis:{},analysis_chronicles:{},analysis_source:{},customConcepts:[],compareNotes:{},compareFactual:{},unitSummary:{}};
    Object.keys(DEFAULT_CONCEPTS).forEach(name=>{
      base.concepts[name]={params: DEFAULT_CONCEPTS[name].params};
    });
    fbLoad(fbData=>{
      if(fbData&&fbData.units&&fbData.units.length>0){
        const merged={...base,...fbData,concepts:{...base.concepts,...(fbData.concepts||{})}};
        if(fbData.analysis&&Object.keys(fbData.analysis).length>0&&(!fbData.analysis_chronicles||Object.keys(fbData.analysis_chronicles).length===0)){
          merged.analysis_chronicles=fbData.analysis;
        }
        setRaw(merged);
        flash("✓ נטען מהענן");
      } else {
        // Firebase empty — try localStorage fallback
        const d=LS.load();
        if(d&&d.units&&d.units.length>0){
          setRaw({...base,...d,concepts:{...base.concepts,...(d.concepts||{})}});
        } else {
          setRaw(base);
        }
      }
    });
  },[]);

  async function loadFile(){
    const d=await fsOpen();
    if(!d){alert("לא ניתן לקרוא");return;}
    const defaultConcepts={};
    Object.keys(DEFAULT_CONCEPTS).forEach(name=>{
      defaultConcepts[name]={params: DEFAULT_CONCEPTS[name].params};
    });
    const existingAnalysis=ALS.load()||raw.analysis||{};
    const existingChr=ACLS.load()||raw.analysis_chronicles||{};
    const existingSrc=ASLS.load()||raw.analysis_source||{};
    const existingConcepts=CLS.load()||raw.concepts||{};
    const merged={
      ...d,
      concepts:{...defaultConcepts,...(d.concepts||{}),...existingConcepts},
      analysis:{...existingAnalysis,...(d.analysis||{})},
      analysis_chronicles:{...existingChr,...(d.analysis_chronicles||{})},
      analysis_source:{...existingSrc,...(d.analysis_source||{})}
    };
    // Migrate old analysis to analysis_chronicles if needed
    if(merged.analysis&&Object.keys(merged.analysis).length>0&&(!merged.analysis_chronicles||Object.keys(merged.analysis_chronicles).length===0)){
      merged.analysis_chronicles=merged.analysis;
    }
    console.log("after merge, units count:", merged.units?.length);
    console.log("setRaw called with:", merged);
    setRaw(merged);
    LS.save(merged);
    fbSave(merged);
    flash("✓ נטען ונשמר בענן");
  }
  async function saveFile(){
    if(!gFH){const ok=await fsSave("chronicles_data.json");if(!ok)return;}
    const ok=await fsWrite(raw);
    ok?flash("✓ נשמר"):alert("שגיאה");
  }
  async function saveAs(){
    gFH=null;
    const ok=await fsSave("chronicles_data.json");if(!ok)return;
    await fsWrite(raw); flash("✓ נשמר");
  }

  // All concepts
  const allConcepts=useMemo(()=>{
    const r=[];
    DIMS.forEach(d=>d.concepts.forEach(name=>r.push({name,dimId:d.id})));
    (raw.customConcepts||[]).forEach(c=>r.push({name:c.name,dimId:c.dimId}));
    return r;
  },[raw.customConcepts]);

  // All units from app1
  const allUnits=useMemo(()=>{
    if(!(raw.units||[]).length)return [];
    return (raw.units||[]).map(u=>({
      id:u.id,label:u.name||u.chapter||"",character:u.character||"",
      chroniclesText:u.chroniclesText||"",sourceText:u.sourceText||"",
      sourceRef:u.sourceRef||"",scholarship:u.scholarship||"",
    }));
  },[raw.units]);

  function getE(uid,cname,mode){
    const store=mode==="source"?"analysis_source":"analysis_chronicles";
    return raw[store]?.[uid]?.[cname]||null;
  }
  const fbSaveTimer = React.useRef(null);
  const pendingPatchFns = React.useRef([]); // תור patch-ים שמצטברים בחלון ה-debounce, ומוחלים כולם יחד על נתון טרי מהשרת
  function queuePatch(patchFn){
    pendingPatchFns.current.push(patchFn);
    if(fbSaveTimer.current) clearTimeout(fbSaveTimer.current);
    fbSaveTimer.current = setTimeout(flushPatches, 2000);
  }
  function flushPatches(){
    const fns = pendingPatchFns.current;
    pendingPatchFns.current = [];
    if(!fns.length) return;
    fbSaveMerge(serverData => fns.reduce((d,fn)=>fn(d), serverData))
      .then(merged=>{ setRaw(merged); window.__rawData = merged; })
      .catch(()=>flash("⚠️ שמירה אוטומטית לענן נכשלה — בדקי חיבור ונסי לשמור שינויים שוב!"));
  }
  function setE(uid,cname,entry,mode){
    const store=mode==="source"?"analysis_source":"analysis_chronicles";
    setRaw(prev=>{
      const updated={...prev,[store]:{...prev[store],[uid]:{...(prev[store]?.[uid]||{}),[cname]:entry}}};
      window.__rawData = updated;
      LS.save(updated);
      return updated;
    });
    queuePatch(d=>({...d,[store]:{...d[store],[uid]:{...(d[store]?.[uid]||{}),[cname]:entry}}}));
  }
  function getParams(cname){const fromRaw=(raw.concepts?.[cname]?.params)||[];return fromRaw.length>0?fromRaw:(DEFAULT_CONCEPTS[cname]?.params)||[];}

  function getCompareNote(uid,cname){ return raw.compareNotes?.[uid]?.[cname]||""; }
  function setCompareNote(uid,cname,text){
    setRaw(prev=>{
      const updated={...prev,compareNotes:{...prev.compareNotes,[uid]:{...(prev.compareNotes?.[uid]||{}),[cname]:text}}};
      window.__rawData = updated;
      LS.save(updated);
      return updated;
    });
    queuePatch(d=>({...d,compareNotes:{...d.compareNotes,[uid]:{...(d.compareNotes?.[uid]||{}),[cname]:text}}}));
  }

  // ── שלב ב': ניתוח השוואתי עובדתי (compareFactual) ──
  function getFactual(uid,cname){ return raw.compareFactual?.[uid]?.[cname]||""; }
  function setFactual(uid,cname,text){
    setRaw(prev=>{
      const updated={...prev,compareFactual:{...prev.compareFactual,[uid]:{...(prev.compareFactual?.[uid]||{}),[cname]:text}}};
      window.__rawData=updated; LS.save(updated); return updated;
    });
    queuePatch(d=>({...d,compareFactual:{...d.compareFactual,[uid]:{...(d.compareFactual?.[uid]||{}),[cname]:text}}}));
  }
  // ── שלב ב': סיכום יחידה (unitSummary) ──
  function getUnitSummary(uid){ return raw.unitSummary?.[uid]||{patterns:"",conclusion:"",notes:"",changes:{}}; }
  function setUnitSummary(uid,obj){
    setRaw(prev=>{
      const updated={...prev,unitSummary:{...prev.unitSummary,[uid]:obj}};
      window.__rawData=updated; LS.save(updated); return updated;
    });
    queuePatch(d=>({...d,unitSummary:{...d.unitSummary,[uid]:obj}}));
  }

  // ── גיבוי ואיפוס נרמז ──
  function backupData(){
    try{
      const blob=new Blob([JSON.stringify(raw,null,2)],{type:"application/json"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);
      a.download=`gibuy_divrei-hayamim_${new Date().toISOString().slice(0,10)}.json`;a.click();
      flash("✓ הגיבוי הורד");
    }catch(e){ flash("⚠️ הגיבוי נכשל"); }
  }
  function stripNirmaz(store){
    const out={};
    Object.keys(store||{}).forEach(uid=>{
      out[uid]={};
      Object.keys(store[uid]||{}).forEach(cn=>{
        const e=store[uid][cn]||{};
        const kept={};
        if(e.explicit_note!==undefined)kept.explicit_note=e.explicit_note; // שומר את הגלוי בלבד
        out[uid][cn]=kept;
      });
    });
    return out;
  }
  function normalizedConcepts(src){
    const c={...(src||{})};
    Object.keys(c).forEach(cn=>{const x=c[cn]; if(x&&Array.isArray(x.params)) c[cn]={...x,params:x.params.map(p=>{
      if(typeof p==="object"&&p){
        const hasNewFmt="paramLabel" in p || "markers" in p;
        if(hasNewFmt) return {...p,id:p.id||genPid(),markers:Array.isArray(p.markers)?p.markers:[]};
        // מיגרציה של פורמט ישן (q=תווית, ind=שאלה, sig=מחרוזת) לפורמט החדש
        return {id:p.id||genPid(),paramLabel:p.q||"",q:p.ind||"",markers:p.sig?p.sig.split(",").map(s=>s.trim()).filter(Boolean):[]};
      }
      return {id:genPid(),paramLabel:"",q:String(p||""),markers:[]};
    })};});
    return c;
  }
  function resetNirmaz(){
    if(!confirm('פעולה זו תמחק את כל נתוני הנרמז:\n• טבלאות הפרמטרים (כן/לא + פסוק) בשני המצבים\n• המלצות הפרשנים\n• כל תוצרי שלב ב\u0027 (ניתוח עובדתי, מסקנות מחקריות, סיכומי יחידות)\n\nיישארו: הגלוי, טקסט הפרשנים, היחידות, ומאגר המושגים.\n\nלהמשיך?')) return;
    if(!confirm('אישור אחרון — הפעולה בלתי הפיכה. גיבוי יורד אוטומטית עכשיו. למחוק?')) return;
    backupData();
    const concepts=normalizedConcepts(raw.concepts);
    const patch=d=>({...d,analysis_chronicles:stripNirmaz(d.analysis_chronicles),analysis_source:stripNirmaz(d.analysis_source),compareFactual:{},compareNotes:{},unitSummary:{},concepts:normalizedConcepts(d.concepts)});
    const updated=patch(raw); updated.concepts=concepts;
    setRaw(updated); window.__rawData=updated; LS.save(updated);
    fbSaveMerge(patch).then(merged=>{setRaw(merged);window.__rawData=merged;flash("✓ נתוני הנרמז נמחקו · הגלוי והפרשנים נשמרו");}).catch(()=>flash("⚠️ המחיקה בענן נכשלה — בדקי חיבור ונסי שוב"));
  }



  // Progress - based on current analysis mode
  const prog=useMemo(()=>{
    const tot=allUnits.length*allConcepts.length;
    let doneChr=0,doneSrc=0;
    allUnits.forEach(u=>allConcepts.forEach(c=>{
      const ec=getE(u.id,c.name,"chronicles");
      if(ec&&(ec.explicit_note||(ec.params||[]).some(p=>p.found!==null)))doneChr++;
      const es=getE(u.id,c.name,"source");
      if(es&&(es.explicit_note||(es.params||[]).some(p=>p.found!==null)))doneSrc++;
    }));
    return{tot,doneChr,doneSrc,pctChr:tot?Math.round(doneChr/tot*100):0,pctSrc:tot?Math.round(doneSrc/tot*100):0,pctTot:tot?Math.round((doneChr+doneSrc)/(tot*2)*100):0};
  },[raw.analysis_chronicles,raw.analysis_source,allUnits,allConcepts]);

  function saveConcept(name,params,sem){
    setRaw(prev=>{
      const updated={...prev,
        concepts:{...prev.concepts,[name]:{...(prev.concepts?.[name]||{}),params,sem}},
        customSemantic:{...(prev.customSemantic||{}),...(sem?{[name]:sem}:{})}
      };
      window.__rawData = updated;
      LS.save(updated);
      return updated;
    });
    setEditConcept(null);
    fbSaveMerge(d=>({...d,
      concepts:{...d.concepts,[name]:{...(d.concepts?.[name]||{}),params,sem}},
      customSemantic:{...(d.customSemantic||{}),...(sem?{[name]:sem}:{})}
    }))
      .then(merged=>{ setRaw(merged); window.__rawData=merged; flash("✓ נשמר בענן"); })
      .catch(()=>flash("⚠️ השמירה לענן נכשלה — בדקי חיבור לאינטרנט ושמרי שוב!"));
  }
  function addConcept(){
    if(!newName.trim())return;
    const cname=newName.trim();
    setData(prev=>{
      const updated={...prev,
        customConcepts:[...(prev.customConcepts||[]),{name:cname,dimId:newDim}],
        concepts:{...prev.concepts,[cname]:{params:newParams}}
      };
      CLS.save(updated.concepts);
      return updated;
    });
    fbSaveMerge(d=>({...d,
      customConcepts:[...(d.customConcepts||[]).filter(c=>c.name!==cname),{name:cname,dimId:newDim}],
      concepts:{...d.concepts,[cname]:{params:newParams}}
    }))
      .then(merged=>{ setRaw(merged); window.__rawData=merged; flash("✓ נוסף ונשמר בענן"); })
      .catch(()=>flash("⚠️ המושג נוסף מקומית אך השמירה לענן נכשלה — בדקי חיבור ונסי שוב!"));
    setNewName(""); setNewParams(Array(10).fill("")); setShowAdd(false);
  }

  const dim4concept=(cname)=>DIMS.find(d=>d.concepts.includes(cname))||DIMS.find(d=>d.id===(raw.customConcepts||[]).find(c=>c.name===cname)?.dimId)||DIMS[0];

  function exportConcepts(){
    const exportData={concepts:raw.concepts||{},...(raw.customSemantic?{customSemantic:raw.customSemantic}:{})};
    const blob=new Blob([JSON.stringify(exportData,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="chronicles_concepts_backup.json";a.click();
    flash("✓ קריטריונים יוצאו");
  }
  function exportAll(){
    const all={};
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);all[k]=localStorage.getItem(k);}
    const blob=new Blob([JSON.stringify(all,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="chronicles_full_backup.json";a.click();
    flash("✓ גיבוי מלא יוצא");
  }
  function importAll(data){
    try{
      Object.entries(data).forEach(([k,v])=>localStorage.setItem(k,v));
      flash("✓ נתונים שוחזרו — טוען מחדש...");
      setTimeout(()=>window.location.reload(),800);
    }catch(e){alert("שגיאה בייבוא: "+e.message);}
  }
  function importConcepts(data){
    setData(prev=>{
      const importedConcepts=data.concepts||data;
      const updated={...prev,concepts:{...prev.concepts,...importedConcepts}};
      if(data.customSemantic)updated.customSemantic={...(prev.customSemantic||{}),...data.customSemantic};
      CLS.save(updated.concepts);
      return updated;
    });
    flash("✓ קריטריונים שוחזרו");
  }

  return(
    <div dir="rtl" style={{minHeight:"100vh",background:"#0f172a"}}>
      <Header msg={msg} tab={tab} setTab={setTab} analysisMode={analysisMode} setAnalysisMode={setAnalysisMode}/>

      {tab==="home"&&<HomeTab allUnits={allUnits} allConcepts={allConcepts} prog={prog} raw={raw} setTab={setTab} setEditConcept={setEditConcept} setShowAdd={setShowAdd} getE={getE} dim4concept={dim4concept} getParams={getParams} setInitConcept={setInitConcept} backupData={backupData} resetNirmaz={resetNirmaz}/>}
      {tab==="stagea"&&<StageA allUnits={allUnits} allConcepts={allConcepts} getE={getE} setE={setE} getParams={getParams} dim4concept={dim4concept} raw={raw}/>}
      {tab==="stageb"&&<StageB allUnits={allUnits} allConcepts={allConcepts} getE={getE} getParams={getParams} getCompareNote={getCompareNote} setCompareNote={setCompareNote} getFactual={getFactual} setFactual={setFactual} getUnitSummary={getUnitSummary} setUnitSummary={setUnitSummary} raw={raw}/>}
      {tab==="rmatrix"&&<ResearchMatrix allUnits={allUnits} allConcepts={allConcepts} getE={getE} getParams={getParams} getCompareNote={getCompareNote} getUnitSummary={getUnitSummary}/>}
      {tab==="reports"&&<ReportGenerator allUnits={allUnits} allConcepts={allConcepts} getE={getE} getParams={getParams} getCompareNote={getCompareNote} getFactual={getFactual} getUnitSummary={getUnitSummary}/>}
      {tab==="byunit"&&<ByUnitTab allUnits={allUnits} allConcepts={allConcepts} raw={raw} getE={getE} setE={setE} getParams={getParams} dim4concept={dim4concept} onUnitSelect={setActiveUnit} analysisMode={analysisMode}/>}
      {tab==="byconcept"&&<ByConceptTab allUnits={allUnits} allConcepts={allConcepts} raw={raw} getE={getE} setE={setE} getParams={getParams} dim4concept={dim4concept} initConcept={initConcept} setInitConcept={setInitConcept} setEditConcept={setEditConcept} analysisMode={analysisMode}/>}
      {tab==="matrix"&&<MatrixTab allUnits={allUnits} allConcepts={allConcepts} raw={raw} getE={getE} dim4concept={dim4concept} analysisMode={analysisMode}/>}
      {tab==="charts"&&<ChartsTab allUnits={allUnits} allConcepts={allConcepts} raw={raw} getE={getE} dim4concept={dim4concept} analysisMode={analysisMode}/>}
      {tab==="compare"&&<CompareTab allUnits={allUnits} allConcepts={allConcepts} getE={getE} getParams={getParams} getCompareNote={getCompareNote} setCompareNote={setCompareNote}/>}
      {tab==="synthesis"&&<SynthesisTab allUnits={allUnits} allConcepts={allConcepts} getE={getE} analysisMode={analysisMode}/>}

      {editConcept&&(()=>{
        const dim=dim4concept(editConcept);
        return(
        <Modal title={`✎ עריכת מושג — ${editConcept} | ${dim?.label||""}`} onClose={()=>setEditConcept(null)}>
          <ConceptParamsEditor key={editConcept+JSON.stringify(getParams(editConcept))} name={editConcept} params={getParams(editConcept)} semData={raw.customSemantic?.[editConcept]} dimLabel={dim?.label} onSave={saveConcept} onClose={()=>setEditConcept(null)}/>
        </Modal>

      })()}
      {showAdd&&(
        <Modal title="הוספת מושג חדש" onClose={()=>setShowAdd(false)}>

          <input value={newName} onChange={e=>setNewName(e.target.value)} style={{...S.input,marginBottom:"10px"}}/>
          <label style={S.label}>ממד</label>
          <select value={newDim} onChange={e=>setNewDim(e.target.value)} style={{...S.input,marginBottom:"10px"}}>
            {DIMS.map(d=><option key={d.id} value={d.id}>{d.label}</option>)}
          </select>
          <label style={S.label}>פרמטרים</label>
          {newParams.map((p,i)=><input key={i} value={p} onChange={e=>{const a=[...newParams];a[i]=e.target.value;setNewParams(a);}} placeholder={`פרמטר ${i+1}`} style={{...S.input,marginBottom:"5px"}}/>)}
          <button onClick={addConcept} style={{...S.btnPrimary,marginTop:"10px"}}>✓ הוסף</button>
        </Modal>
      )}
    </div>
  );
}

function ConceptParamsEditor({name,params,semData,onSave,onClose}){
  const existing=semData||SEMANTIC[name]||{pos:"",neg:""};
  const [semPos,setSemPos]=useState(existing.pos||"");
  const [semNeg,setSemNeg]=useState(existing.neg||"");
  const [ps,setPs]=useState(()=>{
    const a=(params||[]).map(p=>{
      if(typeof p==="object"&&p!==null){
        // תמיכה בשני הפורמטים: החדש (paramLabel/q/markers) והישן (q/ind/sig), למקרה שנשארו נתונים ישנים
        const hasNewFmt="paramLabel" in p || "markers" in p;
        const label=hasNewFmt?(p.paramLabel||""):(p.q||"");
        const q=hasNewFmt?(p.q||""):(p.ind||"");
        const markers=hasNewFmt?(Array.isArray(p.markers)?p.markers:[]):(p.sig?p.sig.split(",").map(s=>s.trim()).filter(Boolean):[]);
        return {id:p.id||genPid(),paramLabel:label,q,markersText:markers.join(", ")};
      }
      return {id:genPid(),paramLabel:"",q:String(p||""),markersText:""};
    });
    return a.length?a:[{id:genPid(),paramLabel:"",q:"",markersText:""}];
  });
  function updLabel(i,v){const a=[...ps];a[i]={...a[i],paramLabel:v};setPs(a);}
  function updQ(i,v){const a=[...ps];a[i]={...a[i],q:v};setPs(a);}
  function updMarkers(i,v){const a=[...ps];a[i]={...a[i],markersText:v};setPs(a);}
  function addRow(){setPs([...ps,{id:genPid(),paramLabel:"",q:"",markersText:""}]);}
  function removeRow(i){setPs(ps.filter((_,idx)=>idx!==i));}
  function doSave(){
    const out=ps
      .filter(p=>p.q&&p.q.trim())
      .map(p=>({id:p.id,paramLabel:p.paramLabel||"",q:p.q,markers:(p.markersText||"").split(",").map(s=>s.trim()).filter(Boolean)}));
    onSave(name,out,{pos:semPos,neg:semNeg});
  }
  return(
    <div>
      {/* Semantic fields */}
      <div style={{marginBottom:"14px",background:"#0f172a",borderRadius:"7px",padding:"12px",border:"1px solid #334155"}}>
        <div style={{fontSize:"11px",color:"#34d399",fontWeight:"700",marginBottom:"8px"}}>שדות סמנטיים</div>
        <label style={{...S.label,color:"#86efac"}}>שדה סמנטי חיובי</label>
        <textarea value={semPos} onChange={e=>setSemPos(e.target.value)} rows={2}
          placeholder="מילים מהשדה החיובי, מופרדות בפסיק..."
          style={{...S.input,resize:"vertical",fontSize:"12px",marginBottom:"8px"}}/>
        <label style={{...S.label,color:"#fca5a5"}}>שדה סמנטי שלילי (הפוך)</label>
        <textarea value={semNeg} onChange={e=>setSemNeg(e.target.value)} rows={2}
          placeholder="מילים מהשדה השלילי, מופרדות בפסיק..."
          style={{...S.input,resize:"vertical",fontSize:"12px"}}/>
      </div>
      {/* Parameters — three layers: paramLabel / q (indicator question) / markers */}
      <div style={{fontSize:"11px",color:"#818cf8",fontWeight:"700",marginBottom:"8px"}}>פרמטרים · אינדיקטורים · סימנים בטקסט ({ps.length})</div>
      <div style={{fontSize:"10px",color:"#64748b",marginBottom:"10px"}}>כל שורה היא אינדיקטור בודד. אינדיקטורים שחולקים אותו "שם פרמטר" יקובצו יחד בתצוגת הניתוח.</div>
      {ps.map((p,i)=>(
        <div key={p.id||i} style={{marginBottom:"10px",background:"#0f172a",borderRadius:"7px",padding:"10px",border:"1px solid #334155"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"5px"}}>
            <div style={{fontSize:"10px",color:"#64748b",fontWeight:"700"}}>אינדיקטור {i+1}</div>
            <button onClick={()=>removeRow(i)} style={{background:"none",border:"none",color:"#f87171",fontSize:"11px",cursor:"pointer"}}>✕ הסר</button>
          </div>
          <label style={{fontSize:"10px",color:"#fbbf24",fontWeight:"700",display:"block",marginBottom:"3px"}}>שם הפרמטר (הקטגוריה המקבצת)</label>
          <input value={p.paramLabel} onChange={e=>updLabel(i,e.target.value)} placeholder="לדוגמה: הכוונה לרצון ה'..." style={{...S.input,marginBottom:"7px"}}/>
          <label style={{fontSize:"10px",color:"#94a3b8",fontWeight:"700",display:"block",marginBottom:"3px"}}>אינדיקטור (שאלה אנליטית)</label>
          <textarea value={p.q} onChange={e=>updQ(i,e.target.value)} placeholder="השאלה הבודקת אם האינדיקטור קיים..." rows={2} style={{...S.input,resize:"vertical",fontSize:"12px",color:"#cbd5e1",marginBottom:"7px"}}/>
          <label style={{fontSize:"10px",color:"#0ea5e9",fontWeight:"700",display:"block",marginBottom:"3px"}}>סימנים בטקסט (ראיות — מופרדים בפסיק)</label>
          <textarea value={p.markersText} onChange={e=>updMarkers(i,e.target.value)} placeholder="ביטוי אחד, ביטוי שני, ביטוי שלישי..." rows={2} style={{...S.input,resize:"vertical",fontSize:"12px",color:"#7dd3fc"}}/>
        </div>
      ))}
      <button onClick={addRow} style={{...S.btnPrimary,background:"#334155",marginBottom:"10px",width:"100%"}}>+ הוסף אינדיקטור</button>
      <div style={{display:"flex",gap:"8px",marginTop:"10px"}}>
        <button onClick={doSave} style={S.btnPrimary}>✓ שמור</button>
        <button onClick={onClose} style={{...S.btnPrimary,background:"#334155"}}>ביטול</button>
      </div>
    </div>
  );
}

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}}>

        </div>
        <div style={{display:"flex",gap:"10px",flexWrap:"wrap"}}>

        </div>
      </div>
    </div>
  );
}
function ByUnitTab({allUnits,allConcepts,raw,getE,setE,getParams,dim4concept,onUnitSelect,analysisMode}){
  const [uid,setUid]=useState(null);
  const [activeConcept,setActiveConcept]=useState(null);
  const unit=allUnits.find(u=>u.id===uid);
  const modeColor=analysisMode==="chronicles"?"#93c5fd":"#fbbf24";
  const modeLabel=analysisMode==="chronicles"?'📘 ניתוח דה"י':'📙 ניתוח מקבילות';
  const unitText=analysisMode==="chronicles"?unit?.chroniclesText:unit?.sourceText;
  const sourceText=analysisMode==="chronicles"?unit?.sourceText:unit?.chroniclesText;
  const done=unit?allConcepts.filter(c=>{const e=getE(unit.id,c.name,analysisMode);return e&&(e.explicit_note||(e.params||[]).some(p=>p.found!==null));}).length:0;

  function handleUnitSelect(u){setUid(u.id);setActiveConcept(null);onUnitSelect&&onUnitSelect(u);}

  return(
    <div style={{display:"grid",gridTemplateColumns:"180px 1fr 260px",height:"calc(100vh - 46px)"}}>
      {/* Sidebar — יחידות */}
      <div style={{background:"#1e293b",borderLeft:"1px solid #334155",overflowY:"auto",padding:"10px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:modeColor,marginBottom:"8px"}}>{modeLabel}</div>
        {["david","solomon"].map(ch=>{
          const us=allUnits.filter(u=>u.character===ch||(ch==="david"&&!u.character));
          if(!us.length)return null;
          return(
            <div key={ch} style={{marginBottom:"10px"}}>
              <div style={{fontSize:"10px",color:ch==="david"?"#93c5fd":"#d8b4fe",fontWeight:"700",marginBottom:"4px"}}>{ch==="david"?"👑 דוד":"👑 שלמה"}</div>
              {us.map(u=>{
                const d=allConcepts.filter(c=>{const e=getE(u.id,c.name,analysisMode);return e&&(e.explicit_note||(e.params||[]).some(p=>p.found!==null));}).length;
                return(
                  <button key={u.id} onClick={()=>handleUnitSelect(u)}
                    style={{display:"block",width:"100%",textAlign:"right",padding:"6px 8px",borderRadius:"6px",border:"none",cursor:"pointer",marginBottom:"2px",fontSize:"11px",
                      background:uid===u.id?"#334155":"transparent",color:uid===u.id?"#f1f5f9":"#64748b",
                      borderRight:uid===u.id?`3px solid ${modeColor}`:"3px solid transparent"}}>
                    <span>{u.label}</span>
                    {d>0&&<span style={{color:modeColor,fontSize:"10px",float:"left"}}>{d}</span>}
                  </button>
                );
              })}
            </div>
          );
        })}
      </div>

      {/* מרכז — טקסט קבוע + עורך מושג */}
      <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 46px)",overflow:"hidden"}}>
        {!unit?(
          <div style={{padding:"60px",textAlign:"center",color:"#334155"}}>בחרי יחידה מהרשימה</div>
        ):(
          <>
            {/* טקסט קבוע */}
            <div style={{flexShrink:0,padding:"12px 16px",borderBottom:"1px solid #334155"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}>
                <div>
                  <div style={{fontSize:"15px",fontWeight:"bold",color:"#f1f5f9"}}>{unit.label}</div>
                  <div style={{fontSize:"11px",color:"#64748b"}}>{unit.sourceRef&&`מקביל: ${unit.sourceRef}`}</div>
                </div>
                <div style={{textAlign:"center"}}>
                  <div style={{fontSize:"18px",fontWeight:"bold",color:modeColor}}>{done}/{allConcepts.length}</div>
                  <div style={{fontSize:"10px",color:"#64748b"}}>נבדקו</div>
                </div>
              </div>
              <div style={{background:"#1e293b",border:`1px solid ${modeColor}44`,borderRadius:"8px",padding:"10px 14px",fontSize:"13px",lineHeight:"2",color:"#e2e8f0",direction:"rtl",maxHeight:"200px",overflowY:"auto"}}>
                <div style={{fontSize:"10px",fontWeight:"700",color:modeColor,marginBottom:"4px"}}>{analysisMode==="chronicles"?'📘 דברי הימים':'📙 מקבילה'}</div>
                {unitText||<span style={{color:"#475569"}}>אין טקסט</span>}
              </div>
            </div>
            {/* עורך מושג פתוח */}
            <div style={{flex:1,overflowY:"auto",padding:"12px 16px"}}>
              {!activeConcept?(
                <div style={{padding:"40px",textAlign:"center",color:"#334155",fontSize:"13px"}}>בחרי מושג מהרשימה לעריכה</div>
              ):(()=>{
                const c=allConcepts.find(a=>a.name===activeConcept);
                const dim=c?dim4concept(c.name):null;
                return(
                  <div>
                    <div style={{fontSize:"13px",fontWeight:"700",color:dim?.color||"#818cf8",marginBottom:"10px"}}>✎ {activeConcept}</div>
                    <ConceptRow key={activeConcept+uid} conceptName={activeConcept} dimColor={dim?.color||"#818cf8"} params={getParams(activeConcept)} entry={getE(unit.id,activeConcept,analysisMode)} onChange={e=>{setE(unit.id,activeConcept,e,analysisMode);}} unitText={unitText} sourceText={sourceText} sourceRef={unit.sourceRef} scholarship={unit.scholarship} analysisMode={analysisMode} customSemantic={raw.customSemantic||{}} character={unit.character||"david"} defaultOpen={true}/>
                  </div>
                );
              })()}
            </div>
          </>
        )}
      </div>

      {/* ימין — רשימת מושגים */}

          <>
            <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",marginBottom:"8px"}}>מושגים</div>

              const cs=allConcepts.filter(c=>c.dimId===dim.id);

              return(
                <div key={dim.id} style={{marginBottom:"10px"}}>

                  {cs.map(c=>{
                    const e=getE(unit.id,c.name,analysisMode);
                    const done=e&&(e.explicit_note||(e.params||[]).some(p=>p.found!==null));
                    const isActive=activeConcept===c.name;
                    return(

function MatrixTab({allUnits,allConcepts,raw,getE,dim4concept,analysisMode}){
  const [ch,setCh]=useState("all");
  const units=ch==="all"?allUnits:allUnits.filter(u=>u.character===ch||(ch==="david"&&!u.character));
  const modeColor=analysisMode==="chronicles"?"#93c5fd":"#fbbf24";
  const modeLabel=analysisMode==="chronicles"?'📘 דה"י':'📙 מקבילות';
  function cellSt(uid,cname){
    const e=getE(uid,cname,analysisMode);if(!e)return"empty";
    const hE=!!(e.explicit_note?.trim()),iN=(e.params||[]).filter(p=>p.found===true).length>0;
    if(hE&&iN)return"both";if(hE)return"explicit";if(iN)return"implicit";
    if((e.params||[]).some(p=>p.found===false))return"checked";return"empty";

              <span style={{width:"10px",height:"10px",background:C[k],borderRadius:"2px",border:k==="empty"?"1px solid #334155":"none",display:"inline-block"}}/>

              {DIMS.map(dim=>allConcepts.filter(c=>c.dimId===dim.id).map(c=>(

            {units.map((u,ri)=>(

// ── Charts Tab ────────────────────────────────────────────────────────
function ChartsTab({allUnits,allConcepts,raw,getE,dim4concept,analysisMode}){
  const modeColor=analysisMode==="chronicles"?"#93c5fd":"#fbbf24";
  const modeLabel=analysisMode==="chronicles"?'📘 דה"י':'📙 מקבילות';
  function Bar({val,max,color,label,val2,color2,label2}){
    const p=max?Math.round(val/max*100):0;
    const p2=max&&val2!=null?Math.round(val2/max*100):0;
    return(
      <div style={{marginBottom:"7px"}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:"2px"}}>
          <span style={{fontSize:"11px",color:"#94a3b8"}}>{label}</span>
          <span style={{fontSize:"11px",color:"#64748b"}}>{val}{val2!=null?` / ${val2}`:""}</span>
        </div>
        <div style={{background:"#0f172a",borderRadius:"4px",height:"9px",overflow:"hidden",display:"flex"}}>
          <div style={{width:p+"%",background:color,borderRadius:"4px",transition:"width 0.4s"}}/>
          {val2!=null&&<div style={{width:p2+"%",background:color2,transition:"width 0.4s"}}/>}
        </div>
      </div>
    );
  }
  const david=allUnits.filter(u=>u.character==="david"||!u.character);
  const solomon=allUnits.filter(u=>u.character==="solomon");
  return(
    <div style={{maxWidth:"800px",margin:"0 auto",padding:"20px 16px"}}>
      <div style={{...S.card,marginBottom:"16px"}}>
        <div style={{fontSize:"13px",fontWeight:"bold",color:modeColor,marginBottom:"8px"}}>מושגים לפי דמות — {modeLabel} <span style={{fontSize:"11px",color:"#64748b",fontWeight:"400"}}>■ כחול=דוד ■ סגול=שלמה</span></div>
        {DIMS.map(dim=>(
          <div key={dim.id} style={{marginBottom:"10px"}}>
            <div style={{fontSize:"10px",color:dim.color,fontWeight:"700",marginBottom:"5px"}}>{dim.label}</div>
            {allConcepts.filter(c=>c.dimId===dim.id).map(c=>{
              const d=david.filter(u=>{const e=getE(u.id,c.name,analysisMode);return e&&(e.explicit_note||(e.params||[]).some(p=>p.found===true));}).length;
              const s=solomon.filter(u=>{const e=getE(u.id,c.name,analysisMode);return e&&(e.explicit_note||(e.params||[]).some(p=>p.found===true));}).length;
              return <Bar key={c.name} label={c.name} val={d} val2={s} max={allUnits.length} color="#93c5fd" color2="#d8b4fe"/>;
            })}
          </div>
        ))}
      </div>
      <div style={S.card}>
        <div style={{fontSize:"13px",fontWeight:"bold",color:modeColor,marginBottom:"8px"}}>גלוי מול נרמז — {modeLabel} <span style={{fontSize:"11px",color:"#64748b",fontWeight:"400"}}>■ ירוק=גלוי ■ סגול=נרמז</span></div>
        {DIMS.map(dim=>(
          <div key={dim.id} style={{marginBottom:"10px"}}>
            <div style={{fontSize:"10px",color:dim.color,fontWeight:"700",marginBottom:"5px"}}>{dim.label}</div>
            {allConcepts.filter(c=>c.dimId===dim.id).map(c=>{
              const exp=allUnits.filter(u=>{const e=getE(u.id,c.name,analysisMode);return !!(e?.explicit_note?.trim());}).length;
              const imp=allUnits.filter(u=>{const e=getE(u.id,c.name,analysisMode);return (e?.params||[]).some(p=>p.found===true);}).length;
              return <Bar key={c.name} label={c.name} val={exp} val2={imp} max={allUnits.length} color="#34d399" color2="#818cf8"/>;
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Compare Tab (סינתזה השוואתית) ────────────────────────────────────
function CompareTab({allUnits,allConcepts,getE,getParams,getCompareNote,setCompareNote}){
  const [selUnit,setSelUnit]=useState(null);
  const [selConcept,setSelConcept]=useState(null);
  const [aiLoading,setAiLoading]=useState(false);
  const [draftNote,setDraftNote]=useState("");
  const [savedFlash,setSavedFlash]=useState(false);

  const unit=allUnits.find(u=>u.id===selUnit);

  // טעינת מסקנה שמורה בכל פעם שמשתנה הבחירה (יחידה/מושג)
  React.useEffect(()=>{
    if(selUnit&&selConcept){ setDraftNote(getCompareNote(selUnit,selConcept)||""); }
    else { setDraftNote(""); }
  },[selUnit,selConcept]);

  function getChrEntry(uid,cname){ return getE(uid,cname,"chronicles"); }
  function getSrcEntry(uid,cname){ return getE(uid,cname,"source"); }

  async function runConceptSynthesis(){
    if(!unit||!selConcept)return;
    setAiLoading(true);
    const ec=getChrEntry(unit.id,selConcept)||{};
    const es=getSrcEntry(unit.id,selConcept)||{};
    const params=getParams(selConcept)||[];
    const validParams=params.filter(p=>p&&(typeof p==="object"?p.q:p).trim());

    function fmtParams(entry){
      if(!validParams.length)return"אין פרמטרים מוגדרים למושג זה.";
      return validParams.map((p,i)=>{
        const q=typeof p==="object"?p.q:p;
        const pe=(entry.params||[])[i]||{};
        const status=pe.found===true?"כן":pe.found===false?"לא":"לא נבדק";
        return `${i+1}. ${q} — ${status}${pe.verse?` (${pe.verse})`:""}${pe.note?`: ${pe.note}`:""}`;
      }).join("\n");
    }

    let diffSummary="אין הבדלים מסומנים";
    try{
      const diff=computeDiff(unit.chroniclesText||"",unit.sourceText||"");
      const added=[],omitted=[],changed=[];
      diff.forEach(ch=>{
        if(ch.type==="added"&&ch.aW?.length)added.push(ch.aW.join(" "));
        else if(ch.type==="omitted"&&ch.bW?.length)omitted.push(ch.bW.join(" "));
        else if(ch.type==="changed")changed.push(`"${(ch.bW||[]).join(" ")}" ← "${(ch.aW||[]).join(" ")}"`);
      });
      const parts=[];
      if(added.length)parts.push(`תוספות (${added.length}): ${added.join(", ")}`);
      if(omitted.length)parts.push(`השמטות (${omitted.length}): ${omitted.join(", ")}`);
      if(changed.length)parts.push(`שינויי מילים (${changed.length}): ${changed.join(", ")}`);
      if(parts.length)diffSummary=parts.join("\n");
    }catch{}

    const prompt=`אתה עוזר מחקר לתזה בתנ"ך, הבוחן את השפעת שינויי הכרוניסט על מושג ספציפי בהשוואה בין דברי הימים למקבילה.

מושג: "${selConcept}"
יחידה: ${unit.label} | דמות: ${unit.character==="solomon"?"שלמה":"דוד"} | מקביל: ${unit.sourceRef||"—"}

── ניתוח דברי הימים ──
גלוי: ${ec.explicit_note?.trim()||"לא נמצא"}
נרמז:
${fmtParams(ec)}

── ניתוח המקבילה (${unit.sourceRef||"שמואל/מלכים"}) ──
גלוי: ${es.explicit_note?.trim()||"לא נמצא"}
נרמז:
${fmtParams(es)}

── שינויים טקסטואליים שזוהו אוטומטית בין הטקסטים ──
${diffSummary}

── טקסט דברי הימים המלא ──
${unit.chroniclesText||"—"}

── טקסט המקביל המלא ──
${unit.sourceText||"—"}

── הערות פרשנים על היחידה (מכלי ההשוואה) ──
${unit.scholarship?.trim()||"אין הערות פרשנים שמורות ליחידה זו"}

הנחיות לכתיבת המסקנה: כתבי בעברית אקדמית, כ-220-280 מילה, בפרוזה רציפה בלבד.

איסור מוחלט על כל סימן עיצוב טקסט: אסור להשתמש בסולמיות (###, ##, #) לכותרות, אסור בכוכביות כפולות (**מילה**) להדגשה, אסור בקווי הפרדה (---, ***), אסור ברשימות ממוספרות (1. 2. 3.) או בתבליטים (-, •, *). כתבי הכל כפסקאות פרוזה רגילות בלבד. אסור בשורות ריקות מיותרות בין הפסקאות — לכל היותר שורה ריקה אחת בין פסקה לפסקה.

המבנה הפנימי הוא שלוש פסקאות רצופות המכסות את ההיבטים הבאים בסדר זה, והדגש בכל המסקנה הוא על שינויי הכרוניסט ומשמעותם למושג "${selConcept}".

פסקה ראשונה — השדה הגלוי: האם המושג "${selConcept}" מופיע במפורש בטקסט דה"י? במקבילה? בשניהם, באחד מהם בלבד, או באף אחד? אם הכרוניסט הוסיף ביטוי מפורש שאינו במקבילה, השמיט ביטוי שהיה בה, או שינה את ניסוחו — ציינו זאת עם המילים המדויקות ומספרי הפסוקים.

פסקה שנייה — השדה הנרמז והשינויים הטקסטואליים: השוו את הפרמטרים בין שני הטקסטים וציינו באילו פרמטרים דה"י פעיל יותר או פחות מהמקבילה. עברו על השינויים הטקסטואליים הרלוונטיים למושג — השמטה, תוספת, שינוי מילים, ובמיוחד שינוי סדר מילים (יש לבדוק שינוי סדר בקריאה ישירה של שני הטקסטים המלאים, גם כשאינו מופיע ברשימת השינויים האוטומטית) — ולכל שינוי משמעותי הסבירו כיצד הוא משפיע על נוכחות המושג או על משמעותו. השתמשו בהערות הפרשנים לביסוס, בציטוט קצר במידת הצורך.

פסקה שלישית — מסקנה: משפט מסכם אחד או שניים הקובעים האם שינויי הכרוניסט חיזקו, החלישו, או לא שינו את ביטוי המושג "${selConcept}" ביחידה זו.`;

    try{
      const res=await fetch("https://anthropic-proxy.anna-sho-ea8.workers.dev",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2500,messages:[{role:"user",content:prompt}]})});
      const data=await res.json();
      if(!data.content||!data.content.length){
        setDraftNote("⚠️ שגיאת AI: "+aiErrorText(data));
      }else{
        let text=data.content.map(b=>b.text||"").join("");
        // ניקוי סימני מרקדאון שה-AI עשוי להוסיף למרות ההנחיה — עטוף ב-try/catch להגנה
        try{
          text=text
            .replace(/^\s*#{1,6}\s+/gm,"")        // הסרת כותרות ### ## # בתחילת שורה
            .replace(/\*\*([^*]+?)\*\*/g,"$1")    // הסרת **הדגשה** — שומר על הטקסט
            .replace(/__([^_]+?)__/g,"$1")        // הסרת __הדגשה חלופית__
            .replace(/^\s*[-=*_]{3,}\s*$/gm,"")   // הסרת קווי הפרדה --- === *** ___
            .replace(/^\s*[\-•]\s+/gm,"")         // הסרת תבליטים - •
            .replace(/\n{3,}/g,"\n\n")            // כיווץ 3+ שורות ריקות לשורה ריקה אחת
            .replace(/[ \t]+\n/g,"\n")            // הסרת רווחים בסוף שורה
            .trim();
        }catch(cleanErr){console.warn("markdown cleanup failed:",cleanErr);}
        if(data.stop_reason==="max_tokens"){
          text+="\n\n⚠️ שים לב: התשובה נקטעה עקב מגבלת אורך. יש להריץ מחדש או להרחיב את המגבלה בקוד.";
        }
        setDraftNote(text);
      }

    setAiLoading(false);
  }

function SynthesisTab({allUnits,allConcepts,getE,analysisMode}){
  const [mode,setMode]=React.useState("unit");

  function flash(m){setSaveMsg(m);setTimeout(()=>setSaveMsg(""),2500);}

  function buildDiffSummary(u){
    try{
      const diff=computeDiff(u.chroniclesText||"",u.sourceText||"");
      const added=[],omitted=[],changed=[];
      diff.forEach(ch=>{
        if(ch.type==="added"&&ch.aW&&ch.aW.length)added.push(ch.aW.join(" "));
        else if(ch.type==="omitted"&&ch.bW&&ch.bW.length)omitted.push(ch.bW.join(" "));
        else if(ch.type==="changed"){const w=(ch.aW||[]).join(" ");if(w)changed.push(w);}
      });
      const parts=[];
      if(added.length)parts.push("תוספות ("+added.length+"): "+added.join(", "));
      if(omitted.length)parts.push("השמטות ("+omitted.length+"): "+omitted.join(", "));
      if(changed.length)parts.push("שינויים ("+changed.length+"): "+changed.join(", "));
      return parts.join(" | ")||"אין הבדלים מסומנים";
    }catch{return"—";}
  }

  function buildAnalysisSummary(uid){
    const lines=[];
    DIMS.forEach(dim=>{
      const found=[];
      allConcepts.filter(c=>c.dimId===dim.id).forEach(c=>{
        const e=getE(uid,c.name,analysisMode);
        if(!e)return;
        const hasExp=!!(e.explicit_note&&e.explicit_note.trim());
        const implCount=(e.params||[]).filter(p=>p.found===true).length;
        const implVerses=(e.params||[]).filter(p=>p.found===true&&p.verse).map(p=>p.verse).join(", ");
        if(hasExp||implCount>0){
          let entry=c.name;
          if(hasExp)entry+=" [גלוי: "+(e.explicit_note.substring(0,100))+(e.explicit_note.length>100?"...":"")+"]";
          if(implCount>0)entry+=" [נרמז: "+implCount+" פרמטרים"+(implVerses?" — פסוקים: "+implVerses:"")+"]";
          found.push(entry);
        }
      });
      if(found.length)lines.push(dim.label+":\n"+found.map(f=>"  • "+f).join("\n"));
    });
    return lines.join("\n\n")||"טרם בוצע ניתוח ליחידה זו";
  }
